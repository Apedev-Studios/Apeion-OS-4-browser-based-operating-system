// 75. HUMAN EYE & VISION
// ============================================================
function simEyeVision(c,ctx,p){
  let objDist=60,lensPower=50,condition='normal',running=true;
  panel(`
    <div class="ctrl-section">
      ${sliderRow('eye_dist','📏 Object Distance',10,150,60,' cm','sv("eye_dist"," cm");eyeUpdate()')}
      ${sliderRow('eye_power','🔍 Lens Focus Power',10,90,50,'%','sv("eye_power","%");eyeUpdate()')}
      <div class="ctrl-label">👁️ Eye Condition</div>
      <div class="btn-row">
        <button class="sim-btn" id="eye_c0" onclick="eyeSetCond('normal')" style="flex:1;font-size:11px">Normal</button>
        <button class="sim-btn" id="eye_c1" onclick="eyeSetCond('myopia')" style="flex:1;font-size:11px">Myopia</button>
        <button class="sim-btn" id="eye_c2" onclick="eyeSetCond('hyperopia')" style="flex:1;font-size:11px">Hyperopia</button>
      </div>
    </div>
    ${infoCards([{id:'eye_focus',val:'Retina',label:'Image Focus Point'},{id:'eye_status',val:'✅ Clear',label:'Vision Status'}])}
    ${theoryBox('Convex lens → light converge → Retina par sharp image','Cornea aur eye-lens milke light ko retina par focus karte hain jahan photoreceptors (rods & cones) image ko electrical signal mein badalte hain — jo brain tak jaata hai. Myopia mein eyeball lamba ho jaata hai (image retina se pehle focus hoti hai) — concave lens se theek hota hai. Hyperopia mein eyeball chhota hota hai (image retina ke peeche focus hoti) — convex lens se theek hota hai!')}
  `);
  window.eyeUpdate=()=>{objDist=gv('eye_dist');lensPower=gv('eye_power');draw();};
  window.eyeSetCond=(cnd)=>{
    condition=cnd;
    ['eye_c0','eye_c1','eye_c2'].forEach(id=>{const b=$id(id);if(b)b.style.background='var(--card2)';});
    const map={normal:'eye_c0',myopia:'eye_c1',hyperopia:'eye_c2'};
    const b=$id(map[cnd]);if(b)b.style.background='rgba(196,158,80,0.4)';
    draw();
  };

  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#04060c';ctx.fillRect(0,0,cw,ch);
    const glow=ctx.createRadialGradient(cw*0.7,ch/2,10,cw*0.7,ch/2,cw*0.6);
    glow.addColorStop(0,'rgba(90,140,255,0.10)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);

    const eyeCX=cw*0.62,eyeCY=ch/2,eyeR=Math.min(cw,ch)*0.24;
    // eyeball shape - stretched for myopia, squashed for hyperopia
    const stretch=condition==='myopia'?1.22:(condition==='hyperopia'?0.82:1.0);
    ctx.save();
    ctx.translate(eyeCX,eyeCY);ctx.scale(stretch,1);
    const eyeGrad=ctx.createRadialGradient(-eyeR*0.3,-eyeR*0.3,4,0,0,eyeR);
    eyeGrad.addColorStop(0,'#fdf6e8');eyeGrad.addColorStop(0.6,'#e8d9b8');eyeGrad.addColorStop(1,'#b8946a');
    ctx.beginPath();ctx.arc(0,0,eyeR,0,Math.PI*2);ctx.fillStyle=eyeGrad;ctx.fill();
    ctx.strokeStyle='rgba(120,90,40,0.5)';ctx.lineWidth=2;ctx.stroke();
    // retina (back wall, in original coord space so scale back)
    ctx.restore();
    const retinaX=eyeCX+eyeR*stretch*0.92;
    ctx.strokeStyle='#c0533a';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(eyeCX,eyeCY,eyeR*0.94,-1.0,1.0);
    ctx.save();ctx.translate(eyeCX,eyeCY);ctx.scale(stretch,1);ctx.translate(-eyeCX,-eyeCY);ctx.restore();
    // simpler: draw retina as vertical-ish arc on right edge
    ctx.beginPath();
    for(let a=-1.1;a<=1.1;a+=0.05){
      const rx=eyeCX+Math.cos(a)*eyeR*stretch*0.96,ry=eyeCY+Math.sin(a)*eyeR*0.96;
      a===-1.1?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='10px var(--font2)';ctx.textAlign='center';
    ctx.fillText('Retina',eyeCX+eyeR*stretch*0.75,eyeCY-eyeR*0.95);

    // lens (biconvex) at front
    const lensX=eyeCX-eyeR*0.55*stretch;
    const lensBulge=8+lensPower*0.18;
    ctx.beginPath();
    ctx.moveTo(lensX,eyeCY-eyeR*0.55);
    ctx.quadraticCurveTo(lensX+lensBulge,eyeCY,lensX,eyeCY+eyeR*0.55);
    ctx.quadraticCurveTo(lensX-lensBulge,eyeCY,lensX,eyeCY-eyeR*0.55);
    ctx.closePath();
    const lg=ctx.createLinearGradient(lensX-lensBulge,eyeCY,lensX+lensBulge,eyeCY);
    lg.addColorStop(0,'rgba(150,220,255,0.55)');lg.addColorStop(1,'rgba(100,180,255,0.75)');
    ctx.fillStyle=lg;ctx.fill();
    ctx.strokeStyle='rgba(200,240,255,0.8)';ctx.lineWidth=1.5;ctx.stroke();

    // object (arrow) at distance - mapped to left side
    const objX=Math.max(30,eyeCX-eyeR*1.4-(objDist-10)*1.3);
    const objH=Math.min(80,20+objDist*0.4);
    ctx.strokeStyle='#5a8a3a';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(objX,eyeCY);ctx.lineTo(objX,eyeCY-objH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(objX,eyeCY-objH);ctx.lineTo(objX-6,eyeCY-objH+12);ctx.lineTo(objX+6,eyeCY-objH+12);ctx.closePath();
    ctx.fillStyle='#5a8a3a';ctx.fill();
    ctx.fillStyle='#a9e34b';ctx.font='10px var(--font2)';ctx.textAlign='center';
    ctx.fillText('Object',objX,eyeCY+16);

    // light rays from object tip through lens to focus point
    const focalPower=lensPower/100*2.2+0.6;
    const objTipY=eyeCY-objH;
    const idealFocusX=lensX+ (eyeR*stretch*0.96-lensX)/(focalPower);
    let focusX=lensX + eyeR*1.4*(1/(0.4+lensPower/60));
    focusX=Math.min(Math.max(focusX,eyeCX-eyeR*0.3),eyeCX+eyeR*1.3);
    const focusY=eyeCY+ (eyeCY-objTipY)*0.06;

    const rayOffsets=[-eyeR*0.4,0,eyeR*0.4];
    ctx.strokeStyle='rgba(255,220,120,0.6)';ctx.lineWidth=1.3;
    rayOffsets.forEach(off=>{
      ctx.beginPath();
      ctx.moveTo(objX,objTipY);
      ctx.lineTo(lensX,eyeCY+off*0.4);
      ctx.lineTo(focusX,focusY);
      ctx.stroke();
    });

    const retinaXPos=eyeCX+eyeR*stretch*0.96;
    const focusError=focusX-retinaXPos;
    let statusText='✅ Clear',focusLabel='Retina par',ok=true;
    if(Math.abs(focusError)>eyeR*0.12){
      ok=false;
      if(focusError<0){statusText='❌ Blurry (Retina se pehle)';focusLabel='Retina se pehle (Myopia)';}
      else{statusText='❌ Blurry (Retina ke peeche)';focusLabel='Retina ke peeche (Hyperopia)';}
    }
    // focus point marker
    ctx.beginPath();ctx.arc(focusX,focusY,4,0,Math.PI*2);
    ctx.fillStyle=ok?'#69db7c':'#ff6b6b';ctx.fill();
    ctx.save();ctx.shadowColor=ok?'rgba(120,220,150,0.8)':'rgba(255,100,100,0.8)';ctx.shadowBlur=12;ctx.fill();ctx.restore();

    // blurry/sharp image preview box top-right
    const boxX=cw-90,boxY=16,boxS=60;
    ctx.fillStyle='rgba(10,10,15,0.6)';ctx.fillRect(boxX-4,boxY-4,boxS+8,boxS+8);
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.strokeRect(boxX-4,boxY-4,boxS+8,boxS+8);
    ctx.save();
    if(!ok)ctx.filter=`blur(${Math.min(6,Math.abs(focusError)/6)}px)`;
    ctx.strokeStyle='#a9e34b';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(boxX+boxS/2,boxY+boxS-8);ctx.lineTo(boxX+boxS/2,boxY+10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(boxX+boxS/2,boxY+10);ctx.lineTo(boxX+boxS/2-7,boxY+22);ctx.lineTo(boxX+boxS/2+7,boxY+22);ctx.closePath();ctx.fillStyle='#a9e34b';ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='8px var(--font2)';ctx.textAlign='center';
    ctx.fillText('Brain deta hai',boxX+boxS/2,boxY+boxS+14);

    ctx.textAlign='left';
    if($id('eye_focus'))$id('eye_focus').textContent=focusLabel;
    if($id('eye_status')){$id('eye_status').textContent=statusText;$id('eye_status').style.color=ok?'#69db7c':'#ff6b6b';}
  }
  window.eyeSetCond('normal');
}

// ============================================================
// 76. IMMUNE SYSTEM BATTLE
// ============================================================
function simImmune(c,ctx,p){
  let pathogens=[],antibodies=[],wbcs=[],running=false,wave=1,health=100,spawnTimer=0,score=0,gameOver=false;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'immStart()',label:'▶ Infection Start!'},{cls:'btn-reset',fn:'immReset()',label:'🔄 Reset'}])}
      ${sliderRow('imm_wbc','🛡️ WBC Count',3,15,6,'','sv("imm_wbc","");immUpdate()')}
    </div>
    ${infoCards([{id:'imm_health',val:'100%',label:'Body Health'},{id:'imm_score',val:'0',label:'Pathogens Destroyed'}])}
    ${theoryBox('Antigen Recognition → Antibody Production → Neutralization','Jab koi pathogen (virus/bacteria) body mein ghusta hai, White Blood Cells (WBCs) use antigen se pehchante hain aur specific antibodies banate hain jo pathogen se chipak ke usse neutralize kar dete hain. Yeh hi hamara "adaptive immune system" hai — jitna zyada WBC, utni tezi se infection control hota hai!')}
  `);
  let wbcCount=6;
  window.immUpdate=()=>{wbcCount=gv('imm_wbc');};
  function spawnPathogen(){
    const cw=c.width,ch=c.height;
    const edge=Math.floor(Math.random()*4);
    let x,y;
    if(edge===0){x=Math.random()*cw;y=-20;}
    else if(edge===1){x=cw+20;y=Math.random()*ch;}
    else if(edge===2){x=Math.random()*cw;y=ch+20;}
    else{x=-20;y=Math.random()*ch;}
    pathogens.push({x,y,vx:0,vy:0,hp:2+Math.floor(wave/2),r:12+Math.random()*6,hue:Math.random()*30+280,wobble:Math.random()*Math.PI*2});
  }
  function initWBCs(){
    wbcs=[];
    const cw=c.width,ch=c.height,cx=cw/2,cy=ch/2;
    for(let i=0;i<wbcCount;i++){
      const a=i/wbcCount*Math.PI*2;
      wbcs.push({x:cx+Math.cos(a)*60,y:cy+Math.sin(a)*60,angle:a,cooldown:0});
    }
  }
  window.immStart=()=>{
    if(gameOver||!running){
      pathogens=[];antibodies=[];health=100;score=0;wave=1;spawnTimer=0;gameOver=false;
      initWBCs();
      running=true;
      animId=requestAnimationFrame(loop);
    }
  };
  window.immReset=()=>{
    stopSim();running=false;pathogens=[];antibodies=[];health=100;score=0;wave=1;gameOver=false;
    initWBCs();draw();
  };
  function updateStats(){
    if($id('imm_health')){$id('imm_health').textContent=Math.max(0,Math.round(health))+'%';$id('imm_health').style.color=health>50?'#69db7c':(health>20?'#ffd43b':'#ff6b6b');}
    if($id('imm_score'))$id('imm_score').textContent=score;
  }
  function loop(){
    if(!running)return;
    const cw=c.width,ch=c.height,cx=cw/2,cy=ch/2;
    spawnTimer++;
    if(spawnTimer>Math.max(20,60-wave*3)){spawnTimer=0;spawnPathogen();if(Math.random()<0.15)wave++;}
    pathogens.forEach(pg=>{
      pg.wobble+=0.1;
      const dx=cx-pg.x,dy=cy-pg.y,d=Math.hypot(dx,dy)||1;
      pg.x+=(dx/d)*0.6+Math.sin(pg.wobble)*0.5;
      pg.y+=(dy/d)*0.6+Math.cos(pg.wobble)*0.5;
      if(d<50){health-=0.15;pg._hit=true;}
    });
    pathogens=pathogens.filter(pg=>{
      if(pg._hit&&d_(pg,cx,cy)<40){health-=0.05;}
      return true;
    });
    wbcs.forEach(w=>{
      w.angle+=0.02;
      const orbit=70+Math.sin(w.angle*2)*8;
      w.x=cx+Math.cos(w.angle)*orbit;w.y=cy+Math.sin(w.angle)*orbit;
      w.cooldown--;
      if(w.cooldown<=0){
        let nearest=null,nd=99999;
        pathogens.forEach(pg=>{const dd=Math.hypot(pg.x-w.x,pg.y-w.y);if(dd<nd){nd=dd;nearest=pg;}});
        if(nearest&&nd<220){
          const ang=Math.atan2(nearest.y-w.y,nearest.x-w.x);
          antibodies.push({x:w.x,y:w.y,vx:Math.cos(ang)*4,vy:Math.sin(ang)*4,target:nearest});
          w.cooldown=40;
        }
      }
    });
    antibodies.forEach(ab=>{ab.x+=ab.vx;ab.y+=ab.vy;});
    antibodies=antibodies.filter(ab=>{
      if(!pathogens.includes(ab.target))return false;
      const d=Math.hypot(ab.x-ab.target.x,ab.y-ab.target.y);
      if(d<ab.target.r){ab.target.hp--;return false;}
      return ab.x>-30&&ab.x<cw+30&&ab.y>-30&&ab.y<ch+30;
    });
    const before=pathogens.length;
    pathogens=pathogens.filter(pg=>pg.hp>0);
    score+=(before-pathogens.length);
    health=Math.min(100,health+0.03);
    if(health<=0){health=0;running=false;gameOver=true;}
    updateStats();
    draw();
    if(running)animId=requestAnimationFrame(loop);
  }
  function d_(pg,cx,cy){return Math.hypot(pg.x-cx,pg.y-cy);}

  function draw(){
    const cw=c.width,ch=c.height,cx=cw/2,cy=ch/2;
    ctx.fillStyle='#060810';ctx.fillRect(0,0,cw,ch);
    const glow=ctx.createRadialGradient(cx,cy,10,cx,cy,cw*0.5);
    glow.addColorStop(0,'rgba(120,90,220,0.16)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);
    // body / cell boundary
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.arc(cx,cy,50,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='11px var(--font2)';ctx.textAlign='center';
    ctx.fillText(gameOver?'💀 Infection Won':'🫀 Healthy Cell Zone',cx,cy+4);

    pathogens.forEach(pg=>{
      const g=ctx.createRadialGradient(pg.x-3,pg.y-3,1,pg.x,pg.y,pg.r);
      g.addColorStop(0,`hsl(${pg.hue},80%,65%)`);g.addColorStop(1,`hsl(${pg.hue},70%,30%)`);
      ctx.save();ctx.shadowColor=`hsla(${pg.hue},80%,60%,0.7)`;ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(pg.x,pg.y,pg.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore();
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2+pg.wobble*0.5;
        ctx.beginPath();ctx.moveTo(pg.x+Math.cos(a)*pg.r,pg.y+Math.sin(a)*pg.r);
        ctx.lineTo(pg.x+Math.cos(a)*(pg.r+5),pg.y+Math.sin(a)*(pg.r+5));
        ctx.strokeStyle=`hsl(${pg.hue},70%,55%)`;ctx.lineWidth=2;ctx.stroke();
      }
    });
    antibodies.forEach(ab=>{
      ctx.save();ctx.translate(ab.x,ab.y);ctx.rotate(Math.atan2(ab.vy,ab.vx));
      ctx.fillStyle='#ffd43b';ctx.beginPath();
      ctx.moveTo(6,0);ctx.lineTo(-4,-4);ctx.lineTo(-4,4);ctx.closePath();ctx.fill();
      ctx.restore();
    });
    wbcs.forEach(w=>{
      const g=ctx.createRadialGradient(w.x-3,w.y-3,1,w.x,w.y,14);
      g.addColorStop(0,'#e8f5ff');g.addColorStop(1,'#58a6ff');
      ctx.save();ctx.shadowColor='rgba(88,166,255,0.7)';ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(w.x,w.y,12,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.restore();
      ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.stroke();
    });
    ctx.textAlign='left';
    if(gameOver){
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,ch/2-30,cw,60);
      ctx.fillStyle='#ff6b6b';ctx.font='700 16px var(--font2)';ctx.textAlign='center';
      ctx.fillText('Body haar gaya! WBC Count badhao aur phir try karo',cw/2,ch/2+5);
      ctx.textAlign='left';
    }
  }
  initWBCs();
  draw();
}

function simDigestion(c,ctx,p){
  let progress=0,running=false,speed=1;
  const ORGANS=[
    {name:'Mouth',hindi:'मुख',range:[0,0.10],desc:'Lar (saliva) mein amylase — starch breakdown shuru',col:'#ffd43b'},
    {name:'Esophagus',hindi:'ग्रासनली',range:[0.10,0.20],desc:'Peristalsis — muscle waves food ko neeche dhakelti hain',col:'#ffa94d'},
    {name:'Stomach',hindi:'आमाशय',range:[0.20,0.42],desc:'HCl acid + pepsin — protein breakdown, food ban jaata hai "chyme"',col:'#ff6b6b'},
    {name:'Small Intestine',hindi:'छोटी आंत',range:[0.42,0.72],desc:'Bile + enzymes — sabse zyada digestion aur nutrient absorption yahin hota hai',col:'#69db7c'},
    {name:'Large Intestine',hindi:'बड़ी आंत',range:[0.72,0.92],desc:'Water absorption — baaki bacha waste solid ban jaata hai',col:'#a07c30'},
    {name:'Rectum',hindi:'मलाशय',range:[0.92,1.0],desc:'Waste (faeces) store hoke body se bahar nikalta hai',col:'#8a6423'}
  ];
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'digToggle()',label:'▶ Khaana Khao!'},{cls:'btn-reset',fn:'digReset()',label:'🔄 Reset'}])}
      ${sliderRow('dig_speed','⚡ Journey Speed',20,150,80,'%','sv("dig_speed","%");digUpdate()')}
    </div>
    <div id="dig_organ_info"></div>
    ${theoryBox('Mouth → Esophagus → Stomach → Small Intestine → Large Intestine → Rectum','Food ek complete tube (alimentary canal) se guzarta hai. Har organ ka apna kaam hai: mouth mechanical breakdown karta hai, stomach acid se protein todta hai, small intestine mein sabse zyada nutrients absorb hote hain (villi ki wajah se), aur large intestine paani wapas kheenchta hai!')}
  `);
  function digUpdate(){speed=gv('dig_speed')/80;}
  window.digUpdate=digUpdate;
  window.digToggle=()=>{
    running=!running;
    if(running){if(progress>=1)progress=0;animId=requestAnimationFrame(animate);}else{stopSim();}
  };
  window.digReset=()=>{stopSim();running=false;progress=0;draw();};

  function currentOrgan(){
    return ORGANS.find(o=>progress>=o.range[0]&&progress<=o.range[1])||ORGANS[ORGANS.length-1];
  }
  function updateInfo(){
    const o=currentOrgan();
    const el=$id('dig_organ_info');
    if(el)el.innerHTML=`<div class="info-cards"><div class="info-card" style="border-color:${o.col}"><div class="info-val" style="color:${o.col}">${o.name}</div><div class="info-lbl">${o.hindi}</div></div></div><div style="font-size:12px;color:var(--text2);font-family:var(--font2);padding:6px 2px;text-align:center">${o.desc}</div>`;
  }

  function tubePath(cw,ch){
    // S-shaped canal path as points
    return [
      [cw*0.5,ch*0.08],[cw*0.5,ch*0.16],       // mouth
      [cw*0.55,ch*0.26],                        // esophagus
      [cw*0.42,ch*0.42],[cw*0.60,ch*0.50],[cw*0.42,ch*0.58], // stomach loop
      [cw*0.30,ch*0.66],[cw*0.70,ch*0.70],[cw*0.30,ch*0.76],[cw*0.70,ch*0.80], // small intestine coils
      [cw*0.65,ch*0.88],[cw*0.30,ch*0.90],       // large intestine
      [cw*0.5,ch*0.95]                           // rectum
    ];
  }
  function pointAtT(pts,t){
    const segs=pts.length-1;
    const scaled=t*segs;
    const i=Math.min(segs-1,Math.floor(scaled));
    const localT=scaled-i;
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
    return [x1+(x2-x1)*localT,y1+(y2-y1)*localT];
  }

  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#0a0810';ctx.fillRect(0,0,cw,ch);
    const glow=ctx.createRadialGradient(cw/2,ch*0.5,10,cw/2,ch*0.5,cw*0.7);
    glow.addColorStop(0,'rgba(255,180,120,0.08)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);

    const pts=tubePath(cw,ch);
    // draw tube with organ-colored segments
    for(let i=0;i<pts.length-1;i++){
      const t0=i/(pts.length-1),t1=(i+1)/(pts.length-1);
      const midT=(t0+t1)/2;
      const organ=ORGANS.find(o=>midT>=o.range[0]&&midT<=o.range[1])||ORGANS[ORGANS.length-1];
      ctx.strokeStyle=organ.col;ctx.lineWidth=22;ctx.lineCap='round';
      ctx.globalAlpha=0.55;
      ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[i+1][0],pts[i+1][1]);ctx.stroke();
      ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(pts[i][0],pts[i][1]);ctx.lineTo(pts[i+1][0],pts[i+1][1]);ctx.stroke();
    }
    // organ labels
    ORGANS.forEach(o=>{
      const midT=(o.range[0]+o.range[1])/2;
      const [x,y]=pointAtT(pts,midT);
      ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='8px var(--font2)';ctx.textAlign='center';
      ctx.fillText(o.name,x+ (x>cw/2?26:-26),y);
    });
    // food bolus marker
    const [fx,fy]=pointAtT(pts,progress);
    const organ=currentOrgan();
    ctx.save();
    ctx.shadowColor=organ.col;ctx.shadowBlur=16;
    const fg=ctx.createRadialGradient(fx-3,fy-3,1,fx,fy,11);
    fg.addColorStop(0,'#fff8e0');fg.addColorStop(1,'#c49e50');
    ctx.beginPath();ctx.arc(fx,fy,10,0,Math.PI*2);ctx.fillStyle=fg;ctx.fill();
    ctx.restore();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.textAlign='left';

    // progress bar
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(10,ch-16,cw-20,6);
    ctx.fillStyle=organ.col;ctx.fillRect(10,ch-16,(cw-20)*progress,6);
  }
  function animate(){
    if(!running)return;
    progress+=0.0022*speed;
    if(progress>=1){progress=1;running=false;stopSim();}
    updateInfo();
    draw();
    if(running)animId=requestAnimationFrame(animate);
  }
  updateInfo();
  draw();
}

// ============================================================
// 78. DNA REPLICATION & MUTATION
// ============================================================
function simDNAReplication(c,ctx,p){
  let bases=[],progress=0,running=false,mutationRate=0,mutCount=0,speed=1;
  const PAIR={'A':'T','T':'A','G':'C','C':'G'};
  const COLORS={'A':'#ff6b6b','T':'#74c0fc','G':'#a9e34b','C':'#ffd43b'};
  function initStrand(){
    bases=[];
    const seq=['A','T','G','C'];
    for(let i=0;i<24;i++)bases.push({b:seq[Math.floor(Math.random()*4)],copied:false,mutated:false});
    progress=0;mutCount=0;
  }
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'dnaToggle()',label:'▶ Replicate!'},{cls:'btn-reset',fn:'dnaReset()',label:'🔄 New Strand'}])}
      ${sliderRow('dna_mut','☢️ Mutation Rate',0,30,5,'%','sv("dna_mut","%");dnaUpdate()')}
      ${sliderRow('dna_speed','⚡ Speed',30,150,80,'%','sv("dna_speed","%");dnaUpdate()')}
    </div>
    ${infoCards([{id:'dna_progress',val:'0%',label:'Replication Progress'},{id:'dna_mutations',val:'0',label:'Mutations Occurred'}])}
    ${theoryBox('A↔T, G↔C — Complementary Base Pairing','DNA Polymerase enzyme double helix ko unzip karta hai aur har original strand ke against ek naya complementary strand banata hai (A hamesha T se, G hamesha C se judta hai). Kabhi-kabhi copying mein error ho jaata hai — ise MUTATION kehte hain. Zyadatar mutations harmless hote hain, lekin kabhi yeh evolution ya genetic diseases ka reason bhi ban sakte hain!')}
  `);
  window.dnaUpdate=()=>{mutationRate=gv('dna_mut');speed=gv('dna_speed')/80;};
  window.dnaToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animate);}else{stopSim();}
  };
  window.dnaReset=()=>{stopSim();running=false;initStrand();draw();};

  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#050810';ctx.fillRect(0,0,cw,ch);
    const glow=ctx.createRadialGradient(cw/2,ch/2,10,cw/2,ch/2,cw*0.65);
    glow.addColorStop(0,'rgba(150,100,255,0.10)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);

    const n=bases.length;
    const stepY=(ch-40)/n;
    const cx=cw/2;
    const amp=cw*0.14;
    const copiedCount=Math.floor(progress*n);

    for(let i=0;i<n;i++){
      const y=20+i*stepY;
      const phase=i*0.5;
      const x1=cx+Math.sin(phase)*amp;
      const x2=cx-Math.sin(phase)*amp;
      const base=bases[i];
      const isCopied=i<copiedCount;

      // backbone strands
      ctx.strokeStyle='rgba(150,180,255,0.35)';ctx.lineWidth=2;
      if(i>0){
        const py=20+(i-1)*stepY,pphase=(i-1)*0.5;
        const px1=cx+Math.sin(pphase)*amp,px2=cx-Math.sin(pphase)*amp;
        ctx.beginPath();ctx.moveTo(px1,py);ctx.lineTo(x1,y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px2,py);ctx.lineTo(x2,y);ctx.stroke();
      }
      // base pair rungs
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();

      // original base nodes
      ctx.beginPath();ctx.arc(x1,y,7,0,Math.PI*2);ctx.fillStyle=COLORS[base.b];ctx.fill();
      ctx.beginPath();ctx.arc(x2,y,7,0,Math.PI*2);ctx.fillStyle=COLORS[PAIR[base.b]];ctx.fill();

      if(isCopied){
        // new complementary strand growing below/beside with slight offset
        const newBaseChar=base.mutated?base.mutB:PAIR[base.b];
        const nx=x2 - (cx-x2)*0.55;
        ctx.save();
        if(base.mutated){ctx.shadowColor='rgba(255,80,80,0.9)';ctx.shadowBlur=14;}
        ctx.beginPath();ctx.arc(nx,y,6,0,Math.PI*2);
        ctx.fillStyle=base.mutated?'#ff2d55':COLORS[newBaseChar];ctx.fill();
        ctx.restore();
        ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1.5;ctx.setLineDash([2,2]);
        ctx.beginPath();ctx.moveTo(x2,y);ctx.lineTo(nx,y);ctx.stroke();ctx.setLineDash([]);
      }
    }
    ctx.font='700 9px var(--font2)';ctx.textAlign='center';
    for(let i=0;i<n;i+=3){
      const y=20+i*stepY,phase=i*0.5;
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.fillText(bases[i].b,cx+Math.sin(phase)*amp,y-11);
    }
    ctx.textAlign='left';

    if($id('dna_progress'))$id('dna_progress').textContent=Math.round(progress*100)+'%';
    if($id('dna_mutations'))$id('dna_mutations').textContent=mutCount;
  }
  function animate(){
    if(!running)return;
    const prevCopied=Math.floor(progress*bases.length);
    progress+=0.003*speed;
    const nowCopied=Math.floor(progress*bases.length);
    for(let i=prevCopied;i<nowCopied&&i<bases.length;i++){
      if(Math.random()*100<mutationRate){
        const opts=['A','T','G','C'].filter(x=>x!==PAIR[bases[i].b]);
        bases[i].mutated=true;
        bases[i].mutB=opts[Math.floor(Math.random()*opts.length)];
        mutCount++;
      }
    }
    if(progress>=1){progress=1;running=false;stopSim();}
    draw();
    if(running)animId=requestAnimationFrame(animate);
  }
  initStrand();
  draw();
}

// ============================================================
// 79. XYLEM & TRANSPIRATION
// ============================================================
function simPlantTransport(c,ctx,p){
  let humidity=40,temperature=25,droplets=[],vapors=[],running=true,t=0;
  panel(`
    <div class="ctrl-section">
      ${sliderRow('pt_hum','💧 Humidity',10,90,40,'%','sv("pt_hum","%");ptUpdate()')}
      ${sliderRow('pt_temp','🌡️ Temperature',10,45,25,'°C','sv("pt_temp","°C");ptUpdate()')}
    </div>
    ${infoCards([{id:'pt_rate',val:'0',label:'Transpiration Rate'},{id:'pt_flow',val:'Normal',label:'Water Flow Speed'}])}
    ${theoryBox('Transpiration Pull: Kam humidity + Zyada temperature = Tez flow','Leaves ke stomata se paani vapor bankar nikalta hai (transpiration) — isse ek "pulling force" banta hai jo xylem tubes ke through root se paani upar kheenchta hai, bilkul straw se juice peene jaisa! Kam humidity aur zyada temperature mein stomata se paani tezi se evaporate hota hai, isliye upward flow bhi tez ho jaata hai.')}
  `);
  window.ptUpdate=()=>{humidity=gv('pt_hum');temperature=gv('pt_temp');};

  function rate(){
    return Math.max(0.2,(temperature-10)/35*2.2 * (1-(humidity-10)/80));
  }
  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#071006';ctx.fillRect(0,0,cw,ch);
    const glow=ctx.createRadialGradient(cw/2,ch*0.3,10,cw/2,ch*0.3,cw*0.7);
    glow.addColorStop(0,'rgba(120,220,150,0.08)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);

    const groundY=ch*0.82;
    // soil
    ctx.fillStyle='#3d2e1a';ctx.fillRect(0,groundY,cw,ch-groundY);
    ctx.fillStyle='rgba(255,255,255,0.05)';
    for(let i=0;i<30;i++){ctx.beginPath();ctx.arc((i*53)%cw,groundY+((i*29)%(ch-groundY)),1.5,0,Math.PI*2);ctx.fill();}

    const stemX=cw/2,stemTop=ch*0.12,stemW=14;
    // roots
    ctx.strokeStyle='#8a6423';ctx.lineWidth=4;ctx.lineCap='round';
    for(let i=-2;i<=2;i++){
      ctx.beginPath();ctx.moveTo(stemX,groundY);
      ctx.quadraticCurveTo(stemX+i*18,groundY+30,stemX+i*32,groundY+55+Math.abs(i)*8);
      ctx.stroke();
    }
    // stem (xylem tube)
    const stemGrad=ctx.createLinearGradient(stemX-stemW,0,stemX+stemW,0);
    stemGrad.addColorStop(0,'#3d6a22');stemGrad.addColorStop(0.5,'#5a8a3a');stemGrad.addColorStop(1,'#3d6a22');
    ctx.fillStyle=stemGrad;
    ctx.fillRect(stemX-stemW/2,stemTop,stemW,groundY-stemTop);
    ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;
    ctx.strokeRect(stemX-stemW/2,stemTop,stemW,groundY-stemTop);
    // xylem inner channel
    ctx.fillStyle='rgba(150,200,255,0.15)';
    ctx.fillRect(stemX-3,stemTop,6,groundY-stemTop);

    // leaves
    const leafPositions=[0.25,0.42,0.58,0.75];
    leafPositions.forEach((lp,i)=>{
      const ly=stemTop+(groundY-stemTop)*lp;
      const side=i%2===0?1:-1;
      ctx.save();ctx.translate(stemX,ly);ctx.rotate(side*0.5);
      const lg=ctx.createLinearGradient(0,0,side*38,0);
      lg.addColorStop(0,'#5a8a3a');lg.addColorStop(1,'#a9e34b');
      ctx.beginPath();
      ctx.ellipse(side*20,0,24,11,0,0,Math.PI*2);
      ctx.fillStyle=lg;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.stroke();
      ctx.restore();
    });

    // droplet particles rising through xylem
    ctx.textAlign='left';
    droplets.forEach(d=>{
      ctx.beginPath();ctx.arc(stemX+d.off,d.y,2.4,0,Math.PI*2);
      ctx.fillStyle='rgba(120,190,255,0.85)';ctx.fill();
    });
    // vapor leaving leaves
    vapors.forEach(v=>{
      ctx.beginPath();ctx.arc(v.x,v.y,v.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(220,240,255,${v.alpha})`;ctx.fill();
    });

    const r=rate();
    if($id('pt_rate'))$id('pt_rate').textContent=r.toFixed(2)+'x';
    const flowLabel=r>1.6?'⚡ Bahut Tez':(r>0.9?'➡️ Normal':'🐢 Dheemi');
    if($id('pt_flow'))$id('pt_flow').textContent=flowLabel;
  }
  function animate(){
    t++;
    const r=rate();
    if(t%Math.max(2,Math.round(14/r))===0){
      droplets.push({y:c.height*0.82,off:(Math.random()-0.5)*4});
    }
    droplets.forEach(d=>d.y-=1.4*r);
    droplets=droplets.filter(d=>d.y>c.height*0.12);
    if(t%Math.max(3,Math.round(20/r))===0){
      const lp=[0.25,0.42,0.58,0.75][Math.floor(Math.random()*4)];
      const ly=c.height*0.12+(c.height*0.82-c.height*0.12)*lp;
      const side=Math.random()<0.5?1:-1;
      vapors.push({x:c.width/2+side*40,y:ly,r:1.5,alpha:0.7,vy:-0.6*r});
    }
    vapors.forEach(v=>{v.y+=v.vy;v.r+=0.06*r;v.alpha-=0.012;});
    vapors=vapors.filter(v=>v.alpha>0);
    draw();
    animId=requestAnimationFrame(animate);
  }
  draw();
  animate();
}

</script>
