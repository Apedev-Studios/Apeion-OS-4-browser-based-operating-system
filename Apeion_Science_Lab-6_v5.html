    {sym:'Fe',name:'Iron',num:26,mass:55.84,type:'metal',col:'#e8590c',desc:'Loha. Blood mein hemoglobin ka hissa.'},
    {sym:'Cu',name:'Copper',num:29,mass:63.55,type:'metal',col:'#ff9f43',desc:'Taamba. Wiring aur paisa mein.'},
    {sym:'Au',name:'Gold',num:79,mass:196.97,type:'metal',col:'#ffd43b',desc:'Sona. React nahi karta, isliye chamakta hai!'},
  ];
  let sel=null;
  function drawPeriodic(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cols=4,cw2=c.width,size=(cw2-20)/cols-6;
    elements.forEach((el,i)=>{
      const row=Math.floor(i/cols),col=i%cols;
      const x=10+col*(size+6),y=10+row*(size*0.7+6);
      ctx.fillStyle=sel===i?el.col+'44':el.col+'22';
      ctx.beginPath();ctx.roundRect(x,y,size,size*0.65,6);ctx.fill();
      ctx.strokeStyle=sel===i?el.col:'rgba(255,255,255,0.1)';ctx.lineWidth=sel===i?2:1;ctx.stroke();
      ctx.fillStyle=el.col;ctx.font='bold 14px monospace';ctx.textAlign='center';
      ctx.fillText(el.sym,x+size/2,y+size*0.35);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px monospace';
      ctx.fillText(el.num,x+size/2,y+size*0.55);
    });
    ctx.textAlign='left';
  }
  function updateInfo(){
    const info=sel!==null?`<div style="background:${elements[sel].col}22;border:1px solid ${elements[sel].col};border-radius:12px;padding:10px;margin-top:8px">
      <div style="font-size:24px;font-weight:800;color:${elements[sel].col}">${elements[sel].sym}</div>
      <div style="font-size:15px;font-weight:700">${elements[sel].name}</div>
      <div style="font-size:12px;color:var(--text2);font-family:var(--font2)">Atomic No: ${elements[sel].num} | Mass: ${elements[sel].mass}</div>
      <div style="font-size:12px;color:#adb5bd;font-family:var(--font2);margin-top:4px">${elements[sel].desc}</div>
    </div>`:'<div style="color:var(--text2);font-size:13px;margin-top:8px;font-family:var(--font2)">Kisi element pe tap karke info dekho!</div>';
    document.getElementById('per_info').innerHTML=info;
  }
  panel(`<div class="ctrl-label">📋 Element Chunno (tap karo)</div><div id="per_info"></div>`);
  drawPeriodic();updateInfo();
  c.onclick=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const cols=4,size=(c.width-20)/cols-6;
    elements.forEach((el,i)=>{
      const row=Math.floor(i/cols),col=i%cols;
      const x=10+col*(size+6),y=10+row*(size*0.7+6);
      if(mx>=x&&mx<=x+size&&my>=y&&my<=y+size*0.65){sel=i;drawPeriodic();updateInfo();}
    });
  };
}

function simElectrolysis(c,ctx,p){
  let voltage=6,running=false,bubbles=[];
  panel(`
    ${sliderRow('el_v','⚡ Voltage',1,12,6,' V','sv("el_v"," V");elUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'elStart()',label:'▶ Start'},{cls:'btn-reset',fn:'elStop()',label:'⏸ Stop'}])}
    ${infoCards([{id:'el_h2',val:'0',label:'H₂ Bubbles'},{id:'el_o2',val:'0',label:'O₂ Bubbles'}])}
    ${theoryBox('2H₂O → 2H₂ + O₂','Paani mein current dene se H₂O molecules toot jaate hain. Cathode (−) par H₂, Anode (+) par O₂ banta hai. 2:1 ratio hamesha!')}
  `);
  let h2count=0,o2count=0;
  window.elUpdate=()=>{voltage=gv('el_v');};
  window.elStart=()=>{running=true;animId=requestAnimationFrame(animEl);};
  window.elStop=()=>{stopSim();running=false;};
  function animEl(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cw=c.width,ch=c.height,v2=gv('el_v');
    // Water
    const waterY=ch*0.3;
    const wg=ctx.createLinearGradient(0,waterY,0,ch-30);
    wg.addColorStop(0,'rgba(74,192,246,0.3)');wg.addColorStop(1,'rgba(28,144,246,0.15)');
    ctx.fillStyle=wg;ctx.fillRect(20,waterY,cw-40,ch-waterY-30);
    ctx.strokeStyle='rgba(74,192,246,0.4)';ctx.lineWidth=1;ctx.strokeRect(20,waterY,cw-40,ch-waterY-30);
    // Electrodes
    const cathX=cw*0.3,anodX=cw*0.7;
    ctx.fillStyle='#adb5bd';ctx.fillRect(cathX-6,waterY-20,12,ch*0.5);
    ctx.fillStyle='#ffd43b';ctx.fillRect(anodX-6,waterY-20,12,ch*0.5);
    ctx.fillStyle='#ff6b6b';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText('− Cathode',cathX,waterY-28);ctx.fillText('+ Anode',anodX,waterY-28);
    ctx.fillText('H₂',cathX,waterY+20);ctx.fillText('O₂',anodX,waterY+20);
    // Battery
    ctx.fillStyle='#ffd43b';ctx.fillRect(cw/2-30,10,60,30);
    ctx.fillStyle='#000';ctx.font='bold 13px monospace';ctx.fillText(v2+'V',cw/2-14,30);
    // Wires
    ctx.strokeStyle='#adb5bd';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cathX,waterY-20);ctx.lineTo(cathX,20);ctx.lineTo(cw/2-30,20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(anodX,waterY-20);ctx.lineTo(anodX,20);ctx.lineTo(cw/2+30,20);ctx.stroke();
    // Bubbles
    if(Math.random()<v2/60){bubbles.push({x:cathX+(Math.random()-0.5)*10,y:ch-50,type:'H2'});h2count++;}
    if(Math.random()<v2/120){bubbles.push({x:anodX+(Math.random()-0.5)*10,y:ch-50,type:'O2'});o2count++;}
    bubbles=bubbles.filter(b=>{
      b.y-=1.5+(Math.random()*0.5);b.x+=(Math.random()-0.5)*0.5;
      if(b.y<waterY+10)return false;
      ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);
      ctx.fillStyle=b.type==='H2'?'rgba(88,166,255,0.7)':'rgba(255,200,0,0.7)';ctx.fill();
      return true;
    });
    if($id('el_h2'))$id('el_h2').textContent=h2count;
    if($id('el_o2'))$id('el_o2').textContent=o2count;
    ctx.textAlign='left';
    animId=requestAnimationFrame(animEl);
  }
}

// PHYSICS: SIMPLE HARMONIC MOTION (Spring-Mass)
// ============================================================
function simSHM(c,ctx,p){
  let mass=1,k=10,amp=80,running=false,t=0;
  panel(`
    ${sliderRow('shm_k','🔧 Spring (k)',1,30,10,' N/m','sv("shm_k"," N/m");shmUpdate()')}
    ${sliderRow('shm_m','⚖️ Mass',0.5,5,1,' kg','sv("shm_m"," kg");shmUpdate()')}
    ${sliderRow('shm_a','📏 Amplitude',20,120,80,' px','sv("shm_a"," px");shmUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'shmStart()',label:'▶ Start'},{cls:'btn-reset',fn:'shmReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'shm_T',val:'1.99',label:'Period (s)'},{id:'shm_f',val:'0.50',label:'Frequency (Hz)'},{id:'shm_x',val:'0',label:'Position (px)'}])}
    ${theoryBox('T = 2π√(m/k)','Mass badhane par oscillation slow hota hai. Spring stiffness badhane par tez hota hai. Energy = ½kA²')}
  `);
  function shmUpdate(){
    mass=gv('shm_m'); k=gv('shm_k'); amp=gv('shm_a');
    const T=(2*Math.PI*Math.sqrt(mass/k)).toFixed(3);
    if($id('shm_T'))$id('shm_T').textContent=T;
    if($id('shm_f'))$id('shm_f').textContent=(1/parseFloat(T)).toFixed(3);
    if(!running) drawSHM(0);
  }
  window.shmUpdate=shmUpdate;
  window.shmStart=()=>{if(running){stopSim();running=false;return;} running=true;t=0;animId=requestAnimationFrame(animSHM);};
  window.shmReset=()=>{stopSim();running=false;t=0;drawSHM(0);};
  function drawSHM(x){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
    const cx=cw/2,wallX=cw*0.15,ballX=cx+x;
    // Ceiling
    ctx.fillStyle='#2d4a6a';ctx.fillRect(0,0,cw,20);
    // Spring (zigzag)
    const springY=ch*0.38,segments=14;
    const sw=ballX-wallX,segW=sw/segments;
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(wallX,springY);
    for(let i=0;i<=segments;i++){
      const sx=wallX+i*segW;
      const sy=springY+(i%2===0?-12:12)*(i>0&&i<segments?1:0);
      ctx.lineTo(sx,sy);
    }
    ctx.lineTo(ballX,springY);ctx.stroke();
    // Wall
    ctx.fillStyle='#3d6a9a';ctx.fillRect(0,10,wallX,ch-10);
    // Equilibrium line
    ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,30);ctx.lineTo(cx,ch-20);ctx.stroke();ctx.setLineDash([]);
    // Mass block
    const bw=50,bh=50;
    const grad=ctx.createLinearGradient(ballX-bw/2,springY,ballX+bw/2,springY+bh);
    grad.addColorStop(0,'#ff6b6b');grad.addColorStop(1,'#c0392b');
    ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(ballX-bw/2,springY,bw,bh,8);ctx.fill();
    ctx.strokeStyle='#ff9999';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
    ctx.fillText(mass+'kg',ballX,springY+30);
    // Position arrow
    if(Math.abs(x)>5){
      ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(cx,springY+65);ctx.lineTo(ballX,springY+65);ctx.stroke();
      ctx.fillStyle='#ffd43b';ctx.fillText(x.toFixed(0)+'px',ballX,springY+82);
    }
    ctx.textAlign='left';
    if($id('shm_x'))$id('shm_x').textContent=x.toFixed(1);
  }
  function animSHM(){
    mass=gv('shm_m');k=gv('shm_k');amp=gv('shm_a');
    const omega=Math.sqrt(k/mass);
    const x=amp*Math.cos(omega*t);
    drawSHM(x);
    t+=0.03;
    animId=requestAnimationFrame(animSHM);
  }
  shmUpdate();
}

// PHYSICS: OHM'S LAW (V=IR visualizer)
// ============================================================
function simOhmsLaw(c,ctx,p){
  let V=6,R=3;
  panel(`
    ${sliderRow('ohm_v','⚡ Voltage (V)',1,24,6,' V','sv("ohm_v"," V");ohmCalc()')}
    ${sliderRow('ohm_r','🔧 Resistance (R)',1,20,3,' Ω','sv("ohm_r"," Ω");ohmCalc()')}
    ${infoCards([{id:'ohm_i',val:'2.00',label:'Current I (A)'},{id:'ohm_p',val:'12.00',label:'Power P (W)'},{id:'ohm_e',val:'6.00',label:'Energy/s (J)'}])}
    ${theoryBox('V = I × R  |  P = V × I','Voltage (V) = EMF. Resistance (Ω) = Rokaawat. Current (A) = Charge flow. Power = kaam karne ki raftaar. V badhao → I bhi badhega!')}
  `);
  function ohmCalc(){
    V=gv('ohm_v'); R=gv('ohm_r');
    const I=(V/R).toFixed(2);
    const P=(V*V/R).toFixed(2);
    if($id('ohm_i'))$id('ohm_i').textContent=I;
    if($id('ohm_p'))$id('ohm_p').textContent=P;
    if($id('ohm_e'))$id('ohm_e').textContent=P;
    drawOhm(V,R,parseFloat(I));
  }
  window.ohmCalc=ohmCalc;
  function drawOhm(V,R,I){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
    // Circuit rectangle
    const mx=40,my=40,mw=cw-80,mh=ch-80;
    const cx2=mx+mw/2,cy2=my+mh/2;
    // Battery (left side)
    ctx.fillStyle='#ffd43b';ctx.fillRect(mx-10,cy2-30,20,60);
    ctx.fillStyle='#000';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText(V+'V',mx,cy2+5);
    // Resistor (top, middle)
    const rx=cx2-30,ry=my-8;
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(rx,my);
    for(let i=0;i<8;i++) ctx.lineTo(rx+(i+0.5)*8,my+(i%2===0?-8:8));
    ctx.lineTo(rx+64,my);ctx.stroke();
    ctx.fillStyle='#ff6b6b';ctx.font='bold 11px monospace';ctx.fillText(R+'Ω',cx2,my-14);
    // Bulb (right side) — brightness based on current
    const bulbX=mx+mw,bulbY=cy2;
    const bright=Math.min(I/8,1);
    if(bright>0.1){
      const g=ctx.createRadialGradient(bulbX,bulbY,0,bulbX,bulbY,50);
      g.addColorStop(0,`rgba(255,215,0,${bright*0.8})`);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(bulbX,bulbY,50,0,Math.PI*2);ctx.fill();
    }
    ctx.beginPath();ctx.arc(bulbX,bulbY,18,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,200,0,${0.2+bright*0.8})`;ctx.fill();
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText('💡',bulbX,bulbY+5);
    // Wires
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(mx,cy2-30);ctx.lineTo(mx,my);ctx.lineTo(rx,my);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx+64,my);ctx.lineTo(mx+mw,my);ctx.lineTo(mx+mw,cy2-18);ctx.stroke();
    ctx.beginPath();ctx.moveTo(mx+mw,cy2+18);ctx.lineTo(mx+mw,my+mh);ctx.lineTo(mx,my+mh);ctx.lineTo(mx,cy2+30);ctx.stroke();
    // Current arrows
    ctx.fillStyle='#56d364';ctx.font='bold 13px monospace';
    ctx.fillText('→ I='+I+'A',cx2-20,my+mh+22);
    ctx.textAlign='left';
  }
  ohmCalc();
}

// CHEMISTRY: ACID-BASE TITRATION
// ============================================================
function simTitration(c,ctx,p){
  let baseAdded=0,acidMol=0.1,acidVol=25;
  panel(`
    ${sliderRow('tit_acid','🔴 Acid (mol/L)',0.05,0.5,0.1,' M','sv("tit_acid"," M");titUpdate()')}
    ${sliderRow('tit_vol','🧪 Acid Volume',10,50,25,' mL','sv("tit_vol"," mL");titUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'titAdd()',label:'➕ Add Base (5mL)'},{cls:'btn-reset',fn:'titReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'tit_base',val:'0',label:'Base Added (mL)'},{id:'tit_ph',val:'1.00',label:'pH'},{id:'tit_status',val:'Acidic',label:'Status'}])}
    ${theoryBox('n(acid) = n(base) at EP','Equivalence Point par acid aur base equal moles mein milte hain. pH = 7 hota hai. Indicator colour change karta hai!')}
  `);
  function pH(){
    acidMol=gv('tit_acid');acidVol=gv('tit_vol');
    const acidMoles=acidMol*acidVol/1000;
    const baseMoles=0.1*baseAdded/1000;
    const totalVol=(acidVol+baseAdded)/1000;
    if(baseMoles<acidMoles){
      const h=(acidMoles-baseMoles)/totalVol;
      return Math.max(0,-Math.log10(h));
    } else if(baseMoles>acidMoles){
      const oh=(baseMoles-acidMoles)/totalVol;
      return Math.min(14,14+Math.log10(oh));
    }
    return 7;
  }
  function titUpdate(){drawTitration();}
  window.titUpdate=titUpdate;
  window.titAdd=()=>{baseAdded+=5;if(baseAdded>100)baseAdded=100;drawTitration();};
  window.titReset=()=>{baseAdded=0;drawTitration();};
  function drawTitration(){
    const ph=pH();
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
    // Color based on pH
    const col=ph<7?`rgba(255,100,100,${0.3+0.05*(7-ph)})`:`rgba(100,150,255,${0.3+0.05*(ph-7)})`;
    // Beaker
    const bx=cw/2-45,by=ch*0.15,bw=90,bh=ch*0.55;
    const liquidH=Math.max(bh*0.3,bh*(0.3+baseAdded/200));
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by);ctx.stroke();
    ctx.fillStyle=col;ctx.fillRect(bx+1,by+bh-liquidH,bw-2,liquidH);
    // Burette (top)
    ctx.strokeStyle='#adb5bd';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(cw/2,10);ctx.lineTo(cw/2,by+5);ctx.stroke();
    ctx.beginPath();ctx.arc(cw/2,by+8,4,0,Math.PI*2);ctx.fillStyle='#74c0fc';ctx.fill();
    // pH label big
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText('pH '+ph.toFixed(2),cw/2,by+bh/2);
    // Status
    const status=ph<7?'Acidic 🔴':ph>7?'Basic 🔵':'Neutral ✅';
    ctx.font='14px monospace';ctx.fillText(status,cw/2,by+bh/2+28);
    // pH bar (bottom)
    const bary=by+bh+20,barW=cw-40;
    const phGrad=ctx.createLinearGradient(20,0,barW+20,0);
    phGrad.addColorStop(0,'#ff0000');phGrad.addColorStop(0.5,'#00cc00');phGrad.addColorStop(1,'#0000ff');
    ctx.fillStyle=phGrad;ctx.fillRect(20,bary,barW,14);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(20+barW*(ph/14),bary+7,9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.font='bold 10px monospace';ctx.fillText(ph.toFixed(1),20+barW*(ph/14)-8,bary+11);
    ctx.textAlign='left';
    if($id('tit_ph'))$id('tit_ph').textContent=ph.toFixed(2);
    if($id('tit_base'))$id('tit_base').textContent=baseAdded;
    if($id('tit_status'))$id('tit_status').textContent=ph<6.5?'Acidic':ph>7.5?'Basic':'Neutral ✅';
  }
  drawTitration();
}

function simMolBond(c,ctx,p){
  let selMol=0;
  const molecules=[
    {name:'H₂O (Water)',formula:'H₂O',type:'Covalent / Polar',atoms:[{sym:'O',col:'#ff6b6b',x:0.5,y:0.35,r:22},{sym:'H',col:'#74c0fc',x:0.3,y:0.6,r:14},{sym:'H',col:'#74c0fc',x:0.7,y:0.6,r:14}],bonds:[[0,1],[0,2]],desc:'Oxygen 2 hydrogen atoms ke saath electrons share karta hai. Polar covalent bond — partial charges hote hain. Isliye pani dissolve karta hai cheezein!'},
    {name:'NaCl (Salt)',formula:'NaCl',type:'Ionic Bond',atoms:[{sym:'Na⁺',col:'#ffd43b',x:0.35,y:0.45,r:24},{sym:'Cl⁻',col:'#69db7c',x:0.65,y:0.45,r:28}],bonds:[[0,1]],desc:'Sodium ek electron deta hai Chlorine ko. Na⁺ positive, Cl⁻ negative ban jaata hai. Opposite charges ek doosre ko kheenchte hain — ionic bond!'},
    {name:'CO₂ (Carbon Dioxide)',formula:'CO₂',type:'Covalent / Non-Polar',atoms:[{sym:'O',col:'#ff6b6b',x:0.2,y:0.45,r:20},{sym:'C',col:'#adb5bd',x:0.5,y:0.45,r:18},{sym:'O',col:'#ff6b6b',x:0.8,y:0.45,r:20}],bonds:[[0,1],[1,2]],desc:'Carbon 2 double bonds banata hai oxygen ke saath. Linear shape — greenhouse gas! Saans lene ke baad yahi exhale karte ho.'},
    {name:'CH₄ (Methane)',formula:'CH₄',type:'Covalent / Non-Polar',atoms:[{sym:'C',col:'#adb5bd',x:0.5,y:0.4,r:20},{sym:'H',col:'#74c0fc',x:0.3,y:0.25,r:13},{sym:'H',col:'#74c0fc',x:0.7,y:0.25,r:13},{sym:'H',col:'#74c0fc',x:0.3,y:0.6,r:13},{sym:'H',col:'#74c0fc',x:0.7,y:0.6,r:13}],bonds:[[0,1],[0,2],[0,3],[0,4]],desc:'Carbon 4 hydrogen atoms ke saath bonds banata hai — tetrahedral shape. Natural gas — cooking mein use hota hai!'},
  ];
  function drawMolBond(){
    const mol=molecules[selMol];
    const cw=c.width,ch=c.height*0.72;
    ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    // Bonds
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=4;
    mol.bonds.forEach(([a,b])=>{
      const A=mol.atoms[a],B=mol.atoms[b];
      ctx.beginPath();ctx.moveTo(A.x*cw,A.y*ch);ctx.lineTo(B.x*cw,B.y*ch);ctx.stroke();
    });
    // Atoms
    mol.atoms.forEach(a=>{
      const x=a.x*cw,y=a.y*ch;
      const g=ctx.createRadialGradient(x-a.r*0.3,y-a.r*0.3,0,x,y,a.r*1.4);
      g.addColorStop(0,a.col+'ff');g.addColorStop(1,a.col+'55');
      ctx.beginPath();ctx.arc(x,y,a.r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle=a.col;ctx.lineWidth=2;ctx.stroke();

function simPrimes(c,ctx,p){
  let limit=100,sieveStep=-1,primes=[],composite=new Set(),animating=false,curNum=2;
  function buildSieve(n){
    const arr=Array.from({length:n+1},(_,i)=>i);
    const comp=new Set([0,1]);
    for(let i=2;i<=n;i++){if(!comp.has(i))for(let j=i*2;j<=n;j+=i)comp.add(j);}
    return comp;
  }
  panel(`
    ${sliderRow('pri_lim','🔢 Limit',20,200,100,'','sv("pri_lim","");priUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'priAnimate()',label:'▶ Animate Sieve'},{cls:'btn-reset',fn:'priReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'pri_count',val:'25',label:'Prime Count'},{id:'pri_cur',val:'-',label:'Current'}])}
    ${theoryBox('Multiples hatao → Primes!','2 se start karo, uske multiples hatao. Phir next unmarked number lo. Repeat karo — jo bache woh prime hain!')}
  `);
  window.priUpdate=()=>{limit=gv('pri_lim');priReset();};
  window.priReset=()=>{stopSim();animating=false;composite=new Set([0,1]);curNum=2;drawSieve(new Set());};
  window.priAnimate=()=>{
    if(animating)return;
    animating=true;composite=new Set([0,1]);curNum=2;
    function step(){
      if(curNum>limit){animating=false;drawSieve(composite);return;}
      if(!composite.has(curNum)){for(let j=curNum*2;j<=limit;j+=curNum)composite.add(j);}
      if($id('pri_cur'))$id('pri_cur').textContent=curNum;
      drawSieve(composite,curNum);
      curNum++;
      animId=setTimeout(step,120);
    }
    step();
  };
  function drawSieve(comp,highlight=-1){
    const n=gv('pri_lim')||100;
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
    const cols=10,cellW=(cw-20)/cols,cellH=Math.min(cellW*0.9,(ch-40)/Math.ceil(n/cols));
    let primeCount=0;
    for(let i=2;i<=n;i++){
      const col=(i-1)%cols,row=Math.floor((i-1)/cols);
      const x=10+col*cellW,y=10+row*cellH;
      const isPrime=!comp.has(i);
      if(isPrime)primeCount++;
      ctx.fillStyle=i===highlight?'#ffd43b44':isPrime?'#69db7c33':'#ff6b6b11';
      ctx.beginPath();ctx.roundRect(x+1,y+1,cellW-2,cellH-2,4);ctx.fill();
      ctx.strokeStyle=i===highlight?'#ffd43b':isPrime?'#69db7c':'#2d4a6a';ctx.lineWidth=isPrime?1.5:0.5;ctx.stroke();
      ctx.fillStyle=i===highlight?'#ffd43b':isPrime?'#a9e34b':'#3d5a6a';
      ctx.font=`bold ${cellH>28?12:10}px monospace`;ctx.textAlign='center';
      ctx.fillText(i,x+cellW/2,y+cellH/2+4);
    }
    if($id('pri_count'))$id('pri_count').textContent=primeCount;
    ctx.textAlign='left';
  }
  drawSieve(new Set());
}

// ============================================================
function simTrigCircle(c,ctx,p){
  let angle=30,running=false;
  panel(`
    ${sliderRow('trig_a','📐 Angle',0,360,30,'°','sv("trig_a","°");trigUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'trigSpin()',label:'🔄 Auto Spin'},{cls:'btn-reset',fn:'trigStop()',label:'⏹ Stop'}])}
    ${infoCards([{id:'trig_sin',val:'0.500',label:'sin(θ)'},{id:'trig_cos',val:'0.866',label:'cos(θ)'},{id:'trig_tan',val:'0.577',label:'tan(θ)'}])}
    ${theoryBox('sin²θ + cos²θ = 1','Sin = opposite/hypotenuse. Cos = adjacent/hypotenuse. Tan = sin/cos. Unit circle par radius = 1 hoti hai. Quadrant yaad rakho!')}
  `);
  function trigUpdate(){
    angle=gv('trig_a');
    const rad=angle*Math.PI/180;
    const s=Math.sin(rad),co=Math.cos(rad),ta=Math.tan(rad);
    if($id('trig_sin'))$id('trig_sin').textContent=s.toFixed(3);
    if($id('trig_cos'))$id('trig_cos').textContent=co.toFixed(3);
    if($id('trig_tan'))$id('trig_tan').textContent=Math.abs(ta)>99?'∞':ta.toFixed(3);
    drawTrig(angle);
  }
  window.trigUpdate=trigUpdate;
  window.trigSpin=()=>{running=true;animId=requestAnimationFrame(spinTrig);};
  window.trigStop=()=>{stopSim();running=false;};
  function spinTrig(){angle=(angle+0.8)%360;if($id('trig_a'))$id('trig_a').value=angle;sv('trig_a','°');trigUpdate();animId=requestAnimationFrame(spinTrig);}
  function drawTrig(deg){
    const rad=deg*Math.PI/180;
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
    const cx=cw/2,cy=ch/2,R=Math.min(cx,cy)*0.75;
    // Grid lines
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(cw,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,ch);ctx.stroke();
    // Circle
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.strokeStyle='#2d4a6a';ctx.lineWidth=2;ctx.stroke();
    // Point on circle
    const px=cx+R*Math.cos(rad),py=cy-R*Math.sin(rad);
    // Sin (vertical, red)
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(px,cy);ctx.lineTo(px,py);ctx.stroke();
    // Cos (horizontal, blue)
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(cx,py);ctx.lineTo(px,py);ctx.stroke();
    // Hypotenuse
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(px,py);ctx.stroke();
    // Tan line (vertical from unit circle to x-axis extended)
    const tanV=R*Math.tan(rad);
    if(Math.abs(tanV)<R*3){
      ctx.strokeStyle='#69db7c';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(cx+R,cy);ctx.lineTo(cx+R,cy-tanV);ctx.stroke();ctx.setLineDash([]);
    }
    // Angle arc
    ctx.strokeStyle='#bc8cff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,30,0,-rad,true);ctx.stroke();
    // Point
    ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fillStyle='#ffd43b';ctx.fill();
    // Labels
    ctx.fillStyle='#ff6b6b';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText('sin='+Math.sin(rad).toFixed(2),px+30,py<cy?py-8:py+18);
    ctx.fillStyle='#58a6ff';ctx.fillText('cos='+Math.cos(rad).toFixed(2),cx+(px-cx)/2,py+18);
    ctx.fillStyle='#bc8cff';ctx.font='bold 13px monospace';ctx.fillText(deg.toFixed(0)+'°',cx+15,cy-8);
    // Quadrant labels
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.font='11px monospace';
    ctx.fillText('I',cx+R*0.6,cy-R*0.6);ctx.fillText('II',cx-R*0.6,cy-R*0.6);
    ctx.fillText('III',cx-R*0.6,cy+R*0.6);ctx.fillText('IV',cx+R*0.6,cy+R*0.6);
    ctx.textAlign='left';
  }
  trigUpdate();
}

function simNeuron(c,ctx,p){
  let running=false,t=0,stimStrength=50;
  panel(`
    ${sliderRow('neu_stim','⚡ Stimulus',10,100,50,'%','sv("neu_stim","%");neuUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'neuFire()',label:'⚡ Fire!'},{cls:'btn-reset',fn:'neuReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'neu_mv',val:'-70',label:'Membrane (mV)'},{id:'neu_state',val:'Rest',label:'State'}])}
    ${theoryBox('−70mV → +40mV → −70mV','Resting potential −70mV. Stimulus aane par Na⁺ andar ghusate hain → depolarization → +40mV! Phir K⁺ bahar jaate hain → repolarization. All-or-nothing rule!')}
  `);
  window.neuUpdate=()=>{stimStrength=gv('neu_stim');};
  window.neuFire=()=>{if(running)return;if(gv('neu_stim')<30){if($id('neu_state'))$id('neu_state').textContent='Below Threshold!';return;} running=true;t=0;animId=requestAnimationFrame(animNeuron);};
  window.neuReset=()=>{stopSim();running=false;t=0;drawNeuron(0,-70,'Resting');};
  function getMV(t){
    if(t<20) return -70;
    if(t<35) return -70+(110*(t-20)/15);
    if(t<50) return 40-(110*(t-35)/15);
    if(t<65) return -70-(10*Math.sin((t-50)/15*Math.PI));
    return -70;
  }
  function getState(mv){return mv<-60?'Resting':mv<0?'Depolarizing':mv>0?'Peak +40mV':'Repolarizing';}
  function drawNeuron(progress,mv,state){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
    // Neuron body (soma)
    const somaX=cw*0.35,somaY=ch*0.35,somaR=35;
    const somaCol=mv>0?'#ff6b6b':mv>-60?'#ffd43b':'#69db7c';
    ctx.beginPath();ctx.arc(somaX,somaY,somaR,0,Math.PI*2);
    ctx.fillStyle=somaCol+'44';ctx.fill();ctx.strokeStyle=somaCol;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('Soma',somaX,somaY+4);
    // Dendrites
    [[-40,-35],[-55,0],[-40,35]].forEach(([dx,dy])=>{
      ctx.strokeStyle='#58a6ff';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(somaX,somaY);ctx.lineTo(somaX+dx,somaY+dy);ctx.stroke();
      ctx.beginPath();ctx.arc(somaX+dx,somaY+dy,8,0,Math.PI*2);ctx.fillStyle='#58a6ff44';ctx.fill();
    });
    // Axon with signal wave
    const axStart=somaX+somaR,axY=somaY,axEnd=cw-30;
    ctx.strokeStyle='#bc8cff';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(axStart,axY);ctx.lineTo(axEnd,axY);ctx.stroke();
    if(running&&progress>0){
      const sigX=axStart+(axEnd-axStart)*Math.min(progress/70,1);
      const g=ctx.createRadialGradient(sigX,axY,0,sigX,axY,25);
      g.addColorStop(0,somaCol+'cc');g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(sigX,axY,25,0,Math.PI*2);ctx.fill();
    }
    // Terminal buttons
    [[-10,-20],[10,0],[-10,20]].forEach(([dx,dy])=>{
      ctx.beginPath();ctx.arc(axEnd+dx,axY+dy,7,0,Math.PI*2);
      ctx.fillStyle=progress>60?'#ffd43b88':'#2d4a6a';ctx.fill();
      ctx.strokeStyle='#ffd43b';ctx.lineWidth=1;ctx.stroke();
    });
    // Graph (AP curve at bottom)
    const gx=20,gy=ch*0.65,gw=cw-40,gh=ch*0.28;
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
    ctx.strokeRect(gx,gy,gw,gh);
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px monospace';ctx.textAlign='left';
    ctx.fillText('+40',gx+2,gy+12);ctx.fillText('-70',gx+2,gy+gh-4);
    ctx.strokeStyle='#56d364';ctx.lineWidth=2;ctx.beginPath();
    for(let tt=0;tt<=80;tt++){
      const mv2=getMV(tt);
      const x=gx+tt*(gw/80);
      const y=gy+gh-(mv2+80)/(120)*gh;
      tt===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    // Current position marker
    if(running&&t>0){
      const markerX=gx+Math.min(t,80)*(gw/80);
      ctx.strokeStyle='#ffd43b';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(markerX,gy);ctx.lineTo(markerX,gy+gh);ctx.stroke();
    }
    ctx.textAlign='left';
    if($id('neu_mv'))$id('neu_mv').textContent=mv.toFixed(0);
    if($id('neu_state'))$id('neu_state').textContent=state;
  }
  function animNeuron(){
    const mv=getMV(t);
    drawNeuron(t,mv,getState(mv));
    t+=0.5;
    if(t>80){running=false;return;}
    animId=requestAnimationFrame(animNeuron);
  }
  drawNeuron(0,-70,'Resting');
}

// CHEMISTRY: GAS LAWS (Boyle's + Charles')

function simGasLaws(c,ctx,p){
  let mode='boyle', P=1, V=10, T=300, animating=false;
  const k_boyle = 10; // P*V = const = 10
  const k_charles = V/T; // V/T = const

  panel(`
    <div class="ctrl-label">📐 Law Chunno</div>
    <div class="btn-row" style="margin-bottom:10px">
      <button class="sim-btn" id="gl_boyle" onclick="glMode('boyle')" style="background:${mode==='boyle'?'var(--blue2)':'var(--card2)'}">Boyle's Law</button>
      <button class="sim-btn" id="gl_charles" onclick="glMode('charles')" style="background:var(--card2)">Charles' Law</button>
    </div>
    <div id="gl_slider_area">
      ${sliderRow('gl_P','🔴 Pressure',1,10,1,' atm','sv("gl_P"," atm");glUpdate()')}
    </div>
    ${infoCards([{id:'gl_P_v',val:'1.0',label:'Pressure (atm)'},{id:'gl_V_v',val:'10.0',label:'Volume (L)'},{id:'gl_T_v',val:'300',label:'Temp (K)'}])}
    ${theoryBox('PV = k  |  V/T = k','Boyle: Temperature fixed rakho — Pressure badhao, Volume ghata! Charles: Pressure fixed — Temperature badhao, Volume barhta hai!')}
  `);

  window.glMode = (m) => {
    mode = m;
    const boyleActive = m === 'boyle';
    if($id('gl_boyle')) $id('gl_boyle').style.background = boyleActive ? 'var(--blue2)' : 'var(--card2)';
    if($id('gl_charles')) $id('gl_charles').style.background = !boyleActive ? 'var(--blue2)' : 'var(--card2)';
    const sa = $id('gl_slider_area');
    if(sa) sa.innerHTML = boyleActive
      ? sliderRow('gl_P','🔴 Pressure',1,10,1,' atm','sv("gl_P"," atm");glUpdate()')
      : sliderRow('gl_T','🌡️ Temp (K)',100,600,300,' K','sv("gl_T"," K");glUpdate()');
    glUpdate();
  };

  window.glUpdate = () => {
    if(mode === 'boyle'){
      P = gv('gl_P') || 1;
      V = k_boyle / P;
      T = 300;
    } else {
      T = gv('gl_T') || 300;
      V = (10/300) * T;
      P = 1;
    }
    if($id('gl_P_v')) $id('gl_P_v').textContent = P.toFixed(2);
    if($id('gl_V_v')) $id('gl_V_v').textContent = V.toFixed(2);
    if($id('gl_T_v')) $id('gl_T_v').textContent = T.toFixed(0);
    drawGas();
  };

  function drawGas(){
    const cw = c.width, ch = c.height;
    ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle = '#fdf6e8'; ctx.fillRect(0,0,cw,ch);

    // Piston container
    const cx = cw/2, cy = ch*0.42;
    const maxW = cw*0.65, maxH = ch*0.45;
    const volRatio = Math.min(V/10, 1.5);
    const boxW = Math.max(40, maxW * Math.min(volRatio, 1));
    const boxH = maxH;
    const bx = cx - boxW/2, by = cy - boxH/2;

    // Gas fill — color by temperature
    const heat = Math.min((T-100)/500, 1);
    const r = Math.round(180 + 70*heat), g2 = Math.round(220 - 100*heat), b = Math.round(255 - 180*heat);
    ctx.fillStyle = `rgba(${r},${g2},${b},0.25)`;
    ctx.fillRect(bx, by, boxW, boxH);

    // Gas molecules (dots)
    const count = Math.round(8 + V*1.5);
    ctx.fillStyle = `rgba(${r},${g2},${b},0.85)`;
    for(let i=0; i<count; i++){
      const mx = bx + 10 + ((i*73)%(boxW-20));
      const my = by + 10 + ((i*53)%(boxH-20));
      ctx.beginPath(); ctx.arc(mx,my,3.5,0,Math.PI*2); ctx.fill();
    }

    // Container walls
    ctx.strokeStyle = '#8a6020'; ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, boxW, boxH);

    // Piston (right wall)
    const pistonX = bx + boxW;
    ctx.fillStyle = '#c49e50';
    ctx.fillRect(pistonX, by+4, 14, boxH-8);
    ctx.strokeStyle = '#8a6020'; ctx.lineWidth=2; ctx.strokeRect(pistonX,by+4,14,boxH-8);
    // Piston arrow hint
    ctx.fillStyle = '#5a3a10'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
    ctx.fillText(mode==='boyle'?'←':'↔', pistonX+7, by+boxH/2+4);

    // Labels
    ctx.fillStyle = '#2c1f0e'; ctx.font='bold 13px monospace';
    ctx.fillText('P = '+P.toFixed(2)+' atm', cx, by-14);
    ctx.fillStyle = '#5a7eb8';
    ctx.fillText('V = '+V.toFixed(2)+' L', cx, by-1);
    ctx.fillStyle = '#c47830';
    ctx.fillText('T = '+T.toFixed(0)+' K', cx, by+12);

    // Law label
    ctx.fillStyle = mode==='boyle'?'#5a7eb8':'#c0533a';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(mode==='boyle'?"Boyle's: PV = "+k_boyle.toFixed(1):"Charles': V/T = "+(10/300).toFixed(4), cx, ch*0.88);
    ctx.textAlign='left';
  }

  glUpdate();
}

// CHEMISTRY: FLAME TEST
// ============================================================
function simFlameTest(c,ctx,p){
  let selEl = 0, burning = false, flameT = 0;

  const elements = [
    {name:'Lithium (Li)',  sym:'Li', col1:'#ff2020', col2:'#ff6060', desc:'Laal rang — Li ki pehchaan. Fireworks mein use hota hai!'},
    {name:'Sodium (Na)',   sym:'Na', col1:'#ffcc00', col2:'#ffee60', desc:'Peela-narangi rang — Sodium street lights mein bhi isi liye peeli hoti hain!'},
    {name:'Potassium (K)', sym:'K',  col1:'#cc44ff', col2:'#ee88ff', desc:'Lilac/violet rang — K ki flame. Ankhon ke liye thoda dekhna mushkil!'},
    {name:'Copper (Cu)',   sym:'Cu', col1:'#00cc44', col2:'#44ff88', desc:'Neela-hara rang — Cu ki bohot khoobsurat flame. Fireworks mein bhi!'},
    {name:'Strontium (Sr)',sym:'Sr', col1:'#ff2060', col2:'#ff6090', desc:'Gehra laal rang — Sr se bahut bright red flame aati hai!'},
    {name:'Barium (Ba)',   sym:'Ba', col1:'#88ee00', col2:'#ccff44', desc:'Aple-hara rang — Ba ka flame test alag hi dikhta hai!'},
  ];

  function buildPanel(){
    panel(`
      <div class="ctrl-label">🔬 Element Chunno</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${elements.map((el,i)=>`<button class="sim-btn" onclick="ftSel(${i})" style="flex:1;min-width:70px;font-size:11px;background:${selEl===i?el.col1+'99':'var(--card2)'};border:1px solid ${el.col1}66">${el.sym}</button>`).join('')}
      </div>
      ${btnRow([{cls:'btn-start',fn:'ftBurn()',label:'🔥 Burn!'},{cls:'btn-reset',fn:'ftReset()',label:'⏹ Stop'}])}
      <div class="theory-box">
        <div class="theory-title">🔬 ${elements[selEl].name}</div>
        <div class="theory-text">${elements[selEl].desc}</div>
      </div>
      ${theoryBox('E = hν  (energy → photon → colour)','Jab metal ko garam karte hain, electrons excited hote hain. Wapas aate hain → specific wavelength ka light emit karte hain. Har element ka fingerprint!')}
    `);
  }

  window.ftSel = (i) => { selEl=i; burning=false; flameT=0; buildPanel(); drawFlame(0); };
  window.ftBurn = () => { burning=true; flameT=0; animId=requestAnimationFrame(animFlame); };
  window.ftReset = () => { stopSim(); burning=false; flameT=0; drawFlame(0); };

  function drawFlame(ft){
    const cw=c.width, ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle='#1a1008'; ctx.fillRect(0,0,cw,ch);

    const el = elements[selEl];
    const cx = cw/2;

    // Bunsen burner base
    ctx.fillStyle='#5a4020';
    ctx.beginPath(); ctx.roundRect(cx-18,ch*0.72,36,ch*0.22,4); ctx.fill();
    ctx.fillStyle='#3a2810';
    ctx.fillRect(cx-8,ch*0.68,16,ch*0.06);

    // Gas tube nozzle
    ctx.fillStyle='#7a6040';
    ctx.beginPath(); ctx.arc(cx, ch*0.68, 10, 0, Math.PI*2); ctx.fill();

    if(ft > 5){
      const intensity = Math.min((ft-5)/30, 1);
      const flameH = ch*0.48 * intensity;
      const baseY = ch*0.67;

      // Outer flame glow
      const outerGlow = ctx.createRadialGradient(cx, baseY-flameH*0.5, 0, cx, baseY-flameH*0.4, flameH*0.85);
      outerGlow.addColorStop(0, el.col2+'88');
      outerGlow.addColorStop(0.5, el.col1+'44');
      outerGlow.addColorStop(1, 'transparent');
      ctx.fillStyle=outerGlow;
      ctx.beginPath(); ctx.ellipse(cx, baseY-flameH*0.45, flameH*0.55, flameH*0.65, 0, 0, Math.PI*2); ctx.fill();

      // Flame layers (3 teardrop shapes)
      for(let layer=0; layer<3; layer++){
        const lh = flameH*(0.9-layer*0.2);
        const lw = (flameH*0.38)*(1-layer*0.15);
        const wobble = Math.sin(ft*0.18 + layer)*4*intensity;
        const grad = ctx.createLinearGradient(cx, baseY, cx+wobble, baseY-lh);
        grad.addColorStop(0, layer===0?'#ffffff':'#ffcc00');
        grad.addColorStop(0.3, el.col2);
        grad.addColorStop(0.7, el.col1);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle=grad;
        ctx.beginPath();
        ctx.moveTo(cx+wobble, baseY-lh);
        ctx.bezierCurveTo(cx+lw, baseY-lh*0.4, cx+lw*1.2, baseY-lh*0.1, cx, baseY);
        ctx.bezierCurveTo(cx-lw*1.2, baseY-lh*0.1, cx-lw, baseY-lh*0.4, cx+wobble, baseY-lh);
        ctx.fill();
      }

      // Sparks
      if(ft%3===0){
        for(let s=0;s<4;s++){
          const sx=cx+(Math.random()-0.5)*flameH*0.6;
          const sy=baseY-flameH*(0.4+Math.random()*0.5);
          ctx.beginPath(); ctx.arc(sx,sy,2.5,0,Math.PI*2);
          ctx.fillStyle=el.col2+'cc'; ctx.fill();
        }
      }

      // Colour label
      ctx.fillStyle='rgba(255,255,255,0.90)';
      ctx.font='bold 15px monospace'; ctx.textAlign='center';
      ctx.fillText(el.sym+' — Flame Colour', cx, ch*0.12);
      ctx.fillStyle=el.col2; ctx.font='bold 20px monospace';
      ctx.fillText('●', cx-12, ch*0.22); ctx.fillText('●', cx, ch*0.22); ctx.fillText('●', cx+12, ch*0.22);

      // Spectrum bar (bottom)
      const bx=20, by=ch*0.88, bw=cw-40, bh=14;
      const specGrad=ctx.createLinearGradient(bx,0,bx+bw,0);
      specGrad.addColorStop(0,'#ff0000'); specGrad.addColorStop(0.2,'#ff8800');
      specGrad.addColorStop(0.4,'#ffff00'); specGrad.addColorStop(0.6,'#00ff00');
      specGrad.addColorStop(0.8,'#0088ff'); specGrad.addColorStop(1,'#8800ff');
      ctx.fillStyle=specGrad; ctx.fillRect(bx,by,bw,bh);
      ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
      // Marker on spectrum
      const hueMap={'#ff2020':0.02,'#ffcc00':0.3,'#cc44ff':0.9,'#00cc44':0.55,'#ff2060':0.04,'#88ee00':0.48};
      const hpos = hueMap[el.col1]||0.5;
      ctx.fillStyle='#fff'; ctx.fillRect(bx+bw*hpos-2, by-4, 4, bh+8);
      ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.textAlign='center';
      ctx.fillText('λ',bx+bw*hpos,by+bh+14);
    } else {
      ctx.fillStyle='rgba(255,255,255,0.30)'; ctx.font='13px monospace'; ctx.textAlign='center';
      ctx.fillText('🔥 "Burn" dabao!', cx, ch*0.40);
    }
    ctx.textAlign='left';
  }

  function animFlame(){
    flameT++;
    drawFlame(flameT);
    if(burning) animId=requestAnimationFrame(animFlame);
  }

  buildPanel();
  drawFlame(0);
}

// MATH: FIBONACCI & GOLDEN RATIO SPIRAL
// ============================================================
function simFibonacci(c,ctx,p){
  let steps=8, animating=false, drawn=0;

  panel(`
    ${sliderRow('fib_n','🔢 Steps',3,13,8,'','sv("fib_n","");fibUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'fibAnimate()',label:'🐚 Animate Spiral'},{cls:'btn-reset',fn:'fibReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'fib_seq',val:'1,1,2,3,5…',label:'Sequence'},{id:'fib_phi',val:'1.618',label:'φ (Golden Ratio)'}])}
    ${theoryBox('φ = (1+√5)/2 ≈ 1.618','Har term = pichle do terms ka sum. F(n)/F(n-1) → φ ke paas jaata hai. Nature mein flowers, shells, galaxies mein yahi pattern milta hai!')}
  `);

  function getFib(n){
    const arr=[1,1];
    for(let i=2;i<n;i++) arr.push(arr[i-1]+arr[i-2]);
    return arr;
  }

  window.fibUpdate = () => {
    steps = Math.round(gv('fib_n'));
    const seq = getFib(steps);
    const phi = (seq[seq.length-1]/seq[seq.length-2]).toFixed(4);
    if($id('fib_seq')) $id('fib_seq').textContent = seq.slice(0,6).join(',')+('…');
    if($id('fib_phi')) $id('fib_phi').textContent = phi;
    drawn = steps;
    drawFib(steps);
  };
  window.fibAnimate = () => {
    if(animating) return;
    animating=true; drawn=0;
    function step(){
      drawn++;
      drawFib(drawn);
      if(drawn < Math.round(gv('fib_n'))){ animId=setTimeout(step, 320); }
      else { animating=false; }
    }
    step();
  };
  window.fibReset = () => { stopSim(); animating=false; drawn=steps; drawFib(steps); };

  function drawFib(n){
    const cw=c.width, ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle='#fdf6e8'; ctx.fillRect(0,0,cw,ch);

    const seq = getFib(Math.max(n,2));
    const maxF = seq[seq.length-1];
    const margin = 18;
    const scale = Math.min((cw-margin*2),(ch-margin*2)) / (maxF*2);

    // Centre the spiral
    let x=cw/2 - seq[seq.length-1]*scale*0.5;
    let y=ch/2 - seq[seq.length-1]*scale*0.5;
    const dirs=[[1,0],[0,1],[-1,0],[0,-1]]; // right, down, left, up
    let dir=0;

    const colors=['#c0533a','#c49e50','#5a7eb8','#5a8a3a','#8a60b0','#c47830','#3a8a6a','#b05060','#506ab0','#60a050','#9060a0','#a07830','#3a7a8a'];

    // Draw squares and spiral arcs
    for(let i=0;i<seq.length;i++){
      const size = seq[i]*scale;
      const col = colors[i % colors.length];

      // Square
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.55;
      ctx.strokeRect(x, y, size*(dirs[dir%4][0]||1), size*(dirs[dir%4][1]||1));
      ctx.globalAlpha = 1;

      // Quarter circle arc (Golden spiral)
      ctx.beginPath();
      ctx.strokeStyle = col;
      ctx.lineWidth = 2.2;
      if(dir%4===0){ ctx.arc(x,       y+size,  size, -Math.PI/2, 0); x+=size; }
      else if(dir%4===1){ ctx.arc(x,       y,       size, 0,          Math.PI/2); y+=size; x-=size; }
      else if(dir%4===2){ ctx.arc(x+size,  y,       size, Math.PI/2,  Math.PI); y-=size; }
      else              { ctx.arc(x+size,  y+size,  size, Math.PI,    3*Math.PI/2); x+=size; y-=size; }
      ctx.stroke();
      dir++;

      // Number label inside square
      const lsize = seq[i]*scale;
      if(lsize > 18){
        ctx.fillStyle = col;
        ctx.font = `bold ${Math.min(lsize*0.32,16)}px monospace`;
        ctx.textAlign='center';
        // Approximate label centre based on direction
        const cx2 = x - (dirs[(dir-1)%4][0]||1)*lsize*0.5;
        const cy2 = y - (dirs[(dir-1)%4][1]||1)*lsize*0.5;
        ctx.fillText(seq[i], cx2 + lsize*(dirs[(dir-1)%4][0]||1)*0.25, cy2 + lsize*(dirs[(dir-1)%4][1]||1)*0.25 + 5);
      }
    }

    // φ label
    ctx.globalAlpha=1;
    ctx.fillStyle='#8a60b0';
    ctx.font='bold 14px monospace'; ctx.textAlign='center';
    ctx.fillText('φ ≈ 1.618 — Golden Ratio', cw/2, ch-8);
    ctx.textAlign='left';

    // Update phi display
    if(seq.length>=2){
      const phi=(seq[seq.length-1]/seq[seq.length-2]).toFixed(5);
      if($id('fib_phi')) $id('fib_phi').textContent=phi;
      if($id('fib_seq')) $id('fib_seq').textContent=seq.slice(0,6).join(',')+('…');
    }
  }

  window.fibUpdate();
}

// ============================================================
// MATH: MATRIX MULTIPLICATION & TRANSFORMATION
// ============================================================
function simMatrixViz(c,ctx,p){
  // Matrix A transforms a unit square → show result
  let a=[[1,0],[0,1]], b=[[1,0],[0,1]];
  const defA=[[2,1],[0,1]], defB=[[1,0],[1,2]];
  a=defA.map(r=>[...r]); b=defB.map(r=>[...r]);

  panel(`
    <div class="ctrl-label">✏️ Matrix A</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">
      ${['a00','a01','a10','a11'].map((id,i)=>`<div style="display:flex;align-items:center;gap:4px"><span style="font-size:11px;color:var(--text2);font-family:var(--font2)">[${Math.floor(i/2)},${i%2}]</span><input type="number" id="${id}" value="${defA[Math.floor(i/2)][i%2]}" min="-5" max="5" step="0.5" style="width:100%;padding:6px;border-radius:8px;border:1px solid rgba(196,158,80,0.35);background:rgba(255,250,235,0.6);color:var(--text);font-size:13px;font-weight:700;text-align:center" oninput="mxUpdate()"></div>`).join('')}
    </div>
    <div class="ctrl-label">✏️ Matrix B</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">
      ${['b00','b01','b10','b11'].map((id,i)=>`<div style="display:flex;align-items:center;gap:4px"><span style="font-size:11px;color:var(--text2);font-family:var(--font2)">[${Math.floor(i/2)},${i%2}]</span><input type="number" id="${id}" value="${defB[Math.floor(i/2)][i%2]}" min="-5" max="5" step="0.5" style="width:100%;padding:6px;border-radius:8px;border:1px solid rgba(196,158,80,0.35);background:rgba(255,250,235,0.6);color:var(--text);font-size:13px;font-weight:700;text-align:center" oninput="mxUpdate()"></div>`).join('')}
    </div>
    ${infoCards([{id:'mx_det',val:'2',label:'det(A×B)'},{id:'mx_c00',val:'',label:'C[0,0]'},{id:'mx_c11',val:'',label:'C[1,1]'}])}
    ${theoryBox('C = A × B','Matrix multiplication — A ki rows × B ki columns. Isse shapes rotate, scale, shear ho sakti hain. Computer graphics, ML — sab matrix pe chalta hai!')}
  `);

  window.mxUpdate = () => {
    const gn = id => { const el=$id(id); return el?parseFloat(el.value)||0:0; };
    a=[[gn('a00'),gn('a01')],[gn('a10'),gn('a11')]];
    b=[[gn('b00'),gn('b01')],[gn('b10'),gn('b11')]];
    drawMatrix();
  };

  function mulMat(A,B){
    return [
      [A[0][0]*B[0][0]+A[0][1]*B[1][0], A[0][0]*B[0][1]+A[0][1]*B[1][1]],
      [A[1][0]*B[0][0]+A[1][1]*B[1][0], A[1][0]*B[0][1]+A[1][1]*B[1][1]]
    ];
  }
  function det(M){ return M[0][0]*M[1][1]-M[0][1]*M[1][0]; }

  function drawMatrix(){
    const cw=c.width, ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle='#fdf6e8'; ctx.fillRect(0,0,cw,ch);

    const C = mulMat(a,b);
    const detC = det(C).toFixed(2);
    if($id('mx_det')) $id('mx_det').textContent=detC;
    if($id('mx_c00')) $id('mx_c00').textContent=C[0][0].toFixed(2);
    if($id('mx_c11')) $id('mx_c11').textContent=C[1][1].toFixed(2);

    // Draw coordinate system
    const ox=cw/2, oy=ch/2;
    const unit = Math.min(cw,ch)*0.14;

    // Grid
    ctx.strokeStyle='rgba(196,158,80,0.12)'; ctx.lineWidth=1;
    for(let g=-5;g<=5;g++){
      ctx.beginPath(); ctx.moveTo(ox+g*unit,0); ctx.lineTo(ox+g*unit,ch); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,oy+g*unit); ctx.lineTo(cw,oy+g*unit); ctx.stroke();
    }
    // Axes
    ctx.strokeStyle='rgba(100,70,20,0.35)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(cw,oy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox,0); ctx.lineTo(ox,ch); ctx.stroke();

    function drawShape(M, col, label, alpha){
      // Transform unit square corners: (0,0),(1,0),(1,1),(0,1)
      const corners=[[0,0],[1,0],[1,1],[0,1]];
      const tx = corners.map(([x,y])=>[
        ox + (M[0][0]*x + M[0][1]*y)*unit,
        oy - (M[1][0]*x + M[1][1]*y)*unit
      ]);
      ctx.beginPath();
      ctx.moveTo(tx[0][0],tx[0][1]);
      tx.slice(1).forEach(([px,py])=>ctx.lineTo(px,py));
      ctx.closePath();
      ctx.fillStyle=col.replace(')',`,${alpha})`).replace('rgb','rgba');
      ctx.fill();
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
      // Label
      const cx2=(tx[0][0]+tx[1][0]+tx[2][0]+tx[3][0])/4;
      const cy2=(tx[0][1]+tx[1][1]+tx[2][1]+tx[3][1])/4;
      ctx.fillStyle=col; ctx.font='bold 12px monospace'; ctx.textAlign='center';
      ctx.fillText(label, cx2, cy2+4);
      // Draw basis vectors
      ctx.strokeStyle=col; ctx.lineWidth=2.5;
      [[1,0],[0,1]].forEach(([vx,vy])=>{
        const ex=ox+(M[0][0]*vx+M[0][1]*vy)*unit;
        const ey=oy-(M[1][0]*vx+M[1][1]*vy)*unit;
        ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ex,ey); ctx.stroke();
        ctx.beginPath(); ctx.arc(ex,ey,4,0,Math.PI*2); ctx.fillStyle=col; ctx.fill();
      });
    }

    // Identity (ghost)
    drawShape([[1,0],[0,1]], 'rgba(180,160,120)', 'I', 0.10);
    // Matrix A transform
    drawShape(a, '#5a7eb8', 'A', 0.18);
    // Matrix B transform
    drawShape(b, '#c47830', 'B', 0.18);
    // Product C = A×B
    drawShape(C, '#5a8a3a', 'A×B', 0.30);

    // Legend
    const ly=ch-42;
    [['#5a7eb8','A'],['#c47830','B'],['#5a8a3a','A×B']].forEach(([col,lbl],i)=>{
      ctx.fillStyle=col; ctx.fillRect(20+i*70, ly, 14, 14);
      ctx.fillStyle='#2c1f0e'; ctx.font='11px monospace'; ctx.textAlign='left';
      ctx.fillText(lbl, 38+i*70, ly+11);
    });

    // Result matrix display
    ctx.fillStyle='rgba(90,138,58,0.90)';
    ctx.font='bold 12px monospace'; ctx.textAlign='center';
    ctx.fillText(`C = [[${C[0][0].toFixed(1)}, ${C[0][1].toFixed(1)}], [${C[1][0].toFixed(1)}, ${C[1][1].toFixed(1)}]]`, cw/2, 22);
    ctx.textAlign='left';
  }

  drawMatrix();
}

// BIOLOGY: MITOSIS — CELL DIVISION
// ============================================================
function simMitosis(c,ctx,p){
  const phases=['Interphase','Prophase','Metaphase','Anaphase','Telophase'];
  const phaseDesc=[
    'Cell grow karti hai, DNA copy hota hai. Nucleus clearly visible hai. Cell apne aap ko divide karne ki taiyari karti hai.',
    'Chromatin condense hokar chromosomes bante hain. Nuclear envelope toot jaati hai. Spindle fibers banana shuru ho jaate hain.',
    'Chromosomes cell ke centre (metaphase plate) mein align ho jaate hain. Spindle fibers attach hote hain centromeres se.',
    'Sister chromatids alag hoke opposite poles ki taraf kheenche jaate hain. Cell thodi elongate hoti hai.',
    'Chromosomes poles par pahunch jaate hain. Nuclear envelopes wapas banti hain. Cytokinesis shuru — do cells ban rahi hain!'
  ];
  let phase=0, animating=false, phaseT=0;

  function buildPanel(){
    panel(`
      <div class="ctrl-label">🔬 Phase Chunno</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
        ${phases.map((ph,i)=>`<button class="sim-btn" onclick="mitPhase(${i})" style="flex:1;min-width:80px;font-size:10px;padding:7px 4px;background:${phase===i?'#5a8a3a':'var(--card2)'}">${ph}</button>`).join('')}
      </div>
      ${btnRow([{cls:'btn-start',fn:'mitPlay()',label:'▶ Auto Play'},{cls:'btn-reset',fn:'mitStop()',label:'⏹ Stop'}])}
      <div class="theory-box">
        <div class="theory-title">📍 ${phases[phase]}</div>
        <div class="theory-text">${phaseDesc[phase]}</div>
      </div>
      ${theoryBox('PMAT — Prophase, Metaphase, Anaphase, Telophase','Mitosis se 2 identical daughter cells banti hain. Asexual reproduction aur growth isi se hoti hai. 46 chromosomes → 46 + 46!')}
    `);
  }

  window.mitPhase=(i)=>{phase=i;phaseT=0;buildPanel();drawMitosis();};
  window.mitPlay=()=>{
    if(animating)return; animating=true; phase=0; phaseT=0; buildPanel();
    function tick(){
      phaseT++;
      drawMitosis();
      if(phaseT>80){phase=(phase+1)%phases.length;phaseT=0;buildPanel();}
      if(!(phase===0&&phaseT>60)){animId=requestAnimationFrame(tick);}
      else{animating=false;}
    }
    tick();
  };
  window.mitStop=()=>{stopSim();animating=false;};

  function drawMitosis(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    ctx.fillStyle='#fdf6e8';ctx.fillRect(0,0,cw,ch);

    const prog=Math.min(phaseT/80,1);
    const cx=cw/2, cy=ch/2;

    if(phase===0){
      // Interphase — single round cell, visible nucleus
      ctx.beginPath();ctx.ellipse(cx,cy,cw*0.32,ch*0.36,0,0,Math.PI*2);
      ctx.fillStyle='rgba(90,138,58,0.15)';ctx.fill();
      ctx.strokeStyle='#5a8a3a';ctx.lineWidth=3;ctx.stroke();
      // Nucleus
      ctx.beginPath();ctx.arc(cx,cy,cw*0.13,0,Math.PI*2);
      ctx.fillStyle='rgba(90,100,200,0.18)';ctx.fill();
      ctx.strokeStyle='#5a7eb8';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#5a7eb8';ctx.font='bold 11px monospace';ctx.textAlign='center';
      ctx.fillText('Nucleus',cx,cy+4);
      // DNA squiggles
      for(let i=0;i<6;i++){
        const sx=cx-30+i*12,sy=cy-8;
        ctx.strokeStyle='rgba(80,120,200,0.5)';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(sx+4,sy-6,sx+8,sy+6,sx+12,sy);ctx.stroke();
      }

    } else if(phase===1){
      // Prophase — chromosomes forming, nuclear envelope breaking
      ctx.beginPath();ctx.ellipse(cx,cy,cw*0.32,ch*0.36,0,0,Math.PI*2);
      ctx.fillStyle='rgba(90,138,58,0.12)';ctx.fill();
      ctx.strokeStyle='#5a8a3a';ctx.lineWidth=3;ctx.stroke();
      // Chromosomes (X shape pairs)
      const chrCols=['#c0533a','#5a7eb8','#c49e50','#5a8a3a'];
      [[cx-30,cy-20],[cx+10,cy-15],[cx-20,cy+15],[cx+20,cy+20]].forEach(([bx,by],i)=>{
        ctx.strokeStyle=chrCols[i%4];ctx.lineWidth=5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(bx-10,by-10);ctx.lineTo(bx+10,by+10);ctx.stroke();
        ctx.beginPath();ctx.moveTo(bx+10,by-10);ctx.lineTo(bx-10,by+10);ctx.stroke();
      });
      // Fading nuclear envelope
      ctx.beginPath();ctx.arc(cx,cy,cw*0.13,0,Math.PI*2);
      ctx.strokeStyle=`rgba(90,126,184,${0.6-prog*0.5})`;ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);

    } else if(phase===2){
      // Metaphase — chromosomes aligned at centre
      ctx.beginPath();ctx.ellipse(cx,cy,cw*0.32,ch*0.36,0,0,Math.PI*2);
      ctx.fillStyle='rgba(90,138,58,0.10)';ctx.fill();
      ctx.strokeStyle='#5a8a3a';ctx.lineWidth=3;ctx.stroke();
      // Metaphase plate line
      ctx.strokeStyle='rgba(196,158,80,0.5)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(cx,cy-ch*0.30);ctx.lineTo(cx,cy+ch*0.30);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#c49e50';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('Metaphase Plate',cx+45,cy);
      // Spindle fibers
      const poleY1=cy-ch*0.34, poleY2=cy+ch*0.34;
      ['#c0533a','#5a7eb8','#c49e50','#5a8a3a'].forEach((col,i)=>{
        const chy=cy-30+i*20;
        ctx.strokeStyle=col+'77';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(cx-8,chy);ctx.lineTo(cx-cw*0.15,poleY1);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx-8,chy);ctx.lineTo(cx-cw*0.15,poleY2);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+8,chy);ctx.lineTo(cx+cw*0.15,poleY1);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+8,chy);ctx.lineTo(cx+cw*0.15,poleY2);ctx.stroke();
        ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(cx-10,chy-8);ctx.lineTo(cx+10,chy+8);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+10,chy-8);ctx.lineTo(cx-10,chy+8);ctx.stroke();
      });

    } else if(phase===3){
      // Anaphase — chromatids pulling apart
      const sep=prog*ch*0.25;
      ctx.beginPath();ctx.ellipse(cx,cy,cw*0.32,ch*0.36+sep*0.3,0,0,Math.PI*2);
      ctx.fillStyle='rgba(90,138,58,0.10)';ctx.fill();ctx.strokeStyle='#5a8a3a';ctx.lineWidth=3;ctx.stroke();
      const cols=['#c0533a','#5a7eb8','#c49e50','#5a8a3a'];
      [-1,1].forEach(dir=>{
        [[cx-20],[cx+10],[cx-30],[cx+25]].forEach(([bx],i)=>{
          const by=cy+dir*sep;
          ctx.strokeStyle=cols[i];ctx.lineWidth=5;ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(bx-8,by-6);ctx.lineTo(bx+8,by+6);ctx.stroke();
          ctx.beginPath();ctx.moveTo(bx+8,by-6);ctx.lineTo(bx-8,by+6);ctx.stroke();
        });
      });
      // Cleavage furrow hint
      ctx.strokeStyle='rgba(196,158,80,0.6)';ctx.lineWidth=2;ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.moveTo(cx-cw*0.25,cy);ctx.lineTo(cx+cw*0.25,cy);ctx.stroke();ctx.setLineDash([]);

    } else {
      // Telophase — two cells forming
      const gap=prog*ch*0.10;
      [-1,1].forEach(dir=>{
        const ny=cy+dir*(ch*0.20+gap);
        ctx.beginPath();ctx.ellipse(cx,ny,cw*0.26,ch*0.22,0,0,Math.PI*2);
        ctx.fillStyle='rgba(90,138,58,0.15)';ctx.fill();ctx.strokeStyle='#5a8a3a';ctx.lineWidth=3;ctx.stroke();
        ctx.beginPath();ctx.arc(cx,ny,cw*0.10,0,Math.PI*2);
        ctx.fillStyle='rgba(90,100,200,0.15)';ctx.fill();ctx.strokeStyle='#5a7eb8';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#5a7eb8';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('46 chr',cx,ny+4);
      });
    }

    // Phase label
    const phaseColors=['#5a8a3a','#c47830','#5a7eb8','#c0533a','#8a60b0'];
    ctx.fillStyle=phaseColors[phase];ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText(phases[phase],cw/2,ch-10);
    ctx.textAlign='left';
  }

  buildPanel(); drawMitosis();
}

// BIOLOGY: BLOOD CELLS
// ============================================================
function simBloodCells(c,ctx,p){
  let cells=[], selType='rbc', running=false, frame=0;
  const types={
    rbc:{name:'Red Blood Cells (RBC)',col:'#e03030',col2:'#ff6060',count:50,size:12,
      fact:'Haemoglobin hota hai — oxygen carry karta hai. Nucleus nahi hota. 120 din jeeta hai. 1 mm³ mein 50 lakh RBC!'},
    wbc:{name:'White Blood Cells (WBC)',col:'#eeeebb',col2:'#ffffdd',count:8,size:16,
      fact:'Immune system ke soldier! Bacteria aur virus ko khaata hai. RBC se 700 guna kam hote hain. Amoeba jaisi movement karti hai.'},
    plt:{name:'Platelets (Thrombocytes)',col:'#ffaa55',col2:'#ffcc88',count:20,size:7,
      fact:'Blood clotting karte hain — zakhm band karte hain. Bahut chhote hote hain. 8-10 din jeete hain. 1.5-4 lakh per mm³.'}
  };

  function spawnCells(){
    const cw=c.width,ch=c.height;
    cells=[];
    Object.entries(types).forEach(([type,t])=>{
      for(let i=0;i<t.count;i++){
        cells.push({
          type, x:Math.random()*cw, y:Math.random()*ch,
          vx:(Math.random()-0.5)*0.8, vy:(Math.random()-0.5)*0.8,
          r:t.size+(Math.random()-0.5)*3,
          phase:Math.random()*Math.PI*2,
          wobble:Math.random()*0.03+0.01
        });
      }
    });
  }

  function buildPanel(){
    panel(`
      <div class="ctrl-label">🩸 Cell Type Chunno</div>
      <div class="btn-row" style="margin-bottom:8px">
        ${Object.entries(types).map(([k,t])=>`<button class="sim-btn" onclick="bcSel('${k}')" style="font-size:11px;background:${selType===k?t.col+'99':'var(--card2)'};border:1px solid ${t.col}66">${k.toUpperCase()}</button>`).join('')}
      </div>
      ${btnRow([{cls:'btn-start',fn:'bcStart()',label:'▶ Animate'},{cls:'btn-reset',fn:'bcStop()',label:'⏹ Stop'}])}
      <div class="theory-box">
        <div class="theory-title" style="color:${types[selType].col}">🩸 ${types[selType].name}</div>
        <div class="theory-text">${types[selType].fact}</div>
      </div>
      ${theoryBox('Blood = Plasma + RBC + WBC + Platelets','Blood ka 55% plasma hai (paani + proteins). Baaki 45% cells. RBC : WBC : Platelets = 700:1:40 approximately!')}
    `);
  }

  window.bcSel=(t)=>{selType=t;buildPanel();if(!running)drawBlood();};
  window.bcStart=()=>{running=true;spawnCells();animId=requestAnimationFrame(animBlood);};
  window.bcStop=()=>{stopSim();running=false;drawBlood();};

  function drawBlood(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    // Blood plasma background
    const bgGrad=ctx.createLinearGradient(0,0,cw,ch);
    bgGrad.addColorStop(0,'#1a0505');bgGrad.addColorStop(1,'#2a0a0a');
    ctx.fillStyle=bgGrad;ctx.fillRect(0,0,cw,ch);

    cells.forEach(cell=>{
      const t=types[cell.type];
      const highlight=(cell.type===selType);
      ctx.globalAlpha=highlight?1:0.22;

      if(cell.type==='rbc'){
        // Biconcave disc shape
        const w=cell.r*1.3,h=cell.r;
        ctx.beginPath();ctx.ellipse(cell.x,cell.y,w,h,cell.phase*0.1,0,Math.PI*2);
        const g=ctx.createRadialGradient(cell.x-w*0.3,cell.y-h*0.3,0,cell.x,cell.y,w);
        g.addColorStop(0,t.col2);g.addColorStop(0.4,t.col);g.addColorStop(0.7,t.col+'99');g.addColorStop(1,'#600000');
        ctx.fillStyle=g;ctx.fill();
        // Biconcave dimple
        ctx.beginPath();ctx.ellipse(cell.x,cell.y,w*0.35,h*0.35,0,0,Math.PI*2);
        ctx.fillStyle='rgba(80,0,0,0.5)';ctx.fill();

      } else if(cell.type==='wbc'){
        // Irregular shape with lobed nucleus
        ctx.beginPath();
        const pts=8;
        for(let i=0;i<pts;i++){
          const ang=i/pts*Math.PI*2+cell.phase;
          const r2=cell.r*(0.8+0.3*Math.sin(i*2.3+frame*cell.wobble));
          const px=cell.x+Math.cos(ang)*r2,py=cell.y+Math.sin(ang)*r2;
          i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle=t.col+'cc';ctx.fill();
        ctx.strokeStyle=t.col2;ctx.lineWidth=1;ctx.stroke();
        // Lobed nucleus
        for(let n=0;n<3;n++){
          const na=n/3*Math.PI*2+frame*0.02;
          ctx.beginPath();ctx.arc(cell.x+Math.cos(na)*5,cell.y+Math.sin(na)*4,4,0,Math.PI*2);
          ctx.fillStyle='rgba(100,180,100,0.7)';ctx.fill();
        }

      } else {
        // Platelet — tiny irregular fragment
        ctx.beginPath();
        const sides=5;
        for(let i=0;i<sides;i++){
          const ang=i/sides*Math.PI*2+cell.phase;
          const r2=cell.r*(0.7+0.4*Math.sin(i*1.7));
          const px=cell.x+Math.cos(ang)*r2,py=cell.y+Math.sin(ang)*r2;
          i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle=t.col+'cc';ctx.fill();
        ctx.strokeStyle=t.col2;ctx.lineWidth=0.8;ctx.stroke();
      }
    });
    ctx.globalAlpha=1;

    // Legend
    const ly=12;
    Object.entries(types).forEach(([k,t],i)=>{
      const lx=12+i*(c.width/3);
      ctx.beginPath();ctx.arc(lx+7,ly,6,0,Math.PI*2);ctx.fillStyle=t.col;ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.80)';ctx.font='10px monospace';ctx.textAlign='left';
      ctx.fillText(k.toUpperCase(),lx+16,ly+4);
    });
  }

  function animBlood(){
    frame++;
    const cw=c.width,ch=c.height;
    cells.forEach(cell=>{
      cell.x+=cell.vx;cell.y+=cell.vy;
      cell.phase+=cell.wobble;
      if(cell.x<-20)cell.x=cw+10;if(cell.x>cw+20)cell.x=-10;
      if(cell.y<-20)cell.y=ch+10;if(cell.y>ch+20)cell.y=-10;
    });
    drawBlood();
    animId=requestAnimationFrame(animBlood);
  }

  spawnCells(); buildPanel(); drawBlood();
}

// BIOLOGY: NATURAL SELECTION / EVOLUTION
// ============================================================
function simEvolution(c,ctx,p){
  let pop=[], gen=0, running=false, envCol='#4a8a3a', predRate=0.3;
  const popSize=40;

  function randCol(){
    const hue=Math.random()*360;
    return `hsl(${hue},70%,55%)`;
  }
  function hslToArr(hsl){
    const m=hsl.match(/hsl\((\d+),(\d+)%,(\d+)%\)/);
    return m?[+m[1],+m[2],+m[3]]:[0,70,55];
  }
  function fitness(creatureHue, envHue){
    const diff=Math.abs(creatureHue-envHue);
    const d=Math.min(diff,360-diff);
    return Math.max(0,1-(d/120));
  }

  function initPop(){
    pop=[];
    for(let i=0;i<popSize;i++){
      const hue=Math.floor(Math.random()*360);
      pop.push({hue,x:50+Math.random()*(c.width-100),y:80+Math.random()*(c.height*0.5-60),size:10,alive:true});
    }
  }

  function buildPanel(){
    panel(`
      <div class="ctrl-label">🌿 Environment Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:6px;margin-bottom:8px">
        ${[['Forest 🌿','#4a8a3a',120],['Desert 🏜️','#c49e50',40],['Snow ❄️','#aaccee',200],['Volcanic 🌋','#8a3020',15]].map(([lbl,col,hue])=>`<button class="sim-btn" onclick="evEnv('${col}',${hue})" style="flex:1;font-size:11px;background:${envCol===col?col+'99':'var(--card2)'};border:1px solid ${col}88">${lbl}</button>`).join('')}
      </div>
      ${sliderRow('ev_pred','🦅 Predator Rate',0,1,0.3,'','sv("ev_pred","");evUpdate()')}
      ${btnRow([{cls:'btn-start',fn:'evNextGen()',label:'⏭ Next Gen'},{cls:'btn-start',fn:'evAutoRun()',label:'▶ Auto Run'},{cls:'btn-reset',fn:'evReset()',label:'🔄 Reset'}])}
      ${infoCards([{id:'ev_gen',val:'0',label:'Generation'},{id:'ev_surv',val:'40',label:'Survivors'},{id:'ev_fit',val:'0.00',label:'Avg Fitness'}])}
      ${theoryBox('Variation + Selection + Heredity = Evolution','Camouflage achha hai → survival zyada. Survival zyada → zyada bachhe → traits pass on. Darwin ka Natural Selection yehi hai!')}
    `);
  }

  window.evEnv=(col,hue)=>{envCol=col;buildPanel();drawEvo();};
  window.evUpdate=()=>{predRate=gv('ev_pred');};
  window.evReset=()=>{stopSim();running=false;gen=0;initPop();buildPanel();drawEvo();};
  window.evNextGen=nextGen;
  window.evAutoRun=()=>{running=true;function tick(){nextGen();if(gen<20&&running)animId=setTimeout(tick,600);else running=false;}tick();};

  function nextGen(){
    gen++;
    const envHue=hslToArr(envCol)[0]||120;
    // Selection — low fitness creatures get eaten by predator
    pop.forEach(cr=>{
      const fit=fitness(cr.hue,envHue);
      if(Math.random()>fit*(1-predRate)+0.15) cr.alive=false;
    });
    const survivors=pop.filter(cr=>cr.alive);
    // Reproduction with mutation
    const newPop=survivors.map(cr=>({...cr,x:50+Math.random()*(c.width-100),y:80+Math.random()*(c.height*0.5-60),alive:true}));
    while(newPop.length<popSize){
      const parent=survivors[Math.floor(Math.random()*survivors.length)];
      if(!parent)break;
      const mutation=(Math.random()-0.5)*30;
      newPop.push({
        hue:(parent.hue+mutation+360)%360,
        x:50+Math.random()*(c.width-100),
        y:80+Math.random()*(c.height*0.5-60),
        size:10,alive:true
      });
    }
    pop=newPop.slice(0,popSize);
    const avgFit=(pop.reduce((s,cr)=>s+fitness(cr.hue,envHue),0)/pop.length).toFixed(3);
    if($id('ev_gen'))$id('ev_gen').textContent=gen;
    if($id('ev_surv'))$id('ev_surv').textContent=survivors.length;
    if($id('ev_fit'))$id('ev_fit').textContent=avgFit;
    drawEvo();
  }

  function drawEvo(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);

    // Environment background
    const envGrad=ctx.createLinearGradient(0,0,0,ch*0.62);
    envGrad.addColorStop(0,envCol+'dd');envGrad.addColorStop(1,envCol+'66');
    ctx.fillStyle=envGrad;ctx.fillRect(0,0,cw,ch*0.62);
    // Ground texture dots
    for(let i=0;i<60;i++){
      ctx.beginPath();ctx.arc((i*137)%cw,((i*89)%((ch*0.62)-20))+10,2,0,Math.PI*2);
      ctx.fillStyle=envCol+'44';ctx.fill();
    }

    // Draw creatures
    const envHue=hslToArr(envCol)[0]||120;
    pop.forEach(cr=>{
      const fit=fitness(cr.hue,envHue);
      ctx.beginPath();ctx.arc(cr.x,cr.y,cr.size*(0.7+fit*0.5),0,Math.PI*2);
      ctx.fillStyle=`hsl(${cr.hue},70%,55%)`;ctx.fill();
      ctx.strokeStyle=`hsl(${cr.hue},40%,35%)`;ctx.lineWidth=1.5;ctx.stroke();
      // Fitness ring
      if(fit>0.6){
        ctx.beginPath();ctx.arc(cr.x,cr.y,cr.size*1.4,0,Math.PI*2);
        ctx.strokeStyle=`rgba(255,255,200,${fit*0.5})`;ctx.lineWidth=1;ctx.stroke();
      }
    });

    // Fitness histogram (bottom)
    const histY=ch*0.65,histH=ch*0.30,histW=cw-30;
    ctx.fillStyle='rgba(255,250,235,0.12)';ctx.fillRect(15,histY,histW,histH);
    ctx.strokeStyle='rgba(196,158,80,0.3)';ctx.lineWidth=1;ctx.strokeRect(15,histY,histW,histH);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText('Hue Distribution (0°→360°)',cw/2,histY-5);

    const buckets=new Array(12).fill(0);
    pop.forEach(cr=>{buckets[Math.floor(cr.hue/30)]++;});
    const maxB=Math.max(...buckets,1);
    buckets.forEach((cnt,i)=>{
      const bw=(histW-10)/12,bx=15+5+i*bw;
      const bh=(cnt/maxB)*histH*0.85;
      const hue=i*30;
      ctx.fillStyle=`hsl(${hue},70%,55%)`;
      ctx.fillRect(bx,histY+histH-bh,bw-2,bh);
      // Env hue marker
      if(i===Math.floor(envHue/30)){
        ctx.strokeStyle='#fff';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(bx+bw/2,histY);ctx.lineTo(bx+bw/2,histY+histH);ctx.stroke();
      }
    });
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='9px monospace';
    ctx.fillText('↑ Env colour',15+(envHue/360)*histW,histY+histH+12);
    ctx.textAlign='left';
  }

  initPop(); buildPanel(); drawEvo();
}
