          ctx.fillText(line,node.x,node.y+r+12+li*13);
        });
        if(isCurrent){
          const slines=node.subLabel.split('\n');
          slines.forEach((line,li)=>{
            ctx.fillStyle='rgba(255,255,255,0.55)';ctx.font='8px var(--font2)';ctx.textAlign='center';
            ctx.fillText(line,node.x,node.y+r+30+li*11);
          });
        }
      });
      if(signalActive&&currentPhase>=0&&currentPhase<localNodes.length-1){
        const n1=localNodes[currentPhase],n2=localNodes[currentPhase+1];
        const t=(phaseTimer%60)/60;
        const px=n1.x+(n2.x-n1.x)*t,py=n1.y+(n2.y-n1.y)*t;
        const sigCol=localNodes[Math.min(currentPhase+1,localNodes.length-1)].col;
        const sg=ctx.createRadialGradient(px,py,0,px,py,12);
        sg.addColorStop(0,'#fff');sg.addColorStop(0.3,sigCol);sg.addColorStop(1,'transparent');
        ctx.fillStyle=sg;ctx.beginPath();ctx.arc(px,py,12,0,Math.PI*2);ctx.fill();
      }
      if(muscleContract>0){
        const mx=localNodes[5].x,my=localNodes[5].y+50;
        const mw=40+muscleContract*25,mh=18-muscleContract*4;
        const mGrad=ctx.createLinearGradient(mx-mw/2,my,mx+mw/2,my);
        mGrad.addColorStop(0,'rgba(248,113,113,0.9)');mGrad.addColorStop(1,'rgba(185,28,28,0.8)');
        ctx.fillStyle=mGrad;ctx.beginPath();ctx.roundRect(mx-mw/2,my,mw,mh,6);ctx.fill();
        ctx.strokeStyle='rgba(252,165,165,0.8)';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 9px var(--font2)';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('CONTRACTED!',mx,my+mh/2);ctx.textBaseline='alphabetic';
      }
      if(currentPhase>=0&&currentPhase<arcPhases.length){
        const phCol=localNodes[Math.min(currentPhase,localNodes.length-1)].col;
        ctx.fillStyle=phCol+'33';ctx.beginPath();ctx.roundRect(cw2*0.15,4,cw2*0.7,26,12);ctx.fill();
        ctx.strokeStyle=phCol+'66';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle=phCol;ctx.font='bold 11px var(--font)';ctx.textAlign='center';
        ctx.fillText('Stage '+(currentPhase+1)+': '+arcPhases[Math.min(currentPhase,arcPhases.length-1)],cw2/2,21);
      }
      ctx.textAlign='left';
    }
    function anim(){
      frame10++;
      if(signalActive){
        phaseTimer++;
        const phaseDur=reflexType==='spinal'?55:90;
        if(phaseTimer>=phaseDur){
          currentPhase++;phaseTimer=0;
          if(currentPhase>=localNodes.length){
            muscleContract=1;
            setTimeout(()=>{muscleContract=0.5;},400);
            setTimeout(()=>{muscleContract=0;signalActive=false;currentPhase=-1;if($id('rf_phase'))$id('rf_phase').textContent='Done ✅';},900);
          }
          if($id('rf_phase')&&currentPhase<arcPhases.length)$id('rf_phase').textContent=arcPhases[Math.min(currentPhase,arcPhases.length-1)];
        }
      }
      draw();
      animId=requestAnimationFrame(anim);
    }
    window.triggerReflex=()=>{if(signalActive)return;signalActive=true;signalPos=0;currentPhase=0;phaseTimer=0;muscleContract=0;if($id('rf_phase'))$id('rf_phase').textContent=arcPhases[0];};
    window.resetReflex=()=>{stopSim();signalActive=false;currentPhase=-1;muscleContract=0;phaseTimer=0;if($id('rf_phase'))$id('rf_phase').textContent='Ready';animId=requestAnimationFrame(anim);};
    window.setReflex=(type)=>{
      reflexType=type;
      const b1=$id('rfbtn1'),b2=$id('rfbtn2');
      if(b1)b1.style.background=type==='spinal'?'rgba(52,211,153,0.25)':'var(--card2)';
      if(b2)b2.style.background=type==='voluntary'?'rgba(52,211,153,0.25)':'var(--card2)';
      if($id('rf_type'))$id('rf_type').textContent=type==='spinal'?'Spinal (25ms)':'Voluntary (200ms)';
      if($id('rf_time'))$id('rf_time').textContent=type==='spinal'?'~25ms':'~200ms';
      localNodes[3].label=type==='spinal'?'Spinal\nCord':'Brain\nCortex';
    };
    draw();
    animId=requestAnimationFrame(anim);
  })();
}

// ============================================================
// 60. CIRCULAR MOTION & CENTRIPETAL FORCE
// ============================================================
function simCircularMotion(c,ctx,p){
  let radius=80,rpm=30,mass=2,running=false,ang=0,trail=[];
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'cmcToggle()',label:'▶ Start'},{cls:'btn-reset',fn:'cmcReset()',label:'🔄 Reset'}])}
      ${sliderRow('cmc_r','⭕ Radius',30,120,80,' px','sv("cmc_r"," px");cmcUpdate()')}
      ${sliderRow('cmc_rpm','🌀 Speed',5,90,30,' RPM','sv("cmc_rpm"," RPM");cmcUpdate()')}
      ${sliderRow('cmc_m','⚖️ Mass',0.5,5,2,' kg','sv("cmc_m"," kg");cmcUpdate()')}
    </div>
    ${infoCards([{id:'cmc_v',val:'0',label:'Speed (m/s)'},{id:'cmc_f',val:'0',label:'Centripetal F (N)'},{id:'cmc_t',val:'0',label:'Time Period (s)'}])}
    ${theoryBox('F = mv²/r = mω²r','Ball ko circle mein ghumte rehne ke liye hamesha center ki taraf ek force chahiye hoti hai — ise centripetal force kehte hain. Radius ghatao ya speed badhao, force turant badh jaayega. Yehi force satellites ko orbit mein aur car ko curve pe rakhta hai!')}
  `);
  function cmcUpdate(){
    radius=gv('cmc_r');rpm=gv('cmc_rpm');mass=gv('cmc_m');
    const omega=rpm*2*Math.PI/60;
    const rM=radius/100;
    const v=omega*rM;
    const F=mass*omega*omega*rM;
    const T=rpm>0?(60/rpm):0;
    if($id('cmc_v'))$id('cmc_v').textContent=v.toFixed(2);
    if($id('cmc_f'))$id('cmc_f').textContent=F.toFixed(2);
    if($id('cmc_t'))$id('cmc_t').textContent=T.toFixed(2);
    if(!running)drawCMC();
  }
  window.cmcUpdate=cmcUpdate;
  window.cmcToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animCMC);}else{stopSim();running=false;}
  };
  window.cmcReset=()=>{stopSim();running=false;ang=0;trail=[];drawCMC();};

  function arrowHead(x,y,angle,col){
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x-9*Math.cos(angle-0.4),y-9*Math.sin(angle-0.4));
    ctx.lineTo(x-9*Math.cos(angle+0.4),y-9*Math.sin(angle+0.4));
    ctx.closePath();ctx.fill();
  }
  function drawCMC(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    drawGrid(ctx,c);
    const cx=cw/2,cy=ch/2;
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.setLineDash([5,5]);ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,radius,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    if(trail.length>1){
      ctx.strokeStyle='rgba(255,107,107,0.35)';ctx.lineWidth=2;ctx.beginPath();
      trail.forEach((pt,i)=>i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));
      ctx.stroke();
    }
    const bx=cx+radius*Math.cos(ang),by=cy+radius*Math.sin(ang);
    const gPivot=ctx.createRadialGradient(cx,cy,0,cx,cy,7);
    gPivot.addColorStop(0,'#a8d4ff');gPivot.addColorStop(1,'#58a6ff');
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle=gPivot;ctx.fill();
    const fdx=cx-bx,fdy=cy-by,flen=Math.sqrt(fdx*fdx+fdy*fdy)||1;
    const fux=fdx/flen,fuy=fdy/flen;
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+fux*38,by+fuy*38);ctx.stroke();
    arrowHead(bx+fux*38,by+fuy*38,Math.atan2(fuy,fux),'#ff6b6b');
    const tx=-Math.sin(ang),ty=Math.cos(ang);
    ctx.strokeStyle='#74c0fc';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+tx*32,by+ty*32);ctx.stroke();
    arrowHead(bx+tx*32,by+ty*32,Math.atan2(ty,tx),'#74c0fc');
    const g=ctx.createRadialGradient(bx-4,by-4,1,bx,by,14);
    g.addColorStop(0,'#fff8');g.addColorStop(0.35,'#ffd43b');g.addColorStop(1,'#ff9f43');
    ctx.beginPath();ctx.arc(bx,by,12,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.font='10px var(--font2)';ctx.fillStyle='#ff6b6b';ctx.fillText('● Centripetal Force',10,ch-28);
    ctx.fillStyle='#74c0fc';ctx.fillText('● Velocity (tangent)',10,ch-14);
  }
  function animCMC(){
    if(!running)return;
    const omega=rpm*2*Math.PI/60;
    ang+=omega*0.045;
    const cx=c.width/2,cy=c.height/2;
    trail.push({x:cx+radius*Math.cos(ang),y:cy+radius*Math.sin(ang)});
    if(trail.length>65)trail.shift();
    drawCMC();
    animId=requestAnimationFrame(animCMC);
  }
  cmcUpdate();
}

// ============================================================
// 61. WAVE INTERFERENCE (Young's Double Slit)
// ============================================================
function simInterference(c,ctx,p){
  let wavelength=22,gap=60,running=true,t=0;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'wifToggle()',label:'⏸ Pause'},{cls:'btn-reset',fn:'wifReset()',label:'🔄 Reset'}])}
      ${sliderRow('wif_lambda','🌈 Wavelength',12,36,22,' px','sv("wif_lambda"," px");wifUpdate()')}
      ${sliderRow('wif_gap','↕️ Slit Gap (d)',30,110,60,' px','sv("wif_gap"," px");wifUpdate()')}
    </div>
    ${infoCards([{id:'wif_fringe',val:'0',label:'Fringe Spacing (px)'},{id:'wif_lbl',val:'—',label:'Pattern'}])}
    ${theoryBox('Path Diff = d·sinθ ; Bright: nλ, Dark: (n+½)λ','Do sources se nikalti waves jab overlap karti hain, kahin crest-crest milke bright fringe banata hai (constructive), kahin crest-trough milke dark fringe (destructive). Wavelength badhane par fringes chaudi ho jaati hain, gap badhane se patli!')}
  `);
  function wifUpdate(){
    wavelength=gv('wif_lambda');gap=gv('wif_gap');
    const approxFringe=(wavelength*220/gap).toFixed(1);
    if($id('wif_fringe'))$id('wif_fringe').textContent=approxFringe;
    if($id('wif_lbl'))$id('wif_lbl').textContent=wavelength>26?'Wide Fringes':wavelength<16?'Tight Fringes':'Medium';
  }
  window.wifUpdate=wifUpdate;
  window.wifToggle=()=>{
    running=!running;
    const btn=document.querySelector('.btn-start');
    if(btn)btn.textContent=running?'⏸ Pause':'▶ Play';
    if(running)animId=requestAnimationFrame(animWIF);else stopSim();
  };
  window.wifReset=()=>{t=0;};

  function drawWIF(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#03060a';ctx.fillRect(0,0,cw,ch);
    const s1x=cw*0.14,s1y=ch/2-gap/2;
    const s2x=cw*0.14,s2y=ch/2+gap/2;
    const k=2*Math.PI/wavelength;
    const step=7;
    for(let y=0;y<ch;y+=step){
      for(let x=cw*0.20;x<cw;x+=step){
        const r1=Math.hypot(x-s1x,y-s1y);
        const r2=Math.hypot(x-s2x,y-s2y);
        const amp=Math.sin(k*r1-t)+Math.sin(k*r2-t);
        const inten=(amp*amp)/4;
        const b=Math.min(255,inten*220);
        ctx.fillStyle=`rgb(${b*0.25|0},${b*0.75|0},${b}) `;
        ctx.fillRect(x,y,step,step);
      }
    }
    // sources
    [ [s1x,s1y],[s2x,s2y] ].forEach(([sx,sy])=>{
      const gg=ctx.createRadialGradient(sx,sy,0,sx,sy,10);
      gg.addColorStop(0,'#fff');gg.addColorStop(0.4,'#ffd43b');gg.addColorStop(1,'transparent');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fill();
    });
    // slit barrier
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(cw*0.17,0);ctx.lineTo(cw*0.17,s1y-14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cw*0.17,s1y+14);ctx.lineTo(cw*0.17,s2y-14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cw*0.17,s2y+14);ctx.lineTo(cw*0.17,ch);ctx.stroke();
    // screen intensity graph on right edge
    const scrX=cw-6;
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(scrX,0);ctx.lineTo(scrX,ch);ctx.stroke();
    for(let y=0;y<ch;y+=2){
      const r1=Math.hypot(cw-scrX+s1x,y-s1y)+Math.hypot(scrX-s1x,0);
      const rr1=Math.hypot(scrX-s1x,y-s1y);
      const rr2=Math.hypot(scrX-s2x,y-s2y);
      const amp=Math.sin(k*rr1-t)+Math.sin(k*rr2-t);
      const inten=(amp*amp)/4;
      const glowW=inten*14;
      ctx.fillStyle=`rgba(255,240,150,${Math.min(0.85,inten)})`;
      ctx.fillRect(scrX-glowW,y,glowW,2);
    }
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px var(--font2)';
    ctx.fillText('Screen →',cw-70,16);
  }
  function animWIF(){
    if(!running)return;
    t+=0.35;
    drawWIF();
    animId=requestAnimationFrame(animWIF);
  }
  wifUpdate();
  drawWIF();
  animId=requestAnimationFrame(animWIF);
}

// ============================================================
// 62. DOPPLER EFFECT
// ============================================================
function simDoppler(c,ctx,p){
  let f0=5,speedKmh=120,running=false,srcX=0,dir=1,pulses=[],emitTimer=0,lastCenterX=0;
  const SOUND_PX=180;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'dopToggle()',label:'▶ Move Source'},{cls:'btn-reset',fn:'dopReset()',label:'🔄 Reset'}])}
      ${sliderRow('dop_f','🔊 Source Freq',2,10,5,' Hz','sv("dop_f"," Hz");dopUpdate()')}
      ${sliderRow('dop_speed','🚗 Source Speed',20,300,120,' km/h','sv("dop_speed"," km/h");dopUpdate()')}
    </div>
    ${infoCards([{id:'dop_front',val:'0',label:'Heard Ahead (Hz)'},{id:'dop_back',val:'0',label:'Heard Behind (Hz)'},{id:'dop_src',val:'0',label:'Source Freq (Hz)'}])}
    ${theoryBox("f' = f·v_sound/(v_sound ∓ v_source)",'Jab source aapki taraf aata hai, waves compress hoti hain — pitch high sunayi deta hai. Jab door jaata hai, waves stretch hoti hain — pitch low sunayi deta hai. Isiliye ambulance paas se guzarte waqt siren ki awaaz badalti hai!')}
  `);
  function dopUpdate(){
    f0=gv('dop_f');speedKmh=gv('dop_speed');
    const vSrc=(speedKmh/3.6)/10; // scaled sound-units
    const vSound=34.3; // scaled speed-of-sound units matching SOUND_PX scaling
    const fFront=(f0*vSound/(vSound-vSrc)).toFixed(2);
    const fBack=(f0*vSound/(vSound+vSrc)).toFixed(2);
    if($id('dop_front'))$id('dop_front').textContent=fFront;
    if($id('dop_back'))$id('dop_back').textContent=fBack;
    if($id('dop_src'))$id('dop_src').textContent=f0.toFixed(1);
  }
  window.dopUpdate=dopUpdate;
  window.dopToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animDop);}else{stopSim();}
  };
  window.dopReset=()=>{stopSim();running=false;srcX=0;dir=1;pulses=[];emitTimer=0;drawDop();};

  function drawDop(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#04070b';ctx.fillRect(0,0,cw,ch);
    const midY=ch*0.42;
    // track
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(0,midY);ctx.lineTo(cw,midY);ctx.stroke();ctx.setLineDash([]);
    // pulses
    pulses.forEach(pl=>{
      const alpha=Math.max(0,1-pl.r/(cw*0.7));
      ctx.strokeStyle=`rgba(167,139,250,${alpha*0.7})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(pl.x,midY,pl.r,0,Math.PI*2);ctx.stroke();
    });
    const sx=cw*0.15+srcX;
    // source (ambulance icon-ish box)
    const grad=ctx.createLinearGradient(sx-16,midY-10,sx+16,midY+10);
    grad.addColorStop(0,'#ff6b6b');grad.addColorStop(1,'#c0392b');
    ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(sx-16,midY-10,32,20,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.font='14px monospace';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('🚑',sx,midY+5);
    ctx.textAlign='left';
    // observers
    ctx.font='22px monospace';
    ctx.fillText('🧍',20,midY+8);
    ctx.fillText('🧍',cw-42,midY+8);
    ctx.font='10px var(--font2)';ctx.fillStyle='#74c0fc';
    ctx.fillText('Observer A',6,midY+30);
    ctx.fillStyle='#ff9f43';ctx.fillText('Observer B',cw-70,midY+30);
    // live readouts
    dopUpdate();
    ctx.font='11px var(--font2)';ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.fillText(dir>0?'Source →':'← Source',cw/2-30,midY-40);
  }
  function animDop(){
    if(!running)return;
    const vSrc=(speedKmh/3.6)/10;
    srcX+=dir*vSrc;
    const cw=c.width;
    if(cw*0.15+srcX>cw*0.85||cw*0.15+srcX<cw*0.10){dir*=-1;}
    emitTimer+=1;
    const emitInterval=Math.max(4,Math.round(30/f0));
    if(emitTimer>=emitInterval){
      emitTimer=0;
      pulses.push({x:c.width*0.15+srcX,r:0});
    }
    pulses.forEach(pl=>pl.r+=SOUND_PX/60);
    pulses=pulses.filter(pl=>pl.r<c.width*0.9);
    drawDop();
    animId=requestAnimationFrame(animDop);
  }
  dopUpdate();
  drawDop();
}

// ============================================================
// 63. ELECTROMAGNETIC INDUCTION (Faraday's Law)
// ============================================================
function simEMInduction(c,ctx,p){
  let turns=6,speedPct=50,running=false,magPos=-120,dir=1,emf=0,flowPhase=0,prevFlux=0;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'emiToggle()',label:'▶ Move Magnet'},{cls:'btn-reset',fn:'emiReset()',label:'🔄 Reset'}])}
      ${sliderRow('emi_turns','🌀 Coil Turns (N)',2,12,6,'','sv("emi_turns","");emiUpdate()')}
      ${sliderRow('emi_speed','⚡ Magnet Speed',10,100,50,'%','sv("emi_speed","%");emiUpdate()')}
    </div>
    ${infoCards([{id:'emi_emf',val:'0.00',label:'Induced EMF (V)'},{id:'emi_dir',val:'—',label:'Current Direction'},{id:'emi_flux',val:'0.00',label:'Flux (Wb)'}])}
    ${theoryBox('EMF = -N·(dΦ/dt)','Jab magnet coil ke paas move karta hai, flux (Φ) badalta hai — isse EMF induce hota hai aur current bahta hai (Faraday ka niyam). Jitni tezi se magnet move karega, utna zyada EMF! Zyada turns (N) bhi EMF ko badhate hain. Magnet ruk jaaye to EMF zero — motion hi zaroori hai!')}
  `);
  function emiUpdate(){turns=gv('emi_turns');speedPct=gv('emi_speed');}
  window.emiUpdate=emiUpdate;
  window.emiToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animEMI);}else{stopSim();}
  };
  window.emiReset=()=>{stopSim();running=false;magPos=-120;dir=1;emf=0;flowPhase=0;drawEMI();};

  function fluxAt(x){
    const sigma=42;
    return Math.exp(-(x*x)/(2*sigma*sigma));
  }
  function drawEMI(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#05080c';ctx.fillRect(0,0,cw,ch);
    const cx=cw/2,cy=ch/2;
    const coilW=90,coilH=110;
    // coil loops (drawn as stacked ellipses to look like a solenoid)
    const loopCount=Math.round(turns);
    for(let i=0;i<loopCount;i++){
      const lx=cx-coilW/2+ (coilW/(loopCount-1||1))*i;
      const glow=Math.abs(emf)>0.05?Math.min(1,Math.abs(emf)/3):0;
      ctx.strokeStyle=glow>0?`rgba(255,212,59,${0.4+glow*0.6})`:'rgba(120,150,200,0.55)';
      ctx.lineWidth=2.5;
      ctx.beginPath();ctx.ellipse(lx,cy,16,coilH/2,0,0,Math.PI*2);ctx.stroke();
    }
    // current flow dots (direction depends on sign of emf)
    if(Math.abs(emf)>0.03){
      const dotDir=emf>0?1:-1;
      for(let i=0;i<6;i++){
        const ph=(flowPhase*dotDir+i/6)%1;
        const ang=ph*Math.PI*2;
        const lx=cx+16*Math.cos(ang);
        const ly=cy+(coilH/2)*Math.sin(ang);
        ctx.beginPath();ctx.arc(lx,ly,3,0,Math.PI*2);
        ctx.fillStyle='#ffd43b';ctx.fill();
      }
    }
    // magnet (bar magnet N-S)
    const mx=cx+magPos;
    const grad=ctx.createLinearGradient(mx-14,cy-45,mx+14,cy+45);
    grad.addColorStop(0,'#ff6b6b');grad.addColorStop(0.5,'#ff6b6b');grad.addColorStop(0.5,'#4dabf7');grad.addColorStop(1,'#4dabf7');
    ctx.fillStyle=grad;ctx.beginPath();ctx.roundRect(mx-14,cy-45,28,90,6);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 13px var(--font)';ctx.textAlign='center';
    ctx.fillText('N',mx,cy-22);ctx.fillText('S',mx,cy+30);
    ctx.textAlign='left';
    // field lines (simple curved hint)
    ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
    for(let i=-1;i<=1;i++){
      ctx.beginPath();ctx.moveTo(mx+14,cy+i*20);ctx.quadraticCurveTo(mx+50,cy+i*20,mx+14,cy+i*20+ (i===0?0:0));ctx.stroke();
    }
    // galvanometer gauge (bottom)
    const gx=cw/2,gy=ch-55,gr=38;
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(gx,gy,gr,Math.PI,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px var(--font2)';ctx.textAlign='center';
    ctx.fillText('−',gx-gr+4,gy-4);ctx.fillText('+',gx+gr-4,gy-4);ctx.fillText('GALVANOMETER',gx,gy+16);
    const needleAngle=Math.PI - Math.PI/2 - Math.max(-1,Math.min(1,emf/2.5))*(Math.PI/2-0.15);
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+gr*0.85*Math.cos(needleAngle),gy-gr*0.85*Math.sin(needleAngle));ctx.stroke();
    ctx.beginPath();ctx.arc(gx,gy,3,0,Math.PI*2);ctx.fillStyle='#ff6b6b';ctx.fill();
    ctx.textAlign='left';
  }
  function animEMI(){
    if(!running)return;
    const v=(speedPct/100)*3.2;
    magPos+=dir*v;
    if(magPos>130||magPos<-130)dir*=-1;
    const newFlux=fluxAt(magPos);
    const dFlux=newFlux-prevFlux;
    prevFlux=newFlux;
    emf=-turns*dFlux*22; // scaled for visible needle motion
    flowPhase+=0.02;
    if($id('emi_emf'))$id('emi_emf').textContent=Math.abs(emf).toFixed(2);
    if($id('emi_flux'))$id('emi_flux').textContent=newFlux.toFixed(2);
    if($id('emi_dir'))$id('emi_dir').textContent=Math.abs(emf)<0.05?'None':(emf>0?'Clockwise':'Anti-clockwise');
    drawEMI();
    animId=requestAnimationFrame(animEMI);
  }
  drawEMI();
}

// ============================================================
// 64. ORBITAL MOTION & KEPLER'S LAWS
// ============================================================
function simOrbital(c,ctx,p){
  let speedPct=100,running=false,showSweep=false,pos={x:0,y:0},vel={x:0,y:0},trail=[],sweepPts=[],crashed=false,GM=0;
  const R0=110;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'orbToggle()',label:'▶ Launch'},{cls:'btn-reset',fn:'orbReset()',label:'🔄 Reset'}])}
      ${sliderRow('orb_speed','🚀 Initial Speed',50,170,100,'%','sv("orb_speed","%");orbSetup()')}
      ${btnRow([{cls:'',fn:'orbSweep()',label:'📐 Toggle Equal-Area Sweep'}])}
    </div>
    ${infoCards([{id:'orb_v',val:'0',label:'Speed'},{id:'orb_d',val:'0',label:'Distance from Sun'},{id:'orb_type',val:'—',label:'Orbit Type'}])}
    ${theoryBox('v_circular = √(GM/r) — Kepler: Equal area in equal time','100% speed par orbit perfect circle banta hai. Kam speed = Sun ki taraf gir sakta hai (ellipse ya crash). Zyada speed = bada ellipse ya escape trajectory! Planet Sun ke paas tez aur door dheere chalta hai — yehi Kepler ka doosra niyam hai.')}
  `);
  function circularV(){return Math.sqrt(GM/R0);}
  function orbSetup(){
    speedPct=gv('orb_speed');
    GM=1400;
    pos={x:R0,y:0};
    const vC=circularV();
    vel={x:0,y:vC*(speedPct/100)};
    trail=[];sweepPts=[];crashed=false;
    drawOrb();
  }
  window.orbSetup=orbSetup;
  window.orbToggle=()=>{
    if(crashed){orbSetup();}
    running=!running;
    if(running){animId=requestAnimationFrame(animOrb);}else{stopSim();}
  };
  window.orbReset=()=>{stopSim();running=false;orbSetup();};
  window.orbSweep=()=>{showSweep=!showSweep;drawOrb();};

  function drawOrb(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#03040a';ctx.fillRect(0,0,cw,ch);
    // starfield
    ctx.fillStyle='rgba(255,255,255,0.35)';
    for(let i=0;i<40;i++){
      const sx=(i*97)%cw,sy=(i*53)%ch;
      ctx.fillRect(sx,sy,1,1);
    }
    const cx=cw/2,cy=ch/2;
    // trail
    if(trail.length>1){
      ctx.strokeStyle='rgba(116,192,252,0.5)';ctx.lineWidth=1.5;ctx.beginPath();
      trail.forEach((t,i)=>i===0?ctx.moveTo(cx+t.x,cy+t.y):ctx.lineTo(cx+t.x,cy+t.y));
      ctx.stroke();
    }
    // equal-area sweep triangles
    if(showSweep&&sweepPts.length>=2){
      ctx.fillStyle='rgba(255,212,59,0.18)';
      ctx.beginPath();ctx.moveTo(cx,cy);
      sweepPts.forEach(t=>ctx.lineTo(cx+t.x,cy+t.y));
      ctx.closePath();ctx.fill();
    }
    // sun
    const sg=ctx.createRadialGradient(cx,cy,0,cx,cy,26);
    sg.addColorStop(0,'#fff8dc');sg.addColorStop(0.4,'#ffd43b');sg.addColorStop(1,'#ff9f43');
    ctx.beginPath();ctx.arc(cx,cy,16,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();
    // planet
    const px=cx+pos.x,py=cy+pos.y;
    const pg=ctx.createRadialGradient(px-3,py-3,1,px,py,9);
    pg.addColorStop(0,'#cdeeff');pg.addColorStop(0.5,'#74c0fc');pg.addColorStop(1,'#3d6ea5');
    ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
    // velocity vector
    const vlen=Math.hypot(vel.x,vel.y);
    if(vlen>0.01){
      const ux=vel.x/vlen,uy=vel.y/vlen;
      ctx.strokeStyle='#69db7c';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+ux*24,py+uy*24);ctx.stroke();
    }
    if(crashed){
      ctx.fillStyle='#ff6b6b';ctx.font='bold 13px var(--font)';ctx.textAlign='center';
      ctx.fillText('💥 Planet Sun mein gir gaya!',cw/2,ch-16);ctx.textAlign='left';
    }
  }
  function animOrb(){
    if(!running)return;
    const dt=0.35;
    const dx=-pos.x,dy=-pos.y;
    const r=Math.max(14,Math.hypot(dx,dy));
    const ax=GM*dx/(r*r*r),ay=GM*dy/(r*r*r);
    vel.x+=ax*dt;vel.y+=ay*dt;
    pos.x+=vel.x*dt;pos.y+=vel.y*dt;
    trail.push({x:pos.x,y:pos.y});
    if(trail.length>200)trail.shift();
    sweepPts.push({x:pos.x,y:pos.y});
    if(sweepPts.length>14)sweepPts.shift();
    const speed=Math.hypot(vel.x,vel.y);
    const dist=Math.hypot(pos.x,pos.y);
    const vC=circularV();
    let type='Elliptical';
    if(Math.abs(speed-vC)<vC*0.03)type='Circular';
    else if(speed>vC*1.35)type='Escape (Hyperbolic)';
    if($id('orb_v'))$id('orb_v').textContent=speed.toFixed(1);
    if($id('orb_d'))$id('orb_d').textContent=dist.toFixed(0);
    if($id('orb_type'))$id('orb_type').textContent=type;
    if(dist<20){
      crashed=true;running=false;stopSim();drawOrb();return;
    }
    if(dist>c.width){running=false;stopSim();drawOrb();return;}
    drawOrb();
    animId=requestAnimationFrame(animOrb);
  }
  orbSetup();
}

// ============================================================
// 65. RADIOACTIVE DECAY & HALF-LIFE
// ============================================================
function simRadioactive(c,ctx,p){
  let halfLife=5,running=false,t=0,atoms=[],history=[];
  const cols=8,rows=6,N0=cols*rows;
  function initAtoms(){
    atoms=[];
    for(let i=0;i<N0;i++){
      atoms.push({x:i%cols,y:Math.floor(i/cols),decayed:false,flash:0});
    }
  }
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'radToggle()',label:'▶ Start Decay'},{cls:'btn-reset',fn:'radReset()',label:'🔄 Reset'}])}
      ${sliderRow('rad_hl','⏱️ Half-Life',2,15,5,' s','sv("rad_hl"," s");radUpdate()')}
    </div>
    ${infoCards([{id:'rad_n',val:String(N0),label:'Remaining Atoms'},{id:'rad_t',val:'0.0',label:'Time (s)'},{id:'rad_hln',val:'0.0',label:'Half-Lives Passed'}])}
    ${theoryBox('N = N₀ · (1/2)^(t / t½)','Har radioactive atom random waqt pe decay hota hai — predict nahi kar sakte KAB, lekin bahut saare atoms ka average behavior bilkul predictable curve follow karta hai! Half-life jitni kam, atoms utni jaldi decay honge.')}
  `);
  function radUpdate(){halfLife=gv('rad_hl');if(!running)drawRad();}
  window.radUpdate=radUpdate;
  window.radToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animRad);}else{stopSim();}
  };
  window.radReset=()=>{stopSim();running=false;t=0;history=[];initAtoms();drawRad();};

  function drawRad(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#04070b';ctx.fillRect(0,0,cw,ch);
    const gridTop=20,gridH=ch*0.48;
    const cellW=cw/cols,cellH=gridH/rows;
    let remaining=0;
    atoms.forEach(a=>{
      const ax=a.x*cellW+cellW/2,ay=gridTop+a.y*cellH+cellH/2;
      if(!a.decayed){
        remaining++;
        const g=ctx.createRadialGradient(ax-3,ay-3,1,ax,ay,10);
        g.addColorStop(0,'#e6ffcc');g.addColorStop(0.5,'#a9e34b');g.addColorStop(1,'#5c9e1f');
        ctx.beginPath();ctx.arc(ax,ay,9,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      }else{
        ctx.beginPath();ctx.arc(ax,ay,9,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.stroke();
        if(a.flash>0){
          ctx.strokeStyle=`rgba(255,180,80,${a.flash})`;ctx.lineWidth=2;
          ctx.beginPath();ctx.arc(ax,ay,9+(1-a.flash)*14,0,Math.PI*2);ctx.stroke();
          a.flash-=0.04;
        }
      }
    });
    const gy0=ch*0.62,gyH=ch*0.30,gx0=32,gxW=cw-50;
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(gx0,gy0);ctx.lineTo(gx0,gy0+gyH);ctx.lineTo(gx0+gxW,gy0+gyH);ctx.stroke();
    const tSpan=Math.max(20,t+5);
    ctx.strokeStyle='rgba(116,192,252,0.55)';ctx.lineWidth=1.5;ctx.beginPath();
    for(let px=0;px<=gxW;px++){
      const tt=(px/gxW)*tSpan;
      const n=N0*Math.pow(0.5,tt/halfLife);
      const py=gy0+gyH-(n/N0)*gyH;
      px===0?ctx.moveTo(gx0+px,py):ctx.lineTo(gx0+px,py);
    }
    ctx.stroke();
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;ctx.beginPath();
    history.forEach((h,i)=>{
      const px=gx0+(h.t/tSpan)*gxW;
      const py=gy0+gyH-(h.n/N0)*gyH;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    });
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px var(--font2)';
    ctx.fillText('N (atoms) vs Time — yellow=actual, blue=theory',gx0,gy0-6);
    if($id('rad_n'))$id('rad_n').textContent=remaining;
    if($id('rad_t'))$id('rad_t').textContent=t.toFixed(1);
    if($id('rad_hln'))$id('rad_hln').textContent=(t/halfLife).toFixed(2);
  }
  const dt=1/30;
  function animRad(){
    if(!running)return;
    t+=dt;
    const pDecay=1-Math.pow(0.5,dt/halfLife);
    atoms.forEach(a=>{if(!a.decayed&&Math.random()<pDecay){a.decayed=true;a.flash=1;}});
    const remaining=atoms.filter(a=>!a.decayed).length;
    history.push({t,n:remaining});
    if(history.length>900)history.shift();
    drawRad();
    if(remaining>0){animId=requestAnimationFrame(animRad);}else{running=false;stopSim();}
  }
  initAtoms();
  drawRad();
}

// ============================================================
// 66. CHEMICAL EQUILIBRIUM (Le Chatelier's Principle)
// ============================================================
function simEquilibrium(c,ctx,p){
  let temp=50,running=false,particles=[];
  const N=40;
  function initParticles(){
    particles=[];
    for(let i=0;i<N;i++){
      particles.push({x:20+Math.random()*(c.width-40),y:20+Math.random()*(c.height*0.6),vx:(Math.random()-0.5)*2.2,vy:(Math.random()-0.5)*2.2,type:'A'});
    }
  }
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'eqmToggle()',label:'▶ Start Reaction'},{cls:'btn-reset',fn:'eqmReset()',label:'🔄 Reset'}])}
      ${sliderRow('eqm_temp','🌡️ Temperature',0,100,50,'°','sv("eqm_temp","°");eqmUpdate()')}
    </div>
    ${infoCards([{id:'eqm_a',val:String(N),label:'[A] Reactant'},{id:'eqm_b',val:'0',label:'[B] Product'},{id:'eqm_k',val:'0.00',label:'Keq = [B]/[A]'}])}
    ${theoryBox('A ⇌ B (Forward = Exothermic) — Le Chatelier','Reaction dono taraf chalti hai — forward (A→B) aur backward (B→A). Jab dono rates barabar ho jaati hain, dynamic equilibrium aa jaata hai — particles bante-tootte rehte hain lekin overall concentration constant rehti hai! Temperature badhane par is exothermic reaction ka equilibrium ULTA (B→A) shift ho jaata hai.')}
  `);
  function eqmUpdate(){temp=gv('eqm_temp');}
  window.eqmUpdate=eqmUpdate;
  window.eqmToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animEqm);}else{stopSim();}
  };
  window.eqmReset=()=>{stopSim();running=false;initParticles();drawEqm();};

  function drawEqm(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#05080c';ctx.fillRect(0,0,cw,ch);
    const boxH=ch*0.62;
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1.5;
    ctx.strokeRect(6,6,cw-12,boxH);
    let countA=0,countB=0;
    particles.forEach(pt=>{
      pt.type==='A'?countA++:countB++;
      const col=pt.type==='A'?'#74c0fc':'#ff9f43';
      const g=ctx.createRadialGradient(pt.x-2,pt.y-2,0.5,pt.x,pt.y,7);
      g.addColorStop(0,'#fff');g.addColorStop(0.4,col);g.addColorStop(1,col);
      ctx.beginPath();ctx.arc(pt.x,pt.y,6,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
    const barY=ch*0.70,barH=ch*0.14,totalW=cw-20;
    const aw=(countA/N)*totalW;
    ctx.fillStyle='#74c0fc';ctx.fillRect(10,barY,aw,barH);
    ctx.fillStyle='#ff9f43';ctx.fillRect(10+aw,barY,totalW-aw,barH);
    ctx.fillStyle='#fff';ctx.font='10px var(--font2)';ctx.textAlign='center';
    if(aw>28)ctx.fillText('A: '+countA,10+aw/2,barY+barH/2+3);
    if(totalW-aw>28)ctx.fillText('B: '+countB,10+aw+(totalW-aw)/2,barY+barH/2+3);
    ctx.textAlign='left';
    ctx.font='10px var(--font2)';ctx.fillStyle='#74c0fc';ctx.fillText('● A (Reactant)',10,ch-6);
    ctx.fillStyle='#ff9f43';ctx.fillText('● B (Product)',110,ch-6);
    if($id('eqm_a'))$id('eqm_a').textContent=countA;
    if($id('eqm_b'))$id('eqm_b').textContent=countB;
    if($id('eqm_k'))$id('eqm_k').textContent=(countB/Math.max(1,countA)).toFixed(2);
  }
  function animEqm(){
    if(!running)return;
    const kf=0.006*Math.max(0,1-temp/160);
    const kr=0.002+0.006*(temp/140);
    const boundsW=c.width-14,boundsH=c.height*0.62-14;
    particles.forEach(pt=>{
      pt.x+=pt.vx;pt.y+=pt.vy;
      if(pt.x<8||pt.x>boundsW)pt.vx*=-1;
      if(pt.y<8||pt.y>boundsH)pt.vy*=-1;
      pt.x=Math.max(8,Math.min(boundsW,pt.x));
      pt.y=Math.max(8,Math.min(boundsH,pt.y));
      if(pt.type==='A'&&Math.random()<kf)pt.type='B';
      else if(pt.type==='B'&&Math.random()<kr)pt.type='A';
    });
    drawEqm();
    animId=requestAnimationFrame(animEqm);
  }
  initParticles();
  drawEqm();
}

// ============================================================
// 67. GALVANIC CELL (Voltaic Battery)
// ============================================================
function simGalvanic(c,ctx,p){
  let running=false,electrons=[],ions=[],znMass=40,cuMass=10,t=0;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'galToggle()',label:'▶ Close Circuit'},{cls:'btn-reset',fn:'galReset()',label:'🔄 Reset'}])}
    </div>
    ${infoCards([{id:'gal_v',val:'0.00',label:'Cell Voltage (V)'},{id:'gal_zn',val:'40',label:'Zn Electrode (Anode)'},{id:'gal_cu',val:'10',label:'Cu Deposited (Cathode)'}])}
    ${theoryBox('Zn → Zn²⁺+2e⁻ (Anode) | Cu²⁺+2e⁻ → Cu (Cathode)','Zinc electrode khud oxidize hoke electrons chodta hai (anode) — ye electrons wire se hoke Copper electrode tak jaate hain jahan Cu²⁺ ions reduce hoke pure copper ban jaate hain (cathode). Isi electron flow se current banta hai — bina bahar se koi power lagaye! E°cell = +1.10V')}
  `);
  window.galToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animGal);}else{stopSim();}
  };
  window.galReset=()=>{stopSim();running=false;electrons=[];ions=[];znMass=40;cuMass=10;t=0;drawGal();};

  function drawGal(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#05080c';ctx.fillRect(0,0,cw,ch);
    const beakerY=ch*0.35,beakerH=ch*0.5;
    const b1x=cw*0.10,b1w=cw*0.32;
    const b2x=cw*0.58,b2w=cw*0.32;
    ctx.fillStyle='rgba(180,220,255,0.15)';ctx.fillRect(b1x,beakerY,b1w,beakerH);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.strokeRect(b1x,beakerY,b1w,beakerH);
    const cuGrad=ctx.createLinearGradient(0,beakerY,0,beakerY+beakerH);
    cuGrad.addColorStop(0,'rgba(100,180,255,0.35)');cuGrad.addColorStop(1,'rgba(60,140,220,0.4)');
    ctx.fillStyle=cuGrad;ctx.fillRect(b2x,beakerY,b2w,beakerH);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.strokeRect(b2x,beakerY,b2w,beakerH);
    const znX=b1x+b1w/2,znTop=beakerY+10,znH=Math.max(15,znMass);
    ctx.fillStyle='#a8a8b0';ctx.fillRect(znX-8,znTop,16,znH);
    ctx.strokeStyle='#dcdce0';ctx.lineWidth=1;ctx.strokeRect(znX-8,znTop,16,znH);
    ctx.fillStyle='#ddd';ctx.font='10px var(--font2)';ctx.textAlign='center';ctx.fillText('Zn (Anode)',znX,beakerY+beakerH+14);
    const cuX=b2x+b2w/2,cuTop=beakerY+10,cuH=Math.max(15,cuMass);
    ctx.fillStyle='#e0834d';ctx.fillRect(cuX-8,cuTop,16,cuH);
    ctx.strokeStyle='#ffb37a';ctx.lineWidth=1;ctx.strokeRect(cuX-8,cuTop,16,cuH);
    ctx.fillText('Cu (Cathode)',cuX,beakerY+beakerH+14);
    ctx.textAlign='left';
    const bridgeY=beakerY-14;
    ctx.strokeStyle='rgba(200,200,200,0.4)';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(znX,bridgeY);ctx.quadraticCurveTo(cw/2,bridgeY-22,cuX,bridgeY);ctx.stroke();
    ctx.lineCap='butt';
    const wireY=18;
    ctx.strokeStyle='#8b949e';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(znX,znTop-4);ctx.lineTo(znX,wireY);ctx.lineTo(cuX,wireY);ctx.lineTo(cuX,cuTop-4);ctx.stroke();
    const vmX=cw/2,vmY=wireY;
    ctx.beginPath();ctx.arc(vmX,vmY,14,0,Math.PI*2);ctx.fillStyle='#0d1117';ctx.fill();
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#ffd43b';ctx.font='bold 9px var(--font2)';ctx.textAlign='center';
    ctx.fillText(running?'1.10':'0.00',vmX,vmY+3);
    ctx.textAlign='left';
    electrons.forEach(e=>{
      let ex,ey;
      if(e.seg===0){ex=znX;ey=znTop-4-(znTop-4-wireY)*e.p;}
      else if(e.seg===1){ex=znX+(cuX-znX)*e.p;ey=wireY;}
      else{ex=cuX;ey=wireY+(cuTop-4-wireY)*e.p;}
      ctx.beginPath();ctx.arc(ex,ey,3,0,Math.PI*2);ctx.fillStyle='#58a6ff';ctx.fill();
    });
    ions.forEach(io=>{
      const ix=znX+(cuX-znX)*io.p;
      const iy=bridgeY-22*4*io.p*(1-io.p);
      ctx.beginPath();ctx.arc(ix,iy,2.5,0,Math.PI*2);ctx.fillStyle='rgba(255,212,59,0.8)';ctx.fill();
    });
    if($id('gal_v'))$id('gal_v').textContent=running?'1.10':'0.00';
    if($id('gal_zn'))$id('gal_zn').textContent=znMass.toFixed(0);
    if($id('gal_cu'))$id('gal_cu').textContent=cuMass.toFixed(0);
  }
  function animGal(){
    if(!running)return;
    t+=1;
    if(t%8===0&&znMass>15){electrons.push({seg:0,p:0});znMass-=0.15;cuMass+=0.15;}
    if(t%14===0){ions.push({p:0});}
    electrons.forEach(e=>{e.p+=0.08;if(e.p>=1){e.p=0;e.seg++;}});
    electrons=electrons.filter(e=>e.seg<3);
    ions.forEach(io=>io.p+=0.03);
    ions=ions.filter(io=>io.p<1);
    drawGal();
    animId=requestAnimationFrame(animGal);
  }
  drawGal();
}

// 68. CRYSTAL GROWTH (Crystallization)
// ============================================================
function simCrystallization(c,ctx,p){
  let speed=50,density=50,running=false,occupied=new Map(),frontier=[],step=0,cellSize=10;
  function keyOf(gx,gy){return gx+','+gy;}
  function neighbors(gx,gy){return [[gx+1,gy],[gx-1,gy],[gx,gy+1],[gx,gy-1],[gx+1,gy+1],[gx-1,gy-1]];}
  function initCrystal(){
    occupied=new Map();frontier=[];
    occupied.set(keyOf(0,0),{depth:0});
    neighbors(0,0).forEach(([nx,ny])=>{frontier.push({gx:nx,gy:ny,depth:1});});
    step=0;
  }
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'cryToggle()',label:'▶ Start Growing'},{cls:'btn-reset',fn:'cryReset()',label:'🔄 Reset'}])}
      ${sliderRow('cry_speed','⚡ Growth Speed',10,100,50,'%','sv("cry_speed","%");cryUpdate()')}
      ${sliderRow('cry_dens','🧪 Supersaturation',10,100,50,'%','sv("cry_dens","%");cryUpdate()')}
    </div>
    ${infoCards([{id:'cry_size',val:'1',label:'Crystal Size (atoms)'},{id:'cry_time',val:'0.0',label:'Time (s)'}])}
    ${theoryBox('Supersaturation → Nucleation → Ordered Lattice Growth','Jab solution mein solute apni solubility limit se zyada ho jaata hai (supersaturated), extra particles ek chhote seed ke around order mein jud ke crystal lattice banane lagte hain. Zyada supersaturation aur sahi speed = tez aur bada crystal!')}
  `);
  function cryUpdate(){speed=gv('cry_speed');density=gv('cry_dens');}
  window.cryUpdate=cryUpdate;
  window.cryToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animCry);}else{stopSim();}
  };
  window.cryReset=()=>{stopSim();running=false;initCrystal();drawCry();};

  function drawCry(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#040810';ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle='rgba(150,200,255,0.15)';
    for(let i=0;i<35;i++){
      const sx=(i*67+step*3)%cw,sy=(i*89)%ch;
      ctx.beginPath();ctx.arc(sx,sy,1.3,0,Math.PI*2);ctx.fill();
    }
    const ox=cw/2,oy=ch/2;
    let maxDepth=1;
    occupied.forEach(v=>{if(v.depth>maxDepth)maxDepth=v.depth;});
    occupied.forEach((v,k)=>{
      const parts=k.split(',');
      const gx=Number(parts[0]),gy=Number(parts[1]);
      const px=ox+gx*cellSize+(gy%2)*cellSize/2;
      const py=oy+gy*cellSize*0.86;
      const hue=200-(v.depth/maxDepth)*80;
      const g=ctx.createRadialGradient(px-2,py-2,0.5,px,py,6);
      g.addColorStop(0,'#ffffff');
      g.addColorStop(0.4,`hsl(${hue},80%,65%)`);
      g.addColorStop(1,`hsl(${hue},70%,40%)`);
      ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
    if($id('cry_size'))$id('cry_size').textContent=occupied.size;
    if($id('cry_time'))$id('cry_time').textContent=(step/30).toFixed(1);
  }
  function animCry(){
    if(!running)return;
    step++;
    const tries=Math.max(1,Math.round(speed/25));
    for(let i=0;i<tries;i++){
      if(frontier.length===0)break;
      const idx=Math.floor(Math.random()*frontier.length);
      const cand=frontier[idx];
      const pGrow=0.15+(density/100)*0.5;
      if(!occupied.has(keyOf(cand.gx,cand.gy))){
        if(Math.random()<pGrow){
          occupied.set(keyOf(cand.gx,cand.gy),{depth:cand.depth});
          neighbors(cand.gx,cand.gy).forEach(([nx,ny])=>{
            if(!occupied.has(keyOf(nx,ny)))frontier.push({gx:nx,gy:ny,depth:cand.depth+1});
          });
        }
      }
      frontier.splice(idx,1);
    }
    if(occupied.size>240){running=false;stopSim();}
    drawCry();
    if(running)animId=requestAnimationFrame(animCry);
  }
  initCrystal();
  drawCry();
}

// 69. PAPER CHROMATOGRAPHY
// ============================================================
function simChromatography(c,ctx,p){
  let running=false,front=0,mixture='ink';
  const MIXES={
    ink:[{name:'Yellow',col:'#ffd43b',rf:0.85},{name:'Red',col:'#ff6b6b',rf:0.55},{name:'Blue',col:'#4dabf7',rf:0.25}],
    leaf:[{name:'Carotene',col:'#ff9f43',rf:0.92},{name:'Xanthophyll',col:'#ffe066',rf:0.70},{name:'Chlorophyll-a',col:'#51cf66',rf:0.45},{name:'Chlorophyll-b',col:'#2f9e44',rf:0.30}]
  };
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🧪 Mixture</div>
      <div class="btn-row">
        <button class="sim-btn" id="chr_b1" onclick="chrSetMix('ink')" style="flex:1;font-size:12px">🖋️ Black Ink</button>
        <button class="sim-btn" id="chr_b2" onclick="chrSetMix('leaf')" style="flex:1;font-size:12px">🍃 Leaf Extract</button>
      </div>
    </div>
    ${btnRow([{cls:'btn-start',fn:'chrToggle()',label:'▶ Start'},{cls:'btn-reset',fn:'chrReset()',label:'🔄 Reset'}])}
    <div id="chr_rf" style="font-size:12px;color:var(--text2);font-family:var(--font2);padding:4px 2px"></div>
    ${theoryBox('Rf = Distance traveled by dye / Distance traveled by solvent','Solvent paper mein capillary action se upar chadta hai, apne saath dyes ko bhi kheenchta hai. Jo dye paper se kam chipakta hai (kam adsorption) woh solvent ke saath tez upar jaata hai — zyada chipakne wala peeche reh jaata hai. Isi tarah mixture ke saare colors alag ho jaate hain!')}
  `);
  window.chrSetMix=(m)=>{
    mixture=m;front=0;
    const b1=$id('chr_b1'),b2=$id('chr_b2');
    if(b1)b1.style.background=m==='ink'?'rgba(196,158,80,0.35)':'var(--card2)';
    if(b2)b2.style.background=m==='leaf'?'rgba(196,158,80,0.35)':'var(--card2)';
    drawChr();
  };
  window.chrToggle=()=>{
    running=!running;
    if(running){animId=requestAnimationFrame(animChr);}else{stopSim();}
  };
  window.chrReset=()=>{stopSim();running=false;front=0;drawChr();};

  function drawChr(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#0a0a08';ctx.fillRect(0,0,cw,ch);
    const stripX=cw/2-30,stripW=60,stripTop=20,stripBot=ch-40;
    const stripH=stripBot-stripTop;
    ctx.fillStyle='rgba(120,170,255,0.25)';ctx.fillRect(stripX-20,stripBot,stripW+40,25);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;ctx.strokeRect(stripX-20,stripBot,stripW+40,25);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px var(--font2)';ctx.textAlign='center';
    ctx.fillText('Solvent',cw/2,stripBot+16);
    ctx.fillStyle='rgba(255,250,240,0.08)';ctx.fillRect(stripX,stripTop,stripW,stripH);
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.5;ctx.strokeRect(stripX,stripTop,stripW,stripH);
    const frontY=stripBot-front*stripH;
    const wet=ctx.createLinearGradient(0,frontY,0,stripBot);
    wet.addColorStop(0,'rgba(150,200,255,0.05)');wet.addColorStop(1,'rgba(150,200,255,0.22)');
    ctx.fillStyle=wet;ctx.fillRect(stripX,frontY,stripW,stripBot-frontY);
    ctx.strokeStyle='rgba(150,200,255,0.7)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(stripX,frontY);ctx.lineTo(stripX+stripW,frontY);ctx.stroke();ctx.setLineDash([]);
    const comps=MIXES[mixture];
    comps.forEach(comp=>{
      const dist=comp.rf*front;
      const dy=stripBot-dist*stripH;
      const spread=4+dist*10;
      const g=ctx.createRadialGradient(cw/2,dy,1,cw/2,dy,spread);
      g.addColorStop(0,comp.col);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.ellipse(cw/2,dy,stripW/2-2,Math.max(2,spread*0.5),0,0,Math.PI*2);ctx.fill();
    });
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.setLineDash([2,2]);
    ctx.beginPath();ctx.moveTo(stripX,stripBot);ctx.lineTo(stripX+stripW,stripBot);ctx.stroke();ctx.setLineDash([]);
    ctx.textAlign='left';
    const rfEl=$id('chr_rf');
    if(rfEl){
      rfEl.innerHTML=comps.map(comp=>`<span style="color:${comp.col}">● ${comp.name}: Rf=${comp.rf.toFixed(2)}</span>`).join('&nbsp;&nbsp;');
    }
  }
  function animChr(){
    if(!running)return;
    front+=0.0035;
    if(front>=1){front=1;running=false;stopSim();}
    drawChr();
    if(running)animId=requestAnimationFrame(animChr);
  }
  window.chrSetMix('ink');
  drawChr();
}

// 70. PASCAL'S TRIANGLE
// ============================================================
function simPascal(c,ctx,p){
  let rows=8,highlight='none',pulse=0,hoverCell=null;
  function buildTriangle(n){
    const tri=[[1]];
    for(let i=1;i<n;i++){
      const prev=tri[i-1],row=[1];
      for(let j=1;j<prev.length;j++)row.push(prev[j-1]+prev[j]);
      row.push(1);
      tri.push(row);
    }
    return tri;
  }
  let tri=buildTriangle(rows);
  panel(`
    <div class="ctrl-section">
      ${sliderRow('pas_rows','🔺 Rows',3,13,8,'','sv("pas_rows","");pasUpdate()')}
      <div class="ctrl-label">✨ Highlight Pattern</div>
      <div class="btn-row">
        <button class="sim-btn" id="pas_h0" onclick="pasSetH('none')" style="flex:1;font-size:11px">Numbers</button>
        <button class="sim-btn" id="pas_h1" onclick="pasSetH('even')" style="flex:1;font-size:11px">🎨 Odd/Even</button>
        <button class="sim-btn" id="pas_h2" onclick="pasSetH('fib')" style="flex:1;font-size:11px">🐚 Fibonacci</button>
      </div>
    </div>
    ${infoCards([{id:'pas_sum',val:'1',label:'Row Sum (2ⁿ)'},{id:'pas_val',val:'—',label:'Tap a cell'}])}
    ${theoryBox('C(n,r) = C(n-1,r-1) + C(n-1,r)','Har number apne seedhe upar ke do numbers ka sum hota hai! Yeh triangle Binomial expansion (a+b)ⁿ ke coefficients deta hai. Odd/Even pattern ko rangao to ek chhota Sierpinski Triangle chhup ke nikal aata hai — pure number theory se pure geometry!')}
  `);
  function pasUpdate(){
    rows=gv('pas_rows');
    tri=buildTriangle(rows);
    const sumEl=$id('pas_sum');
    if(sumEl)sumEl.textContent=Math.pow(2,rows-1).toLocaleString();
    draw();
  }
  window.pasUpdate=pasUpdate;
  window.pasSetH=(h)=>{
    highlight=h;
    ['pas_h0','pas_h1','pas_h2'].forEach(id=>{const b=$id(id);if(b)b.style.background='var(--card2)';});
    const map={none:'pas_h0',even:'pas_h1',fib:'pas_h2'};
    const b=$id(map[h]);if(b)b.style.background='rgba(196,158,80,0.4)';
    draw();
  };
  function fibSet(n){const f=new Set();let a=1,b=1;while(a<=n){f.add(a);const t=a+b;a=b;b=t;}return f;}

  function cellAt(mx,my){
    const cw=c.width,ch=c.height;
    const cell=Math.min(cw/(rows+1.5),(ch-30)/(rows+0.5));
    const size=Math.max(14,Math.min(cell*0.82,42));
    const totalW=(rows)*size*0.95;
    const ox=cw/2-totalW/2+size/2;
    const oy=20;
    for(let i=0;i<tri.length;i++){
      const rowW=(tri[i].length-1)*size*0.95;
      const rowOx=cw/2-rowW/2;
      for(let j=0;j<tri[i].length;j++){
        const px=rowOx+j*size*0.95;
        const py=oy+i*size*0.86+size/2;
        if(Math.hypot(mx-px,my-py)<size*0.42)return {i,j,val:tri[i][j]};
      }
    }
    return null;
  }
  c.onclick=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(c.width/rect.width),my=(e.clientY-rect.top)*(c.height/rect.height);
    const hit=cellAt(mx,my);
    if(hit){
      hoverCell={i:hit.i,j:hit.j};
      const vEl=$id('pas_val');
      if(vEl)vEl.textContent=`C(${hit.i},${hit.j}) = ${hit.val.toLocaleString()}`;
      draw();
    }
  };

  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#070912';ctx.fillRect(0,0,cw,ch);
    // soft radial glow backdrop
    const bgGlow=ctx.createRadialGradient(cw/2,ch*0.35,10,cw/2,ch*0.35,cw*0.7);
    bgGlow.addColorStop(0,'rgba(120,90,220,0.10)');bgGlow.addColorStop(1,'transparent');
    ctx.fillStyle=bgGlow;ctx.fillRect(0,0,cw,ch);

    const maxVal=Math.max(...tri[tri.length-1]);
    const size=Math.max(14,Math.min(cw/(rows+1),(ch-30)/(rows+0.5),42));
    const oy=20;
    const fibSetVals=highlight==='fib'?fibSet(maxVal):null;

    for(let i=0;i<tri.length;i++){
      const rowW=(tri[i].length-1)*size*0.95;
      const rowOx=cw/2-rowW/2;
      for(let j=0;j<tri[i].length;j++){
        const val=tri[i][j];
        const px=rowOx+j*size*0.95;
        const py=oy+i*size*0.86+size/2;
        let fillCol,glowCol,textCol='#fff';
        if(highlight==='even'){
          const isEven=val%2===0;
          fillCol=isEven?'#3d6a22':'#c0533a';
          glowCol=isEven?'rgba(120,220,90,0.55)':'rgba(255,100,80,0.55)';
        }else if(highlight==='fib'){
          const isFib=fibSetVals.has(val);
          fillCol=isFib?'#a07c30':'#1c2333';
          glowCol=isFib?'rgba(255,212,80,0.7)':'rgba(80,100,160,0.2)';
          textCol=isFib?'#1a1200':'rgba(255,255,255,0.55)';
        }else{
          const t=Math.log(val+1)/Math.log(maxVal+1);
          const hue=250-t*110;
          fillCol=`hsl(${hue},65%,${28+t*22}%)`;
          glowCol=`hsla(${hue},80%,65%,0.55)`;
        }
        const isHover=hoverCell&&hoverCell.i===i&&hoverCell.j===j;
        const r=size*0.42*(isHover?1.15:1);
        ctx.save();
        ctx.shadowColor=glowCol;ctx.shadowBlur=isHover?26:12;
        const grad=ctx.createRadialGradient(px-r*0.3,py-r*0.3,1,px,py,r);
        grad.addColorStop(0,'#ffffff');
        grad.addColorStop(0.35,fillCol);
        grad.addColorStop(1,fillCol);
        ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();
        if(isHover){ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();}
        ctx.restore();
        if(size>20){
          ctx.fillStyle=textCol;
          ctx.font=`700 ${Math.max(8,Math.min(13,size*0.32))}px var(--font2)`;
          ctx.textAlign='center';ctx.textBaseline='middle';
          const label=val>9999?val.toExponential(1):val.toLocaleString();
          ctx.fillText(label,px,py+1);
        }
      }
    }
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
  }
  pasUpdate();
  window.pasSetH('none');
}

// 71. 3D SOLIDS — VOLUME & SURFACE AREA
// ============================================================
function simSolids3D(c,ctx,p){
  let shape='cube',dim1=6,dim2=6,rotY=0.5,rotX=-0.4,dragging=false,lastX=0,lastY=0,autoRotate=true;
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🧊 Solid</div>
      <div class="btn-row">
        <button class="sim-btn" id="sol_b0" onclick="solSet('cube')" style="flex:1;font-size:11px">Cube</button>
        <button class="sim-btn" id="sol_b1" onclick="solSet('cylinder')" style="flex:1;font-size:11px">Cylinder</button>
        <button class="sim-btn" id="sol_b2" onclick="solSet('cone')" style="flex:1;font-size:11px">Cone</button>
        <button class="sim-btn" id="sol_b3" onclick="solSet('sphere')" style="flex:1;font-size:11px">Sphere</button>
      </div>
    </div>
    <div class="ctrl-section" id="sol_sliders"></div>
    ${infoCards([{id:'sol_vol',val:'0',label:'Volume (units³)'},{id:'sol_sa',val:'0',label:'Surface Area (units²)'}])}
    <div style="font-size:11px;color:var(--text2);font-family:var(--font2);text-align:center;padding:2px">👆 Drag karke ghumao</div>
    <div id="sol_formula" style="text-align:center"></div>
  `);
  const FORMULAS={
    cube:{vol:'a³',sa:'6a²'},
    cylinder:{vol:'πr²h',sa:'2πr²+2πrh'},
    cone:{vol:'⅓πr²h',sa:'πr²+πrl'},
    sphere:{vol:'⁴⁄₃πr³',sa:'4πr²'}
  };
  function refreshSliders(){
    let html='';
    if(shape==='cube'){
      html=sliderRow('sol_d1','📏 Side (a)',2,12,dim1,'','sv("sol_d1","");solUpdate()');
    }else if(shape==='sphere'){
      html=sliderRow('sol_d1','📏 Radius (r)',2,10,dim1,'','sv("sol_d1","");solUpdate()');
    }else{
      html=sliderRow('sol_d1','📏 Radius (r)',2,8,dim1,'','sv("sol_d1","");solUpdate()')
          +sliderRow('sol_d2','📏 Height (h)',2,14,dim2,'','sv("sol_d2","");solUpdate()');
    }
    $id('sol_sliders').innerHTML=html;
    const f=FORMULAS[shape];
    $id('sol_formula').innerHTML=theoryBox(`V=${f.vol}  |  SA=${f.sa}`,'Solid ko drag karke rotate karo — sliders se dimensions badlo, volume aur surface area turant recalculate hoga. Cone ka volume cylinder ka bilkul ⅓ hota hai (same r,h) — dono shapes banake khud compare karo!');
  }
  window.solSet=(s)=>{
    shape=s;autoRotate=true;
    ['sol_b0','sol_b1','sol_b2','sol_b3'].forEach(id=>{const b=$id(id);if(b)b.style.background='var(--card2)';});
    const map={cube:'sol_b0',cylinder:'sol_b1',cone:'sol_b2',sphere:'sol_b3'};
    const b=$id(map[s]);if(b)b.style.background='rgba(196,158,80,0.4)';
    refreshSliders();solUpdate();
  };
  window.solUpdate=()=>{
    dim1=gv('sol_d1');dim2=$id('sol_d2')?gv('sol_d2'):dim1;
    let vol=0,sa=0;
    if(shape==='cube'){vol=dim1**3;sa=6*dim1*dim1;}
    else if(shape==='cylinder'){vol=Math.PI*dim1*dim1*dim2;sa=2*Math.PI*dim1*dim1+2*Math.PI*dim1*dim2;}
    else if(shape==='cone'){const l=Math.sqrt(dim1*dim1+dim2*dim2);vol=Math.PI*dim1*dim1*dim2/3;sa=Math.PI*dim1*dim1+Math.PI*dim1*l;}
    else if(shape==='sphere'){vol=4/3*Math.PI*dim1**3;sa=4*Math.PI*dim1*dim1;}
    if($id('sol_vol'))$id('sol_vol').textContent=vol.toFixed(1);
    if($id('sol_sa'))$id('sol_sa').textContent=sa.toFixed(1);
    drawStatic();
  };

  // ---- 3D projection helpers ----
  function rot(pt){
    let [x,y,z]=pt;
    const cy=Math.cos(rotY),sy=Math.sin(rotY);
    let x1=x*cy+z*sy, z1=-x*sy+z*cy;
    const cx=Math.cos(rotX),sx=Math.sin(rotX);
    let y1=y*cx-z1*sx, z2=y*sx+z1*cx;
    return [x1,y1,z2];
  }
  function project(pt,cx,cy,scale){
    const [x,y,z]=rot(pt);
    const persp=280/(280+z);
    return {x:cx+x*scale*persp,y:cy+y*scale*persp,z,persp};
  }

  function drawFacePoly(pts,cx,cy,scale,fillBase,alphaBase){
    const proj=pts.map(pt=>project(pt,cx,cy,scale));
    const avgZ=proj.reduce((s,q)=>s+q.z,0)/proj.length;
    // simple back-face normal check via signed area
    let area=0;
    for(let i=0;i<proj.length;i++){const a=proj[i],b=proj[(i+1)%proj.length];area+=(a.x*b.y-b.x*a.y);}
    const visible=area>0; // orientation-based visibility for convex faces
    const light=0.45+0.55*Math.max(0,Math.min(1,(avgZ+6)/12));
    ctx.beginPath();
    proj.forEach((q,i)=>i===0?ctx.moveTo(q.x,q.y):ctx.lineTo(q.x,q.y));
    ctx.closePath();
    const [r,g,b]=fillBase;
    ctx.fillStyle=`rgba(${Math.round(r*light)},${Math.round(g*light)},${Math.round(b*light)},${alphaBase})`;
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.stroke();
    return avgZ;
  }

  function drawCubeShape(cx,cy,scale){
    const s=1;
    const verts=[];
    for(const sx of [-s,s])for(const sy of [-s,s])for(const sz of [-s,s])verts.push([sx,sy,sz]);
    const idx=(x,y,z)=>verts.findIndex(v=>v[0]===x&&v[1]===y&&v[2]===z);
    const faces=[
      [idx(-1,-1,-1),idx(1,-1,-1),idx(1,1,-1),idx(-1,1,-1)],
      [idx(-1,-1,1),idx(1,-1,1),idx(1,1,1),idx(-1,1,1)],
      [idx(-1,-1,-1),idx(-1,1,-1),idx(-1,1,1),idx(-1,-1,1)],
      [idx(1,-1,-1),idx(1,1,-1),idx(1,1,1),idx(1,-1,1)],
      [idx(-1,-1,-1),idx(1,-1,-1),idx(1,-1,1),idx(-1,-1,1)],
      [idx(-1,1,-1),idx(1,1,-1),idx(1,1,1),idx(-1,1,1)],
    ];
    const faceInfo=faces.map(f=>{
      const pts=f.map(i=>verts[i]);
      const projd=pts.map(pt=>project(pt,cx,cy,scale));
      const avgZ=projd.reduce((s2,q)=>s2+q.z,0)/projd.length;
      return {pts,avgZ};
    });
    faceInfo.sort((a,b)=>a.avgZ-b.avgZ);
    faceInfo.forEach(f=>drawFacePoly(f.pts,cx,cy,scale,[90,140,255],0.85));
  }
  function drawCylinderShape(cx,cy,scale,rRatio,hRatio){
    const segs=28,rr=rRatio,hh=hRatio;
    const top=[],bot=[];
    for(let i=0;i<segs;i++){
      const a=i/segs*Math.PI*2;
      top.push([Math.cos(a)*rr,-hh,Math.sin(a)*rr]);
      bot.push([Math.cos(a)*rr,hh,Math.sin(a)*rr]);
    }
    const parts=[];
    parts.push({pts:top,avgZ:top.map(pt=>project(pt,cx,cy,scale).z).reduce((s,v)=>s+v,0)/segs,type:'cap'});
    parts.push({pts:bot,avgZ:bot.map(pt=>project(pt,cx,cy,scale).z).reduce((s,v)=>s+v,0)/segs,type:'cap'});
    for(let i=0;i<segs;i++){
      const j=(i+1)%segs;
      const quad=[top[i],top[j],bot[j],bot[i]];
      const avgZ=quad.map(pt=>project(pt,cx,cy,scale).z).reduce((s,v)=>s+v,0)/4;
      parts.push({pts:quad,avgZ,type:'side'});
    }
    parts.sort((a,b)=>a.avgZ-b.avgZ);
    parts.forEach(part=>drawFacePoly(part.pts,cx,cy,scale,[255,180,70],part.type==='cap'?0.85:0.75));
  }
  function drawConeShape(cx,cy,scale,rRatio,hRatio){
    const segs=28,rr=rRatio,hh=hRatio;
    const apex=[0,-hh,0];
    const base=[];
    for(let i=0;i<segs;i++){const a=i/segs*Math.PI*2;base.push([Math.cos(a)*rr,hh,Math.sin(a)*rr]);}
    const parts=[{pts:base,avgZ:base.map(pt=>project(pt,cx,cy,scale).z).reduce((s,v)=>s+v,0)/segs,type:'cap'}];
    for(let i=0;i<segs;i++){
      const j=(i+1)%segs;
      const tri=[apex,base[i],base[j]];
      const avgZ=tri.map(pt=>project(pt,cx,cy,scale).z).reduce((s,v)=>s+v,0)/3;
      parts.push({pts:tri,avgZ,type:'side'});
    }
    parts.sort((a,b)=>a.avgZ-b.avgZ);
    parts.forEach(part=>drawFacePoly(part.pts,cx,cy,scale,[120,220,150],part.type==='cap'?0.8:0.72));
  }
  function drawSphereShape(cx,cy,scale){
    const latSegs=14,lonSegs=20;
    const parts=[];
    for(let i=0;i<latSegs;i++){
      const th1=Math.PI*i/latSegs-Math.PI/2, th2=Math.PI*(i+1)/latSegs-Math.PI/2;
      for(let j=0;j<lonSegs;j++){
        const ph1=2*Math.PI*j/lonSegs, ph2=2*Math.PI*(j+1)/lonSegs;
        const v=(th,ph)=>[Math.cos(th)*Math.cos(ph),Math.sin(th),Math.cos(th)*Math.sin(ph)];
        const quad=[v(th1,ph1),v(th1,ph2),v(th2,ph2),v(th2,ph1)];
        const avgZ=quad.map(pt=>project(pt,cx,cy,scale).z).reduce((s,val)=>s+val,0)/4;
        parts.push({pts:quad,avgZ});
      }
    }
    parts.sort((a,b)=>a.avgZ-b.avgZ);
    parts.forEach(part=>drawFacePoly(part.pts,cx,cy,scale,[200,110,240],0.8));
  }

  function drawStatic(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#05070d';ctx.fillRect(0,0,cw,ch);
    const glow=ctx.createRadialGradient(cw/2,ch/2,10,cw/2,ch/2,cw*0.6);
    glow.addColorStop(0,'rgba(90,120,255,0.10)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle='rgba(255,255,255,0.10)';
    for(let i=0;i<40;i++){
      const sx=(i*137)%cw,sy=(i*211)%ch;
      ctx.beginPath();ctx.arc(sx,sy,0.9,0,Math.PI*2);ctx.fill();
    }
    const cx=cw/2,cy=ch/2;
    const scale=Math.min(cw,ch)*0.24;
    if(shape==='cube')drawCubeShape(cx,cy,scale);
    else if(shape==='cylinder')drawCylinderShape(cx,cy,scale,1,dim2/dim1*0.9||1);
    else if(shape==='cone')drawConeShape(cx,cy,scale,1,dim2/dim1*0.9||1);
    else drawSphereShape(cx,cy,scale);
  }
  function animLoop(){
    if(autoRotate&&!dragging)rotY+=0.006;
    drawStatic();
    animId=requestAnimationFrame(animLoop);
  }
  c.onpointerdown=(e)=>{dragging=true;autoRotate=false;lastX=e.clientX;lastY=e.clientY;};
  window.addEventListener('pointerup',()=>{dragging=false;});
  c.onpointermove=(e)=>{
    if(!dragging)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    rotY+=dx*0.01;rotX+=dy*0.01;
    rotX=Math.max(-1.4,Math.min(1.4,rotX));
    lastX=e.clientX;lastY=e.clientY;
    drawStatic();
  };
  window.solSet('cube');
  animLoop();
}

// 72. MONTY HALL PARADOX
// ============================================================
function simMontyHall(c,ctx,p){
  let doors=[0,0,0],prizeIdx=0,chosen=-1,revealedGoat=-1,stage='pick',stats={switchWin:0,switchLose:0,stayWin:0,stayLose:0},lastStrategy=null,animT=0,autoRunning=false,autoCount=0;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'mhNewGame()',label:'🎲 New Game'},{cls:'btn-reset',fn:'mhAutoRun()',label:'⚡ Run 200 Trials'}])}
    </div>
    <div id="mh_msg" style="font-size:13px;color:var(--text2);font-family:var(--font2);text-align:center;padding:6px;min-height:20px"></div>
    ${infoCards([{id:'mh_switch',val:'0%',label:'Switch Win Rate'},{id:'mh_stay',val:'0%',label:'Stay Win Rate'}])}
    ${theoryBox('P(switch wins)=2/3   P(stay wins)=1/3','Jab tum pehli baar door choose karte ho, prize milne ka chance 1/3 hota hai. Host jaan-boojh kar ek khaali (goat) door kholta hai — yeh EXTRA information hai! Isliye switch karne se baaki 2 doors ka poora 2/3 probability tumhare naye door mein concentrate ho jaata hai. Yahi hai Monty Hall Paradox!')}
  `);
  function newGame(){
    prizeIdx=Math.floor(Math.random()*3);
    chosen=-1;revealedGoat=-1;stage='pick';animT=0;
    $id('mh_msg').textContent='Ek darwaza chuno (tap karo)';
    draw();
  }
  window.mhNewGame=newGame;
  function pickDoor(i){
    if(stage!=='pick')return;
    chosen=i;
    const others=[0,1,2].filter(x=>x!==i&&x!==prizeIdx);
    revealedGoat=others[Math.floor(Math.random()*others.length)];
    stage='reveal';
    $id('mh_msg').innerHTML=`Host ne darwaza ${revealedGoat+1} khola — usme 🐐 hai! Ab <b>Switch</b> ya <b>Stay</b>?`;
    draw();
  }
  function finalize(strategy){
    if(stage!=='reveal')return;
    lastStrategy=strategy;
    let finalChoice=chosen;
    if(strategy==='switch')finalChoice=[0,1,2].find(x=>x!==chosen&&x!==revealedGoat);
    const won=finalChoice===prizeIdx;
    if(strategy==='switch'){if(won)stats.switchWin++;else stats.switchLose++;}
    else{if(won)stats.stayWin++;else stats.stayLose++;}
    stage='done';
    chosen=finalChoice;
    $id('mh_msg').innerHTML=won?`🎉 Jeet gaye! Prize door ${prizeIdx+1} tha (${strategy==='switch'?'Switch':'Stay'})`:`😢 Haar gaye. Prize door ${prizeIdx+1} tha (${strategy==='switch'?'Switch':'Stay'})`;
    updateStats();
    draw();
    setTimeout(()=>{if(!autoRunning)newGame();},1400);
  }
  window.mhAutoRun=()=>{
    if(autoRunning)return;
    autoRunning=true;autoCount=0;
    function runOne(){
      if(autoCount>=200){autoRunning=false;newGame();return;}
      prizeIdx=Math.floor(Math.random()*3);
      chosen=Math.floor(Math.random()*3);
      const others=[0,1,2].filter(x=>x!==chosen&&x!==prizeIdx);
      revealedGoat=others[Math.floor(Math.random()*others.length)];
      const finalChoice=[0,1,2].find(x=>x!==chosen&&x!==revealedGoat);
      if(finalChoice===prizeIdx)stats.switchWin++;else stats.switchLose++;
      // also simulate stay strategy in parallel for comparison
      if(chosen===prizeIdx)stats.stayWin++;else stats.stayLose++;
      autoCount++;
      updateStats();
      stage='done';
      draw();
      setTimeout(runOne,15);
    }
    $id('mh_msg').textContent='⚡ 200 games auto-simulate ho rahe hain...';
    runOne();
  };
  function updateStats(){
    const st=stats.switchWin+stats.switchLose,sy=stats.stayWin+stats.stayLose;
    if($id('mh_switch'))$id('mh_switch').textContent=st?Math.round(stats.switchWin/st*100)+'%':'0%';
    if($id('mh_stay'))$id('mh_stay').textContent=sy?Math.round(stats.stayWin/sy*100)+'%':'0%';
  }
  c.onclick=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(c.width/rect.width);
    const cw=c.width;
    const dw=Math.min(cw/3.6,120);
    for(let i=0;i<3;i++){
      const dx=cw/2+(i-1)*(dw+18)-dw/2;
      if(mx>=dx&&mx<=dx+dw){
        if(stage==='pick')pickDoor(i);
        return;
      }
    }
  };
  window.mhSwitch=()=>finalize('switch');
  window.mhStay=()=>finalize('stay');

  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#0a0612';ctx.fillRect(0,0,cw,ch);
    const glow=ctx.createRadialGradient(cw/2,ch*0.4,10,cw/2,ch*0.4,cw*0.7);
    glow.addColorStop(0,'rgba(200,80,180,0.14)');glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(0,0,cw,ch);

    const dw=Math.min(cw/3.6,120),dh=dw*1.7,doorY=ch/2-dh/2;
    for(let i=0;i<3;i++){
      const dx=cw/2+(i-1)*(dw+18)-dw/2;
      const isChosen=i===chosen;
      const showBack = (stage==='reveal'&&i===revealedGoat) || (stage==='done');
      ctx.save();
      if(isChosen&&stage!=='done'){ctx.shadowColor='rgba(255,212,59,0.7)';ctx.shadowBlur=22;}
      if(showBack){
        const isPrize=i===prizeIdx;
        const g=ctx.createLinearGradient(dx,doorY,dx,doorY+dh);
        g.addColorStop(0,isPrize?'#3d6a22':'#2a2035');
        g.addColorStop(1,isPrize?'#5a8a3a':'#1a1522');
        ctx.fillStyle=g;
        ctx.beginPath();ctx.roundRect(dx,doorY,dw,dh,10);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.stroke();
        ctx.font=`${dw*0.5}px serif`;ctx.textAlign='center';
        ctx.fillText(isPrize?'🏆':'🐐',dx+dw/2,doorY+dh/2+dw*0.18);
      }else{
        const g=ctx.createLinearGradient(dx,doorY,dx,doorY+dh);
        g.addColorStop(0,'#c49e50');g.addColorStop(1,'#8a6423');
        ctx.fillStyle=g;
        ctx.beginPath();ctx.roundRect(dx,doorY,dw,dh,10);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=isChosen?3:1.5;
        ctx.strokeStyle=isChosen?'#ffd43b':'rgba(255,255,255,0.35)';
        ctx.stroke();
        ctx.fillStyle='rgba(0,0,0,0.25)';
        ctx.beginPath();ctx.arc(dx+dw*0.82,doorY+dh*0.52,dw*0.06,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font=`700 ${dw*0.3}px var(--font2)`;
        ctx.fillText(String(i+1),dx+dw/2,doorY+dh*0.42);
      }
      ctx.restore();
      ctx.textAlign='left';
    }

    if(stage==='reveal'){
      const by=doorY+dh+26;
      ctx.fillStyle='rgba(88,166,255,0.9)';
      const bw=Math.min(cw*0.4,150);
      ctx.beginPath();ctx.roundRect(cw/2-bw-10,by,bw,40,10);ctx.fill();
      ctx.fillStyle='rgba(255,120,100,0.9)';
      ctx.beginPath();ctx.roundRect(cw/2+10,by,bw,40,10);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='700 14px var(--font2)';ctx.textAlign='center';
      ctx.fillText('🔄 SWITCH',cw/2-bw/2-10,by+25);
      ctx.fillText('✋ STAY',cw/2+bw/2+10,by+25);
      ctx.textAlign='left';
      c.onSwitchZone={x:cw/2-bw-10,y:by,w:bw,h:40};
      c.onStayZone={x:cw/2+10,y:by,w:bw,h:40};
    }
  }
  const origClick=c.onclick;
  c.onclick=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(c.width/rect.width),my=(e.clientY-rect.top)*(c.height/rect.height);
    if(stage==='reveal'&&c.onSwitchZone){
      const s=c.onSwitchZone,st=c.onStayZone;
      if(mx>=s.x&&mx<=s.x+s.w&&my>=s.y&&my<=s.y+s.h)return finalize('switch');
      if(mx>=st.x&&mx<=st.x+st.w&&my>=st.y&&my<=st.y+st.h)return finalize('stay');
    }
    if(stage==='pick'){
      const cw=c.width;
      const dw=Math.min(cw/3.6,120);
      for(let i=0;i<3;i++){
        const dx=cw/2+(i-1)*(dw+18)-dw/2;
        if(mx>=dx&&mx<=dx+dw)return pickDoor(i);
      }
    }
  };
  newGame();
}

// 73. TESSELLATION & SYMMETRY EXPLORER
// ============================================================
function simTessellation(c,ctx,p){
  let shapeType='hex',rotation=0,colorMode='rainbow',size=34,animT=0,running=true;
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🔷 Tile Shape</div>
      <div class="btn-row">
        <button class="sim-btn" id="tes_b0" onclick="tesSet('hex')" style="flex:1;font-size:11px">⬡ Hexagon</button>
        <button class="sim-btn" id="tes_b1" onclick="tesSet('tri')" style="flex:1;font-size:11px">△ Triangle</button>
        <button class="sim-btn" id="tes_b2" onclick="tesSet('square')" style="flex:1;font-size:11px">◻ Square</button>
      </div>
    </div>
    ${sliderRow('tes_size','📏 Tile Size',18,55,34,'px','sv("tes_size","px");tesUpdate()')}
    ${sliderRow('tes_rot','🔄 Rotation',0,60,0,'°','sv("tes_rot","°");tesUpdate()')}
    <div class="ctrl-section">
      <div class="ctrl-label">🎨 Colors</div>
      <div class="btn-row">
        <button class="sim-btn" id="tes_c0" onclick="tesSetColor('rainbow')" style="flex:1;font-size:11px">🌈 Rainbow</button>
        <button class="sim-btn" id="tes_c1" onclick="tesSetColor('sunset')" style="flex:1;font-size:11px">🌅 Sunset</button>
        <button class="sim-btn" id="tes_c2" onclick="tesSetColor('ocean')" style="flex:1;font-size:11px">🌊 Ocean</button>
      </div>
    </div>
    ${theoryBox('Tessellation = Shapes jo bina gap/overlap ke plane bhar de','Sirf 3 regular polygons akele plane ko tile kar sakte hain: equilateral triangle (60°), square (90°), aur regular hexagon (120°) — kyunki inke interior angles 360° ko exactly divide karte hain! Yeh hi wajah hai ki honeycomb hexagonal hoti hai aur floor tiles square.')}
  `);
  window.tesSet=(s)=>{
    shapeType=s;
    ['tes_b0','tes_b1','tes_b2'].forEach(id=>{const b=$id(id);if(b)b.style.background='var(--card2)';});
    const map={hex:'tes_b0',tri:'tes_b1',square:'tes_b2'};
    const b=$id(map[s]);if(b)b.style.background='rgba(196,158,80,0.4)';
    draw();
  };
  window.tesSetColor=(m)=>{
    colorMode=m;
    ['tes_c0','tes_c1','tes_c2'].forEach(id=>{const b=$id(id);if(b)b.style.background='var(--card2)';});
    const map={rainbow:'tes_c0',sunset:'tes_c1',ocean:'tes_c2'};
    const b=$id(map[m]);if(b)b.style.background='rgba(196,158,80,0.4)';
    draw();
  };
  window.tesUpdate=()=>{size=gv('tes_size');rotation=gv('tes_rot')*Math.PI/180;draw();};

  function palette(t){
    if(colorMode==='rainbow')return `hsl(${(t*47)%360},75%,60%)`;
    if(colorMode==='sunset')return `hsl(${20+(t*17)%40},85%,${55+(t*7)%20}%)`;
    return `hsl(${180+(t*13)%60},70%,${40+(t*11)%25}%)`;
  }
  function rotatePt(x,y,cx,cy,ang){
    const dx=x-cx,dy=y-cy;
    return [cx+dx*Math.cos(ang)-dy*Math.sin(ang), cy+dx*Math.sin(ang)+dy*Math.cos(ang)];
  }
  function drawPoly(cx,cy,r,sides,ang,fill,glow){
    ctx.save();
    ctx.shadowColor=glow;ctx.shadowBlur=8;
    ctx.beginPath();
    for(let i=0;i<sides;i++){
      const a=ang+i/sides*Math.PI*2;
      const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.restore();
  }
  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#080a14';ctx.fillRect(0,0,cw,ch);
    const cx=cw/2,cy=ch/2;
    let idx=0;
    if(shapeType==='hex'){
      const r=size,hstep=r*1.5,vstep=r*Math.sqrt(3);
      for(let row=-Math.ceil(ch/vstep)-2;row<Math.ceil(ch/vstep)+2;row++){
        for(let col=-Math.ceil(cw/hstep)-2;col<Math.ceil(cw/hstep)+2;col++){
          const x=cx+col*hstep;
          const y=cy+row*vstep+(col%2!==0?vstep/2:0);
          if(x<-r*2||x>cw+r*2||y<-r*2||y>ch+r*2)continue;
          idx++;
          drawPoly(x,y,r*0.96,6,rotation,palette(idx),palette(idx));
        }
      }
    }else if(shapeType==='square'){
      const s=size*1.6;
      for(let row=-1;row*s<ch+s*2;row++){
        for(let col=-1;col*s<cw+s*2;col++){
          const x=cx+(col*s)%cw-cw/2+cw/2,y=row*s;
          const px=((col*s)+cw*50)%cw - (cw%s), py=y;
          idx++;
        }
      }
      // simpler regular grid
      const startX=(cx%s)-s*2, startY=(cy%s)-s*2;
      idx=0;
      for(let y=startY;y<ch+s;y+=s){
        for(let x=startX;x<cw+s;x+=s){
          idx++;
          const cxp=x+s/2,cyp=y+s/2;
          ctx.save();
          ctx.translate(cxp,cyp);ctx.rotate(rotation);
          ctx.shadowColor=palette(idx);ctx.shadowBlur=8;
          ctx.fillStyle=palette(idx);
          ctx.fillRect(-s*0.47,-s*0.47,s*0.94,s*0.94);
          ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.2;
          ctx.strokeRect(-s*0.47,-s*0.47,s*0.94,s*0.94);
          ctx.restore();
        }
      }
    }else{
      // triangle tessellation using triangular grid of up/down triangles
      const s=size*1.5,h=s*Math.sqrt(3)/2;
      const startX=(cx%s)-s*3, startY=(cy%h)-h*3;
      idx=0;
      for(let row=startY;row<ch+h*2;row+=h){
        let col0=startX;
        for(let x=col0;x<cw+s*2;x+=s/2){
          const rowIdx=Math.round((row-startY)/h);
          const colIdx=Math.round((x-startX)/(s/2));
          const up=(colIdx+rowIdx)%2===0;
          idx++;
          const cxp=x, cyp=row+h/2;
          ctx.save();
          ctx.translate(cxp,cyp);ctx.rotate(rotation);
          const pts=up?[[0,-h/2],[s/2*0.58,h/2],[-s/2*0.58,h/2]]:[[0,h/2],[s/2*0.58,-h/2],[-s/2*0.58,-h/2]];
          ctx.shadowColor=palette(idx);ctx.shadowBlur=8;
          ctx.beginPath();
          pts.forEach((pt,i)=>i===0?ctx.moveTo(pt[0],pt[1]):ctx.lineTo(pt[0],pt[1]));
          ctx.closePath();
          ctx.fillStyle=palette(idx);ctx.fill();
          ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
          ctx.restore();
        }
      }
    }
  }
  window.tesSet('hex');
  window.tesSetColor('rainbow');
  draw();
}

// ============================================================
// 74. SIMPLE VS COMPOUND INTEREST RACE
// ============================================================
function simInterestRace(c,ctx,p){
  let principal=10000,rate=10,years=20,t=0,running=false,speed=1;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'irToggle()',label:'▶ Start Race'},{cls:'btn-reset',fn:'irReset()',label:'🔄 Reset'}])}
      ${sliderRow('ir_p','💰 Principal (₹)',1000,100000,10000,'','sv("ir_p","");irUpdate()')}
      ${sliderRow('ir_r','📈 Rate',2,20,10,'%','sv("ir_r","%");irUpdate()')}
      ${sliderRow('ir_y','📅 Years',5,40,20,'','sv("ir_y","");irUpdate()')}
    </div>
    ${infoCards([{id:'ir_simple',val:'₹0',label:'Simple Interest Total'},{id:'ir_compound',val:'₹0',label:'Compound Interest Total'}])}
    ${theoryBox('Simple: P(1+rt)   |   Compound: P(1+r)ᵗ','Simple interest mein sirf principal par interest milta hai, isliye graph ek straight line banata hai. Compound interest mein pichle interest par bhi interest milta hai, isliye curve exponentially upar bhaagta hai — jitna zyada years, gap utna hi zyada dramatic hota hai. Yahi "power of compounding" hai jo Warren Buffett jaise investors use karte hain!')}
  `);
  function irUpdate(){
    principal=gv('ir_p');rate=gv('ir_r');years=gv('ir_y');
    if(!running)draw();
  }
  window.irUpdate=irUpdate;
  window.irToggle=()=>{
    running=!running;
    if(running){t=0;animId=requestAnimationFrame(animate);}else{stopSim();}
  };
  window.irReset=()=>{stopSim();running=false;t=0;draw();};

  function valuesAt(yr){
    const simple=principal*(1+(rate/100)*yr);
    const compound=principal*Math.pow(1+rate/100,yr);
    return {simple,compound};
  }
  function fmtMoney(v){
    if(v>=10000000)return '₹'+(v/10000000).toFixed(2)+'Cr';
    if(v>=100000)return '₹'+(v/100000).toFixed(2)+'L';
    return '₹'+Math.round(v).toLocaleString('en-IN');
  }
  function draw(){
    const cw=c.width,ch=c.height;
    ctx.fillStyle='#070912';ctx.fillRect(0,0,cw,ch);
    const padL=54,padB=34,padT=18,padR=16;
    const plotW=cw-padL-padR,plotH=ch-padT-padB;
    const curYear=running?Math.min(t,years):years;
    const finalVals=valuesAt(years);
    const maxVal=Math.max(finalVals.compound,finalVals.simple)*1.08;

    // grid + axes
    ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
    for(let i=0;i<=5;i++){
      const y=padT+plotH-i/5*plotH;
      ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(cw-padR,y);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px monospace';ctx.textAlign='right';
      ctx.fillText(fmtMoney(i/5*maxVal),padL-6,y+3);
    }
    for(let yr=0;yr<=years;yr+=Math.max(1,Math.round(years/8))){
      const x=padL+yr/years*plotW;
      ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,ch-padB);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px monospace';ctx.textAlign='center';
      ctx.fillText('Y'+yr,x,ch-padB+14);
    }
    ctx.textAlign='left';

    // curves
    function plotCurve(fn,col,glow){
      ctx.save();
      ctx.shadowColor=glow;ctx.shadowBlur=10;
      ctx.strokeStyle=col;ctx.lineWidth=3;
      ctx.beginPath();
      for(let yr=0;yr<=curYear;yr+=curYear/120||0.1){
        const v=fn(yr);
        const x=padL+yr/years*plotW,y=padT+plotH-(v/maxVal)*plotH;
        yr===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.restore();
      // dot at current end
      const v=fn(curYear);
      const x=padL+curYear/years*plotW,y=padT+plotH-(v/maxVal)*plotH;
      ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      return {x,y,v};
    }
    const simEnd=plotCurve(yr=>principal*(1+(rate/100)*yr),'#58a6ff','rgba(88,166,255,0.7)');
    const compEnd=plotCurve(yr=>principal*Math.pow(1+rate/100,yr),'#ffd43b','rgba(255,212,59,0.8)');

    ctx.font='700 11px var(--font2)';
    ctx.fillStyle='#58a6ff';ctx.fillText('● Simple',padL+6,padT+14);
    ctx.fillStyle='#ffd43b';ctx.fillText('● Compound',padL+90,padT+14);

    const curVals=valuesAt(curYear);
    if($id('ir_simple'))$id('ir_simple').textContent=fmtMoney(curVals.simple);
    if($id('ir_compound'))$id('ir_compound').textContent=fmtMoney(curVals.compound);
  }
  function animate(){
    if(!running)return;
    t+=years/240;
    if(t>=years){t=years;running=false;draw();stopSim();return;}
    draw();
    animId=requestAnimationFrame(animate);
  }
  draw();
}
