function simSound(c,ctx,p){
  let freq=440,amp=60,running=false,phase=0,showHarmonics=true,resonMode=false;
  let resonFreq=440,resonAmp=0,resonPhase=0;

  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'soundToggle()',label:'▶ Play Wave'},{cls:'btn-reset',fn:'soundReset()',label:'🔄 Reset'}])}
      ${sliderRow('snd_freq','🎵 Frequency',50,1200,440,' Hz','sv("snd_freq"," Hz");soundUp()')}
      ${sliderRow('snd_amp','📊 Amplitude',10,90,60,' px','sv("snd_amp"," px");soundUp()')}
      <div class="ctrl-label" style="margin-top:4px">🎼 Harmonics / Resonance</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:6px">
        <button class="sim-btn btn-start" onclick="setNote('C')" style="flex:0;padding:6px 10px;font-size:12px">C (262Hz)</button>
        <button class="sim-btn btn-start" onclick="setNote('E')" style="flex:0;padding:6px 10px;font-size:12px">E (330Hz)</button>
        <button class="sim-btn btn-start" onclick="setNote('G')" style="flex:0;padding:6px 10px;font-size:12px">G (392Hz)</button>
        <button class="sim-btn btn-start" onclick="setNote('A')" style="flex:0;padding:6px 10px;font-size:12px">A (440Hz)</button>
        <button class="sim-btn btn-pause" onclick="toggleResonMode()" style="flex:0;padding:6px 10px;font-size:12px">🔔 Resonance</button>
      </div>
    </div>
    ${infoCards([{id:'snd_period',val:'2.27',label:'Period (ms)'},{id:'snd_pitch',val:'A4',label:'Note'},{id:'snd_speed',val:'343',label:'Speed (m/s)'}])}
    ${theoryBox('v = fλ  |  Resonance: f₀ = nv/2L','Frequency badhane par pitch zyada hoti hai. Resonance tab hoti hai jab driving frequency = natural frequency. Standing waves antinodes par maximum amplitude dikhate hain.')}
  `);

  function noteFromFreq(f){
    const notes=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const octave=Math.round(Math.log2(f/261.63));
    const semitone=Math.round(12*Math.log2(f/261.63))%12;
    return notes[((semitone%12)+12)%12]+(4+octave);
  }

  function soundUp(){
    freq=gv('snd_freq'); amp=gv('snd_amp');
    if($id('snd_period'))$id('snd_period').textContent=(1000/freq).toFixed(2);
    if($id('snd_pitch'))$id('snd_pitch').textContent=noteFromFreq(freq);
  }
  window.soundUp=soundUp;
  window.soundToggle=()=>{
    if(running){stopSim();running=false;}
    else{running=true;animId=requestAnimationFrame(animSound);}
  };
  window.soundReset=()=>{stopSim();running=false;phase=0;resonAmp=0;drawSound();};
  window.setNote=(n)=>{
    const map={C:262,E:330,G:392,A:440};
    freq=map[n];
    const sl=$id('snd_freq');if(sl){sl.value=freq;sv('snd_freq',' Hz');}
    soundUp();
  };
  window.toggleResonMode=()=>{
    resonMode=!resonMode;
    resonFreq=freq; resonAmp=0; resonPhase=0;
  };

  function drawSound(){
    const cw=c.width, ch=c.height;
    // Deep dark background
    ctx.fillStyle='#0a0014'; ctx.fillRect(0,0,cw,ch);
    // Purple-violet gradient overlay
    const bg=ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0,'rgba(80,0,120,0.45)');
    bg.addColorStop(1,'rgba(20,0,60,0.30)');
    ctx.fillStyle=bg; ctx.fillRect(0,0,cw,ch);

    // Grid lines (frequency markers)
    ctx.strokeStyle='rgba(180,100,255,0.12)'; ctx.lineWidth=1;
    for(let x=0;x<cw;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();}
    for(let y=0;y<ch;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();}

    const cy=ch/2;

    // --- RESONANCE MODE: standing wave ---
    if(resonMode){
      resonAmp=Math.min(resonAmp+0.8, amp*1.4);
      // Draw standing wave nodes/antinodes
      const nHarmonics=3;
      for(let h=1;h<=nHarmonics;h++){
        ctx.strokeStyle=`rgba(${200+h*15},${80+h*30},255,${0.6-h*0.12})`;
        ctx.lineWidth=3-h*0.5;
        ctx.beginPath();
        for(let x=0;x<cw;x++){
          const envelope=Math.sin(Math.PI*x/cw);
          const y=cy + resonAmp*envelope*Math.sin(h*Math.PI*2*x/cw)*Math.cos(phase*h*0.5);
          x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
      // Node markers
      for(let n=0;n<=4;n++){
        const nx=n*cw/4;
        ctx.beginPath();ctx.arc(nx,cy,6,0,Math.PI*2);
        ctx.fillStyle='rgba(255,200,50,0.9)';ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='10px monospace';ctx.textAlign='center';
        ctx.fillText(n%2===0?'N':'AN',nx,cy+20);
      }
      ctx.textAlign='left';
      ctx.fillStyle='rgba(255,150,50,0.9)';ctx.font='bold 13px monospace';
      ctx.fillText('🔔 RESONANCE MODE — Standing Wave',10,22);
      ctx.fillStyle='rgba(200,150,255,0.8)';ctx.font='11px monospace';
      ctx.fillText('N=Node (zero) | AN=Antinode (max amplitude)',10,38);
    } else {
      // --- NORMAL MODE: travelling wave + harmonics ---
      // Main wave with neon glow
      const gradient=ctx.createLinearGradient(0,cy-amp,0,cy+amp);
      gradient.addColorStop(0,'rgba(200,100,255,0.9)');
      gradient.addColorStop(0.5,'rgba(130,50,255,1.0)');
      gradient.addColorStop(1,'rgba(200,100,255,0.9)');

      // Glow pass (wider, transparent)
      ctx.strokeStyle='rgba(180,80,255,0.25)'; ctx.lineWidth=10;
      ctx.beginPath();
      for(let x=0;x<cw;x++){
        const y=cy+amp*Math.sin(2*Math.PI*freq*x/(cw)+phase);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();

      // Main wave
      ctx.strokeStyle=gradient; ctx.lineWidth=3;
      ctx.beginPath();
      for(let x=0;x<cw;x++){
        const y=cy+amp*Math.sin(2*Math.PI*freq*x/(cw)+phase);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();

      // 2nd harmonic
      ctx.strokeStyle='rgba(80,200,255,0.55)'; ctx.lineWidth=1.5;
      ctx.beginPath();
      for(let x=0;x<cw;x++){
        const y=cy+(amp*0.4)*Math.sin(2*2*Math.PI*freq*x/(cw)+phase*2);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();

      // 3rd harmonic
      ctx.strokeStyle='rgba(255,180,50,0.35)'; ctx.lineWidth=1;
      ctx.beginPath();
      for(let x=0;x<cw;x++){
        const y=cy+(amp*0.25)*Math.sin(3*2*Math.PI*freq*x/(cw)+phase*3);
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();

      // Amplitude annotation
      ctx.strokeStyle='rgba(255,220,80,0.6)'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(8,cy-amp);ctx.lineTo(8,cy+amp);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,220,80,0.9)';ctx.font='11px monospace';ctx.textAlign='left';
      ctx.fillText('A='+amp,12,cy-amp+14);ctx.fillText('-A',12,cy+amp-4);

      // Wavelength bracket
      const wl=cw*0.6; // visual wavelength
      ctx.strokeStyle='rgba(80,255,200,0.6)'; ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cw*0.2,cy-amp-18);ctx.lineTo(cw*0.2+wl,cy-amp-18);ctx.stroke();
      ctx.fillStyle='rgba(80,255,200,0.9)';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText('λ (wavelength)',cw*0.2+wl/2,cy-amp-22);
      ctx.textAlign='left';

      // Particle dots riding the wave
      for(let i=0;i<8;i++){
        const px=cw*0.1+i*(cw*0.8/7);
        const py=cy+amp*Math.sin(2*Math.PI*freq*px/(cw)+phase);
        const r=6+3*Math.abs(Math.sin(2*Math.PI*freq*px/(cw)+phase));
        ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);
        const brightness=0.5+0.5*Math.abs(Math.sin(2*Math.PI*freq*px/(cw)+phase));
        ctx.fillStyle=`rgba(255,${120+Math.round(brightness*100)},${200+Math.round(brightness*55)},${0.7+brightness*0.3})`;
        ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;ctx.stroke();
      }
    }

    // HUD
    ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 14px monospace';ctx.textAlign='right';
    ctx.fillText(freq+' Hz',cw-10,22);
    ctx.fillStyle='rgba(200,150,255,0.8)';ctx.font='12px monospace';
    ctx.fillText(noteFromFreq(freq),cw-10,38);
    ctx.textAlign='left';

    // Legend
    const legItems=[{c:'rgba(180,80,255,0.9)',l:'Fundamental (f)'},{c:'rgba(80,200,255,0.7)',l:'2nd Harmonic (2f)'},{c:'rgba(255,180,50,0.7)',l:'3rd Harmonic (3f)'}];
    if(!resonMode) legItems.forEach((item,i)=>{
      ctx.fillStyle=item.c;ctx.fillRect(10,ch-50+i*14,10,3);
      ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='10px monospace';ctx.fillText(item.l,26,ch-47+i*14);
    });
  }

  function animSound(){
    phase+=0.06*(freq/440);
    drawSound();
    animId=requestAnimationFrame(animSound);
  }
  soundUp(); drawSound();
}

// ============================================================
// LENS & MIRROR — IMAGE FORMATION + RAY DIAGRAMS
// ============================================================
function simLens(c,ctx,p){
  let lensType='convex',focalLen=120,objDist=200,running=false;

  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🔭 Lens / Mirror Type</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:6px">
        ${[['Convex Lens','convex','#38bdf8'],['Concave Lens','concave','#a78bfa'],['Concave Mirror','cmirror','#fb923c'],['Convex Mirror','xmirror','#34d399']].map(([l,v,col])=>`<button class="sim-btn" onclick="lensSetType('${v}')" id="lt_${v}" style="flex:1;font-size:11px;background:${lensType===v?col+'55':'var(--card2)'};border:1px solid ${col}66">${l}</button>`).join('')}
      </div>
      ${sliderRow('lens_f','🎯 Focal Length',40,200,120,' px','sv("lens_f"," px");lensUp()')}
      ${sliderRow('lens_obj','📦 Object Distance',60,300,200,' px','sv("lens_obj"," px");lensUp()')}
    </div>
    ${infoCards([{id:'lens_v',val:'--',label:'Image Dist (v)'},{id:'lens_mag',val:'--',label:'Magnification'},{id:'lens_nature',val:'--',label:'Image Nature'}])}
    ${theoryBox('1/f = 1/v − 1/u  (Lens Formula)','Convex lens real, inverted image banata hai (jab u>f). Concave lens hamesha virtual, erect, diminished image banata hai. Mirror formula bhi yahi hai!')}
  `);

  function calcLens(){
    const f=focalLen, u=-objDist;
    let v, mag, nature;
    if(lensType==='convex'){
      v=1/(1/f-1/u);
      mag=-v/u;
      if(v>0){nature='Real, Inverted';}else{nature='Virtual, Erect';}
    } else if(lensType==='concave'){
      v=1/(-1/f-1/u);
      mag=-v/u;
      nature='Virtual, Erect';
    } else if(lensType==='cmirror'){
      v=1/(1/f+1/u);
      mag=-v/u;
      if(v<0){nature='Real, Inverted';}else{nature='Virtual, Erect';}
    } else {
      v=1/(-1/f+1/u);
      mag=-v/u;
      nature='Virtual, Erect';
    }
    if($id('lens_v'))$id('lens_v').textContent=isFinite(v)?v.toFixed(1)+'px':'∞';
    if($id('lens_mag'))$id('lens_mag').textContent=isFinite(mag)?mag.toFixed(2)+'×':'∞';
    if($id('lens_nature'))$id('lens_nature').textContent=nature;
    return {v,mag,nature};
  }

  function lensUp(){focalLen=gv('lens_f');objDist=gv('lens_obj');drawLens();}
  window.lensUp=lensUp;
  window.lensSetType=(t)=>{
    lensType=t;
    document.querySelectorAll('[id^="lt_"]').forEach(b=>{
      b.style.background='var(--card2)';
    });
    const cols={convex:'#38bdf8',concave:'#a78bfa',cmirror:'#fb923c',xmirror:'#34d399'};
    const el=$id('lt_'+t);if(el)el.style.background=cols[t]+'55';
    drawLens();
  };

  function drawLens(){
    const cw=c.width, ch=c.height;
    const {v,mag}=calcLens();

    // Background — dark navy with subtle grid
    ctx.fillStyle='#060d1f'; ctx.fillRect(0,0,cw,ch);
    const bgGrad=ctx.createLinearGradient(0,0,cw,ch);
    bgGrad.addColorStop(0,'rgba(10,30,80,0.7)');bgGrad.addColorStop(1,'rgba(5,15,40,0.7)');
    ctx.fillStyle=bgGrad;ctx.fillRect(0,0,cw,ch);

    // Grid
    ctx.strokeStyle='rgba(56,189,248,0.06)';ctx.lineWidth=1;
    for(let x=0;x<cw;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();}
    for(let y=0;y<ch;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();}

    const cx=cw*0.55, cy=ch/2;
    const isMirror=(lensType==='cmirror'||lensType==='xmirror');

    // Principal axis
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.5;ctx.setLineDash([6,6]);
    ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(cw,cy);ctx.stroke();
    ctx.setLineDash([]);

    // Object arrow
    const ox=cx-objDist;
    const objH=50;
    if(ox>5&&ox<cw-5){
      ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(ox,cy);ctx.lineTo(ox,cy-objH);ctx.stroke();
      // Arrowhead
      ctx.fillStyle='#fbbf24';
      ctx.beginPath();ctx.moveTo(ox,cy-objH);ctx.lineTo(ox-6,cy-objH+12);ctx.lineTo(ox+6,cy-objH+12);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(251,191,36,0.9)';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText('Object',ox,cy-objH-8);
      ctx.textAlign='left';
    }

    // Draw lens or mirror
    if(!isMirror){
      // Lens shape
      const lensH=ch*0.55, lw=lensType==='convex'?22:10;
      ctx.strokeStyle='rgba(56,189,248,0.9)';ctx.lineWidth=2.5;
      ctx.shadowBlur=18;ctx.shadowColor='rgba(56,189,248,0.6)';
      if(lensType==='convex'){
        ctx.beginPath();
        ctx.moveTo(cx,cy-lensH/2);
        ctx.bezierCurveTo(cx+lw*2,cy-lensH/4,cx+lw*2,cy+lensH/4,cx,cy+lensH/2);
        ctx.bezierCurveTo(cx-lw*2,cy+lensH/4,cx-lw*2,cy-lensH/4,cx,cy-lensH/2);
        ctx.strokeStyle='rgba(56,189,248,0.8)';ctx.stroke();
        ctx.fillStyle='rgba(56,189,248,0.08)';ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(cx,cy-lensH/2);
        ctx.bezierCurveTo(cx-lw*3,cy-lensH/4,cx-lw*3,cy+lensH/4,cx,cy+lensH/2);
        ctx.strokeStyle='rgba(167,139,250,0.8)';ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx,cy-lensH/2);
        ctx.bezierCurveTo(cx+lw*3,cy-lensH/4,cx+lw*3,cy+lensH/4,cx,cy+lensH/2);
        ctx.strokeStyle='rgba(167,139,250,0.8)';ctx.stroke();
      }
      ctx.shadowBlur=0;
    } else {
      // Mirror: arc on right side
      const r=focalLen*2;
      const col=lensType==='cmirror'?'#fb923c':'#34d399';
      ctx.strokeStyle=col;ctx.lineWidth=4;
      ctx.shadowBlur=14;ctx.shadowColor=col+'99';
      ctx.beginPath();
      const startA=lensType==='cmirror'?Math.PI*0.6:Math.PI*0.6;
      const curve=lensType==='cmirror'?1:-1;
      ctx.arc(cx+curve*r,cy,r,Math.PI-0.6,Math.PI+0.6);
      ctx.stroke();ctx.shadowBlur=0;
      // Mirror surface lines
      for(let i=0;i<8;i++){
        const a=Math.PI+0.6-i*0.15;
        const sx=cx+curve*r+r*Math.cos(a), sy=cy+r*Math.sin(a);
        const ex=sx+10*Math.cos(a+Math.PI/2), ey=sy+10*Math.sin(a+Math.PI/2);
        ctx.strokeStyle=col+'44';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
      }
    }

    // Focal points
    const fColor='#a78bfa';
    [-1,1].forEach(side=>{
      const fx=cx+side*focalLen;
      ctx.beginPath();ctx.arc(fx,cy,5,0,Math.PI*2);
      ctx.fillStyle=fColor;ctx.fill();
      ctx.fillStyle='rgba(167,139,250,0.9)';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText('F',fx,cy-10);
      ctx.textAlign='left';
    });

    // RAY DRAWING
    const rayY=cy-objH;
    const rays=[
      {col:'#ef4444',dash:[]},
      {col:'#22c55e',dash:[5,3]},
      {col:'#f59e0b',dash:[3,5]},
    ];

    if(isFinite(v)&&!isMirror){
      const imgX=cx+v;
      const imgH=objH*Math.abs(mag)*(mag<0?-1:1);

      // Ray 1: parallel to axis → through far focal point
      const r1=rays[0];
      ctx.strokeStyle=r1.col;ctx.lineWidth=1.8;ctx.setLineDash(r1.dash);
      ctx.beginPath();
      ctx.moveTo(ox>0?ox:0,rayY);
      ctx.lineTo(cx,rayY);
      if(lensType==='convex'){
        ctx.lineTo(imgX<cw?imgX:cw,(imgH<0?cy-Math.abs(imgH):cy+Math.abs(imgH)));
      } else {
        // Diverge toward far F
        ctx.lineTo(cw,(cy+(rayY-cy)*2));
      }
      ctx.stroke();

      // Ray 2: through optical centre → straight
      const r2=rays[1];
      ctx.strokeStyle=r2.col;ctx.lineWidth=1.8;ctx.setLineDash(r2.dash);
      ctx.beginPath();ctx.moveTo(ox>0?ox:0,rayY);ctx.lineTo(cw,cy+(rayY-cy)*(cw-ox)/(cx-ox+cw));ctx.stroke();

      // Ray 3: through near focal point → parallel
      const r3=rays[2];
      ctx.strokeStyle=r3.col;ctx.lineWidth=1.8;ctx.setLineDash(r3.dash);
      ctx.beginPath();
      if(objDist>focalLen){
        ctx.moveTo(ox>0?ox:0,rayY);ctx.lineTo(cx,rayY+(cy-rayY)/(1));
        ctx.lineTo(cw,rayY+(cy-rayY)/(1));
      } else {
        ctx.moveTo(ox>0?ox:0,rayY);ctx.lineTo(cx,cy+(rayY-cy)*0.5);ctx.lineTo(cw,cy+(rayY-cy)*0.5);
      }
      ctx.stroke();
      ctx.setLineDash([]);

      // Image arrow
      if(imgX>10&&imgX<cw-10){
        const imgTop=cy-imgH;
        ctx.strokeStyle='rgba(248,113,113,0.9)';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(imgX,cy);ctx.lineTo(imgX,imgTop);ctx.stroke();
        ctx.fillStyle=v>0?'rgba(248,113,113,0.9)':'rgba(248,113,113,0.4)';
        ctx.beginPath();ctx.moveTo(imgX,imgTop);ctx.lineTo(imgX-5,imgTop+(imgH>0?12:-12));ctx.lineTo(imgX+5,imgTop+(imgH>0?12:-12));ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(252,165,165,0.9)';ctx.font='11px monospace';ctx.textAlign='center';
        ctx.fillText(v>0?'Real Image':'Virtual Image',imgX,imgTop-(imgH>0?12:-12));
        ctx.textAlign='left';
      }
    }
    ctx.setLineDash([]);

    // Labels
    ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold 13px monospace';
    ctx.fillText({convex:'Convex Lens',concave:'Concave Lens',cmirror:'Concave Mirror',xmirror:'Convex Mirror'}[lensType],10,22);

    // Ray legend
    const rleg=[{c:'#ef4444',l:'Parallel ray'},{c:'#22c55e',l:'Through centre'},{c:'#f59e0b',l:'Through focal pt'}];
    rleg.forEach((r,i)=>{
      ctx.fillStyle=r.c;ctx.fillRect(10,ch-55+i*16,16,3);
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='10px monospace';ctx.fillText(r.l,32,ch-51+i*16);
    });
  }

  lensUp();
}

// ============================================================
// HEAT TRANSFER — CONDUCTION / CONVECTION / RADIATION
// ============================================================
function simHeat(c,ctx,p){
  let mode='conduction', tempL=100, tempR=20, running=false, frame=0;
  let particles=[];

  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🌡️ Heat Transfer Mode</div>
      <div class="btn-row" style="gap:6px">
        ${[['🔩 Conduction','conduction','#fb923c'],['🌊 Convection','convection','#38bdf8'],['☀️ Radiation','radiation','#fbbf24']].map(([l,v,col])=>`<button class="sim-btn" onclick="heatMode('${v}')" id="hm_${v}" style="flex:1;font-size:11px;background:${mode===v?col+'55':'var(--card2)'};border:1px solid ${col}66">${l}</button>`).join('')}
      </div>
      ${sliderRow('heat_tL','🔴 Hot Temp',40,200,100,' °C','sv("heat_tL"," °C");heatUp()')}
      ${sliderRow('heat_tR','🔵 Cold Temp',0,80,20,' °C','sv("heat_tR"," °C");heatUp()')}
    </div>
    ${btnRow([{cls:'btn-start',fn:'heatToggle()',label:'▶ Animate'},{cls:'btn-reset',fn:'heatReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'heat_flux',val:'--',label:'Heat Flux'},{id:'heat_delta',label:'ΔT (°C)',val:'80'},{id:'heat_mode',val:'Conduction',label:'Mode'}])}
    ${theoryBox('Q/t = kA(ΔT/d)  |  Q = σεAT⁴','Conduction: atoms vibrate kar energy pass karte hain (metals best). Convection: fluid move karke heat le jaata hai. Radiation: electromagnetic waves se — vacuum mein bhi kaam karta hai (Sun se Earth tak)!')}
  `);

  function heatUp(){tempL=gv('heat_tL');tempR=gv('heat_tR');if($id('heat_delta'))$id('heat_delta').textContent=(tempL-tempR).toFixed(0);drawHeat();}
  window.heatUp=heatUp;
  window.heatMode=(m)=>{
    mode=m;running=false;stopSim();frame=0;particles=[];
    const cols={conduction:'#fb923c',convection:'#38bdf8',radiation:'#fbbf24'};
    document.querySelectorAll('[id^="hm_"]').forEach(b=>{b.style.background='var(--card2)';});
    const el=$id('hm_'+m);if(el)el.style.background=cols[m]+'55';
    if($id('heat_mode'))$id('heat_mode').textContent=m.charAt(0).toUpperCase()+m.slice(1);
    const fluxMap={conduction:'High',convection:'Medium',radiation:'Low'};
    if($id('heat_flux'))$id('heat_flux').textContent=fluxMap[m];
    initParticles(); drawHeat();
  };
  window.heatToggle=()=>{
    if(running){stopSim();running=false;}
    else{running=true;animId=requestAnimationFrame(animHeat);}
  };
  window.heatReset=()=>{stopSim();running=false;frame=0;initParticles();drawHeat();};

  function initParticles(){
    particles=[];
    if(mode==='convection'){
      for(let i=0;i<30;i++){
        particles.push({
          x:20+Math.random()*(c.width-40),
          y:c.height*0.3+Math.random()*c.height*0.5,
          vx:(Math.random()-0.5)*0.5,
          vy:-0.2-Math.random()*0.5,
          temp:tempL*(0.3+Math.random()*0.7),
          r:5+Math.random()*4
        });
      }
    }
  }

  function tempColor(t, maxT){
    const ratio=Math.max(0,Math.min(1,(t-tempR)/(maxT-tempR)));
    const r=Math.round(20+ratio*235);
    const g=Math.round(100-ratio*80);
    const b=Math.round(220-ratio*200);
    return `rgb(${r},${g},${b})`;
  }

  function drawHeat(){
    const cw=c.width, ch=c.height;
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);

    if(mode==='conduction'){
      // Metal rod with temperature gradient
      const rodX=cw*0.1, rodW=cw*0.8, rodY=ch*0.4, rodH=ch*0.18;
      // Temperature gradient along rod
      for(let x=0;x<rodW;x++){
        const ratio=x/rodW;
        const t=tempL+(tempR-tempL)*ratio;
        const col=tempColor(t, tempL);
        ctx.fillStyle=col;
        ctx.fillRect(rodX+x,rodY,1,rodH);
      }
      // Rod border
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
      ctx.strokeRect(rodX,rodY,rodW,rodH);

      // Animated vibrating atoms
      const nAtoms=12;
      for(let i=0;i<=nAtoms;i++){
        const ratio=i/nAtoms;
        const t=tempL+(tempR-tempL)*ratio;
        const vib=((t-tempR)/(tempL-tempR+0.01))*8;
        const ax=rodX+ratio*rodW;
        const ay=rodY+rodH/2+(running?Math.sin(frame*0.15*t/20+i*1.1)*vib:0);
        ctx.beginPath();ctx.arc(ax,ay,5+vib*0.4,0,Math.PI*2);
        ctx.fillStyle=tempColor(t,tempL);
        ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();
        // Bond lines
        if(i<nAtoms){
          ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1.5;
          ctx.beginPath();ctx.moveTo(ax,ay);
          const nx=rodX+(ratio+1/nAtoms)*rodW;
          ctx.lineTo(nx,ay);ctx.stroke();
        }
      }

      // Heat arrows from hot end
      for(let a=0;a<4;a++){
        const ay2=rodY+rodH*0.2+a*(rodH*0.2);
        const progress=(frame*0.008+a*0.25)%1;
        const ax2=rodX+progress*rodW;
        ctx.fillStyle=`rgba(255,150,50,${0.7-progress*0.5})`;
        ctx.beginPath();ctx.moveTo(ax2,ay2);ctx.lineTo(ax2-8,ay2-5);ctx.lineTo(ax2-8,ay2+5);ctx.closePath();ctx.fill();
      }

      // Temperature labels
      ctx.fillStyle='#ff4500';ctx.font='bold 14px monospace';ctx.textAlign='center';
      ctx.fillText(tempL+'°C',rodX,rodY-10);
      ctx.fillStyle='#4a90d9';
      ctx.fillText(tempR+'°C',rodX+rodW,rodY-10);
      ctx.textAlign='left';

      // Color bar legend at bottom
      const barX=cw*0.1,barW=cw*0.8,barY=ch*0.82,barH=14;
      for(let x=0;x<barW;x++){ctx.fillStyle=tempColor(tempL+(tempR-tempL)*(x/barW),tempL);ctx.fillRect(barX+x,barY,1,barH);}
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,barH);
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='11px monospace';
      ctx.textAlign='center';ctx.fillText('HOT → COLD temperature gradient',cw/2,barY+barH+16);
      ctx.textAlign='left';

    } else if(mode==='convection'){
      // Fluid container
      const fx=cw*0.1,fw=cw*0.8,fy=ch*0.15,fh=ch*0.65;
      // Background fluid
      ctx.fillStyle='rgba(10,20,50,0.9)';ctx.fillRect(fx,fy,fw,fh);
      ctx.strokeStyle='rgba(100,180,255,0.5)';ctx.lineWidth=2;ctx.strokeRect(fx,fy,fw,fh);

      // Heat source at bottom
      const heatGrad=ctx.createLinearGradient(fx,fy+fh,fx,fy+fh*0.7);
      heatGrad.addColorStop(0,'rgba(255,80,0,0.7)');heatGrad.addColorStop(1,'rgba(255,80,0,0)');
      ctx.fillStyle=heatGrad;ctx.fillRect(fx,fy,fw,fh);

      // Convection current arrows (circular flow)
      if(running){
        const cxf=fx+fw/2,cyf=fy+fh/2;
        const t2=frame*0.02;
        ctx.strokeStyle='rgba(255,200,80,0.4)';ctx.lineWidth=2;
        // Left loop
        ctx.beginPath();
        for(let a=0;a<Math.PI*2;a+=0.05){
          const rx=cxf-fw*0.22+Math.cos(a+t2)*fw*0.18;
          const ry=cyf+Math.sin(a+t2)*fh*0.32;
          a<0.05?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
        }ctx.stroke();
        // Right loop
        ctx.beginPath();
        for(let a=0;a<Math.PI*2;a+=0.05){
          const rx=cxf+fw*0.22+Math.cos(-a+t2)*fw*0.18;
          const ry=cyf+Math.sin(-a+t2)*fh*0.32;
          a<0.05?ctx.moveTo(rx,ry):ctx.lineTo(rx,ry);
        }ctx.stroke();
      }

      // Particles
      particles.forEach(pt=>{
        if(running){
          pt.y+=pt.vy;pt.x+=pt.vx;
          pt.temp=pt.temp+(tempL-pt.temp)*0.005;
          if(pt.y<fy+5){pt.y=fy+fh-5;pt.temp=tempL*0.9;}
          if(pt.y>fy+fh-5){pt.y=fy+5;pt.vy=-Math.abs(pt.vy);}
          if(pt.x<fx+5||pt.x>fx+fw-5)pt.vx*=-1;
        }
        ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
        ctx.fillStyle=tempColor(pt.temp,tempL)+'cc';ctx.fill();
        ctx.strokeStyle=tempColor(pt.temp,tempL);ctx.lineWidth=1;ctx.stroke();
      });

      // Labels
      ctx.fillStyle='#ff6b35';ctx.font='bold 12px monospace';ctx.textAlign='center';
      ctx.fillText('🔥 HEAT SOURCE ('+tempL+'°C)',fx+fw/2,fy+fh+18);
      ctx.fillStyle='rgba(180,220,255,0.8)';ctx.font='11px monospace';
      ctx.fillText('Hot fluid rises → cools → sinks → repeats',fx+fw/2,fy-8);
      ctx.textAlign='left';

    } else {
      // RADIATION — sun-like source radiating waves
      const sunX=cw*0.2, sunY=ch*0.4, objX=cw*0.78, objY=ch*0.4;

      // Draw sun
      const t3=frame*0.05;
      for(let r=0;r<3;r++){
        ctx.beginPath();ctx.arc(sunX,sunY,35+r*8+(running?Math.sin(t3)*4:0),0,Math.PI*2);
        ctx.fillStyle=`rgba(255,${200-r*50},0,${0.15-r*0.03})`;ctx.fill();
      }
      ctx.beginPath();ctx.arc(sunX,sunY,28,0,Math.PI*2);
      ctx.fillStyle='#fbbf24';ctx.fill();
      ctx.strokeStyle='#fde68a';ctx.lineWidth=2;ctx.stroke();
      // Rays
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4+(running?t3*0.3:0);
        ctx.strokeStyle='rgba(251,191,36,0.7)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(sunX+35*Math.cos(a),sunY+35*Math.sin(a));ctx.lineTo(sunX+55*Math.cos(a),sunY+55*Math.sin(a));ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText('Source ('+tempL+'°C)',sunX,sunY+65);

      // Radiation waves (EM waves)
      const nWaves=5;
      for(let w=0;w<nWaves;w++){
        const wProgress=(((frame*0.015+w/nWaves))%1);
        const wx=sunX+60+(objX-sunX-80)*wProgress;
        const alpha=0.8-wProgress*0.5;
        ctx.strokeStyle=`rgba(255,${180+Math.round(75*wProgress)},50,${alpha})`;
        ctx.lineWidth=1.5;
        ctx.beginPath();
        const wAmp=12;
        for(let x=0;x<30;x++){
          const px=wx-15+x;
          const py=sunY+wAmp*Math.sin(x*0.5);
          x===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
        }ctx.stroke();
        // Photon glow
        ctx.beginPath();ctx.arc(wx,sunY,4,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,220,80,${alpha*0.9})`;ctx.fill();
      }

      // Object receiving heat
      const objW=50, objH2=80;
      const heatRatio=(tempL-20)/(200-20);
      const objGrad=ctx.createLinearGradient(objX,objY-objH2/2,objX,objY+objH2/2);
      objGrad.addColorStop(0,tempColor(tempR+(tempL-tempR)*heatRatio,tempL));
      objGrad.addColorStop(1,tempColor(tempR,tempL));
      ctx.fillStyle=objGrad;ctx.fillRect(objX-objW/2,objY-objH2/2,objW,objH2);
      ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.strokeRect(objX-objW/2,objY-objH2/2,objW,objH2);
      ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='11px monospace';ctx.textAlign='center';
      ctx.fillText('Object',objX,objY+objH2/2+16);
      ctx.fillText('(absorbs radiation)',objX,objY+objH2/2+30);

      // Stefan-Boltzmann label
      ctx.fillStyle='rgba(251,191,36,0.8)';ctx.font='11px monospace';
      ctx.fillText('Q = σεAT⁴',cw/2,ch*0.82);
      ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='10px monospace';
      ctx.fillText('No medium needed — works in vacuum!',cw/2,ch*0.88);
      ctx.textAlign='left';

      // Vacuum label
      ctx.fillStyle='rgba(100,100,150,0.7)';ctx.font='10px monospace';
      ctx.fillText('— VACUUM —',cw*0.45,ch*0.55);
    }

    // Mode badge
    const modeColors={conduction:'#fb923c',convection:'#38bdf8',radiation:'#fbbf24'};
    ctx.fillStyle=modeColors[mode]+'33';ctx.beginPath();ctx.roundRect(10,8,130,24,8);ctx.fill();
    ctx.fillStyle=modeColors[mode];ctx.font='bold 12px monospace';ctx.textAlign='left';
    ctx.fillText(mode.toUpperCase(),18,25);
  }

  function animHeat(){frame++;drawHeat();animId=requestAnimationFrame(animHeat);}
  initParticles();heatUp();
}

// ============================================================
// NEWTON'S LAWS OF MOTION — F = ma INTERACTIVE
// ============================================================
function simNewton(c,ctx,p){
  let mass=5, force=20, friction=0.1, law=1, running=false;
  let boxX, boxVx=0, boxAx=0, frame=0, trail=[];

  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">📜 Newton's Law</div>
      <div class="btn-row" style="gap:6px">
        ${[['1st Law','1','#34d399'],['2nd Law','2','#38bdf8'],['3rd Law','3','#f472b6']].map(([l,v,col])=>`<button class="sim-btn" onclick="newtonLaw('${v}')" id="nl_${v}" style="flex:1;font-size:12px;background:${law==v?col+'55':'var(--card2)'};border:1px solid ${col}66">${l}</button>`).join('')}
      </div>
    </div>
    ${sliderRow('nwt_mass','⚖️ Mass (kg)',1,20,5,' kg','sv("nwt_mass"," kg");newtonUp()')}
    ${sliderRow('nwt_force','💪 Force (N)',0,100,20,' N','sv("nwt_force"," N");newtonUp()')}
    ${sliderRow('nwt_friction','🧱 Friction',0,0.5,0.1,'','sv("nwt_friction","");newtonUp()')}
    ${btnRow([{cls:'btn-start',fn:'newtonStart()',label:'▶ Apply Force'},{cls:'btn-reset',fn:'newtonReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'nwt_a',val:'4.0',label:'a (m/s²)'},{id:'nwt_v',val:'0',label:'v (m/s)'},{id:'nwt_f',val:'20',label:'F_net (N)'}])}
    ${theoryBox('F = ma  |  a = (F−f)/m','1st Law: koi force nahi → object apni halat mein rehta hai. 2nd Law: F=ma → zyada force, zyada acceleration. 3rd Law: har action ka equal & opposite reaction hota hai.')}
  `);

  function newtonUp(){
    mass=gv('nwt_mass');force=gv('nwt_force');friction=gv('nwt_friction');
    const fNet=Math.max(0,force-friction*mass*9.8);
    const a=fNet/mass;
    if($id('nwt_a'))$id('nwt_a').textContent=a.toFixed(2);
    if($id('nwt_f'))$id('nwt_f').textContent=fNet.toFixed(1);
    if(!running)drawNewton();
  }
  window.newtonUp=newtonUp;
  window.newtonLaw=(l)=>{
    law=parseInt(l);
    running=false;stopSim();boxVx=0;trail=[];
    const cols={1:'#34d399',2:'#38bdf8',3:'#f472b6'};
    document.querySelectorAll('[id^="nl_"]').forEach(b=>{b.style.background='var(--card2)';});
    const el=$id('nl_'+l);if(el)el.style.background=cols[l]+'55';
    drawNewton();
  };
  window.newtonStart=()=>{
    if(running){stopSim();running=false;}
    else{running=true;animId=requestAnimationFrame(animNewton);}
  };
  window.newtonReset=()=>{stopSim();running=false;boxVx=0;boxX=undefined;trail=[];if($id('nwt_v'))$id('nwt_v').textContent='0';drawNewton();};

  function drawNewton(){
    const cw=c.width, ch=c.height;
    ctx.fillStyle='#080f1e';ctx.fillRect(0,0,cw,ch);

    // Ground with texture
    const groundY=ch*0.72;
    const groundGrad=ctx.createLinearGradient(0,groundY,0,ch);
    groundGrad.addColorStop(0,'#1a2a1a');groundGrad.addColorStop(1,'#0d1a0d');
    ctx.fillStyle=groundGrad;ctx.fillRect(0,groundY,cw,ch-groundY);

    // Ground texture lines
    for(let x=0;x<cw;x+=20){
      ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,groundY);ctx.lineTo(x,groundY+8);ctx.stroke();
    }
    ctx.strokeStyle='rgba(100,200,100,0.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(cw,groundY);ctx.stroke();

    if(law===1){
      // 1st Law: inertia demo — object moving, then force applied
      if(boxX===undefined)boxX=cw*0.15;
      const bw=60, bh=45;
      const by=groundY-bh;

      // Trail
      ctx.strokeStyle='rgba(52,211,153,0.25)';ctx.lineWidth=2;
      if(trail.length>1){ctx.beginPath();trail.forEach((p,i)=>i===0?ctx.moveTo(p,by+bh/2):ctx.lineTo(p,by+bh/2));ctx.stroke();}

      // Box
      const boxGrad=ctx.createLinearGradient(boxX,by,boxX+bw,by+bh);
      boxGrad.addColorStop(0,'#34d399');boxGrad.addColorStop(1,'#059669');
      ctx.fillStyle=boxGrad;ctx.beginPath();ctx.roundRect(boxX,by,bw,bh,8);ctx.fill();
      ctx.strokeStyle='#6ee7b7';ctx.lineWidth=2;ctx.stroke();

      // Mass label
      ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';
      ctx.fillText(mass+'kg',boxX+bw/2,by+bh/2+5);

      // Velocity arrow
      if(Math.abs(boxVx)>0.1){
        const arrowLen=Math.min(Math.abs(boxVx)*10,80);
        ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(boxX+bw,by+bh/2);ctx.lineTo(boxX+bw+arrowLen,by+bh/2);ctx.stroke();
        ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.moveTo(boxX+bw+arrowLen,by+bh/2);ctx.lineTo(boxX+bw+arrowLen-10,by+bh/2-6);ctx.lineTo(boxX+bw+arrowLen-10,by+bh/2+6);ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(251,191,36,0.9)';ctx.font='11px monospace';ctx.fillText('v='+boxVx.toFixed(1)+' m/s',boxX+bw+5,by-8);
      }

      // Force text
      ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='13px monospace';
      ctx.fillText(force===0?'No Force Applied → Object stays at rest or constant velocity!':'Force applied → Object accelerates (2nd Law activates)',cw/2,groundY+24);
      ctx.textAlign='left';

    } else if(law===2){
      // 2nd Law: F=ma, show force vector & acceleration
      if(boxX===undefined)boxX=cw*0.1;
      const bw=55+mass*1.5, bh=40+mass*1;
      const by=groundY-bh;
      const fNet=Math.max(0,force-friction*mass*9.8);
      const accel=fNet/mass;

      // Trail
      ctx.strokeStyle='rgba(56,189,248,0.2)';ctx.lineWidth=2;
      if(trail.length>1){ctx.beginPath();trail.forEach((t2,i)=>i===0?ctx.moveTo(t2,by+bh/2):ctx.lineTo(t2,by+bh/2));ctx.stroke();}

      // Box (size reflects mass)
      const bg2=ctx.createLinearGradient(boxX,by,boxX,by+bh);
      bg2.addColorStop(0,'#38bdf8');bg2.addColorStop(1,'#0284c7');
      ctx.fillStyle=bg2;ctx.beginPath();ctx.roundRect(boxX,by,bw,bh,8);ctx.fill();
      ctx.strokeStyle='#7dd3fc';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText(mass+'kg',boxX+bw/2,by+bh/2+5);

      // Force arrow (red, input)
      const fScale=Math.min(force*1.5,cw*0.3);
      if(force>0){
        ctx.strokeStyle='#ef4444';ctx.lineWidth=4;
        ctx.beginPath();ctx.moveTo(boxX-10,by+bh/2);ctx.lineTo(boxX-10-fScale,by+bh/2);ctx.stroke();
        ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(boxX-10,by+bh/2);ctx.lineTo(boxX-22,by+bh/2-7);ctx.lineTo(boxX-22,by+bh/2+7);ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(252,165,165,0.9)';ctx.font='bold 12px monospace';ctx.fillText('F='+force+'N',boxX-10-fScale*0.5,by-8);
      }

      // Friction arrow (opposing)
      if(running&&friction>0&&boxVx>0.1){
        const fFric=friction*mass*9.8;
        ctx.strokeStyle='#f59e0b';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(boxX,by+bh+6);ctx.lineTo(boxX-Math.min(fFric*4,60),by+bh+6);ctx.stroke();
        ctx.fillStyle='rgba(245,158,11,0.9)';ctx.font='11px monospace';ctx.fillText('f='+fFric.toFixed(1)+'N',boxX-50,by+bh+22);
      }

      // Acceleration arrow
      const aScale=Math.min(accel*8,cw*0.25);
      ctx.strokeStyle='#22c55e';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(boxX+bw,by+bh/2);ctx.lineTo(boxX+bw+aScale,by+bh/2);ctx.stroke();
      ctx.fillStyle='#22c55e';ctx.beginPath();ctx.moveTo(boxX+bw+aScale,by+bh/2);ctx.lineTo(boxX+bw+aScale-8,by+bh/2-5);ctx.lineTo(boxX+bw+aScale-8,by+bh/2+5);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(34,197,94,0.9)';ctx.font='bold 12px monospace';ctx.textAlign='center';
      ctx.fillText('a='+accel.toFixed(2)+'m/s²',boxX+bw+aScale/2,by-8);

      // F=ma equation display
      ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 16px monospace';
      ctx.fillText(force+'N = '+mass+'kg × '+accel.toFixed(2)+'m/s²',cw/2,groundY+24);
      ctx.textAlign='left';

    } else {
      // 3rd Law: Action-Reaction (two blocks pushing each other)
      const b1x=cw*0.25, b2x=cw*0.58;
      const bw2=55,bh2=45,by2=groundY-bh2;

      // Block 1
      ctx.fillStyle='#f472b6';ctx.beginPath();ctx.roundRect(b1x,by2,bw2,bh2,8);ctx.fill();
      ctx.strokeStyle='#f9a8d4';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText('Block A',b1x+bw2/2,by2+bh2/2+5);

      // Block 2
      ctx.fillStyle='#a78bfa';ctx.beginPath();ctx.roundRect(b2x,by2,bw2,bh2,8);ctx.fill();
      ctx.strokeStyle='#c4b5fd';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.fillText('Block B',b2x+bw2/2,by2+bh2/2+5);
      ctx.textAlign='left';

      // Action arrow (A → B)
      const t4=running?frame*0.05:0;
      const arrowPulse=2+Math.sin(t4)*1.5;
      ctx.strokeStyle='#ef4444';ctx.lineWidth=arrowPulse+1.5;
      ctx.beginPath();ctx.moveTo(b1x+bw2,by2+bh2/2);ctx.lineTo(b2x-5,by2+bh2/2);ctx.stroke();
      ctx.fillStyle='#ef4444';ctx.beginPath();ctx.moveTo(b2x-5,by2+bh2/2);ctx.lineTo(b2x-18,by2+bh2/2-7);ctx.lineTo(b2x-18,by2+bh2/2+7);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(252,165,165,0.9)';ctx.font='bold 11px monospace';ctx.textAlign='center';
      ctx.fillText('ACTION →',b1x+bw2+(b2x-b1x-bw2)/2,by2+bh2/2-12);

      // Reaction arrow (B → A)
      ctx.strokeStyle='#22c55e';ctx.lineWidth=arrowPulse+1.5;
      ctx.beginPath();ctx.moveTo(b2x,by2+bh2*0.7);ctx.lineTo(b1x+bw2+5,by2+bh2*0.7);ctx.stroke();
      ctx.fillStyle='#22c55e';ctx.beginPath();ctx.moveTo(b1x+bw2+5,by2+bh2*0.7);ctx.lineTo(b1x+bw2+18,by2+bh2*0.7-7);ctx.lineTo(b1x+bw2+18,by2+bh2*0.7+7);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(134,239,172,0.9)';ctx.font='bold 11px monospace';
      ctx.fillText('← REACTION',b1x+bw2+(b2x-b1x-bw2)/2,by2+bh2*0.7+18);

      // Labels
      ctx.fillStyle='#ef4444';ctx.font='12px monospace';ctx.fillText('F_AB = '+force+'N →',b1x,groundY+18);
      ctx.fillStyle='#22c55e';ctx.fillText('← F_BA = '+force+'N (equal & opposite)',b2x-50,groundY+35);
      ctx.textAlign='left';

      // Example: rocket
      if(running){
        ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px monospace';ctx.textAlign='center';
        ctx.fillText('🚀 Like a Rocket — Gas pushed back → Rocket goes forward!',cw/2,groundY+55);
        ctx.textAlign='left';
      }
    }
  }

  function animNewton(){
    frame++;
    const fNet=Math.max(0,force-friction*mass*9.8);
    const accel=fNet/mass;
    if(boxX===undefined)boxX=law===2?c.width*0.1:c.width*0.15;
    boxAx=accel;
    if(law<3){
      boxVx+=boxAx*0.016;
      boxVx*=(1-friction*0.05);
      boxX+=boxVx;
      trail.push(boxX);
      if(trail.length>80)trail.shift();
      if($id('nwt_v'))$id('nwt_v').textContent=Math.abs(boxVx).toFixed(2);
      if(boxX>c.width+100){boxX=0;trail=[];}
    }
    drawNewton();
    animId=requestAnimationFrame(animNewton);
  }
  newtonUp();
}

// ============================================================
// WORK, ENERGY & POWER — ROLLER COASTER KE/PE CONVERTER
// ============================================================
function simEnergy(c,ctx,p){
  let running=false, frame=0, pos=0, speed=1;
  let mass=10, initH=200;

  // Track definition: array of [x_frac, y_frac] normalized to canvas
  const trackPts=[
    [0.03,0.18],[0.12,0.18],[0.22,0.72],[0.35,0.58],[0.48,0.72],
    [0.60,0.40],[0.72,0.72],[0.84,0.62],[0.94,0.72],[0.98,0.72]
  ];

  panel(`
    ${sliderRow('en_mass','⚖️ Mass (kg)',1,30,10,' kg','sv("en_mass"," kg");energyUp()')}
    ${sliderRow('en_h','🏔️ Start Height',100,280,200,' m','sv("en_h"," m");energyUp()')}
    ${sliderRow('en_speed','⚡ Cart Speed',0.3,3,1,'×','sv("en_speed","×");energyUp()')}
    ${btnRow([{cls:'btn-start',fn:'energyToggle()',label:'🎢 Launch!'},{cls:'btn-reset',fn:'energyReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'en_ke',val:'0',label:'KE (kJ)'},{id:'en_pe',val:'--',label:'PE (kJ)'},{id:'en_total',val:'--',label:'Total E (kJ)'}])}
    ${theoryBox('KE = ½mv²  |  PE = mgh  |  KE+PE = E_total','Energy conservation! Jab cart upar hoti hai — PE zyada, KE kam. Neechay girti hai — KE zyada, PE kam. Total energy (without friction) HAMESHA same rehti hai!')}
  `);

  function energyUp(){mass=gv('en_mass');initH=gv('en_h');speed=gv('en_speed');if(!running)drawEnergy(0);}
  window.energyUp=energyUp;
  window.energyToggle=()=>{
    if(running){stopSim();running=false;}
    else{running=true;pos=0;animId=requestAnimationFrame(animEnergy);}
  };
  window.energyReset=()=>{stopSim();running=false;pos=0;drawEnergy(0);};

  function getTrackPoint(t){
    // t in [0,1], returns {x,y,h} on canvas
    const n=trackPts.length;
    const idx=Math.floor(t*(n-1));
    const lo=Math.min(idx,n-2), hi=lo+1;
    const frac=t*(n-1)-lo;
    const cw=c.width, ch=c.height;
    const groundY=ch*0.78;
    const x=cw*(trackPts[lo][0]*(1-frac)+trackPts[hi][0]*frac);
    const rawY=ch*(trackPts[lo][1]*(1-frac)+trackPts[hi][1]*frac);
    const h_px=groundY-rawY;
    const h_m=(h_px/groundY)*initH;
    return {x, y:rawY, h_m};
  }

  function drawEnergy(t2){
    const cw=c.width, ch=c.height;
    const groundY=ch*0.78;
    const maxH=initH;

    // Sky gradient
    const sky=ctx.createLinearGradient(0,0,0,groundY);
    sky.addColorStop(0,'#0c1445');sky.addColorStop(0.6,'#1a3a6e');sky.addColorStop(1,'#2d5a8e');
    ctx.fillStyle=sky;ctx.fillRect(0,0,cw,groundY);
    // Ground
    const ground=ctx.createLinearGradient(0,groundY,0,ch);
    ground.addColorStop(0,'#2d5a1e');ground.addColorStop(1,'#1a3a0e');
    ctx.fillStyle=ground;ctx.fillRect(0,groundY,cw,ch-groundY);

    // Clouds
    [[0.15,0.1],[0.55,0.07],[0.80,0.13]].forEach(([cx2,cy2])=>{
      for(let r=0;r<3;r++){
        ctx.beginPath();ctx.arc(cw*cx2+r*18,ch*cy2,16+r*6,0,Math.PI*2);
        ctx.fillStyle='rgba(200,220,255,0.12)';ctx.fill();
      }
    });

    // Track rails
    ctx.strokeStyle='#94a3b8';ctx.lineWidth=4;
    ctx.beginPath();
    for(let i=0;i<=100;i++){
      const {x,y}=getTrackPoint(i/100);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }ctx.stroke();
    // Track shadow
    ctx.strokeStyle='rgba(30,40,70,0.4)';ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<=100;i++){
      const {x,y}=getTrackPoint(i/100);
      i===0?ctx.moveTo(x,y+4):ctx.lineTo(x,y+4);
    }ctx.stroke();

    // Track ties (cross bars)
    for(let i=0;i<=40;i++){
      const {x,y}=getTrackPoint(i/40);
      ctx.strokeStyle='rgba(100,80,40,0.6)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.stroke();
    }

    // Height markers
    for(let h=0;h<=maxH;h+=50){
      const py=groundY-(h/maxH)*(groundY-ch*0.1);
      ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;ctx.setLineDash([4,8]);
      ctx.beginPath();ctx.moveTo(0,py);ctx.lineTo(cw,py);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='10px monospace';ctx.textAlign='left';
      ctx.fillText(h+'m',2,py-2);
    }

    // Cart + cart physics
    const {x:cx3,y:cy3,h_m}=getTrackPoint(Math.min(t2,0.999));
    const g=9.8;
    const h0=initH;
    const pe=mass*g*Math.max(h_m,0);
    const totalE=mass*g*h0;
    const ke=Math.max(0,totalE-pe);
    const v=Math.sqrt(2*ke/mass);

    if($id('en_pe'))$id('en_pe').textContent=(pe/1000).toFixed(1);
    if($id('en_ke'))$id('en_ke').textContent=(ke/1000).toFixed(1);
    if($id('en_total'))$id('en_total').textContent=(totalE/1000).toFixed(1);

    // Energy bar visualization
    const barX=cw-70, barY=ch*0.1, barW=22, barH=groundY-ch*0.12;
    // PE bar
    const peFrac=pe/totalE;
    const keFrac=ke/totalE;
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(barX,barY,barW,barH);
    ctx.fillStyle='rgba(56,189,248,0.85)';ctx.fillRect(barX,barY+barH*(1-peFrac),barW,barH*peFrac);
    ctx.fillStyle='rgba(244,114,182,0.85)';ctx.fillRect(barX,barY+barH*(1-peFrac)-barH*keFrac,barW,barH*keFrac);
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,barH);
    ctx.fillStyle='rgba(56,189,248,0.9)';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText('PE',barX+barW/2,barY+barH+12);
    ctx.fillStyle='rgba(244,114,182,0.9)';ctx.fillText('KE',barX+barW/2,barY+barH+24);
    ctx.textAlign='left';

    // Cart body
    const cartW=36, cartH=20;
    // Determine track angle for cart tilt
    const p1=getTrackPoint(Math.max(0,t2-0.01));
    const p2=getTrackPoint(Math.min(1,t2+0.01));
    const angle=Math.atan2(p2.y-p1.y,p2.x-p1.x);

    ctx.save();ctx.translate(cx3,cy3-cartH/2);ctx.rotate(angle);
    // Cart gradient
    const cartGrad=ctx.createLinearGradient(-cartW/2,-cartH,cartW/2,cartH);
    cartGrad.addColorStop(0,'#f472b6');cartGrad.addColorStop(1,'#be185d');
    ctx.fillStyle=cartGrad;ctx.beginPath();ctx.roundRect(-cartW/2,-cartH,cartW,cartH,5);ctx.fill();
    ctx.strokeStyle='#fbcfe8';ctx.lineWidth=1.5;ctx.stroke();
    // Wheels
    [-cartW*0.3,cartW*0.3].forEach(wx=>{
      ctx.beginPath();ctx.arc(wx,0,6,0,Math.PI*2);
      ctx.fillStyle='#1e293b';ctx.fill();
      ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.stroke();
      ctx.beginPath();ctx.arc(wx,0,2,0,Math.PI*2);
      ctx.fillStyle='#64748b';ctx.fill();
    });
    ctx.restore();

    // Speed glow under cart
    const glow=ctx.createRadialGradient(cx3,cy3,0,cx3,cy3,30+v*2);
    glow.addColorStop(0,`rgba(244,114,182,${Math.min(0.6,v*0.1)})`);
    glow.addColorStop(1,'transparent');
    ctx.fillStyle=glow;ctx.fillRect(cx3-60,cy3-20,120,40);

    // Velocity label
    if(t2>0.01){
      ctx.fillStyle='rgba(251,191,36,0.9)';ctx.font='bold 12px monospace';ctx.textAlign='center';
      ctx.fillText('v = '+v.toFixed(1)+' m/s',cx3,cy3-30);
      ctx.textAlign='left';
    }

    // KE/PE annotations at current position
    ctx.fillStyle='rgba(56,189,248,0.85)';ctx.font='11px monospace';ctx.textAlign='center';
    ctx.fillText('PE='+Math.round(pe/1000)+'kJ',cx3,cy3+25);
    ctx.fillStyle='rgba(244,114,182,0.85)';
    ctx.fillText('KE='+Math.round(ke/1000)+'kJ',cx3,cy3+40);
    ctx.textAlign='left';
  }

  function animEnergy(){
    frame++;
    pos+=0.003*speed;
    if(pos>1){pos=0;}
    drawEnergy(pos);
    animId=requestAnimationFrame(animEnergy);
  }
  energyUp();
}

    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);

    m.bondPairs.forEach(([a,b2],bi)=>{
      const at1=m.atoms[a],at2=m.atoms[b2];
      const btype=m.bondType[bi];

        // Double bond — two parallel lines
        const dx=at2.x-at1.x,dy=at2.y-at1.y;
        const len=Math.sqrt(dx*dx+dy*dy)||1;
        const nx=-dy/len*3,ny=dx/len*3;
        [[-1,1],[1,-1]].forEach(([s])=>{
          ctx.beginPath();ctx.moveTo(at1.x+nx*s,at1.y+ny*s);ctx.lineTo(at2.x+nx*s,at2.y+ny*s);
          ctx.strokeStyle=m.color+'cc';ctx.lineWidth=2;ctx.stroke();

        ctx.beginPath();ctx.moveTo(at1.x,at1.y);ctx.lineTo(at2.x,at2.y);
        ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2.5;ctx.stroke();
      }
    });
    // Atoms
    m.atoms.forEach(at=>{
      const grad=ctx.createRadialGradient(at.x-at.r*0.35,at.y-at.r*0.35,0,at.x,at.y,at.r);
      grad.addColorStop(0,'#fff');grad.addColorStop(0.3,at.col);grad.addColorStop(1,at.col+'55');
      ctx.beginPath();ctx.arc(at.x,at.y,at.r,0,Math.PI*2);
      ctx.fillStyle=grad;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font=`bold ${at.r>14?13:10}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(at.el,at.x,at.y);
    });
    ctx.restore();
    // Molecule name label
    ctx.fillStyle=m.color;ctx.font='bold 16px var(--font)';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText(m.name+' — '+m.formula,cw/2,ch*0.88);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px monospace';
    ctx.fillText('Type: '+m.type+'  |  Bond: '+m.bonds,cw/2,ch*0.94);
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    rot+=0.008;
  }
  function animHC(){drawHC();if(running)animId=requestAnimationFrame(animHC);}

}

function simReactivity(c,ctx,p){
  const metals=[

    {name:'Zinc',sym:'Zn',rank:4,color:'#74c0fc',acid_rxn:'Moderate. Zn + 2HCl → ZnCl₂ + H₂↑',h2_speed:2,flames:false},
    {name:'Iron',sym:'Fe',rank:5,color:'#e8590c',acid_rxn:'Slow. Fe + 2HCl → FeCl₂ + H₂↑',h2_speed:1.2,flames:false},

  ];
  let selMetal=2,reacting=false,bubbles=[],frame2=0;
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">⚗️ Metal Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:5px">
        ${metals.map((m,i)=>`<button class="sim-btn" id="rxbtn_${i}" onclick="selRx(${i})" style="flex:0;padding:6px 11px;font-size:12px;background:${i===2?m.color+'33':'var(--card2)'};border:1px solid ${m.color}55;color:${m.color}">${m.sym}</button>`).join('')}
      </div>
    </div>
    ${btnRow([{cls:'btn-start',fn:'rxStart()',label:'🔬 Add to Acid!'},{cls:'btn-reset',fn:'rxReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'rx_rank',val:'3rd',label:'Reactivity Rank'},{id:'rx_rate',val:'Fast',label:'Reaction Rate'},{id:'rx_gas',val:'H₂↑',label:'Gas Produced'}])}
    ${theoryBox('Metal + Acid → Salt + Hydrogen↑','Reactivity Series: K > Na > Mg > Zn > Fe > Cu > Au. Jitna upar, utna zyada reactive. Cu aur Au HCl se react nahi karte — inhe dilute acids dissolve nahi karte!')}
  `);
  function selRxUpdate(i){
    selMetal=i;
    metals.forEach((_,j)=>{const b=$id('rxbtn_'+j);if(b)b.style.background=j===i?metals[j].color+'33':'var(--card2)';});
    const m=metals[i];
    if($id('rx_rank'))$id('rx_rank').textContent=m.rank+'st/nd/rd';
    const rates=['Explosive!','Very Fast','Fast','Moderate','Slow','None','None'];
    if($id('rx_rate'))$id('rx_rate').textContent=rates[i];
    if($id('rx_gas'))$id('rx_gas').textContent=m.h2_speed>0?'H₂↑ produced':'No gas';
    bubbles=[];reacting=false;drawRx(0);
  }
  window.selRx=selRxUpdate;
  window.rxStart=()=>{reacting=true;bubbles=[];frame2=0;if(animId)cancelAnimationFrame(animId);animId=requestAnimationFrame(animRx);};
  window.rxReset=()=>{stopSim();reacting=false;bubbles=[];drawRx(0);};
  function drawRx(fr){
    const m=metals[selMetal];
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    // Background
    const bg=ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0,'#0d1117');bg.addColorStop(1,'#131926');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Beaker
    const bx=cw*0.22,by=ch*0.18,bw=cw*0.56,bh=ch*0.62;
    // Acid liquid
    const acidH=bh*0.72;
    const acidGrad=ctx.createLinearGradient(bx,by+bh-acidH,bx,by+bh);
    acidGrad.addColorStop(0,'rgba(100,220,100,0.15)');acidGrad.addColorStop(1,'rgba(60,180,60,0.35)');
    ctx.fillStyle=acidGrad;ctx.fillRect(bx+4,by+bh-acidH,bw-8,acidH);
    // Acid label
    ctx.fillStyle='rgba(100,220,100,0.8)';ctx.font='13px monospace';ctx.textAlign='center';
    ctx.fillText('HCl (Hydrochloric Acid)',cw/2,by+bh-acidH+18);
    // Beaker glass outline
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,by+bh);ctx.lineTo(bx+bw,by+bh);ctx.lineTo(bx+bw,by);ctx.stroke();
    // Beaker rim
    ctx.beginPath();ctx.moveTo(bx-6,by);ctx.lineTo(bx+bw+6,by);ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=4;ctx.stroke();
    // Bubbles (H2 gas)
    bubbles.forEach(b=>{
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.strokeStyle=`rgba(100,200,255,${b.a})`;ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=`rgba(150,220,255,${b.a*0.3})`;ctx.fill();
    });
    // Metal piece
    const mx=cw/2,acidSurfY=by+bh-acidH;
    let metalY=acidSurfY+10;
    if(fr>0&&m.h2_speed>0) metalY=acidSurfY+20+Math.min(fr*0.3,acidH*0.4);
    const mw=50,mh=22;
    const mGrad=ctx.createLinearGradient(mx-mw/2,metalY-mh/2,mx+mw/2,metalY+mh/2);
    mGrad.addColorStop(0,m.color+'ee');mGrad.addColorStop(1,m.color+'77');
    ctx.fillStyle=mGrad;ctx.beginPath();ctx.roundRect(mx-mw/2,metalY-mh/2,mw,mh,5);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m.sym,mx,metalY);ctx.textBaseline='alphabetic';
    // Flames for very reactive metals
    if(m.flames&&fr>10){
      for(let fi=0;fi<5;fi++){
        const fx=mx+(-2+fi)*16;const fy=metalY-mh/2-10-Math.sin(fr*0.2+fi)*12;
        ctx.beginPath();ctx.arc(fx,fy,6+Math.sin(fr*0.15+fi)*3,0,Math.PI*2);
        ctx.fillStyle=fi%2===0?'rgba(255,150,0,0.8)':'rgba(255,70,0,0.7)';ctx.fill();
      }
    }
    // Reaction equation
    if(fr>5&&m.h2_speed>0){
      ctx.fillStyle='rgba(255,220,100,0.9)';ctx.font='12px monospace';ctx.textAlign='center';
      ctx.fillText(m.acid_rxn,cw/2,by+bh+26);
    } else if(fr>5){
      ctx.fillStyle='rgba(200,100,100,0.9)';ctx.font='12px monospace';ctx.textAlign='center';
      ctx.fillText(m.acid_rxn,cw/2,by+bh+26);
    }
    // Reactivity series bar on left
    const barX=14,barY=ch*0.1,barH=ch*0.75;
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(barX,barY,18,barH);
    metals.forEach((mt,j)=>{
      const yy=barY+j*(barH/metals.length)+4;
      ctx.fillStyle=j===selMetal?mt.color:'rgba(255,255,255,0.2)';
      ctx.font=`bold ${j===selMetal?12:9}px monospace`;ctx.textAlign='left';
      ctx.fillText(mt.sym,barX+2,yy+10);
      if(j===selMetal){ctx.strokeStyle=mt.color;ctx.lineWidth=2;ctx.strokeRect(barX-1,yy-2,20,14);}
    });
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText('↑ More',barX+9,barY-4);ctx.fillText('Reactive',barX+9,barY+3);
    ctx.textAlign='left';
  }
  function animRx(){
    frame2++;
    const m=metals[selMetal];
    if(m.h2_speed>0&&frame2%Math.max(1,Math.round(8/m.h2_speed))===0){
      const bx2=c.width*0.22,by2=c.height*0.18,bw2=c.width*0.56,bh2=c.height*0.62;
      const acidSurfY=by2+bh2*0.28;
      bubbles.push({x:bx2+bw2*0.2+Math.random()*bw2*0.6,y:acidSurfY+Math.random()*bh2*0.5,r:3+Math.random()*5,a:0.7,vy:-(1+Math.random()*2)});
    }
    bubbles.forEach(b=>{b.y+=b.vy;b.a-=0.008;});
    bubbles=bubbles.filter(b=>b.a>0.05&&b.y>0);
    drawRx(frame2);
    animId=requestAnimationFrame(animRx);
  }
  selRxUpdate(2);
}

// ============================================================
// CATALYSTS & REACTION RATE — ACTIVATION ENERGY & SPEED
// ============================================================
function simCatalyst(c,ctx,p){
  let hascat=false,temp=300,conc=1,frame3=0,running2=false;
  let particles2=[];
  panel(`
    <div class="btn-row">
      <button class="sim-btn btn-start" id="catbtn" onclick="toggleCat()">➕ Add Catalyst</button>
      <button class="sim-btn btn-reset" onclick="catReset()">🔄 Reset</button>
    </div>
    ${sliderRow('cat_temp','🌡️ Temperature',200,600,300,' K','sv("cat_temp"," K");catUp()')}
    ${sliderRow('cat_conc','⚗️ Concentration',1,5,1,'×','sv("cat_conc","×");catUp()')}
    ${btnRow([{cls:'btn-start',fn:'catStart()',label:'▶ Start Reaction'},{cls:'btn-pause',fn:'catPause()',label:'⏸ Pause'}])}
    ${infoCards([{id:'cat_ea',val:'80',label:'Ea (kJ/mol)'},{id:'cat_rate',val:'Low',label:'Reaction Rate'},{id:'cat_rxn',val:'0',label:'Rxn Count'}])}
    ${theoryBox('Rate = Ae^(-Ea/RT)  (Arrhenius)','Catalyst activation energy (Ea) ko kam karta hai — zyada molecules reaction kar paate hain! Temperature badhane se bhi rate zyada hoti hai (har 10°C pe approx 2× faster).')}
  `);
  let rxnCount=0;
  window.toggleCat=()=>{
    hascat=!hascat;
    const b=$id('catbtn');
    if(b){b.textContent=hascat?'✅ Catalyst Active':'➕ Add Catalyst';b.style.background=hascat?'rgba(105,219,124,0.3)':'linear-gradient(135deg,#5a8a3a,#3d6a22)';}
    if($id('cat_ea'))$id('cat_ea').textContent=hascat?'30':'80';
    catRateUpdate();
  };
  window.catUp=()=>{temp=gv('cat_temp');conc=gv('cat_conc');catRateUpdate();};
  function catRateUpdate(){
    const ea=hascat?30:80;const kk=Math.exp(-ea/(0.008314*temp))*conc*(hascat?10:1);
    const rate=kk>0.5?'Very High':kk>0.1?'High':kk>0.01?'Medium':'Low';
    if($id('cat_rate'))$id('cat_rate').textContent=rate;
    if($id('cat_ea'))$id('cat_ea').textContent=hascat?30:80;
  }
  window.catStart=()=>{running2=true;if(!animId)animId=requestAnimationFrame(animCat);};
  window.catPause=()=>{running2=false;};
  window.catReset=()=>{stopSim();running2=false;rxnCount=0;particles2=[];if($id('cat_rxn'))$id('cat_rxn').textContent=0;drawCat();};
  // Init particles
  function initParticles(){
    particles2=[];
    for(let i=0;i<18;i++){
      const side=i<9?'A':'B';
      particles2.push({
        x:side==='A'?30+Math.random()*c.width*0.35:c.width*0.55+Math.random()*c.width*0.38,
        y:40+Math.random()*(c.height-80),
        vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.5,
        r:8,side,reacted:false,
        color:side==='A'?'#ff6b6b':'#74c0fc'
      });
    }
  }
  initParticles();
  function drawCat(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    const bg=ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0,'#0d1117');bg.addColorStop(1,'#0e1620');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Divider (activation energy barrier)
    const barrierH=hascat?ch*0.28:ch*0.65;
    const midX=cw/2;
    ctx.fillStyle=hascat?'rgba(105,219,124,0.15)':'rgba(255,100,100,0.12)';
    ctx.fillRect(midX-6,ch-barrierH,12,barrierH);
    ctx.strokeStyle=hascat?'rgba(105,219,124,0.7)':'rgba(255,100,100,0.6)';
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(midX,ch-barrierH);ctx.lineTo(midX,ch);ctx.stroke();
    // Barrier label
    ctx.fillStyle=hascat?'rgba(105,219,124,0.9)':'rgba(255,100,100,0.9)';
    ctx.font='11px monospace';ctx.textAlign='center';
    ctx.fillText('Ea='+(hascat?30:80)+' kJ',midX,ch-barrierH-6);
    // Catalyst label
    if(hascat){
      ctx.fillStyle='rgba(105,219,124,0.8)';ctx.font='bold 12px monospace';ctx.textAlign='center';
      ctx.fillText('⚡ CATALYST ACTIVE',midX,20);
    }
    // Particles
    particles2.forEach(pt=>{
      if(pt.reacted){
        const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.r+4);
        g.addColorStop(0,'#ffd43bcc');g.addColorStop(1,'transparent');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r+4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffd43b';
      } else ctx.fillStyle=pt.color;
      ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(pt.reacted?'P':pt.side,pt.x,pt.y);ctx.textBaseline='alphabetic';
    });
    // Labels
    ctx.fillStyle='rgba(255,107,107,0.7)';ctx.font='12px monospace';ctx.textAlign='left';
    ctx.fillText('Reactant A',8,18);
    ctx.fillStyle='rgba(116,192,252,0.7)';ctx.textAlign='right';
    ctx.fillText('Reactant B',cw-8,18);
    ctx.textAlign='left';
    if($id('cat_rxn'))$id('cat_rxn').textContent=rxnCount;
  }
  function animCat(){
    if(!running2){animId=requestAnimationFrame(animCat);return;}
    frame3++;
    const speed=1+(temp-200)/200+conc*0.5;
    const eaFactor=hascat?4:1;
    particles2.forEach(pt=>{
      if(pt.reacted)return;
      pt.x+=pt.vx*speed;pt.y+=pt.vy*speed;
      if(pt.x<pt.r){pt.x=pt.r;pt.vx=Math.abs(pt.vx);}
      if(pt.x>c.width-pt.r){pt.x=c.width-pt.r;pt.vx=-Math.abs(pt.vx);}
      if(pt.y<pt.r){pt.y=pt.r;pt.vy=Math.abs(pt.vy);}
      if(pt.y>c.height-pt.r){pt.y=c.height-pt.r;pt.vy=-Math.abs(pt.vy);}
      // Check barrier crossing
      const midX=c.width/2;
      const barrierH=hascat?c.height*0.28:c.height*0.65;
      const barrierTop=c.height-barrierH;
      if(Math.abs(pt.x-midX)<14&&pt.y>barrierTop){
        if(Math.random()>1-0.04*eaFactor){pt.vx*=-1;}
      }
      // Reaction: A meets B close enough across barrier
      particles2.forEach(pt2=>{
        if(pt2.side===pt.side||pt2.reacted||pt.reacted)return;
        const dx=pt.x-pt2.x,dy=pt.y-pt2.y;
        if(Math.sqrt(dx*dx+dy*dy)<pt.r+pt2.r+2){
          pt.reacted=true;pt2.reacted=true;rxnCount++;
          setTimeout(()=>{pt.reacted=false;pt2.reacted=false;
            pt.x=30+Math.random()*c.width*0.35;pt2.x=c.width*0.55+Math.random()*c.width*0.38;
            pt.color='#ff6b6b';pt2.color='#74c0fc';
          },600);
        }
      });
    });
    drawCat();
    animId=requestAnimationFrame(animCat);
  }
  running2=true;animId=requestAnimationFrame(animCat);
}

// ============================================================
// MOLE CONCEPT / STOICHIOMETRY — AVOGADRO & MOLE CALCULATIONS
// ============================================================
function simMole(c,ctx,p){
  let selEl=0,moles=1,frame4=0;
  const elements2=[
    {name:'Carbon',sym:'C',molar:12,color:'#adb5bd',icon:'⚫'},
    {name:'Oxygen (O₂)',sym:'O₂',molar:32,color:'#74c0fc',icon:'🔵'},
    {name:'Water (H₂O)',sym:'H₂O',molar:18,color:'#4dabf7',icon:'💧'},
    {name:'NaCl',sym:'NaCl',molar:58.5,color:'#ffd43b',icon:'🧂'},
    {name:'Iron',sym:'Fe',molar:56,color:'#e8590c',icon:'🟠'},
    {name:'Glucose',sym:'C₆H₁₂O₆',molar:180,color:'#69db7c',icon:'🍬'},
  ];
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🔢 Element / Compound Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:5px">
        ${elements2.map((el,i)=>`<button class="sim-btn" id="molbtn_${i}" onclick="selMolEl(${i})" style="flex:0;padding:6px 10px;font-size:11px;background:${i===0?el.color+'33':'var(--card2)'};border:1px solid ${el.color}55;color:${el.color}">${el.sym}</button>`).join('')}
      </div>
    </div>
    ${sliderRow('mol_n','⚖️ Moles',0.1,5,1,' mol','sv("mol_n"," mol");moleUp()')}
    ${infoCards([{id:'mol_mass',val:'12.0',label:'Mass (g)'},{id:'mol_atoms',val:'6.022×10²³',label:'Particles'},{id:'mol_vol',val:'22.4',label:'Vol at STP (L)'}])}
    ${theoryBox('1 Mole = 6.022 × 10²³ particles (Avogadro Number)','Mass = Moles × Molar Mass | Particles = Moles × 6.022×10²³ | Gas volume at STP = Moles × 22.4 L. Ek mole carbon = 12 grams = 602,200,000,000,000,000,000,000 atoms!')}
  `);
  window.selMolEl=(i)=>{
    selEl=i;
    elements2.forEach((_,j)=>{const b=$id('molbtn_'+j);if(b)b.style.background=j===i?elements2[j].color+'33':'var(--card2)';});
    moleUp();
  };
  window.moleUp=()=>{
    moles=gv('mol_n');
    const el=elements2[selEl];
    const mass=(moles*el.molar).toFixed(2);
    const avog='6.022×10²³';
    const vol=(moles*22.4).toFixed(1);
    if($id('mol_mass'))$id('mol_mass').textContent=mass+' g';
    if($id('mol_atoms'))$id('mol_atoms').textContent=(moles===1?avog:(moles*6.022).toFixed(2)+'×10²³');
    if($id('mol_vol'))$id('mol_vol').textContent=vol+' L';
  };
  function drawMole(){
    const el=elements2[selEl];
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    const bg=ctx.createLinearGradient(0,0,cw,ch);
    bg.addColorStop(0,'#0a0f1e');bg.addColorStop(1,'#0f1820');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Title
    ctx.fillStyle=el.color;ctx.font='bold 16px var(--font)';ctx.textAlign='center';
    ctx.fillText(el.name+' — '+el.sym,cw/2,28);
    // Large Avogadro sphere representation
    const cx=cw/2,cy=ch*0.42;
    const bigR=Math.min(cw,ch)*0.28;
    const sphereGrad=ctx.createRadialGradient(cx-bigR*0.3,cy-bigR*0.3,0,cx,cy,bigR);
    sphereGrad.addColorStop(0,'rgba(255,255,255,0.15)');
    sphereGrad.addColorStop(0.4,el.color+'88');
    sphereGrad.addColorStop(1,el.color+'22');
    ctx.beginPath();ctx.arc(cx,cy,bigR,0,Math.PI*2);
    ctx.fillStyle=sphereGrad;ctx.fill();
    ctx.strokeStyle=el.color+'aa';ctx.lineWidth=2;ctx.stroke();
    // Show moles as smaller spheres inside
    const n=Math.min(Math.round(moles*8),40);
    for(let i=0;i<n;i++){
      const ang=(i/n)*Math.PI*2+frame4*0.01;
      const rad2=bigR*0.55+Math.sin(i*2.3)*bigR*0.2;
      const px=cx+rad2*Math.cos(ang);
      const py=cy+rad2*Math.sin(ang)*0.6;
      ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);
      ctx.fillStyle=el.color+'cc';ctx.fill();
    }
    // Symbol in center
    ctx.fillStyle='#fff';ctx.font='bold 26px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(el.sym,cx,cy);ctx.textBaseline='alphabetic';
    // Stats display
    const m=moles*el.molar;
    const boxY=ch*0.74;
    const boxes=[
      {label:'Moles',val:moles.toFixed(1)+' mol',col:'#ffd43b'},
      {label:'Mass',val:m.toFixed(1)+' g',col:el.color},
      {label:'Molar Mass',val:el.molar+' g/mol',col:'#a9e34b'},
    ];
    boxes.forEach((bx,i)=>{
      const bxx=cw*0.1+i*(cw*0.27);
      ctx.fillStyle=bx.col+'22';ctx.beginPath();ctx.roundRect(bxx,boxY,cw*0.24,ch*0.18,10);ctx.fill();
      ctx.strokeStyle=bx.col+'66';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=bx.col;ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText(bx.val,bxx+cw*0.12,boxY+ch*0.08);
      ctx.fillStyle='rgba(255,255,255,0.45)';ctx.font='10px monospace';
      ctx.fillText(bx.label,bxx+cw*0.12,boxY+ch*0.14);
    });
    ctx.textAlign='left';
    frame4++;
  }
  function animMole(){drawMole();animId=requestAnimationFrame(animMole);}
  animId=requestAnimationFrame(animMole);
  moleUp();
}

// ============================================================
// POLYMERS & PLASTICS — MONOMER-POLYMER CHAIN FORMATION
// ============================================================
function simPolymers(c,ctx,p){
  const polymerTypes=[
    {name:'Polyethylene (PE)',monomer:'CH₂=CH₂',monSym:'▣',type:'Addition',color:'#74c0fc',use:'Plastic bags, bottles',chain:'[-CH₂-CH₂-]ₙ'},
    {name:'PVC',monomer:'CH₂=CHCl',monSym:'▤',type:'Addition',color:'#cc5de8',use:'Pipes, wires, flooring',chain:'[-CH₂-CHCl-]ₙ'},
    {name:'Polystyrene (PS)',monomer:'CH₂=CH-C₆H₅',monSym:'▦',type:'Addition',color:'#ff9f43',use:'Thermocol, cups, packaging',chain:'[-CH₂-CH(Ph)-]ₙ'},
    {name:'Nylon-6,6',monomer:'Diamine + Diacid',monSym:'◈',type:'Condensation',color:'#69db7c',use:'Ropes, fabric, toothbrush',chain:'[-NH-(CH₂)₆-NH-CO-(CH₂)₄-CO-]ₙ'},
    {name:'Polyester (PET)',monomer:'Diol + Diacid',monSym:'◇',type:'Condensation',color:'#f06595',use:'Bottles, polyester fabric',chain:'[-O-(CH₂)₂-O-CO-C₆H₄-CO-]ₙ'},
  ];
  let selPoly=0,chainLen=1,building=false,frame5=0;
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🔗 Polymer Type Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:5px">
        ${polymerTypes.map((pt,i)=>`<button class="sim-btn" id="polbtn_${i}" onclick="selPoly(${i})" style="flex:0;padding:5px 9px;font-size:10px;background:${i===0?pt.color+'33':'var(--card2)'};border:1px solid ${pt.color}55;color:${pt.color}">${pt.name.split(' ')[0]}</button>`).join('')}
      </div>
    </div>
    ${btnRow([{cls:'btn-start',fn:'polyBuild()',label:'🔗 Build Chain!'},{cls:'btn-reset',fn:'polyReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'pol_type',val:'Addition',label:'Type'},{id:'pol_n',val:'1',label:'Chain Length (n)'},{id:'pol_use',val:'',label:'Uses'}])}
    ${theoryBox('nCH₂=CH₂ → [-CH₂-CH₂-]ₙ  (Polymerization)','Addition polymerization: double bond tutke monomers chain banate hain. Condensation polymerization: do different functional groups react karke small molecules (H₂O) release karte hain aur chain banti hai!')}
  `);
  window.selPoly=(i)=>{
    selPoly=i;
    polymerTypes.forEach((_,j)=>{const b=$id('polbtn_'+j);if(b)b.style.background=j===i?polymerTypes[j].color+'33':'var(--card2)';});
    const pt=polymerTypes[i];
    if($id('pol_type'))$id('pol_type').textContent=pt.type;
    if($id('pol_use'))$id('pol_use').textContent=pt.use;
    chainLen=1;building=false;drawPoly(1);
  };
  window.polyBuild=()=>{building=true;chainLen=1;if(animId)cancelAnimationFrame(animId);animId=requestAnimationFrame(animPoly);};
  window.polyReset=()=>{stopSim();building=false;chainLen=1;drawPoly(1);};
  function drawPoly(n){
    const pt=polymerTypes[selPoly];
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    const bg=ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0,'#0a0f1e');bg.addColorStop(1,'#0d1520');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Title
    ctx.fillStyle=pt.color;ctx.font='bold 14px var(--font)';ctx.textAlign='center';
    ctx.fillText(pt.name,cw/2,22);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='11px monospace';
    ctx.fillText('Monomer: '+pt.monomer,cw/2,38);
    // Draw chain
    const unitW=Math.min(46,cw*0.8/Math.max(n,1));
    const unitH=30;
    const rows=Math.ceil(n*unitW/cw*1.2);
    let drawn=0;
    for(let row=0;row<rows&&drawn<n;row++){
      const unitsInRow=Math.floor(cw*0.85/unitW);
      const startX=cw*0.07;
      const yy=ch*0.2+row*(unitH+14);
      for(let col=0;col<unitsInRow&&drawn<n;col++){
        const xx=startX+col*unitW;
        // Connector line
        if(col>0||row>0){
          ctx.strokeStyle=pt.color+'66';ctx.lineWidth=2;
          if(col>0){ctx.beginPath();ctx.moveTo(xx-2,yy+unitH/2);ctx.lineTo(xx,yy+unitH/2);ctx.stroke();}
          else{ctx.beginPath();ctx.moveTo(startX+(unitsInRow-1)*unitW+unitW/2,yy-14);ctx.lineTo(xx+unitW/2,yy);ctx.stroke();}
        }
        const blockGrad=ctx.createLinearGradient(xx,yy,xx+unitW-4,yy+unitH);
        blockGrad.addColorStop(0,pt.color+'cc');blockGrad.addColorStop(1,pt.color+'55');
        ctx.fillStyle=blockGrad;ctx.beginPath();ctx.roundRect(xx,yy,unitW-4,unitH,5);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='#fff';ctx.font=`bold ${unitW>35?10:8}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(pt.monSym,xx+unitW/2-2,yy+unitH/2);ctx.textBaseline='alphabetic';
        // Water released in condensation
        if(pt.type==='Condensation'&&drawn>0&&drawn<n){
          ctx.fillStyle='rgba(100,200,255,0.7)';ctx.font='8px monospace';ctx.textAlign='center';
          ctx.fillText('H₂O',xx-4,yy-4);
        }
        drawn++;
      }
    }
    // Chain formula at bottom
    if(n>2){
      ctx.fillStyle=pt.color+'cc';ctx.font='12px monospace';ctx.textAlign='center';
      ctx.fillText(pt.chain,cw/2,ch*0.86);
    }
    // Info bar
    ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText('n = '+n+' monomers  |  Type: '+pt.type,cw/2,ch*0.93);
    ctx.textAlign='left';
    if($id('pol_n'))$id('pol_n').textContent=n;
  }
  function animPoly(){
    frame5++;
    if(building&&frame5%6===0){chainLen=Math.min(chainLen+1,20);}
    drawPoly(chainLen);
    animId=requestAnimationFrame(animPoly);
  }
  animId=requestAnimationFrame(animPoly);
  if($id('pol_use'))$id('pol_use').textContent=polymerTypes[0].use;
  if($id('pol_type'))$id('pol_type').textContent=polymerTypes[0].type;
}

// MATH: COORDINATE GEOMETRY
// ============================================================
function simCoordGeo(c,ctx,p){
  let mode='points';
  const cgColors={points:'#ff6b6b',line:'#58a6ff',circle:'#69db7c'};
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🎯 Mode Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:6px">
        <button class="sim-btn" id="cg_m_points" style="flex:0;padding:8px 14px;background:${cgColors.points}33;border:1px solid ${cgColors.points}55;color:${cgColors.points}" onclick="cgMode('points')">📍 Points</button>
        <button class="sim-btn" id="cg_m_line" style="flex:0;padding:8px 14px;background:var(--card2);border:1px solid ${cgColors.line}55;color:${cgColors.line}" onclick="cgMode('line')">📏 Line</button>
        <button class="sim-btn" id="cg_m_circle" style="flex:0;padding:8px 14px;background:var(--card2);border:1px solid ${cgColors.circle}55;color:${cgColors.circle}" onclick="cgMode('circle')">⭕ Circle</button>
      </div>
    </div>
    <div id="cg_controls"></div>
    <div id="cg_info"></div>
    ${theoryBox('Distance=√((x₂-x₁)²+(y₂-y₁)²) | y=mx+c | (x-h)²+(y-k)²=r²','Coordinate plane par har point (x,y) se define hota hai. Line ka equation slope (m) aur intercept (c) se banta hai. Circle apne center (h,k) aur radius (r) se define hota hai.')}
  `);
  function setBtnHighlight(){
    Object.keys(cgColors).forEach(m=>{
      const b=$id('cg_m_'+m);
      if(b)b.style.background=m===mode?cgColors[m]+'33':'var(--card2)';
    });
  }
  window.cgMode=(m)=>{mode=m;setBtnHighlight();renderCgControls();};
  function renderCgControls(){
    let html='';
    if(mode==='points'){
      html=sliderRow('cg_x1','x₁',-10,10,2,'','sv("cg_x1","");cgDraw()')
        +sliderRow('cg_y1','y₁',-10,10,1,'','sv("cg_y1","");cgDraw()')
        +sliderRow('cg_x2','x₂',-10,10,6,'','sv("cg_x2","");cgDraw()')
        +sliderRow('cg_y2','y₂',-10,10,5,'','sv("cg_y2","");cgDraw()');
    } else if(mode==='line'){
      html=sliderRow('cg_m','Slope (m)',-5,5,1,'','sv("cg_m","");cgDraw()')
        +sliderRow('cg_c','Intercept (c)',-10,10,0,'','sv("cg_c","");cgDraw()');
    } else {
      html=sliderRow('cg_h','Center h',-8,8,0,'','sv("cg_h","");cgDraw()')
        +sliderRow('cg_k','Center k',-8,8,0,'','sv("cg_k","");cgDraw()')
        +sliderRow('cg_r','Radius r',1,10,4,'','sv("cg_r","");cgDraw()');
    }
    $id('cg_controls').innerHTML=html;
    cgDraw();
  }
  window.cgDraw=()=>{
    const cw=c.width,ch=c.height;
    const scale=Math.min(cw,ch)/22;
    const {ox,oy}=drawCoordPlane(ctx,c,scale);
    if(mode==='points'){
      const x1=gv('cg_x1'),y1=gv('cg_y1'),x2=gv('cg_x2'),y2=gv('cg_y2');
      const dist=Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1));
      const midx=(x1+x2)/2,midy=(y1+y2)/2;
      const slope=x2===x1?'∞':((y2-y1)/(x2-x1)).toFixed(2);
      ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(ox+x1*scale,oy-y1*scale);ctx.lineTo(ox+x2*scale,oy-y2*scale);ctx.stroke();
      [[x1,y1,'#ff6b6b','A'],[x2,y2,'#ffd43b','B']].forEach(pt=>{
        const[x,y,col,lbl]=pt;
        ctx.beginPath();ctx.arc(ox+x*scale,oy-y*scale,6,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
        ctx.fillStyle=col;ctx.font='bold 12px monospace';ctx.fillText(lbl+'('+x+','+y+')',ox+x*scale+10,oy-y*scale-8);
      });
      ctx.beginPath();ctx.arc(ox+midx*scale,oy-midy*scale,5,0,Math.PI*2);ctx.fillStyle='#69db7c';ctx.fill();
      ctx.fillStyle='#69db7c';ctx.font='11px monospace';ctx.fillText('M('+midx+','+midy+')',ox+midx*scale+8,oy-midy*scale+16);
      $id('cg_info').innerHTML=infoCards([{id:'cg_v1',val:dist.toFixed(2),label:'Distance AB'},{id:'cg_v2',val:'('+midx+', '+midy+')',label:'Midpoint M'},{id:'cg_v3',val:slope,label:'Slope (m)'}]);
    } else if(mode==='line'){
      const m=gv('cg_m'),cc=gv('cg_c');
      ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.beginPath();
      let started=false;
      for(let px=0;px<=cw;px++){
        const xv=(px-ox)/scale;
        const yv=m*xv+cc;
        const py=oy-yv*scale;
        if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
      }
      ctx.stroke();
      const xint=m===0?'--':(-cc/m).toFixed(2);
      ctx.fillStyle='#ffd43b';ctx.font='bold 13px monospace';
      ctx.fillText('y = '+m+'x + ('+cc+')',12,22);
      $id('cg_info').innerHTML=infoCards([{id:'cg_v1',val:m,label:'Slope (m)'},{id:'cg_v2',val:cc,label:'Y-Intercept'},{id:'cg_v3',val:xint,label:'X-Intercept'}]);
    } else {
      const h=gv('cg_h'),k=gv('cg_k'),r=gv('cg_r');
      const cx=ox+h*scale,cy=oy-k*scale;
      ctx.beginPath();ctx.arc(cx,cy,r*scale,0,Math.PI*2);
      ctx.fillStyle='rgba(88,166,255,0.15)';ctx.fill();
      ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.stroke();
      ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fillStyle='#ffd43b';ctx.fill();
      ctx.fillStyle='#ffd43b';ctx.font='11px monospace';ctx.fillText('('+h+','+k+')',cx+8,cy-8);
      ctx.strokeStyle='#ff6b6b';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*scale,cy);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#ff6b6b';ctx.fillText('r='+r,cx+r*scale/2-10,cy-6);
      ctx.fillStyle='#69db7c';ctx.font='bold 13px monospace';
      ctx.fillText('(x-'+h+')²+(y-'+k+')²='+r+'²',12,22);
      $id('cg_info').innerHTML=infoCards([{id:'cg_v1',val:r,label:'Radius'},{id:'cg_v2',val:(Math.PI*r*r).toFixed(2),label:'Area'},{id:'cg_v3',val:(2*Math.PI*r).toFixed(2),label:'Circumference'}]);
    }
  };
  setBtnHighlight();renderCgControls();
}
