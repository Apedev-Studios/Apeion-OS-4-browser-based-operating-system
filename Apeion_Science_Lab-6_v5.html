// MATH: STATISTICS — MEAN, MEDIAN, MODE
// ============================================================
function simStatistics(c,ctx,p){
  let data=[7,3,9,3,5,7,7,2];
  const barColors=['#74c0fc','#ffa94d','#a9e34b','#ff6b6b','#cc5de8','#ffd43b','#69db7c','#f06595','#fab005','#38bdf8','#f472b6','#34d399','#fb923c','#a78bfa','#facc15'];
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'statRoll()',label:'🎲 New Random Data'},{cls:'btn-reset',fn:'statReset()',label:'🔄 Reset'}])}
      ${sliderRow('stat_n','🔢 Data Points',5,15,8,'','sv("stat_n","");statResize()')}
    </div>
    ${infoCards([{id:'stat_mean',val:'',label:'Mean'},{id:'stat_median',val:'',label:'Median'},{id:'stat_mode',val:'',label:'Mode'},{id:'stat_range',val:'',label:'Range'}])}
    ${theoryBox('Mean=Σx/n | Median=Beech wali value | Mode=Sabse zyada baar aane wali value','Mean sabhi values ka average hai. Median sorted data ka beech wala number hai (ya beech ke do ka average). Mode sabse zyada repeat hone wali value hai. Range = Max − Min.')}
  `);
  window.statRoll=()=>{
    const n=gv('stat_n')||8;
    data=Array.from({length:n},()=>Math.floor(Math.random()*19)+1);
    statUpdate();
  };
  window.statReset=()=>{
    data=[7,3,9,3,5,7,7,2];
    if($id('stat_n')){$id('stat_n').value=8;sv('stat_n','');}
    statUpdate();
  };
  window.statResize=()=>{
    const n=gv('stat_n');
    if(n>data.length){while(data.length<n)data.push(Math.floor(Math.random()*19)+1);}
    else data=data.slice(0,n);
    statUpdate();
  };
  function computeStats(arr){
    const n=arr.length;
    const mean=arr.reduce((a,b)=>a+b,0)/n;
    const sorted=[...arr].sort((a,b)=>a-b);
    const median=n%2===0?(sorted[n/2-1]+sorted[n/2])/2:sorted[(n-1)/2];
    const freq={};
    arr.forEach(v=>freq[v]=(freq[v]||0)+1);
    let maxFreq=0,modes=[];
    Object.keys(freq).forEach(k=>{
      if(freq[k]>maxFreq){maxFreq=freq[k];modes=[k];}
      else if(freq[k]===maxFreq)modes.push(k);
    });
    const mode=maxFreq>1?modes.join(', '):'None';
    const range=sorted[n-1]-sorted[0];
    return {mean,median,mode,range,maxFreq};
  }
  function statUpdate(){
    const s=computeStats(data);
    if($id('stat_mean'))$id('stat_mean').textContent=s.mean.toFixed(2);
    if($id('stat_median'))$id('stat_median').textContent=s.median.toFixed(2);
    if($id('stat_mode'))$id('stat_mode').textContent=s.mode;
    if($id('stat_range'))$id('stat_range').textContent=s.range;
    drawStatChart(s);
  }
  function drawStatChart(s){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);drawGrid(ctx,c);
    const n=data.length;
    const padL=36,padB=40,padT=20,padR=14;
    const plotW=cw-padL-padR,plotH=ch-padT-padB;
    const maxV=Math.max(...data,1);
    const bw=plotW/n;
    const modeVals=s.mode==='None'?[]:s.mode.split(', ');
    const meanY=padT+plotH-(s.mean/maxV)*plotH;
    ctx.strokeStyle='#ff6b6b';ctx.setLineDash([5,4]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(padL,meanY);ctx.lineTo(cw-padR,meanY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ff6b6b';ctx.font='10px monospace';ctx.fillText('Mean='+s.mean.toFixed(1),padL+4,meanY-6);
    const medY=padT+plotH-(s.median/maxV)*plotH;
    ctx.strokeStyle='#58a6ff';ctx.setLineDash([2,3]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(padL,medY);ctx.lineTo(cw-padR,medY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#58a6ff';ctx.font='10px monospace';ctx.fillText('Median='+s.median.toFixed(1),padL+4,medY+14);
    data.forEach((v,i)=>{
      const x=padL+i*bw;
      const h=(v/maxV)*plotH;
      const y=padT+plotH-h;
      const isMode=modeVals.includes(String(v));
      const col=isMode?'#ffd43b':barColors[i%barColors.length];
      const grad=ctx.createLinearGradient(x,y,x,padT+plotH);
      grad.addColorStop(0,col);grad.addColorStop(1,col+'55');
      ctx.fillStyle=grad;
      ctx.beginPath();ctx.roundRect(x+3,y,Math.max(bw-6,2),h,4);ctx.fill();
      ctx.strokeStyle=isMode?'#ffd43b':col;ctx.lineWidth=isMode?2:1;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';
      ctx.fillText(v,x+bw/2,y-6);
      ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='9px monospace';
      ctx.fillText('#'+(i+1),x+bw/2,padT+plotH+14);
    });
    ctx.textAlign='left';
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+plotH);ctx.lineTo(cw-padR,padT+plotH);ctx.stroke();
  }
  statUpdate();
}

// ============================================================
// MATH: FRACTAL PATTERNS — SIERPINSKI & KOCH SNOWFLAKE
// ============================================================
function simFractals(c,ctx,p){
  let type='sierpinski',depth=4,maxDepth=4,animFrame=0,shapeCount=0;
  const sierColors=['#ff6b6b','#ffd43b','#74c0fc','#69db7c','#cc5de8','#ffa94d','#f06595','#38bdf8'];
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🌀 Fractal Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:6px">
        <button class="sim-btn" id="fr_t_sier" style="flex:0;padding:8px 14px;background:#ff6b6b33;border:1px solid #ff6b6b55;color:#ff6b6b" onclick="fracType('sierpinski')">🔺 Sierpinski</button>
        <button class="sim-btn" id="fr_t_koch" style="flex:0;padding:8px 14px;background:var(--card2);border:1px solid #69db7c55;color:#69db7c" onclick="fracType('koch')">❄️ Koch Snowflake</button>
      </div>
    </div>
    ${sliderRow('frac_depth','🔁 Iterations (Depth)',0,6,4,'','sv("frac_depth","");fracSetDepth()')}
    ${btnRow([{cls:'btn-start',fn:'fracAnimate()',label:'▶ Animate Growth'},{cls:'btn-reset',fn:'fracReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'frac_shapes',val:'',label:'Triangles/Points'},{id:'frac_depth_v',val:'4',label:'Current Depth'}])}
    ${theoryBox('Self-Similarity: Whole = Many Small Copies of Itself','Fractal woh shape hai jisme har chhota part bade shape jaisa dikhta hai! Sierpinski Triangle har triangle ko 3 chhote triangles mein todta hai. Koch Snowflake har line segment ko 4 chhote segments mein todta hai — infinite detail!')}
  `);
  function setTypeBtn(){
    if($id('fr_t_sier'))$id('fr_t_sier').style.background=type==='sierpinski'?'#ff6b6b33':'var(--card2)';
    if($id('fr_t_koch'))$id('fr_t_koch').style.background=type==='koch'?'#69db7c33':'var(--card2)';
  }
  window.fracType=(t)=>{type=t;setTypeBtn();maxDepth=gv('frac_depth');depth=maxDepth;fracDraw();};
  window.fracSetDepth=()=>{maxDepth=gv('frac_depth');depth=maxDepth;fracDraw();};
  window.fracAnimate=()=>{
    stopSim();depth=0;animFrame=0;
    animId=requestAnimationFrame(stepAnim);
  };
  window.fracReset=()=>{stopSim();depth=0;fracDraw();};
  function stepAnim(){
    animFrame++;
    if(animFrame%18===0&&depth<maxDepth)depth++;
    fracDraw();
    if(depth<maxDepth)animId=requestAnimationFrame(stepAnim);
  }
  function fracDraw(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    const bg=ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0,'#0a0f1e');bg.addColorStop(1,'#0d1520');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    shapeCount=0;
    if(type==='sierpinski'){
      const size=Math.min(cw,ch)*0.85;
      const x0=cw/2,y0=ch*0.06;
      const x1=x0-size/2,y1=y0+size*0.85;
      const x2=x0+size/2,y2=y1;
      drawSierpinski(x0,y0,x1,y1,x2,y2,depth);
    } else {
      const size=Math.min(cw,ch)*0.6;
      const cx=cw/2,cy=ch/2;
      const pts=kochSnowflakePoints(cx,cy,size,depth);
      ctx.beginPath();
      pts.forEach((pt,i)=>i===0?ctx.moveTo(pt[0],pt[1]):ctx.lineTo(pt[0],pt[1]));
      ctx.closePath();
      const grad=ctx.createLinearGradient(cx-size,cy-size,cx+size,cy+size);
      grad.addColorStop(0,'rgba(88,166,255,0.25)');grad.addColorStop(1,'rgba(105,219,124,0.15)');
      ctx.fillStyle=grad;ctx.fill();
      ctx.strokeStyle='#69db7c';ctx.lineWidth=1.8;ctx.stroke();
      shapeCount=pts.length-1;
    }
    ctx.fillStyle='rgba(255,255,255,0.45)';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText((type==='sierpinski'?'Sierpinski Triangle':'Koch Snowflake')+' — Depth '+depth,cw/2,ch-12);
    ctx.textAlign='left';
    if($id('frac_shapes'))$id('frac_shapes').textContent=shapeCount;
    if($id('frac_depth_v'))$id('frac_depth_v').textContent=depth;
  }
  function drawSierpinski(x0,y0,x1,y1,x2,y2,d){
    if(d<=0){
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x2,y2);ctx.closePath();
      const idx=Math.abs(Math.round(x0+y0))%sierColors.length;
      ctx.fillStyle=sierColors[idx]+'bb';ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=0.5;ctx.stroke();
      shapeCount++;
      return;
    }
    const mx01=(x0+x1)/2,my01=(y0+y1)/2;
    const mx12=(x1+x2)/2,my12=(y1+y2)/2;
    const mx20=(x2+x0)/2,my20=(y2+y0)/2;
    drawSierpinski(x0,y0,mx01,my01,mx20,my20,d-1);
    drawSierpinski(mx01,my01,x1,y1,mx12,my12,d-1);
    drawSierpinski(mx20,my20,mx12,my12,x2,y2,d-1);
  }
  function kochSnowflakePoints(cx,cy,size,d){
    const h=size*Math.sqrt(3)/2;
    const p1=[cx,cy-h*2/3];
    const p2=[cx-size/2,cy+h/3];
    const p3=[cx+size/2,cy+h/3];
    let pts=[p1,p2,p3,p1];
    for(let it=0;it<d;it++){
      const next=[];
      for(let i=0;i<pts.length-1;i++)next.push(...kochSegment(pts[i],pts[i+1]));
      next.push(pts[pts.length-1]);
      pts=next;
    }
    return pts;
  }
  function kochSegment(a,b){
    const dx=b[0]-a[0],dy=b[1]-a[1];
    const p1=a;
    const p2=[a[0]+dx/3,a[1]+dy/3];
    const p4=[a[0]+dx*2/3,a[1]+dy*2/3];
    const angle=Math.atan2(dy,dx)-Math.PI/3;
    const len=Math.sqrt(dx*dx+dy*dy)/3;
    const p3=[p2[0]+len*Math.cos(angle),p2[1]+len*Math.sin(angle)];
    return [p1,p2,p3,p4];
  }
  setTypeBtn();fracDraw();
}

    </div>
    <div class="ctrl-section">
      <div class="ctrl-label">📊 Riemann Method</div>
      <div class="btn-row">
        <button class="sim-btn" id="int_m_left" onclick="intMethod('left')">Left</button>
        <button class="sim-btn" id="int_m_right" onclick="intMethod('right')">Right</button>
        <button class="sim-btn" id="int_m_mid" onclick="intMethod('mid')">Midpoint</button>
      </div>
    </div>
    ${sliderRow('int_n','🔢 Rectangles (n)',2,60,8,'','sv("int_n","");intDraw()')}
    ${infoCards([{id:'int_approx',val:'',label:'Riemann Sum'},{id:'int_exact',val:'',label:'Exact ∫f(x)dx'},{id:'int_error',val:'',label:'Error %'}])}
    ${theoryBox('∫f(x)dx ≈ Σ f(xᵢ)·Δx','Curve ke neeche area ko chhote rectangles mein todo — har rectangle ka area f(x)×width hota hai. n (rectangles) jitna zyada, approximation jitna accurate! n→∞ par yahi exact integral ban jaata hai.')}
  `);
  function setBtnStyles(){
    Object.keys(functions).forEach(k=>{
      const b=$id('int_f_'+k);
      if(b)b.style.background=k===fnKey?functions[k].color+'33':'var(--card2)';
    });
    ['left','right','mid'].forEach(m=>{
      const b=$id('int_m_'+m);
      if(b){b.style.background=m===method?'#ffd43b33':'var(--card2)';b.style.color=m===method?'#ffd43b':'inherit';}
    });
  }
  window.intFn=(k)=>{fnKey=k;setBtnStyles();intDraw();};
  window.intMethod=(m)=>{method=m;setBtnStyles();intDraw();};
  function simpsonExact(f,a,b,steps){
    if(steps%2!==0)steps++;
    const h=(b-a)/steps;
    let sum=f(a)+f(b);
    for(let i=1;i<steps;i++)sum+=f(a+i*h)*(i%2===0?2:4);
    return sum*h/3;
  }
  window.intDraw=()=>{
    const def=functions[fnKey];
    const n=gv('int_n');
    const a=def.a,b=def.b;
    const dx=(b-a)/n;
    let approxSum=0;
    const rects=[];
    for(let i=0;i<n;i++){
      const x0=a+i*dx;
      const xs=method==='left'?x0:method==='right'?x0+dx:x0+dx/2;
      const height=def.fn(xs);
      approxSum+=height*dx;
      rects.push({x0,height});
    }
    const exact=simpsonExact(def.fn,a,b,2000);
    const errPct=exact!==0?Math.abs((approxSum-exact)/exact*100):0;
    if($id('int_approx'))$id('int_approx').textContent=approxSum.toFixed(3);
    if($id('int_exact'))$id('int_exact').textContent=exact.toFixed(3);
    if($id('int_error'))$id('int_error').textContent=errPct.toFixed(2)+'%';
    drawIntegration(def,a,b,rects,dx);
  };
  function drawIntegration(def,a,b,rects,dx){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);drawGrid(ctx,c);
    const padL=40,padB=36,padT=16,padR=14;
    const plotW=cw-padL-padR,plotH=ch-padT-padB;
    let maxY=0;
    for(let x=a;x<=b;x+=(b-a)/200)maxY=Math.max(maxY,def.fn(x));
    maxY*=1.15;
    const sx=v=>padL+((v-a)/(b-a))*plotW;
    const sy=v=>padT+plotH-(v/maxY)*plotH;
    rects.forEach(r=>{
      const x1=sx(r.x0),x2=sx(r.x0+dx);
      const y0=sy(0),y1=sy(r.height);
      const col=r.height>=0?def.color:'#ff6b6b';
      const grad=ctx.createLinearGradient(x1,y1,x1,y0);
      grad.addColorStop(0,col+'aa');grad.addColorStop(1,col+'22');
      ctx.fillStyle=grad;
      ctx.fillRect(x1,Math.min(y0,y1),Math.max(x2-x1,1),Math.abs(y0-y1));
      ctx.strokeStyle=col+'cc';ctx.lineWidth=1;
      ctx.strokeRect(x1,Math.min(y0,y1),Math.max(x2-x1,1),Math.abs(y0-y1));
    });
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2.5;ctx.beginPath();
    let started=false;
    for(let x=a;x<=b;x+=(b-a)/300){
      const px=sx(x),py=sy(def.fn(x));
      if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(padL,sy(0));ctx.lineTo(cw-padR,sy(0));ctx.stroke();
    ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+plotH);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px monospace';
    ctx.fillText('a='+a,padL-4,sy(0)+16);
    ctx.fillText('b='+b,sx(b)-14,sy(0)+16);
    ctx.fillStyle='#ffd43b';ctx.font='bold 12px monospace';
    ctx.fillText(def.label,padL,padT+12);
  }
  setBtnStyles();intDraw();
}

// MATH: QUADRATIC EQUATIONS — ROOTS & DISCRIMINANT
// ============================================================
function simQuadratic(c,ctx,p){
  panel(`
    ${sliderRow('q_a','a (x² coefficient)',-5,5,1,'','sv("q_a","");qDraw()')}
    ${sliderRow('q_b','b (x coefficient)',-10,10,-2,'','sv("q_b","");qDraw()')}
    ${sliderRow('q_c','c (constant)',-10,10,-3,'','sv("q_c","");qDraw()')}
    ${infoCards([{id:'q_disc',val:'',label:'Discriminant (D)'},{id:'q_roots',val:'',label:'Roots'},{id:'q_vertex',val:'',label:'Vertex'}])}
    ${theoryBox('x = (−b ± √D) / 2a   |   D = b² − 4ac','D>0 → 2 alag real roots. D=0 → 1 repeated root (parabola x-axis ko touch karta hai). D<0 → koi real root nahi (parabola x-axis se nahi milta). Vertex parabola ka turning point hai!')}
  `);
  window.qDraw=()=>{
    let a=gv('q_a'),b=gv('q_b'),cc=gv('q_c');
    if(a===0)a=0.5;
    const D=b*b-4*a*cc;
    const vx=-b/(2*a),vy=a*vx*vx+b*vx+cc;
    let rootsText,r1=null,r2=null;
    if(D>0){
      r1=(-b+Math.sqrt(D))/(2*a);r2=(-b-Math.sqrt(D))/(2*a);
      rootsText=r1.toFixed(2)+', '+r2.toFixed(2);
    } else if(D===0){
      r1=-b/(2*a);
      rootsText=r1.toFixed(2)+' (repeated)';
    } else {
      rootsText='No real roots';
    }
    if($id('q_disc'))$id('q_disc').textContent=D.toFixed(1);
    if($id('q_roots'))$id('q_roots').textContent=rootsText;
    if($id('q_vertex'))$id('q_vertex').textContent='('+vx.toFixed(2)+', '+vy.toFixed(2)+')';
    const cw=c.width,ch=c.height;
    const scale=Math.min(cw,ch)/22;
    const {ox,oy}=drawCoordPlane(ctx,c,scale);
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.beginPath();
    let started=false;
    for(let px=0;px<=cw;px++){
      const xv=(px-ox)/scale;
      const yv=a*xv*xv+b*xv+cc;
      const py=oy-yv*scale;
      if(py<-1000||py>ch+1000)continue;
      if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(255,212,59,0.5)';ctx.setLineDash([5,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(ox+vx*scale,0);ctx.lineTo(ox+vx*scale,ch);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(ox+vx*scale,oy-vy*scale,6,0,Math.PI*2);ctx.fillStyle='#ffd43b';ctx.fill();
    ctx.fillStyle='#ffd43b';ctx.font='bold 11px monospace';
    ctx.fillText('Vertex',ox+vx*scale+10,oy-vy*scale-8);
    if(D>=0){
      [r1,r2].forEach(r=>{
        if(r===null)return;
        ctx.beginPath();ctx.arc(ox+r*scale,oy,7,0,Math.PI*2);
        ctx.fillStyle='#ff6b6b';ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
      });
    }
    ctx.fillStyle='#a9e34b';ctx.font='bold 13px monospace';
    ctx.fillText('y = '+a+'x² + ('+b+')x + ('+cc+')',12,22);
    ctx.fillStyle=D>0?'#69db7c':D===0?'#ffd43b':'#ff6b6b';
    ctx.font='bold 12px monospace';
    ctx.fillText('D = '+D.toFixed(1)+(D>0?' (2 real roots)':D===0?' (1 repeated root)':' (no real roots)'),12,40);
  };
  qDraw();
}

// ============================================================
// BIOLOGY: PUNNETT SQUARE — GENETICS & MENDELIAN INHERITANCE
// ============================================================
function simPunnett(c,ctx,p){
  const traits=[
    {name:'Seed Color',dominant:'Y (Yellow)',recessive:'y (Green)',domChar:'Y',recChar:'y'},
    {name:'Seed Shape',dominant:'R (Round)',recessive:'r (Wrinkled)',domChar:'R',recChar:'r'},
    {name:'Plant Height',dominant:'T (Tall)',recessive:'t (Short)',domChar:'T',recChar:'t'},
    {name:'Flower Color',dominant:'P (Purple)',recessive:'p (White)',domChar:'P',recChar:'p'},
    {name:'Pod Color',dominant:'G (Green)',recessive:'g (Yellow)',domChar:'G',recChar:'g'},
  ];
  let selTrait=0,p1='Aa',p2='Aa',frame6=0,highlight=-1;
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🧬 Trait Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:5px">
        ${traits.map((t,i)=>`<button class="sim-btn" id="ptbtn_${i}" onclick="selPTrait(${i})" style="flex:0;padding:5px 9px;font-size:10px;background:${i===0?'rgba(167,139,250,0.25)':'var(--card2)'};border:1px solid rgba(167,139,250,${i===0?0.7:0.3});color:#a78bfa">${t.name}</button>`).join('')}
      </div>
    </div>
    <div class="ctrl-section">
      <div class="ctrl-label">👨 Parent 1 Genotype</div>
      <div class="btn-row" id="p1btns"></div>
      <div class="ctrl-label" style="margin-top:8px">👩 Parent 2 Genotype</div>
      <div class="btn-row" id="p2btns"></div>
    </div>
    ${infoCards([{id:'pun_dom',val:'3',label:'Dominant'},{id:'pun_rec',val:'1',label:'Recessive'},{id:'pun_ratio',val:'3:1',label:'Phenotype Ratio'}])}
    ${theoryBox('Mendel ka Niyam: 3:1 (Aa×Aa)','Dominant allele (capital) recessive allele (small) ko daba deta hai. Homozygous dominant (AA) = Homozygous recessive (aa) = Heterozygous (Aa) → mixed phenotype. Dihybrid cross mein 9:3:3:1 ratio milta hai!')}
  `);
  function buildParentBtns(){
    const tr=traits[selTrait];
    const D=tr.domChar,r=tr.recChar;
    const opts1=[D+D,D+r,r+r];
    const opts2=[D+D,D+r,r+r];
    const p1div=$id('p1btns');const p2div=$id('p2btns');
    if(!p1div||!p2div)return;
    p1div.innerHTML=opts1.map((o,i)=>`<button class="sim-btn" id="p1opt_${i}" onclick="setP1('${o}')" style="flex:1;font-size:12px;font-family:monospace;background:${p1===o?'rgba(167,139,250,0.3)':'var(--card2)'};border:1px solid rgba(167,139,250,0.4);color:#a78bfa">${o}</button>`).join('');
    p2div.innerHTML=opts2.map((o,i)=>`<button class="sim-btn" id="p2opt_${i}" onclick="setP2('${o}')" style="flex:1;font-size:12px;font-family:monospace;background:${p2===o?'rgba(167,139,250,0.3)':'var(--card2)'};border:1px solid rgba(167,139,250,0.4);color:#a78bfa">${o}</button>`).join('');
  }
  window.selPTrait=(i)=>{
    selTrait=i;
    traits.forEach((_,j)=>{const b=$id('ptbtn_'+j);if(b){b.style.background=j===i?'rgba(167,139,250,0.25)':'var(--card2)';b.style.borderColor=j===i?'rgba(167,139,250,0.7)':'rgba(167,139,250,0.3)';}});
    buildParentBtns();calcPunnett();
  };
  window.setP1=(g)=>{p1=g;buildParentBtns();calcPunnett();};
  window.setP2=(g)=>{p2=g;buildParentBtns();calcPunnett();};
  function calcPunnett(){
    // Get gametes
    const tr=traits[selTrait];
    const D=tr.domChar,r=tr.recChar;
    const gametes1=[p1[0],p1[1]];
    const gametes2=[p2[0],p2[1]];
    let domCount=0,recCount=0;
    const grid=[];
    gametes1.forEach(g1=>{
      gametes2.forEach(g2=>{
        const combo=[g1,g2].sort((a,b)=>a===a.toUpperCase()?-1:1).join('');
        grid.push(combo);
        if(combo.includes(D))domCount++;else recCount++;
      });
    });
    const gcd=Math.min(domCount,recCount)||1;
    const ratio=domCount===0?'0:4':recCount===0?'4:0':domCount+':'+recCount;
    if($id('pun_dom'))$id('pun_dom').textContent=domCount;
    if($id('pun_rec'))$id('pun_rec').textContent=recCount;
    if($id('pun_ratio'))$id('pun_ratio').textContent=ratio;
    drawPunnett(gametes1,gametes2,grid,tr);
  }
  function drawPunnett(g1,g2,grid,tr){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    // Rich dark gradient background
    const bg=ctx.createLinearGradient(0,0,cw,ch);
    bg.addColorStop(0,'#0d0a1a');bg.addColorStop(0.5,'#110d20');bg.addColorStop(1,'#0a0d1a');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Particle background
    for(let i=0;i<30;i++){
      const px=(Math.sin(i*2.3+frame6*0.01)*0.5+0.5)*cw;
      const py=(Math.cos(i*1.7+frame6*0.008)*0.5+0.5)*ch;
      ctx.beginPath();ctx.arc(px,py,1,0,Math.PI*2);
      ctx.fillStyle=`rgba(167,139,250,${0.04+0.03*Math.sin(frame6*0.05+i)})`;ctx.fill();
    }
    // Title
    ctx.fillStyle='rgba(167,139,250,0.9)';ctx.font='bold 14px var(--font)';ctx.textAlign='center';
    ctx.fillText('🧬 '+tr.name+' — Punnett Square',cw/2,20);
    ctx.font='11px var(--font2)';ctx.fillStyle='rgba(167,139,250,0.6)';
    ctx.fillText(tr.dominant+' | '+tr.recessive,cw/2,36);
    // Grid layout
    const cellW=Math.min((cw-80)/3,100),cellH=Math.min((ch-90)/3,90);
    const startX=(cw-cellW*3)/2,startY=50;
    // Header row gametes
    g1.forEach((g,i)=>{
      const cx=startX+cellW*(i+1)+cellW/2,cy=startY+cellH*0.5;
      const isD=g===g.toUpperCase();
      const gCol=isD?'#a78bfa':'#f9a8d4';
      const gGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,cellW*0.38);
      gGrad.addColorStop(0,gCol+'44');gGrad.addColorStop(1,'transparent');
      ctx.fillStyle=gGrad;ctx.beginPath();ctx.arc(cx,cy,cellW*0.38,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=gCol+'99';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=gCol;ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(g,cx,cy);ctx.textBaseline='alphabetic';
    });
    g2.forEach((g,i)=>{
      const cx=startX+cellW*0.5,cy=startY+cellH*(i+1)+cellH/2;
      const isD=g===g.toUpperCase();
      const gCol=isD?'#a78bfa':'#f9a8d4';
      const gGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,cellW*0.38);
      gGrad.addColorStop(0,gCol+'44');gGrad.addColorStop(1,'transparent');
      ctx.fillStyle=gGrad;ctx.beginPath();ctx.arc(cx,cy,cellW*0.38,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=gCol+'99';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=gCol;ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(g,cx,cy);ctx.textBaseline='alphabetic';
    });
    // Grid cells
    grid.forEach((combo,i)=>{
      const col=i%2,row=Math.floor(i/2);
      const cx=startX+cellW*(col+1),cy=startY+cellH*(row+1);
      const isDom=combo.includes(tr.domChar);
      const cellCol=isDom?'rgba(167,139,250,0.18)':'rgba(249,168,212,0.18)';
      const borderCol=isDom?'rgba(167,139,250,0.7)':'rgba(249,168,212,0.7)';
      const pulse=highlight===i?0.35+0.15*Math.sin(frame6*0.15):0;
      const gCell=ctx.createLinearGradient(cx,cy,cx+cellW,cy+cellH);
      gCell.addColorStop(0,isDom?`rgba(167,139,250,${0.18+pulse})`:`rgba(249,168,212,${0.18+pulse})`);
      gCell.addColorStop(1,isDom?`rgba(100,80,180,${0.08+pulse})`:`rgba(220,120,160,${0.08+pulse})`);
      ctx.fillStyle=gCell;
      ctx.beginPath();ctx.roundRect(cx+3,cy+3,cellW-6,cellH-6,10);ctx.fill();
      ctx.strokeStyle=borderCol;ctx.lineWidth=highlight===i?2.5:1.5;ctx.stroke();
      // Combo text with color coding
      const letters=combo.split('');
      const totalW=letters.length*14;
      letters.forEach((lt,li)=>{
        const isCapital=lt===lt.toUpperCase();
        ctx.fillStyle=isCapital?'#c4b5fd':'#fbcfe8';
        ctx.font='bold 18px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(lt,cx+cellW/2-7+li*14,cy+cellH/2);
      });
      ctx.textBaseline='alphabetic';
      // Phenotype label below combo
      ctx.fillStyle=isDom?'rgba(196,181,253,0.7)':'rgba(251,207,232,0.7)';
      ctx.font='9px var(--font2)';ctx.textAlign='center';
      ctx.fillText(isDom?tr.dominant.split('(')[0].trim():tr.recessive.split('(')[0].trim(),cx+cellW/2,cy+cellH-8);
    });
    // Grid lines
    ctx.strokeStyle='rgba(167,139,250,0.2)';ctx.lineWidth=1;
    for(let i=0;i<=3;i++){
      ctx.beginPath();ctx.moveTo(startX+i*cellW,startY);ctx.lineTo(startX+i*cellW,startY+cellH*3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(startX,startY+i*cellH);ctx.lineTo(startX+cellW*3,startY+i*cellH);ctx.stroke();
    }
    // Legend
    const legY=startY+cellH*3+14;
    ctx.beginPath();ctx.roundRect(startX,legY,cellW*1.3,28,8);
    ctx.fillStyle='rgba(167,139,250,0.2)';ctx.fill();
    ctx.strokeStyle='rgba(167,139,250,0.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#c4b5fd';ctx.font='bold 10px var(--font2)';ctx.textAlign='center';
    ctx.fillText('■ Dominant Phenotype',startX+cellW*0.65,legY+17);
    ctx.beginPath();ctx.roundRect(startX+cellW*1.4,legY,cellW*1.3,28,8);
    ctx.fillStyle='rgba(249,168,212,0.2)';ctx.fill();
    ctx.strokeStyle='rgba(249,168,212,0.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#fbcfe8';ctx.font='bold 10px var(--font2)';ctx.textAlign='center';
    ctx.fillText('■ Recessive Phenotype',startX+cellW*2.05,legY+17);
    ctx.textAlign='left';
    frame6++;
  }
  function animPunnett(){
    frame6++;
    // Cycle highlight through cells
    highlight=Math.floor(frame6/45)%4;
    const tr=traits[selTrait];
    const g1arr=[p1[0],p1[1]],g2arr=[p2[0],p2[1]];
    const grid=[];
    g1arr.forEach(ga=>{g2arr.forEach(gb=>{
      const combo=[ga,gb].sort((a,b)=>a===a.toUpperCase()?-1:1).join('');
      grid.push(combo);
    });});
    drawPunnett(g1arr,g2arr,grid,tr);
    animId=requestAnimationFrame(animPunnett);
  }
  buildParentBtns();calcPunnett();
  animId=requestAnimationFrame(animPunnett);
}

// BIOLOGY: OSMOSIS & DIFFUSION — MEMBRANE TRANSPORT
// ============================================================
function simOsmosis(c,ctx,p){
  let solConc=0.3,temp2=25,running3=false,frame7=0;
  let particlesLeft=[],particlesRight=[],crossed=[];
  panel(`
    ${btnRow([{cls:'btn-start',fn:'osmStart()',label:'▶ Start'},{cls:'btn-reset',fn:'osmReset()',label:'🔄 Reset'}])}
    ${sliderRow('osm_conc','🧂 Solute Conc (Right)',0,1,0.3,'','sv("osm_conc","");osmUp()')}
    ${sliderRow('osm_temp','🌡️ Temperature',5,45,25,'°C','sv("osm_temp","°C");osmUp()')}
    ${infoCards([{id:'osm_moved',val:'0',label:'Particles Moved'},{id:'osm_eq',val:'No',label:'Equilibrium'},{id:'osm_dir',val:'→',label:'Net Direction'}])}
    ${theoryBox('Water moves from LOW solute → HIGH solute side','Osmosis: semi-permeable membrane se solvent (water) move karta hai. Diffusion: particles HIGH concentration se LOW concentration ki taraf — dono equilibrium achieve karne ki koshish karte hain!')}
  `);
  function initOsm(){
    particlesLeft=[];particlesRight=[];crossed=[];
    const cw=c.width,ch=c.height;
    const midX=cw/2;
    // Left side: water particles (blue) — more water (low solute)
    for(let i=0;i<25;i++){
      particlesLeft.push({x:40+Math.random()*(midX-70),y:40+Math.random()*(ch-80),vx:(Math.random()-0.5)*1.8,vy:(Math.random()-0.5)*1.8,type:'water',r:5,alpha:1});
    }
    // Right side: solute particles (orange) per conc + water
    const nSolute=Math.round(solConc*20);
    for(let i=0;i<nSolute;i++){
      particlesRight.push({x:midX+40+Math.random()*(cw-midX-70),y:40+Math.random()*(ch-80),vx:(Math.random()-0.5)*1.2,vy:(Math.random()-0.5)*1.2,type:'solute',r:7,alpha:1});
    }
    for(let i=0;i<15-nSolute;i++){
      particlesRight.push({x:midX+40+Math.random()*(cw-midX-70),y:40+Math.random()*(ch-80),vx:(Math.random()-0.5)*1.8,vy:(Math.random()-0.5)*1.8,type:'water',r:5,alpha:1});
    }
  }
  window.osmUp=()=>{solConc=gv('osm_conc');temp2=gv('osm_temp');};
  window.osmStart=()=>{running3=true;if(!animId)animId=requestAnimationFrame(animOsm);};
  window.osmReset=()=>{stopSim();running3=false;crossed=[];if($id('osm_moved'))$id('osm_moved').textContent=0;if($id('osm_eq'))$id('osm_eq').textContent='No';initOsm();drawOsm();};
  function drawOsm(){
    const cw=c.width,ch=c.height,midX=cw/2;
    ctx.clearRect(0,0,cw,ch);
    // Background
    const bg=ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0,'#050d18');bg.addColorStop(1,'#081525');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Left chamber (low solute - lighter blue tint)
    const leftGrad=ctx.createLinearGradient(0,0,midX,0);
    leftGrad.addColorStop(0,'rgba(56,189,248,0.05)');leftGrad.addColorStop(1,'rgba(56,189,248,0.02)');
    ctx.fillStyle=leftGrad;ctx.fillRect(0,0,midX,ch);
    // Right chamber (high solute - warmer tint)
    const nSolR=particlesRight.filter(p=>p.type==='solute').length;
    const rightGrad=ctx.createLinearGradient(midX,0,cw,0);
    rightGrad.addColorStop(0,'rgba(251,146,60,0.02)');rightGrad.addColorStop(1,'rgba(251,146,60,0.07)');
    ctx.fillStyle=rightGrad;ctx.fillRect(midX,0,cw-midX,ch);
    // Membrane (semi-permeable with pores)
    const memGrad=ctx.createLinearGradient(midX-6,0,midX+6,0);
    memGrad.addColorStop(0,'rgba(100,220,180,0.8)');memGrad.addColorStop(0.5,'rgba(150,255,200,1)');memGrad.addColorStop(1,'rgba(100,220,180,0.8)');
    ctx.fillStyle=memGrad;
    const poreSpacing=30;
    for(let py=0;py<ch;py+=poreSpacing){
      ctx.fillRect(midX-5,py,10,20);
    }
    // Pore gaps (openings)
    ctx.fillStyle='rgba(5,13,24,0.9)';
    for(let py=0;py<ch;py+=poreSpacing){
      ctx.fillRect(midX-4,py+20,8,10);
    }
    // Membrane label
    ctx.fillStyle='rgba(100,220,180,0.8)';ctx.font='bold 10px var(--font2)';ctx.textAlign='center';
    ctx.save();ctx.translate(midX,ch*0.1);ctx.rotate(-Math.PI/2);ctx.fillText('Semi-permeable Membrane',0,0);ctx.restore();
    // Draw water particles (left)
    particlesLeft.forEach(pt=>{
      const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.r*1.8);
      g.addColorStop(0,'rgba(125,211,252,0.95)');g.addColorStop(0.6,'rgba(56,189,248,0.7)');g.addColorStop(1,'rgba(14,165,233,0.1)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(186,230,253,0.6)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('H₂O',pt.x,pt.y);ctx.textBaseline='alphabetic';
    });
    // Draw particles right (water + solute)
    particlesRight.forEach(pt=>{
      if(pt.type==='water'){
        const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.r*1.8);
        g.addColorStop(0,'rgba(125,211,252,0.8)');g.addColorStop(1,'rgba(14,165,233,0.1)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(186,230,253,0.5)';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('H₂O',pt.x,pt.y);ctx.textBaseline='alphabetic';
      } else {
        const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,pt.r*2);
        g.addColorStop(0,'rgba(253,186,116,1)');g.addColorStop(0.5,'rgba(251,146,60,0.8)');g.addColorStop(1,'rgba(234,88,12,0.15)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(254,215,170,0.7)';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('Sol',pt.x,pt.y);ctx.textBaseline='alphabetic';
      }
    });
    // Crossing arrows
    if(running3){
      ctx.strokeStyle='rgba(56,189,248,0.4)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(midX-20,ch/2);ctx.lineTo(midX+20,ch/2);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='rgba(56,189,248,0.7)';
      ctx.beginPath();ctx.moveTo(midX+20,ch/2);ctx.lineTo(midX+14,ch/2-5);ctx.lineTo(midX+14,ch/2+5);ctx.fill();
    }
    // Side labels
    ctx.fillStyle='rgba(56,189,248,0.8)';ctx.font='bold 13px var(--font2)';ctx.textAlign='center';
    ctx.fillText('Pure Water',midX*0.5,22);ctx.fillStyle='rgba(251,146,60,0.8)';
    ctx.fillText('Solute Solution',midX+midX*0.5,22);
    const wL=particlesLeft.filter(p=>p.type==='water').length;
    const wR=particlesRight.filter(p=>p.type==='water').length;
    ctx.fillStyle='rgba(56,189,248,0.5)';ctx.font='11px var(--font2)';ctx.textAlign='center';
    ctx.fillText('Water: '+wL,midX*0.5,ch-10);
    ctx.fillStyle='rgba(251,146,60,0.5)';
    ctx.fillText('Water: '+wR,midX+midX*0.5,ch-10);
    ctx.textAlign='left';
  }
  let crossCount=0;
  function animOsm(){
    frame7++;
    const cw=c.width,ch=c.height,midX=cw/2;
    const speed=0.6+temp2*0.04;
    if(running3){
      // Move left water
      particlesLeft.forEach(pt=>{
        pt.x+=pt.vx*speed;pt.y+=pt.vy*speed;
        if(pt.x<pt.r){pt.x=pt.r;pt.vx=Math.abs(pt.vx);}
        if(pt.x>midX-15-pt.r){pt.x=midX-15-pt.r;pt.vx=-Math.abs(pt.vx);}
        if(pt.y<pt.r){pt.y=pt.r;pt.vy=Math.abs(pt.vy);}
        if(pt.y>ch-pt.r){pt.y=ch-pt.r;pt.vy=-Math.abs(pt.vy);}
        // Osmosis crossing: water moves to high solute side
        const soluteRatio=solConc;
        if(pt.x>midX-18&&Math.random()<soluteRatio*0.006*speed&&particlesLeft.length>3){
          pt.x=midX+30+Math.random()*60;
          pt.vx=Math.abs(pt.vx);
          particlesRight.push(pt);
          particlesLeft.splice(particlesLeft.indexOf(pt),1);
          crossCount++;
          if($id('osm_moved'))$id('osm_moved').textContent=crossCount;
          if($id('osm_dir'))$id('osm_dir').textContent='→ (Osmosis)';
        }
      });
      // Move right particles
      particlesRight.forEach(pt=>{
        pt.x+=pt.vx*speed;pt.y+=pt.vy*speed;
        if(pt.x<midX+15){pt.x=midX+15;pt.vx=Math.abs(pt.vx);}
        if(pt.x>cw-pt.r){pt.x=cw-pt.r;pt.vx=-Math.abs(pt.vx);}
        if(pt.y<pt.r){pt.y=pt.r;pt.vy=Math.abs(pt.vy);}
        if(pt.y>ch-pt.r){pt.y=ch-pt.r;pt.vy=-Math.abs(pt.vy);}
      });
      // Equilibrium check
      const wL=particlesLeft.filter(p=>p.type==='water').length;
      const wR=particlesRight.filter(p=>p.type==='water').length;
      const eq=Math.abs(wL-wR)<3;
      if($id('osm_eq'))$id('osm_eq').textContent=eq?'Yes! ⚖️':'No';
    }
    drawOsm();
    animId=requestAnimationFrame(animOsm);
  }
  initOsm();drawOsm();
  animId=requestAnimationFrame(animOsm);
}

// ============================================================
// BIOLOGY: ENZYME ACTION — LOCK & KEY MODEL
// ============================================================
function simEnzyme(c,ctx,p){
  let temp3=37,pH3=7,frame8=0,running4=false,reactions=0;
  let substrates=[],products=[];
  panel(`
    ${btnRow([{cls:'btn-start',fn:'enzymeStart()',label:'▶ Start'},{cls:'btn-reset',fn:'enzymeReset()',label:'🔄 Reset'}])}
    ${sliderRow('enz_temp','🌡️ Temperature',0,80,37,'°C','sv("enz_temp","°C");enzUp()')}
    ${sliderRow('enz_ph','⚗️ pH',0,14,7,'','sv("enz_ph","");enzUp()')}
    ${infoCards([{id:'enz_rate2',val:'Max',label:'Activity'},{id:'enz_rxns',val:'0',label:'Reactions'},{id:'enz_state',val:'Active',label:'State'}])}
    ${theoryBox('Enzyme = Biological catalyst (Lock & Key Model)','Enzyme ke active site mein sirf specific substrate fit hoti hai (lock-and-key). 37°C aur pH 7-8 par enzymes most active hoti hain. Temp>60°C ya extreme pH = Denaturation — enzyme permanently damaged!')}
  `);
  function initEnz(){
    substrates=[];products=[];reactions=0;
    const cw=c.width,ch=c.height;
    for(let i=0;i<10;i++){
      substrates.push({x:30+Math.random()*(cw-60),y:30+Math.random()*(ch-60),vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,state:'free',timer:0,r:10});
    }
  }
  window.enzUp=()=>{temp3=gv('enz_temp');pH3=gv('enz_ph');enzUpdateStats();};
  function enzActivity(){
    const tOpt=37,pOpt=7.4;
    const tFactor=Math.exp(-Math.pow(temp3-tOpt,2)/300);
    const pFactor=Math.exp(-Math.pow(pH3-pOpt,2)/2);
    return Math.max(0,tFactor*pFactor);
  }
  function enzUpdateStats(){
    const act=enzActivity();
    const pct=Math.round(act*100);
    const state=temp3>65?'Denatured 💀':temp3>55?'Damaged ⚠️':pH3<3||pH3>11?'Denatured 💀':pH3<5||pH3>9?'Damaged ⚠️':act>0.7?'Active ✅':act>0.3?'Partial ⚡':'Inactive ❌';
    if($id('enz_rate2'))$id('enz_rate2').textContent=pct+'%';
    if($id('enz_state'))$id('enz_state').textContent=state;
    if($id('enz_rxns'))$id('enz_rxns').textContent=reactions;
  }
  window.enzymeStart=()=>{running4=true;if(!animId)animId=requestAnimationFrame(animEnzyme);};
  window.enzymeReset=()=>{stopSim();running4=false;reactions=0;initEnz();enzUpdateStats();drawEnzyme();};
  const enzymeX=c.width/2,enzymeY=c.height*0.45;
  function drawEnzyme(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    // Dark sci-fi background
    const bg=ctx.createRadialGradient(cw/2,ch/2,0,cw/2,ch/2,Math.max(cw,ch)*0.7);
    bg.addColorStop(0,'#0a1020');bg.addColorStop(1,'#050810');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Subtle grid
    ctx.strokeStyle='rgba(251,146,60,0.04)';ctx.lineWidth=1;
    for(let gx=0;gx<cw;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,ch);ctx.stroke();}
    for(let gy=0;gy<ch;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(cw,gy);ctx.stroke();}
    const act=enzActivity();
    const isDen=temp3>65||(pH3<3||pH3>11);
    // Enzyme body (C-shape for active site)
    const ex=cw/2,ey=ch*0.45,er=Math.min(cw,ch)*0.2;
    const enzCol=isDen?'#ef4444':act>0.5?'#fb923c':'#f59e0b';
    const enzGrad=ctx.createRadialGradient(ex,ey,0,ex,ey,er);
    enzGrad.addColorStop(0,enzCol+'33');enzGrad.addColorStop(0.7,enzCol+'15');enzGrad.addColorStop(1,'transparent');
    ctx.fillStyle=enzGrad;ctx.beginPath();ctx.arc(ex,ey,er,0,Math.PI*2);ctx.fill();
    // Enzyme outer ring
    ctx.strokeStyle=enzCol+(isDen?'99':'cc');ctx.lineWidth=isDen?2:3;
    ctx.setLineDash(isDen?[6,4]:[]);
    ctx.beginPath();
    ctx.arc(ex,ey,er*0.85,0.6,Math.PI*2-0.6);ctx.stroke();
    ctx.setLineDash([]);
    // Active site mouth (opening)
    if(!isDen){
      ctx.strokeStyle=enzCol;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(ex,ey,er*0.55,-0.5,0.5);ctx.stroke();
      // Active site glow
      const asGrad=ctx.createRadialGradient(ex+er*0.6,ey,0,ex+er*0.6,ey,er*0.3);
      asGrad.addColorStop(0,enzCol+'55');asGrad.addColorStop(1,'transparent');
      ctx.fillStyle=asGrad;ctx.beginPath();ctx.arc(ex+er*0.6,ey,er*0.3,0,Math.PI*2);ctx.fill();
    } else {
      // Denatured - broken shape
      ctx.strokeStyle='#ef4444aa';ctx.lineWidth=2;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.arc(ex,ey,er*0.85,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#ef444466';ctx.font='bold 20px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✗ DENATURED',ex,ey+er*0.9);ctx.textBaseline='alphabetic';
    }
    // Label
    ctx.fillStyle=enzCol;ctx.font='bold 13px var(--font2)';ctx.textAlign='center';
    ctx.fillText('ENZYME',ex,ey-er-8);
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px var(--font2)';
    ctx.fillText('Active Site →',ex+10,ey+8);
    // Substrate particles
    substrates.forEach(sub=>{
      const sg=ctx.createRadialGradient(sub.x,sub.y,0,sub.x,sub.y,sub.r*2);
      if(sub.state==='bound'){
        sg.addColorStop(0,'rgba(167,239,80,1)');sg.addColorStop(0.6,'rgba(100,200,30,0.7)');sg.addColorStop(1,'transparent');
        ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sub.x,sub.y,sub.r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(200,255,100,0.8)';ctx.lineWidth=2;ctx.stroke();
      } else {
        sg.addColorStop(0,'rgba(96,165,250,1)');sg.addColorStop(0.6,'rgba(59,130,246,0.7)');sg.addColorStop(1,'transparent');
        ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sub.x,sub.y,sub.r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(147,197,253,0.8)';ctx.lineWidth=1.5;ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(sub.state==='bound'?'ES':'S',sub.x,sub.y);ctx.textBaseline='alphabetic';
    });
    // Product particles
    products.forEach(pr=>{
      pr.alpha-=0.015;if(pr.alpha<=0)return;
      const pg=ctx.createRadialGradient(pr.x,pr.y,0,pr.x,pr.y,pr.r*2);
      pg.addColorStop(0,`rgba(253,224,71,${pr.alpha})`);pg.addColorStop(1,'transparent');
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(pr.x,pr.y,pr.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(234,179,8,${pr.alpha*0.7})`;ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=`rgba(255,255,255,${pr.alpha})`;ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('P',pr.x,pr.y);ctx.textBaseline='alphabetic';
    });
    // Bell curve activity indicator
    const bx=12,bw=cw-24,bh=40,by2=ch-52;
    ctx.fillStyle='rgba(255,255,255,0.04)';ctx.beginPath();ctx.roundRect(bx,by2,bw,bh,8);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.stroke();
    // Bell curve
    ctx.strokeStyle='rgba(251,146,60,0.7)';ctx.lineWidth=2;ctx.beginPath();
    for(let px=bx;px<=bx+bw;px++){
      const xv=(px-bx)/bw;const xNorm=(xv-0.5)*10;
      const yt=by2+bh-(bh*0.85)*Math.exp(-xNorm*xNorm/2);
      if(px===bx)ctx.moveTo(px,yt);else ctx.lineTo(px,yt);
    }
    ctx.stroke();
    // Current temp indicator
    const tPct=temp3/80;
    const ix=bx+tPct*bw;
    ctx.fillStyle=enzCol;ctx.beginPath();ctx.arc(ix,by2+bh/2,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='9px var(--font2)';ctx.textAlign='left';
    ctx.fillText('Temp Activity',bx+4,by2+12);
    ctx.textAlign='left';
  }
  function animEnzyme(){
    frame8++;
    products=products.filter(pr=>pr.alpha>0);
    const cw=c.width,ch=c.height;
    const act=enzActivity();
    const isDen=temp3>65||(pH3<3||pH3>11);
    const ex=cw/2,ey=ch*0.45,er=Math.min(cw,ch)*0.2;
    if(running4&&!isDen){
      substrates.forEach(sub=>{
        if(sub.state==='free'){
          sub.x+=sub.vx;sub.y+=sub.vy;
          if(sub.x<sub.r||sub.x>cw-sub.r)sub.vx*=-1;
          if(sub.y<sub.r||sub.y>ch-80-sub.r)sub.vy*=-1;
          // Check proximity to active site
          const dx=sub.x-(ex+er*0.6),dy=sub.y-ey;
          if(Math.sqrt(dx*dx+dy*dy)<er*0.35&&Math.random()<act*0.08){
            sub.state='bound';sub.x=ex+er*0.6;sub.y=ey;sub.timer=0;
          }
        } else if(sub.state==='bound'){
          sub.timer++;
          // Pulse animation while bound
          sub.r=10+2*Math.sin(sub.timer*0.3);
          if(sub.timer>40*Math.max(0.3,act)){
            // Release as products
            products.push({x:ex+er*0.6+30,y:ey-20,vx:2,vy:-1.5,r:8,alpha:1});
            products.push({x:ex+er*0.6+15,y:ey+20,vx:1.5,vy:1.5,r:8,alpha:1});
            sub.state='free';sub.r=10;sub.timer=0;
            sub.x=Math.random()*cw*0.4;sub.y=30+Math.random()*(ch-100);
            sub.vx=(Math.random()-0.5)*2;sub.vy=(Math.random()-0.5)*2;
            reactions++;if($id('enz_rxns'))$id('enz_rxns').textContent=reactions;
          }
        }
      });
    }
    enzUpdateStats();drawEnzyme();
    animId=requestAnimationFrame(animEnzyme);
  }
  initEnz();enzUpdateStats();
  animId=requestAnimationFrame(animEnzyme);
}

// ============================================================
// BIOLOGY: BREATHING MECHANISM — ANATOMICAL LUNG ANIMATION
// ============================================================
function simBreathing(c,ctx,p){
  let breathRate=15,phase=0,frame9=0,running5=false,breathCount=0,auto=true;
  panel(`
    <div class="btn-row">
      <button class="sim-btn btn-start" onclick="breatheIn()">💨 Inhale</button>
      <button class="sim-btn btn-pause" onclick="breatheOut()">🌬️ Exhale</button>
      <button class="sim-btn btn-reset" id="autobtn" onclick="toggleAuto()">🔄 Auto</button>
    </div>
    ${sliderRow('br_rate','💓 Breaths/min',8,30,15,'','sv("br_rate","");brUp()')}
    ${infoCards([{id:'br_count',val:'0',label:'Breaths'},{id:'br_vol',val:'0.5',label:'Tidal Vol (L)'},{id:'br_phase',val:'Exhale',label:'Phase'}])}
    ${theoryBox('Breathing = Pressure Difference (Boyle\'s Law)','Inhale: Diaphragm neeche + Ribs bahar → Lung volume ↑ → Pressure ↓ → Air enters. Exhale: Diaphragm upar + Ribs andar → Volume ↓ → Pressure ↑ → Air exits. Normal rate = 12-20 breaths/min.')}
  `);
  window.brUp=()=>{breathRate=gv('br_rate');};
  window.breatheIn=()=>{auto=false;phase=1;};
  window.breatheOut=()=>{auto=false;phase=-1;};
  window.toggleAuto=()=>{auto=!auto;const b=$id('autobtn');if(b)b.style.background=auto?'rgba(100,200,100,0.3)':'';};
  let lungExpansion=0;
  function drawBreathing(){
    const cw=c.width,ch=c.height;
    ctx.clearRect(0,0,cw,ch);
    // Rich dark anatomical background
    const bg=ctx.createLinearGradient(0,0,0,ch);
    bg.addColorStop(0,'#0a0810');bg.addColorStop(0.5,'#0d0a14');bg.addColorStop(1,'#080610');
    ctx.fillStyle=bg;ctx.fillRect(0,0,cw,ch);
    // Subtle body outline
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(cw/2,ch*0.45,cw*0.42,ch*0.48,0,0,Math.PI*2);ctx.stroke();
    const cx=cw/2,lExp=lungExpansion;
    const lungW=cw*0.28+lExp*cw*0.12,lungH=ch*0.44+lExp*ch*0.10;
    const lTop=ch*0.08,rTop=ch*0.09;
    const lLungX=cx-cw*0.12,rLungX=cx+cw*0.12;
    // Rib cage
    const ribTop=ch*0.06,ribBot=ch*0.7;
    const ribW=cw*0.39+lExp*cw*0.08;
    for(let ri=0;ri<8;ri++){
      const ry=ribTop+ri*(ribBot-ribTop)/8;
      const rw2=ribW*(0.7+0.3*Math.sin(ri*0.4));
      ctx.strokeStyle=`rgba(200,200,220,${0.07+0.04*Math.sin(ri+frame9*0.02)})`;ctx.lineWidth=4;
      ctx.beginPath();ctx.ellipse(cx,ry,rw2,14,0,0,Math.PI*2);ctx.stroke();
    }
    // Left Lung
    const lGrad=ctx.createRadialGradient(lLungX,ch*0.38,10,lLungX,ch*0.38,lungW*0.8);
    lGrad.addColorStop(0,'rgba(252,165,165,0.9)');
    lGrad.addColorStop(0.4,'rgba(239,68,68,0.7)');
    lGrad.addColorStop(0.7,'rgba(185,28,28,0.5)');
