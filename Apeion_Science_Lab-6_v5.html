<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vigyan Lab 🔬</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ── Warm cream & ivory backgrounds ── */
  --bg:#f5f0e8;
  --bg2:#ede8de;
  --bg3:#e8e2d6;
  /* ── Glassmorphism card surfaces ── */
  --card:rgba(255,252,245,0.55);
  --card2:rgba(255,250,240,0.40);
  /* ── Golden borders ── */
  --border:rgba(196,158,80,0.35);
  --border2:rgba(196,158,80,0.65);
  /* ── Text ── */
  --text:#2c1f0e;
  --text2:#7a6340;
  --text3:#b8860b;
  /* ── Accent gold palette ── */
  --gold:#c49e50;
  --gold2:#a07c30;
  --gold-light:#f0d080;
  --gold-glow:rgba(196,158,80,0.30);
  /* ── Status / subject accents (warmed) ── */
  --green:#5a8a3a;
  --green2:#3d6a22;
  --blue:#5a7eb8;
  --blue2:#3d5c96;
  --red:#c0533a;
  --yellow:#c49e50;
  --orange:#c47830;
  --purple:#8a60b0;
  --teal:#3a8a6a;
  --cyan:#3a8a6a;
  /* ── Subject card accents ── */
  --ph:#c0533a;
  --ch:#c49e50;
  --ma:#5a7eb8;
  --bi:#5a8a3a;
  --font:'Baloo 2',cursive;
  --font2:'Rajdhani',sans-serif;
  /* ── Glass recipe ── */
  --glass-blur:backdrop-filter:blur(18px) saturate(160%);
  --shadow-gold:0 8px 32px rgba(196,158,80,0.18),0 2px 8px rgba(196,158,80,0.10);
  --shadow-card:0 4px 24px rgba(120,90,30,0.10),0 1px 4px rgba(120,90,30,0.07);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
}

/* Subtle warm grain texture on body */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(255,220,130,0.18) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 80%, rgba(196,158,80,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(255,245,220,0.08) 0%, transparent 70%);
}

.screen{display:none;flex-direction:column;width:100%;height:100vh;overflow:hidden;position:relative;z-index:1}
.screen.active{display:flex}

/* ===== HOME ===== */
#home{
  background:
    linear-gradient(160deg, #fdf6e8 0%, #f5ecd6 40%, #ede4cc 100%);
  overflow-y:auto;padding:0 0 24px;
}

.home-header{
  padding:30px 20px 22px;text-align:center;
  background:linear-gradient(180deg,rgba(255,240,190,0.60) 0%,transparent 100%);
  position:relative;
  border-bottom:1px solid rgba(196,158,80,0.20);
}
.home-header::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c49e50' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

.app-logo{
  font-size:56px;display:block;margin-bottom:8px;
  filter:drop-shadow(0 0 18px rgba(196,158,80,0.55));
  animation:glow 2.5s ease-in-out infinite alternate;
}
@keyframes glow{
  0%{filter:drop-shadow(0 0 8px rgba(196,158,80,0.35))}
  100%{filter:drop-shadow(0 0 28px rgba(196,158,80,0.80))}
}

.app-name{
  font-size:30px;font-weight:800;
  color:var(--text);letter-spacing:1px;
}
.app-name span{
  background:linear-gradient(135deg,#c49e50,#f0c860,#a07c30);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  display:inline;
  -webkit-box-decoration-break:clone;
  box-decoration-break:clone;
}
.app-tagline{
  font-size:13px;color:var(--text2);
  font-family:var(--font2);margin-top:4px;letter-spacing:0.5px;
}

/* ── Subject cards ── */
.subject-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 16px 0}
.subj-card{
  border-radius:22px;padding:20px 14px;cursor:pointer;
  border:1px solid rgba(196,158,80,0.30);
  position:relative;overflow:hidden;
  transition:transform 0.15s, box-shadow 0.15s;
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,0.70);
}
.subj-card:active{transform:scale(0.95);box-shadow:var(--shadow-gold)}
.subj-card::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:100px;height:100px;border-radius:50%;
  background:currentColor;opacity:0.08;
}
/* Glass shimmer line */
.subj-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.80),transparent);
}

.phys-card{
  background:linear-gradient(145deg,rgba(255,248,235,0.75),rgba(255,235,210,0.55));
  color:var(--ph);
}
.chem-card{
  background:linear-gradient(145deg,rgba(255,252,230,0.75),rgba(255,245,200,0.55));
  color:var(--ch);
}
.math-card{
  background:linear-gradient(145deg,rgba(235,242,255,0.75),rgba(215,230,255,0.55));
  color:var(--ma);
}
.bio-card{
  background:linear-gradient(145deg,rgba(235,255,240,0.75),rgba(215,245,225,0.55));
  color:var(--bi);
}

.subj-icon{font-size:38px;display:block;margin-bottom:8px;filter:drop-shadow(0 2px 6px currentColor)}
.subj-name{font-size:18px;font-weight:800;display:block}
.subj-hindi{font-size:12px;color:var(--text2);font-family:var(--font2);display:block;margin-bottom:8px}
.subj-count{
  display:inline-block;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:20px;
  background:currentColor;color:#fff;font-family:var(--font2);
  box-shadow:0 2px 6px rgba(0,0,0,0.12);
}

/* ===== LAB SCREEN ===== */
#labScreen{
  background:linear-gradient(160deg,#fdf6e8 0%,#ede4cc 100%);
  overflow:hidden;
}
.lab-header{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border-bottom:1px solid rgba(196,158,80,0.25);
  background:rgba(255,250,235,0.65);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  flex-shrink:0;
  box-shadow:0 2px 12px rgba(196,158,80,0.08);
}
.back-btn{
  width:38px;height:38px;border-radius:12px;
  border:1px solid rgba(196,158,80,0.40);
  background:rgba(255,252,240,0.70);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--gold2);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.80),0 2px 6px rgba(196,158,80,0.12);
}
.lab-title{flex:1;font-size:16px;font-weight:700;color:var(--text)}
.lab-subject-badge{
  font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:20px;font-family:var(--font2);
}

/* Experiment list */
.exp-list{overflow-y:auto;flex:1;padding:12px}
.exp-item{
  background:rgba(255,252,242,0.62);
  border:1px solid rgba(196,158,80,0.28);
  border-radius:18px;padding:14px;margin-bottom:10px;
  cursor:pointer;display:flex;align-items:center;gap:12px;
  transition:all 0.2s;
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,0.75);
}
.exp-item:active{
  transform:scale(0.98);
  border-color:rgba(196,158,80,0.65);
  box-shadow:var(--shadow-gold);
}
.exp-icon{font-size:32px;flex-shrink:0}
.exp-info{flex:1}
.exp-name{font-size:15px;font-weight:700;margin-bottom:2px;color:var(--text)}
.exp-desc{font-size:12px;color:var(--text2);font-family:var(--font2);line-height:1.4}
.exp-tag{
  font-size:10px;padding:2px 8px;border-radius:10px;
  font-family:var(--font2);font-weight:700;margin-top:4px;display:inline-block;
}

/* ===== SIM SCREEN ===== */
#simScreen{
  background:linear-gradient(160deg,#fdf6e8 0%,#ede4cc 100%);
  overflow:hidden;
}
.sim-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border-bottom:1px solid rgba(196,158,80,0.25);
  background:rgba(255,250,235,0.65);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  flex-shrink:0;
  box-shadow:0 2px 10px rgba(196,158,80,0.07);
}
.sim-title{flex:1;font-size:15px;font-weight:700;color:var(--text)}

.sim-body{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* Canvas area */
.canvas-wrap{
  flex:1;position:relative;min-height:0;
  background:rgba(240,232,216,0.50);
  border-bottom:1px solid rgba(196,158,80,0.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
canvas{width:100%;height:100%;display:block}

/* Controls panel */
.controls-panel{
  background:rgba(255,252,242,0.72);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  overflow-y:auto;
  max-height:42vh;padding:12px;
  border-top:1px solid rgba(255,255,255,0.60);
}

.ctrl-section{margin-bottom:12px}
.ctrl-label{
  font-size:11px;font-weight:700;
  color:var(--gold2);
  text-transform:uppercase;letter-spacing:1.2px;
  font-family:var(--font2);margin-bottom:8px;
}

.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.slider-name{font-size:13px;font-weight:600;min-width:90px;color:var(--text)}
.slider-val{
  font-size:13px;font-weight:700;
  background:linear-gradient(135deg,#c49e50,#f0c860);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  min-width:50px;text-align:right;font-family:var(--font2);
}

input[type=range]{
  flex:1;-webkit-appearance:none;height:6px;border-radius:3px;
  background:rgba(196,158,80,0.18);outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;
  border-radius:50%;
  background:linear-gradient(135deg,#f0c860,#c49e50);
  cursor:pointer;
  box-shadow:0 0 8px rgba(196,158,80,0.55),0 2px 4px rgba(120,80,10,0.20);
}

.btn-row{display:flex;gap:8px;margin-bottom:8px}
.sim-btn{
  flex:1;padding:10px;border:none;border-radius:13px;
  font-size:13px;font-weight:700;font-family:var(--font);
  cursor:pointer;transition:transform 0.1s,box-shadow 0.1s;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.sim-btn:active{transform:scale(0.96)}

.btn-start{
  background:linear-gradient(135deg,#5a8a3a,#3d6a22);
  color:#fff;
  box-shadow:0 3px 0 #2a4d18,0 4px 12px rgba(90,138,58,0.30);
}
.btn-reset{
  background:rgba(255,250,235,0.60);
  color:var(--text2);
  border:1px solid rgba(196,158,80,0.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.80);
}
.btn-pause{
  background:linear-gradient(135deg,#c49e50,#a07c30);
  color:#fff;
  box-shadow:0 3px 0 #7a5c18;
}

/* Info cards */
.info-cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.info-card{
  flex:1;min-width:80px;
  background:rgba(255,252,240,0.65);
  border:1px solid rgba(196,158,80,0.30);
  border-radius:14px;padding:8px 10px;text-align:center;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.80),0 2px 8px rgba(196,158,80,0.08);
}
.info-val{
  font-size:18px;font-weight:800;
  background:linear-gradient(135deg,#b8860b,#f0c040);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  font-family:var(--font2);
}
.info-lbl{font-size:10px;color:var(--text2);font-family:var(--font2);margin-top:2px}

/* Theory box */
.theory-box{
  background:rgba(255,250,230,0.58);
  border:1px solid rgba(196,158,80,0.32);
  border-radius:16px;padding:12px;margin-bottom:8px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.75),var(--shadow-card);
}
.theory-title{
  font-size:13px;font-weight:700;
  background:linear-gradient(135deg,#8a60b0,#b890e0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:6px;display:flex;align-items:center;gap:6px;
}
.theory-text{font-size:12px;color:var(--text2);font-family:var(--font2);line-height:1.6}
.formula{
  background:rgba(196,158,80,0.10);
  border:1px solid rgba(196,158,80,0.40);
  border-radius:8px;padding:6px 12px;font-family:monospace;
  font-size:14px;
  background:linear-gradient(135deg,#3a8a6a,#5aaa8a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-align:center;margin:6px 0;
  display:block;
}

/* Color select */
.color-btns{display:flex;gap:6px;flex-wrap:wrap}
.col-btn{
  width:32px;height:32px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:all 0.15s;
}
.col-btn.active{
  border-color:var(--gold);
  box-shadow:0 0 8px rgba(196,158,80,0.55);
  transform:scale(1.2);
}

/* Molecule display */
.molecule-area{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.atom-badge{
  padding:6px 14px;border-radius:20px;font-weight:700;
  font-size:14px;font-family:var(--font2);border:2px solid;
}

/* ===== THEME TOGGLE BUTTON ===== */
#themeToggleBtn{
  position:fixed;top:14px;right:14px;z-index:9999;
  width:42px;height:42px;border-radius:50%;border:none;
  cursor:pointer;font-size:20px;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.2s, box-shadow 0.2s, background 0.3s;
  box-shadow:0 3px 14px rgba(0,0,0,0.18);
  background:rgba(255,252,240,0.82);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1.5px solid rgba(196,158,80,0.35);
}
#themeToggleBtn:active{transform:scale(0.90)}

/* ===== WATERCOLOR THEME ===== */
body.theme-watercolor{
  --bg:#ffffff;
  --bg2:#f0f4ff;
  --bg3:#e8efff;
  --card:rgba(255,255,255,0.72);
  --card2:rgba(245,248,255,0.60);
  --border:rgba(160,180,240,0.35);
  --border2:rgba(120,150,220,0.55);
  --text:#1a1a2e;
  --text2:#4a5580;
  --text3:#6070c0;
  --gold:#7090e0;
  --gold2:#4060b8;
  --gold-light:#b0c4ff;
  --gold-glow:rgba(100,130,220,0.25);
  --green:#3a9a5a;
  --blue:#4070d0;
  --red:#d04060;
  --yellow:#d09030;
  --orange:#d06030;
  --purple:#8050c0;
  --teal:#30a080;
  --ph:#d04060;
  --ch:#d09030;
  --ma:#4070d0;
  --bi:#3a9a5a;
  --shadow-gold:0 8px 32px rgba(100,130,220,0.18),0 2px 8px rgba(100,130,220,0.10);
  --shadow-card:0 4px 24px rgba(80,100,200,0.10),0 1px 4px rgba(80,100,200,0.07);
}
body.theme-watercolor{
  background:
    radial-gradient(ellipse at 10% 15%, rgba(255,180,200,0.30) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 10%, rgba(180,210,255,0.35) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 85%, rgba(200,180,255,0.25) 0%, transparent 45%),
    radial-gradient(ellipse at 30% 60%, rgba(180,255,220,0.20) 0%, transparent 40%),
    #ffffff !important;
}
body.theme-watercolor::before{
  background:
    radial-gradient(ellipse at 20% 20%, rgba(255,150,180,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(150,180,255,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 30%, rgba(180,150,255,0.12) 0%, transparent 40%) !important;
}
body.theme-watercolor #home{
  background:
    radial-gradient(ellipse at 5% 5%, rgba(255,180,200,0.35) 0%, transparent 40%),
    radial-gradient(ellipse at 90% 5%, rgba(170,200,255,0.35) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 95%, rgba(200,170,255,0.30) 0%, transparent 40%),
    radial-gradient(ellipse at 25% 70%, rgba(170,255,210,0.25) 0%, transparent 35%),
    radial-gradient(ellipse at 75% 55%, rgba(255,210,150,0.20) 0%, transparent 35%),
    #ffffff !important;
}
body.theme-watercolor .home-header{
  background:linear-gradient(180deg,rgba(200,220,255,0.50) 0%,transparent 100%) !important;
  border-bottom:1px solid rgba(160,180,240,0.30) !important;
}
body.theme-watercolor .app-name{color:#1a1a2e !important;}
body.theme-watercolor .app-name span{
  background:linear-gradient(135deg,#5070c8,#8090e0,#3050a0) !important;
  -webkit-background-clip:text !important;-webkit-text-fill-color:transparent !important;
  background-clip:text !important;display:inline;
}
body.theme-watercolor .subj-card{
  border:1px solid rgba(160,180,240,0.35) !important;
  box-shadow:0 4px 24px rgba(80,100,200,0.10),inset 0 1px 0 rgba(255,255,255,0.90) !important;
}
body.theme-watercolor .phys-card{background:linear-gradient(145deg,rgba(255,220,225,0.80),rgba(255,200,210,0.60)) !important;}
body.theme-watercolor .chem-card{background:linear-gradient(145deg,rgba(255,245,210,0.80),rgba(255,230,180,0.60)) !important;}
body.theme-watercolor .math-card{background:linear-gradient(145deg,rgba(220,230,255,0.80),rgba(200,215,255,0.60)) !important;}
body.theme-watercolor .bio-card{background:linear-gradient(145deg,rgba(215,255,230,0.80),rgba(195,245,215,0.60)) !important;}
body.theme-watercolor #labScreen,
body.theme-watercolor #simScreen{background:linear-gradient(160deg,#fff 0%,#f0f4ff 100%) !important;}
body.theme-watercolor .lab-header,body.theme-watercolor .sim-header{
  background:rgba(240,245,255,0.80) !important;
  border-bottom:1px solid rgba(160,180,240,0.30) !important;
}
body.theme-watercolor .controls-panel{background:rgba(245,248,255,0.85) !important;}
body.theme-watercolor .exp-item{
  background:rgba(245,248,255,0.75) !important;
  border:1px solid rgba(160,180,240,0.30) !important;
}
body.theme-watercolor .canvas-wrap{background:rgba(230,235,255,0.50) !important;}
body.theme-watercolor input[type=range]{background:rgba(100,130,220,0.18) !important;}
body.theme-watercolor input[type=range]::-webkit-slider-thumb{
  background:linear-gradient(135deg,#90b0ff,#6080d0) !important;
  box-shadow:0 0 8px rgba(100,130,220,0.55) !important;
}
body.theme-watercolor .slider-val{
  background:linear-gradient(135deg,#6080d0,#90b0ff) !important;
  -webkit-background-clip:text;background-clip:text;
}
body.theme-watercolor .ctrl-label{color:#4060b8 !important;}
body.theme-watercolor .back-btn{
  background:rgba(230,235,255,0.80) !important;
  border:1px solid rgba(160,180,240,0.50) !important;
  color:#4060b8 !important;
}
body.theme-watercolor #themeToggleBtn{
  background:rgba(220,230,255,0.90) !important;
  border:1.5px solid rgba(120,150,220,0.45) !important;
}

/* ===== DARK THEME ===== */
body.theme-dark{
  --bg:#0d0d14;
  --bg2:#111118;
  --bg3:#16161f;
  --card:rgba(22,22,34,0.80);
  --card2:rgba(18,18,28,0.70);
  --border:rgba(80,80,140,0.35);
  --border2:rgba(100,100,180,0.55);

// ============================================================
const THEMES = ['normal','watercolor','dark'];
const THEME_ICONS = {normal:'🌙', watercolor:'🌑', dark:'☀️'};
let currentThemeIdx = 0;

function cycleTheme(){
  // Remove old theme class
  document.body.classList.remove('theme-watercolor','theme-dark');
  // Advance
  currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
  const t = THEMES[currentThemeIdx];
  if(t !== 'normal') document.body.classList.add('theme-' + t);
  // Update button icon
  document.getElementById('themeToggleBtn').textContent = THEME_ICONS[t];
}

// ---- HELPERS ----
function panel(html){document.getElementById('controlsPanel').innerHTML=html;}
function $id(id){return document.getElementById(id);}
function sliderRow(id,label,min,max,val,unit,onInput){
  return `<div class="slider-row"><span class="slider-name">${label}</span><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" oninput='${onInput};'><span class="slider-val" id="${id}_v">${val}${unit}</span></div>`;
}
function sv(id,unit=''){const el=$id(id);if(el)$id(id+'_v').textContent=el.value+unit;}
function gv(id){const el=$id(id);return el?parseFloat(el.value):0;}

// drawGrid: shared dark canvas background + faint grid (used across many sims)
function drawGrid(ctx,c){
  const cw=c.width,ch=c.height;
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
  const step=30;
  for(let x=step;x<cw;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();}
  for(let y=step;y<ch;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();}
}

// drawCoordPlane: full Cartesian plane (axes + numbered ticks) for coordinate geometry sims
function drawCoordPlane(ctx,c,scale){
  const cw=c.width,ch=c.height;
  drawGrid(ctx,c);
  const ox=cw/2,oy=ch/2;
  ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1;
  for(let gx=ox%scale;gx<cw;gx+=scale){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,ch);ctx.stroke();}
  for(let gy=oy%scale;gy<ch;gy+=scale){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(cw,gy);ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(cw,oy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,ch);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.32)';ctx.font='9px monospace';ctx.textAlign='center';
  const unitsX=Math.floor(ox/scale);
  for(let i=-unitsX;i<=unitsX;i+=2){
    if(i===0)continue;
    const x=ox+i*scale;
    if(x<10||x>cw-10)continue;
    ctx.fillText(i,x,oy+12);
  }
  ctx.textAlign='right';
  const unitsY=Math.floor(oy/scale);
  for(let i=-unitsY;i<=unitsY;i+=2){
    if(i===0)continue;
    const y=oy-i*scale;
    if(y<10||y>ch-10)continue;
    ctx.fillText(i,ox-6,y+3);
  }
  ctx.textAlign='left';
  return {ox,oy};
}

function theoryBox(formula,text){
  return `<div class="theory-box"><div class="theory-title">📚 Siddhant (Theory)</div><div class="formula">${formula}</div><div class="theory-text">${text}</div></div>`;
}
function infoCards(cards){
  return `<div class="info-cards">${cards.map(c=>`<div class="info-card"><div class="info-val" id="${c.id}">${c.val}</div><div class="info-lbl">${c.label}</div></div>`).join('')}</div>`;
}

  return `<div class="btn-row">${btns.map(b=>`<button class="sim-btn ${b.cls}" onclick="${b.fn}">${b.label}</button>`).join('')}</div>`;
}

// ============================================================
// 1. PROJECTILE MOTION
// ============================================================
function simProjectile(c,ctx,p){
  let angle=45,speed=15,g=9.8,running=false,t=0,trail=[];
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'projLaunch()',label:'🚀 Launch!'},{cls:'btn-reset',fn:'projReset()',label:'🔄 Reset'}])}
      ${sliderRow('proj_angle','📐 Angle',0,90,45,'°','sv("proj_angle","°");projUpdate()')}
      ${sliderRow('proj_speed','⚡ Speed',5,40,15,' m/s','sv("proj_speed"," m/s");projUpdate()')}
      ${sliderRow('proj_g','🌍 Gravity',1,25,10,' m/s²','sv("proj_g"," m/s²");projUpdate()')}
    </div>
    ${infoCards([{id:'p_range',val:'0',label:'Range (m)'},{id:'p_height',val:'0',label:'Max Height'},{id:'p_time',val:'0',label:'Time (s)'}])}
    ${theoryBox('Range = v²sin(2θ)/g','Angle 45° par range sabse zyada hoti hai. Speed badhane par parabola bada hota hai. Gravity badhane par ball jaldi girti hai.')}
  `);
  function projUpdate(){
    angle=gv('proj_angle');speed=gv('proj_speed');g=gv('proj_g');
    const rad=angle*Math.PI/180;
    const R=(speed*speed*Math.sin(2*rad)/g).toFixed(1);
    const H=(speed*speed*Math.sin(rad)*Math.sin(rad)/(2*g)).toFixed(1);
    const T=(2*speed*Math.sin(rad)/g).toFixed(2);
    if($id('p_range'))$id('p_range').textContent=R;
    if($id('p_height'))$id('p_height').textContent=H;
    if($id('p_time'))$id('p_time').textContent=T;
    if(!running)drawProjectileStatic();
  }
  window.projUpdate=projUpdate;
  window.projLaunch=()=>{running=true;t=0;trail=[];animate();};
  window.projReset=()=>{stopSim();running=false;t=0;trail=[];drawProjectileStatic();};

  function drawProjectileStatic(){
    ctx.clearRect(0,0,c.width,c.height);
    drawGrid(ctx,c);
    // Draw trajectory preview
    const rad=angle*Math.PI/180;
    const scale=c.width/60;
    const gy=c.height-40;
    const ox=30;
    ctx.strokeStyle='rgba(88,166,255,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();
    for(let tt=0;tt<50;tt+=0.1){
      const x=ox+(speed*Math.cos(rad)*tt)*scale/10;
      const y=gy-(speed*Math.sin(rad)*tt-0.5*g*tt*tt)*scale/10;
      if(y>gy)break;
      tt===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();ctx.setLineDash([]);
    // Angle indicator
    ctx.save();ctx.translate(ox,gy);
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(40*Math.cos(rad),-40*Math.sin(rad));ctx.stroke();
    ctx.fillStyle='#ffd43b';ctx.font='12px monospace';ctx.fillText(angle+'°',25,-20);
    ctx.restore();
    // Ground
    ctx.fillStyle='#2d4a6a';ctx.fillRect(0,gy,c.width,c.height-gy);
  }

  function animate(){
    if(!running)return;
    const rad=angle*Math.PI/180;
    const scale=c.width/60;
    const gy=c.height-40;
    const ox=30;
    const x=ox+(speed*Math.cos(rad)*t)*scale/10;
    const y=gy-(speed*Math.sin(rad)*t-0.5*g*t*t)*scale/10;
    trail.push({x,y});
    ctx.clearRect(0,0,c.width,c.height);
    drawGrid(ctx,c);
    ctx.fillStyle='#2d4a6a';ctx.fillRect(0,gy,c.width,c.height-gy);
    // Trail
    ctx.strokeStyle='rgba(88,166,255,0.6)';ctx.lineWidth=2;ctx.beginPath();
    trail.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
    // Ball
    ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fillStyle='#ff6b6b';ctx.fill();
    ctx.strokeStyle='#ff9999';ctx.lineWidth=2;ctx.stroke();
    t+=0.05;
    if(y>=gy){running=false;
      ctx.fillStyle='#ffd43b';ctx.font='bold 14px monospace';
      ctx.fillText('Range: '+((x-ox)/scale*10).toFixed(1)+'m',x-30,gy-10);
    }else{animId=requestAnimationFrame(animate);}
  }
  projUpdate();
}

// ============================================================
// 2. PENDULUM
// ============================================================
function simPendulum(c,ctx,p){
  let L=1.5,running=false,theta=Math.PI/4,omega=0,t=0;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'pendStart()',label:'▶ Start'},{cls:'btn-reset',fn:'pendReset()',label:'🔄 Reset'}])}
      ${sliderRow('pend_L','📏 Length',0.5,3,1.5,' m','sv("pend_L"," m");pendUpdate()')}
      ${sliderRow('pend_angle','📐 Angle',5,60,45,'°','sv("pend_angle","°");pendUpdate()')}
    </div>
    ${infoCards([{id:'pend_T',val:'2.45',label:'Time Period (s)'},{id:'pend_f',val:'0.41',label:'Frequency (Hz)'}])}
    ${theoryBox('T = 2π√(L/g)','Lambaai badhane par time period barhta hai. Angle ka asar sirf chhote anglon par hota hai. g = 9.8 m/s²')}
  `);
  function pendUpdate(){
    L=gv('pend_L');
    const T=(2*Math.PI*Math.sqrt(L/9.8)).toFixed(3);
    const f=(1/parseFloat(T)).toFixed(3);
    if($id('pend_T'))$id('pend_T').textContent=T;
    if($id('pend_f'))$id('pend_f').textContent=f;
    if(!running){theta=gv('pend_angle')*Math.PI/180;drawPend();}
  }
  window.pendUpdate=pendUpdate;
  window.pendStart=()=>{
    if(running){stopSim();running=false;return;}
    running=true;theta=gv('pend_angle')*Math.PI/180;omega=0;
    animId=requestAnimationFrame(animPend);
  };
  window.pendReset=()=>{stopSim();running=false;theta=Math.PI/4;omega=0;drawPend();};

  function drawPend(){
    ctx.clearRect(0,0,c.width,c.height);
    drawGrid(ctx,c);
    const cx=c.width/2,cy=70;
    const pxLen=Math.min(c.height-120,c.width*0.4)*(L/3);
    const bx=cx+pxLen*Math.sin(theta);
    const by=cy+pxLen*Math.cos(theta);
    // String
    ctx.strokeStyle='#8b949e';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(bx,by);ctx.stroke();
    // Pivot
    ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle='#58a6ff';ctx.fill();
    // Bob
    ctx.beginPath();ctx.arc(bx,by,16,0,Math.PI*2);
    ctx.fillStyle='#ff6b6b';ctx.fill();
    ctx.strokeStyle='#ff9999';ctx.lineWidth=2;ctx.stroke();
    // Angle text
    ctx.fillStyle='#ffd43b';ctx.font='12px monospace';
    ctx.fillText((theta*180/Math.PI).toFixed(1)+'°',cx+8,cy+30);
  }
  const dt=0.03;
  function animPend(){
    const alpha=-(9.8/L)*Math.sin(theta);
    omega+=alpha*dt;theta+=omega*dt;
    // Damping
    omega*=0.9995;
    drawPend();
    animId=requestAnimationFrame(animPend);
  }
  pendUpdate();
}

function simGravity(c,ctx,p){
  let planet='earth',running=false,t=0,y=0;
  const gvals={earth:9.8,moon:1.6,mars:3.7,jupiter:24.8,sun:274};
  const pcols={earth:'#74c0fc',moon:'#adb5bd',mars:'#ff6b6b',jupiter:'#ffa94d',sun:'#ffd43b'};
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">🌍 Planet Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:6px">
        ${Object.keys(gvals).map(pl=>`<button class="sim-btn" id="p_${pl}" style="flex:0;padding:8px 12px;background:${pl===planet?pcols[pl]+'44':'var(--card2)'};border:1px solid ${pcols[pl]}" onclick="selPlanet('${pl}')">${getPlanetEmoji(pl)} ${pl}</button>`).join('')}
      </div>
    </div>
    ${btnRow([{cls:'btn-start',fn:'gravDrop()',label:'⬇ Drop Ball'},{cls:'btn-reset',fn:'gravReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'g_val',val:'9.8',label:'g (m/s²)'},{id:'g_t',val:'0',label:'Time (s)'},{id:'g_vel',val:'0',label:'Velocity (m/s)'}])}
    ${theoryBox('h = ½gt²  |  v = gt','Earth par g=9.8, Moon par sirf 1.6! Isliye Moon par objects dhire girte hain. Jupiter par bahut tezi se girenge.')}
  `);
  function getPlanetEmoji(pl){return{earth:'🌍',moon:'🌙',mars:'🔴',jupiter:'🟠',sun:'☀️'}[pl]}
  window.selPlanet=(pl)=>{
    planet=pl;
    document.querySelectorAll('[id^="p_"]').forEach(b=>{
      const n=b.id.replace('p_','');
      b.style.background=n===pl?pcols[pl]+'44':'var(--card2)';
    });
    if($id('g_val'))$id('g_val').textContent=gvals[pl];
    gravReset();
  };
  window.gravDrop=()=>{
    stopSim();running=true;t=0;y=0;
    animId=requestAnimationFrame(animGrav);
  };
  window.gravReset=()=>{stopSim();running=false;t=0;y=0;drawGrav(0,0);};
  function drawGrav(y,v){
    ctx.clearRect(0,0,c.width,c.height);
    const ch=c.height,cw=c.width;
    // Background - space-like
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cw,ch);
    // Stars
    for(let i=0;i<30;i++){
      ctx.beginPath();ctx.arc((i*137)%cw,(i*83)%ch,1,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fill();
    }
    // Ground
    ctx.fillStyle=pcols[planet]+'44';ctx.fillRect(0,ch-30,cw,30);
    ctx.fillStyle=pcols[planet];ctx.font='12px monospace';
    ctx.fillText(planet.toUpperCase()+' (g='+gvals[planet]+')',10,ch-10);
    // Ball
    const bx=cw/2;
    const maxH=ch-60;
    const by=20+Math.min(y/5*(maxH/20),maxH);
    ctx.beginPath();ctx.arc(bx,by,18,0,Math.PI*2);
    ctx.fillStyle='#ff6b6b';ctx.fill();
    ctx.strokeStyle='#ff9999';ctx.lineWidth=2;ctx.stroke();
    // Height indicator
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(bx+25,20);ctx.lineTo(bx+25,by);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#adb5bd';ctx.font='11px monospace';
    ctx.fillText(y.toFixed(1)+'m',bx+28,(20+by)/2);
  }
  const dt=0.05;
  function animGrav(){
    const g=gvals[planet];
    t+=dt;y=0.5*g*t*t;
    const v=g*t;
    if($id('g_t'))$id('g_t').textContent=t.toFixed(2);
    if($id('g_vel'))$id('g_vel').textContent=v.toFixed(1);
    drawGrav(y,v);
    if(y<100)animId=requestAnimationFrame(animGrav);
    else{running=false;}
  }
  drawGrav(0,0);
}

function simWaves(c,ctx,p){
  let A=50,freq=2,phase=0,running=false;
  panel(`
    <div class="ctrl-section">
      ${btnRow([{cls:'btn-start',fn:'waveStart()',label:'▶ Start'},{cls:'btn-reset',fn:'waveStop()',label:'⏸ Stop'}])}
      ${sliderRow('wave_A','📊 Amplitude',10,80,50,' px','sv("wave_A"," px");waveUp()')}
      ${sliderRow('wave_f','🔊 Frequency',1,8,2,' Hz','sv("wave_f"," Hz");waveUp()')}
    </div>
    ${infoCards([{id:'w_wavelength',val:'--',label:'Wavelength'},{id:'w_period',val:'0.5',label:'Period (s)'}])}
    ${theoryBox('v = fλ  |  T = 1/f','Amplitude = wave ki unchai. Frequency = 1 second mein kitne peaks. Wavelength = do peaks ke beech distance.')}
  `);
  function waveUp(){A=gv('wave_A');freq=gv('wave_f');if($id('w_period'))$id('w_period').textContent=(1/freq).toFixed(2);}
  window.waveUp=waveUp;
  window.waveStart=()=>{running=true;animId=requestAnimationFrame(animWave);};
  window.waveStop=()=>{stopSim();running=false;};
  function drawWave(){
    ctx.clearRect(0,0,c.width,c.height);
    drawGrid(ctx,c);
    const cy=c.height/2;
    // Wave 1
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=3;ctx.beginPath();
    for(let x=0;x<c.width;x++){
      const y=cy+A*Math.sin(2*Math.PI*freq*x/c.width+phase);
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    // Wave 2 (different phase)
    ctx.strokeStyle='rgba(255,107,107,0.5)';ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<c.width;x++){
      const y=cy+A*Math.sin(2*Math.PI*freq*x/c.width+phase+Math.PI/2);
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    // Axis
    ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(c.width,cy);ctx.stroke();
    // Labels
    ctx.fillStyle='#58a6ff';ctx.font='11px monospace';
    ctx.fillText('A='+A,5,cy-A-5);
    ctx.fillText('-A='+A,5,cy+A+15);
  }
  function animWave(){phase+=0.05;drawWave();animId=requestAnimationFrame(animWave);}
  drawWave();
}

function simOptics(c,ctx,p){
  let n=1.5,angle=30;
  panel(`
    ${sliderRow('opt_n','💎 Refractive Index',1.0,2.5,1.5,'','sv("opt_n","");optDraw()')}
    ${sliderRow('opt_ang','📐 Incident Angle',5,80,30,'°','sv("opt_ang","°");optDraw()')}
    ${infoCards([{id:'opt_refr',val:'',label:'Refracted Angle'},{id:'opt_crit',val:'',label:'Critical Angle'}])}
    ${theoryBox('n₁sinθ₁ = n₂sinθ₂ (Snell\'s Law)','Jab light ek medium se doosre mein jaati hai, woh mudi (refract) hoti hai. Dense medium mein angle chhota hota hai.')}
  `);
  window.optDraw=()=>{
    n=gv('opt_n');angle=gv('opt_ang');
    const r=Math.asin(Math.sin(angle*Math.PI/180)/n)*180/Math.PI;
    const crit=(Math.asin(1/n)*180/Math.PI).toFixed(1);
    if($id('opt_refr'))$id('opt_refr').textContent=isNaN(r)?'TIR!':r.toFixed(1)+'°';
    if($id('opt_crit'))$id('opt_crit').textContent=crit+'°';
    ctx.clearRect(0,0,c.width,c.height);
    drawGrid(ctx,c);
    const cx=c.width/2,cy=c.height/2;
    // Interface
    ctx.fillStyle='rgba(74,192,246,0.1)';ctx.fillRect(0,cy,c.width,c.height/2);
    ctx.strokeStyle='rgba(74,192,246,0.4)';ctx.lineWidth=2;
    ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(c.width,cy);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#74c0fc';ctx.font='12px monospace';ctx.fillText('Air (n=1)',10,cy-8);
    ctx.fillText('Glass (n='+n+')',10,cy+20);
    // Normal line
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(cx,cy-100);ctx.lineTo(cx,cy+100);ctx.stroke();ctx.setLineDash([]);
    // Incident ray
    const ia=angle*Math.PI/180;
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(cx-100*Math.sin(ia),cy-100*Math.cos(ia));ctx.lineTo(cx,cy);ctx.stroke();
    // Arrow
    ctx.fillStyle='#ffd43b';ctx.fillText('θ₁='+angle+'°',cx-80*Math.sin(ia)-30,cy-80*Math.cos(ia));
    // Refracted/Reflected ray
    if(!isNaN(r)){
      const ra=r*Math.PI/180;
      ctx.strokeStyle='#ff6b6b';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+100*Math.sin(ra),cy+100*Math.cos(ra));ctx.stroke();
      ctx.fillStyle='#ff6b6b';ctx.fillText('θ₂='+r.toFixed(1)+'°',cx+10,cy+50);
    } else {
      ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+80*Math.sin(ia),cy-80*Math.cos(ia));ctx.stroke();
      ctx.fillStyle='#ff6b6b';ctx.fillText('Total Internal Reflection!',cx-80,cy-60);
    }
  };
  optDraw();
}

// 6. ELECTRIC CIRCUIT
// ============================================================
function simCircuit(c,ctx,p){
  let V=5,R=10,running=false,electrons=[];
  panel(`
    ${sliderRow('cir_v','🔋 Voltage (V)',1,20,5,' V','sv("cir_v"," V");cirUpdate()')}
    ${sliderRow('cir_r','🔌 Resistance (Ω)',1,50,10,' Ω','sv("cir_r"," Ω");cirUpdate()')}
    ${btnRow([{cls:'btn-start',fn:'cirStart()',label:'💡 Switch ON'},{cls:'btn-reset',fn:'cirOff()',label:'⭕ Switch OFF'}])}
    ${infoCards([{id:'cir_I',val:'0.50',label:'Current (A)'},{id:'cir_P',val:'2.50',label:'Power (W)'},{id:'cir_bright',val:'Medium',label:'Brightness'}])}
    ${theoryBox('V = IR  (Ohm\'s Law)','Voltage = Current × Resistance. Zyada voltage ya kam resistance = zyada current = zyada roshan bulb!')}
  `);
  function cirUpdate(){
    V=gv('cir_v');R=gv('cir_r');
    const I=V/R,P=V*I;
    if($id('cir_I'))$id('cir_I').textContent=I.toFixed(2);
    if($id('cir_P'))$id('cir_P').textContent=P.toFixed(2);
    const b=P<2?'Dim':P<8?'Medium':'Bright!';
    if($id('cir_bright'))$id('cir_bright').textContent=b;
    drawCircuit();
  }
  window.cirUpdate=cirUpdate;
  window.cirStart=()=>{running=true;for(let i=0;i<8;i++)electrons.push({t:i/8});animId=requestAnimationFrame(animCir);};
  window.cirOff=()=>{stopSim();running=false;electrons=[];drawCircuit();};

  function drawCircuit(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cw=c.width,ch=c.height;
    const I=V/R,P=V*I;
    const glow=Math.min(1,P/20);
    // Circuit path
    const pad=40,bh=ch*0.7,bw=cw*0.7,ox=(cw-bw)/2,oy=(ch-bh)/2;
    ctx.strokeStyle='#2d4a6a';ctx.lineWidth=4;ctx.strokeRect(ox,oy,bw,bh);
    // Battery (left)
    const bx=ox,by=oy+bh/2;
    ctx.fillStyle='#ffd43b';ctx.fillRect(bx-15,by-25,12,50);
    ctx.fillStyle='#ffd43b';ctx.fillRect(bx-8,by-15,8,30);
    ctx.fillStyle='#adb5bd';ctx.font='bold 11px monospace';
    ctx.fillText(V+'V',bx-30,by+5);
    ctx.fillText('+',bx-12,by-28);ctx.fillText('-',bx-12,by+38);
    // Bulb (right)
    const lx=ox+bw,ly=oy+bh/2;
    if(running&&glow>0){
      const gradient=ctx.createRadialGradient(lx,ly,0,lx,ly,40*glow+10);
      gradient.addColorStop(0,`rgba(255,220,100,${glow})`);
      gradient.addColorStop(1,'transparent');
      ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(lx,ly,50,0,Math.PI*2);ctx.fill();
    }
    ctx.beginPath();ctx.arc(lx,ly,18,0,Math.PI*2);
    ctx.fillStyle=running?`rgba(255,220,0,${0.3+glow*0.7})`:'#2d4a6a';
    ctx.fill();ctx.strokeStyle='#adb5bd';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#adb5bd';ctx.font='10px monospace';ctx.fillText('💡',lx-8,ly+4);
    // Resistance label
    ctx.fillStyle='#ff9999';ctx.font='11px monospace';ctx.fillText(R+'Ω',ox+bw/2-15,oy-8);
    // Current label
    if(running){ctx.fillStyle='#74c0fc';ctx.font='11px monospace';ctx.fillText('I='+I.toFixed(2)+'A',ox+bw/2-25,oy+bh+18);}
  }
  function animCir(){
    drawCircuit();
    const cw=c.width,ch=c.height;
    const pad=40,bh=ch*0.7,bw=cw*0.7,ox=(cw-bw)/2,oy=(ch-bh)/2;
    const I=V/R,speed=I/20;
    electrons.forEach(e=>{
      e.t=(e.t+speed)%1;
      const path=getCircuitPath(ox,oy,bw,bh);
      const pos=getPathPos(path,e.t);
      ctx.beginPath();ctx.arc(pos.x,pos.y,5,0,Math.PI*2);
      ctx.fillStyle='#58a6ff';ctx.fill();
      ctx.beginPath();ctx.arc(pos.x,pos.y,8,0,Math.PI*2);
      ctx.fillStyle='rgba(88,166,255,0.3)';ctx.fill();
    });
    animId=requestAnimationFrame(animCir);
  }
  function getCircuitPath(ox,oy,bw,bh){
    return [{x:ox,y:oy},{x:ox+bw,y:oy},{x:ox+bw,y:oy+bh},{x:ox,y:oy+bh}];
  }
  function getPathPos(path,t){
    const total=4,seg=t*total;const i=Math.floor(seg)%4;
    const frac=seg-Math.floor(seg);
    const a=path[i],b=path[(i+1)%4];
    return{x:a.x+(b.x-a.x)*frac,y:a.y+(b.y-a.y)*frac};
  }
  cirUpdate();
}

function simCollision(c,ctx,p){
  let m1=2,m2=2,v1=5,v2=-2,running=false;
  let x1=80,x2=0,cv1=v1,cv2=v2,collided=false;
  panel(`
    ${sliderRow('col_m1','⚫ Mass 1',1,5,2,' kg','sv("col_m1"," kg");colUp()')}
    ${sliderRow('col_m2','🔵 Mass 2',1,5,2,' kg','sv("col_m2"," kg");colUp()')}
    ${sliderRow('col_v1','→ Velocity 1',-10,10,5,' m/s','sv("col_v1"," m/s");colUp()')}
    ${sliderRow('col_v2','← Velocity 2',-10,10,-2,' m/s','sv("col_v2"," m/s");colUp()')}
    ${btnRow([{cls:'btn-start',fn:'colStart()',label:'💥 Collide!'},{cls:'btn-reset',fn:'colReset()',label:'🔄 Reset'}])}
    ${infoCards([{id:'col_p_before',val:'',label:'p Before'},{id:'col_p_after',val:'',label:'p After'},{id:'col_v1f',val:'',label:'v1 After'},{id:'col_v2f',val:'',label:'v2 After'}])}
    ${theoryBox('m₁v₁ + m₂v₂ = m₁v₁\' + m₂v₂\'','Elastic collision mein total momentum aur kinetic energy dono conserve hoti hain. Heavy ball chhoti ball ko zyada push karta hai.')}
  `);
  function colUp(){
    m1=gv('col_m1');m2=gv('col_m2');v1=gv('col_v1');v2=gv('col_v2');
    const p=(m1*v1+m2*v2).toFixed(2);
    if($id('col_p_before'))$id('col_p_before').textContent=p;
    // Elastic collision formulas
    const v1f=((m1-m2)*v1+2*m2*v2)/(m1+m2);
    const v2f=((m2-m1)*v2+2*m1*v1)/(m1+m2);
    const pf=(m1*v1f+m2*v2f).toFixed(2);
    if($id('col_v1f'))$id('col_v1f').textContent=v1f.toFixed(2)+' m/s';
    if($id('col_v2f'))$id('col_v2f').textContent=v2f.toFixed(2)+' m/s';
    if($id('col_p_after'))$id('col_p_after').textContent=pf;
    if(!running)drawCol();
  }
  window.colUp=colUp;
  window.colStart=()=>{cv1=v1;cv2=v2;x1=c.width*0.2;x2=c.width*0.8;collided=false;running=true;animId=requestAnimationFrame(animCol);};
  window.colReset=()=>{stopSim();running=false;drawCol();};
  function r1(){return 10+m1*8;}
  function r2(){return 10+m2*8;}
  function drawCol(){
    ctx.clearRect(0,0,c.width,c.height);
    drawGrid(ctx,c);
    const cy=c.height/2;
    // Ground
    ctx.fillStyle='#2d4a6a';ctx.fillRect(0,cy+r1()+2,c.width,4);
    // Ball 1
    ctx.beginPath();ctx.arc(x1,cy,r1(),0,Math.PI*2);
    ctx.fillStyle='#ff6b6b';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(m1+'kg',x1,cy+5);
    ctx.textAlign='left';
    // Velocity arrow 1
    const ax=x1+r1()*Math.sign(cv1);
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(ax,cy-r1()-10);ctx.lineTo(ax+cv1*5,cy-r1()-10);ctx.stroke();
    // Ball 2
    ctx.beginPath();ctx.arc(x2,cy,r2(),0,Math.PI*2);
    ctx.fillStyle='#58a6ff';ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(m2+'kg',x2,cy+5);
    ctx.textAlign='left';
  }
  function animCol(){
    x1+=cv1*1.5;x2+=cv2*1.5;
    if(!collided&&Math.abs(x1-x2)<r1()+r2()){
      collided=true;
      const v1f=((m1-m2)*cv1+2*m2*cv2)/(m1+m2);
      const v2f=((m2-m1)*cv2+2*m1*cv1)/(m1+m2);
      cv1=v1f;cv2=v2f;
      // Flash
      ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(0,0,c.width,c.height);
    }
    drawCol();
    if(x1>c.width+50||x1<-50)running=false;
    if(running)animId=requestAnimationFrame(animCol);
  }
  colUp();
}

function simMagnet(c,ctx,p){
  panel(`
    ${sliderRow('mag_str','🧲 Strength',1,10,5,'','sv("mag_str","");magDraw()')}
    <div class="btn-row">
      <button class="sim-btn btn-start" onclick="setMagPol(1)">N-S Poles</button>
      <button class="sim-btn btn-reset" onclick="setMagPol(2)">Same Poles</button>
    </div>
    ${theoryBox('F = qv × B','Magnetic field lines N pole se nikl kar S pole mein enter karti hain. Same poles repel karte hain, opposite poles attract.')}
  `);
  let polarity=1;
  window.setMagPol=(p)=>{polarity=p;magDraw();};
  window.magDraw=()=>{
    const str=gv('mag_str');
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cx=c.width/2,cy=c.height/2;
    const mag1={x:cx-80,y:cy,pol:1};
    const mag2={x:cx+80,y:cy,pol:polarity};
    // Draw field lines
    for(let angle=0;angle<360;angle+=20){
      ctx.beginPath();ctx.strokeStyle=`rgba(255,107,107,0.4)`;ctx.lineWidth=1;
      let px=mag1.x+20*Math.cos(angle*Math.PI/180);
      let py=mag1.y+20*Math.sin(angle*Math.PI/180);
      ctx.moveTo(px,py);
      for(let step=0;step<80;step++){
        let fx=0,fy=0;
        [mag1,mag2].forEach(m=>{
          const dx=px-m.x,dy=py-m.y;
          const r=Math.sqrt(dx*dx+dy*dy)+1;
          const f=str*m.pol/(r*r);
          fx+=f*dx/r;fy+=f*dy/r;
        });
        const len=Math.sqrt(fx*fx+fy*fy)+0.001;
        px+=fx/len*4;py+=fy/len*4;
        if(px<0||px>c.width||py<0||py>c.height)break;
        ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    // Draw magnets
    [{m:mag1,label:'N'},{m:mag2,label:polarity===1?'S':'N'}].forEach(({m,label})=>{
      ctx.fillStyle=label==='N'?'#ff6b6b':'#58a6ff';
      ctx.fillRect(m.x-22,m.y-14,44,28);
      ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';
      ctx.fillText(label,m.x,m.y+5);ctx.textAlign='left';
    });
  };
  magDraw();
}

function simAtomic(c,ctx,p){
  const elements=[
    {name:'Hydrogen',sym:'H',Z:1,N:0,shells:[1],color:'#74c0fc'},
    {name:'Helium',sym:'He',Z:2,N:2,shells:[2],color:'#a9e34b'},
    {name:'Carbon',sym:'C',Z:6,N:6,shells:[2,4],color:'#ff9f43'},
    {name:'Oxygen',sym:'O',Z:8,N:8,shells:[2,6],color:'#ff6b6b'},
    {name:'Sodium',sym:'Na',Z:11,N:12,shells:[2,8,1],color:'#ffd43b'},
    {name:'Chlorine',sym:'Cl',Z:17,N:18,shells:[2,8,7],color:'#69db7c'},
    {name:'Iron',sym:'Fe',Z:26,N:30,shells:[2,8,14,2],color:'#e8590c'},
  ];
  let selEl=0,angle=0;
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">⚛️ Element Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:6px">
        ${elements.map((el,i)=>`<button class="sim-btn" onclick="selAtom(${i})" id="atbtn_${i}" style="flex:0;padding:6px 12px;background:${i===0?el.color+'33':'var(--card2)'};border:1px solid ${el.color}44;color:${el.color}">${el.sym}</button>`).join('')}
      </div>
    </div>
    ${infoCards([{id:'at_proton',val:'1',label:'Protons (Z)'},{id:'at_neutron',val:'0',label:'Neutrons (N)'},{id:'at_mass',val:'1',label:'Mass No.'}])}
    ${theoryBox('Mass Number = Protons + Neutrons','Nucleus mein protons aur neutrons hote hain. Electrons shells mein ghoomte hain. Proton count = Atomic Number (Z).')}
  `);
  window.selAtom=(i)=>{
    selEl=i;
    elements.forEach((_,j)=>{
      const b=$id('atbtn_'+j);
      if(b)b.style.background=j===i?elements[j].color+'33':'var(--card2)';
    });
    const el=elements[i];
    if($id('at_proton'))$id('at_proton').textContent=el.Z;
    if($id('at_neutron'))$id('at_neutron').textContent=el.N;
    if($id('at_mass'))$id('at_mass').textContent=el.Z+el.N;
  };
  function drawAtom(){
    const el=elements[selEl];
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cx=c.width/2,cy=c.height/2;
    // Orbits
    el.shells.forEach((count,si)=>{
      const r=35+si*35;
      ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      // Electrons
      for(let i=0;i<count;i++){
        const ea=angle+i*(2*Math.PI/count)+(si*0.7);
        const ex=cx+r*Math.cos(ea);const ey=cy+r*Math.sin(ea);
        ctx.beginPath();ctx.arc(ex,ey,5,0,Math.PI*2);
        ctx.fillStyle='#58a6ff';ctx.fill();
        const glr=ctx.createRadialGradient(ex,ey,0,ex,ey,8);
        glr.addColorStop(0,'rgba(88,166,255,0.3)');glr.addColorStop(1,'transparent');
        ctx.fillStyle=glr;ctx.beginPath();ctx.arc(ex,ey,8,0,Math.PI*2);ctx.fill();
      }
    });
    // Nucleus
    const nr=20;
    const nucGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,nr);
    nucGrad.addColorStop(0,el.color);nucGrad.addColorStop(1,el.color+'88');
    ctx.beginPath();ctx.arc(cx,cy,nr,0,Math.PI*2);ctx.fillStyle=nucGrad;ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText(el.sym,cx,cy+5);ctx.textAlign='left';
    // Label
    ctx.fillStyle=el.color;ctx.font='13px monospace';
    ctx.fillText(el.name+' (Z='+el.Z+')',10,20);
    angle+=0.02;animId=requestAnimationFrame(drawAtom);
  }
  animId=requestAnimationFrame(drawAtom);
}

// CHEMISTRY: pH SCALE
// ============================================================
function simPH(c,ctx,p){
  panel(`
    ${sliderRow('ph_val','🧪 pH Value',0,14,7,'','sv("ph_val","");phDraw()')}
    ${infoCards([{id:'ph_type',val:'Neutral',label:'Type'},{id:'ph_h',val:'1e-7',label:'[H⁺] mol/L'},{id:'ph_example',val:'Pure Water',label:'Example'}])}
    ${theoryBox('pH = -log₁₀[H⁺]','pH < 7 = Acidic (Khattha). pH = 7 = Neutral. pH > 7 = Basic/Alkaline. Strong acids ka pH 0-2, strong bases ka pH 12-14 hota hai.')}
  `);
  const examples=['Battery Acid','Lemon Juice','Vinegar','Orange','Tomato','Coffee','Milk','Pure Water','Sea Water','Baking Soda','Milk of Magnesia','Ammonia','Bleach','Oven Cleaner','Drain Cleaner'];
  window.phDraw=()=>{
    const ph=gv('ph_val');
    const hconc=Math.pow(10,-ph).toExponential(1);
    const type=ph<7?'Acidic (अम्लीय)':ph>7?'Basic (क्षारीय)':'Neutral (उदासीन)';
    if($id('ph_type'))$id('ph_type').textContent=type;
    if($id('ph_h'))$id('ph_h').textContent=hconc;

// ============================================================
function simStates(c,ctx,p){
  let temp=25,particles=[],running=true;
  for(let i=0;i<40;i++)particles.push({x:50+Math.random()*(c.width-100),y:50+Math.random()*(c.height-100),vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2});
  panel(`
    ${sliderRow('st_temp','🌡️ Temperature',-50,400,25,'°C','sv("st_temp","°C");stUp()')}
    ${infoCards([{id:'st_state',val:'Liquid',label:'State'},{id:'st_motion',val:'Medium',label:'Particle Motion'}])}
    ${theoryBox('Solid → Liquid → Gas','Temperature badhane par particles zyada tezi se hilte hain aur zyada jagah letein hain. Solid mein particles fixed hote hain.')}
  `);
  window.stUp=()=>{temp=gv('st_temp');
    const s=temp<0?'Solid (ठोस)':temp<100?'Liquid (द्रव)':'Gas (गैस)';
    const m=temp<0?'Bahut Slow':temp<100?'Medium':'Bahut Fast!';
    if($id('st_state'))$id('st_state').textContent=s;
    if($id('st_motion'))$id('st_motion').textContent=m;
  };
  function animState(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const speed=Math.max(0.1,temp/40+0.5);
    const col=temp<0?'#74c0fc':temp<100?'#a9e34b':'#ff6b6b';
    // Container
    ctx.strokeStyle='#2d4a6a';ctx.lineWidth=2;ctx.strokeRect(20,20,c.width-40,c.height-40);
    particles.forEach(pt=>{
      // Solid: restrict movement
      if(temp<0){pt.vx*=0.3;pt.vy*=0.3;}
      else{
        pt.vx+=(Math.random()-0.5)*0.3*speed;
        pt.vy+=(Math.random()-0.5)*0.3*speed;
        const maxV=speed*2;
        pt.vx=Math.max(-maxV,Math.min(maxV,pt.vx));
        pt.vy=Math.max(-maxV,Math.min(maxV,pt.vy));
      }
      pt.x+=pt.vx;pt.y+=pt.vy;
      if(pt.x<28)pt.x=28;if(pt.x>c.width-28)pt.x=c.width-28;
      if(pt.y<28)pt.y=28;if(pt.y>c.height-28)pt.y=c.height-28;
      if(pt.x<=28||pt.x>=c.width-28)pt.vx*=-0.8;
      if(pt.y<=28||pt.y>=c.height-28)pt.vy*=-0.8;
      ctx.beginPath();ctx.arc(pt.x,pt.y,6,0,Math.PI*2);
      ctx.fillStyle=col+'cc';ctx.fill();
      const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,8);
      g.addColorStop(0,col+'44');g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(pt.x,pt.y,8,0,Math.PI*2);ctx.fill();
    });
    // Temp display
    ctx.fillStyle=col;ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillText(temp+'°C',c.width/2,c.height-5);ctx.textAlign='left';
    animId=requestAnimationFrame(animState);
  }
  animId=requestAnimationFrame(animState);
}

function simGraph(c,ctx,p){
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">📈 Function Type</div>
      <div class="btn-row" style="flex-wrap:wrap">
        <button class="sim-btn" style="flex:0;padding:6px 10px" onclick="setFn('linear')">y=mx+c</button>
        <button class="sim-btn" style="flex:0;padding:6px 10px" onclick="setFn('quad')">y=ax²+bx+c</button>
        <button class="sim-btn" style="flex:0;padding:6px 10px" onclick="setFn('sin')">y=sin(x)</button>
        <button class="sim-btn" style="flex:0;padding:6px 10px" onclick="setFn('cos')">y=cos(x)</button>
      </div>
    </div>
    <div id="fn_controls"></div>
    ${theoryBox('f(x) = ?','Linear function: seedhi line. Quadratic: U-shaped parabola. Sin/Cos: wave pattern. Slope (m) = line ki dhalan.')}
  `);
  let fnType='linear',m=1,b_c=0,a=1,bb=0;
  window.setFn=(t)=>{fnType=t;renderFnControls();graphDraw();};
  function renderFnControls(){
    let html='';
    if(fnType==='linear'){html=sliderRow('fn_m','m (Slope)',-5,5,1,'','sv("fn_m","");graphDraw()')+sliderRow('fn_b','c (Intercept)',-10,10,0,'','sv("fn_b","");graphDraw()');}
    else if(fnType==='quad'){html=sliderRow('fn_a','a',-3,3,1,'','sv("fn_a","");graphDraw()')+sliderRow('fn_b','b',-5,5,0,'','sv("fn_b","");graphDraw()')+sliderRow('fn_c2','c',-10,10,0,'','sv("fn_c2","");graphDraw()');}
    else html=sliderRow('fn_amp','Amplitude',0.5,3,1,'','sv("fn_amp","");graphDraw()')+sliderRow('fn_freq','Frequency',0.5,4,1,'','sv("fn_freq","");graphDraw()');
    $id('fn_controls').innerHTML=html;
  }
  window.graphDraw=()=>{
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cw=c.width,ch=c.height;
    const ox=cw/2,oy=ch/2,scale=30;
    // Grid
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
    for(let x=ox%scale;x<cw;x+=scale){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();}
    for(let y=oy%scale;y<ch;y+=scale){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();}
    // Axes
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(cw,oy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,ch);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='10px monospace';
    ctx.fillText('x',cw-15,oy-5);ctx.fillText('y',ox+5,12);
    // Plot
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.beginPath();
    let started=false;
    for(let px=0;px<cw;px++){
      const xv=(px-ox)/scale;
      let yv=0;
      if(fnType==='linear'){yv=gv('fn_m')*xv+gv('fn_b');}
      else if(fnType==='quad'){yv=gv('fn_a')*xv*xv+gv('fn_b')*xv+gv('fn_c2');}
      else if(fnType==='sin'){yv=gv('fn_amp')*Math.sin(gv('fn_freq')*xv);}
      else{yv=gv('fn_amp')*Math.cos(gv('fn_freq')*xv);}
      const py=oy-yv*scale;
      if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
    }
    ctx.stroke();
  };
  renderFnControls();graphDraw();
}

function simTriangle(c,ctx,p){
  panel(`
    ${sliderRow('tri_a','📏 Side a',1,10,3,'','sv("tri_a","");triDraw()')}
    ${sliderRow('tri_b','📏 Side b',1,10,4,'','sv("tri_b","");triDraw()')}
    ${infoCards([{id:'tri_c',val:'5.00',label:'c (Hypotenuse)'},{id:'tri_area',val:'6.00',label:'Area (sq units)'}])}
    ${theoryBox('a² + b² = c²','Right angle triangle mein: do chhoti sides ka square ka sum = badi side (hypotenuse) ke square ke barabar hota hai. 3-4-5 famous triplet hai!')}
  `);
  window.triDraw=()=>{
    const a=gv('tri_a'),b=gv('tri_b');
    const c2=Math.sqrt(a*a+b*b);
    const area=(0.5*a*b).toFixed(2);
    if($id('tri_c'))$id('tri_c').textContent=c2.toFixed(2);
    if($id('tri_area'))$id('tri_area').textContent=area;
    ctx.clearRect(0,0,c.width,c.height);
    drawGrid(ctx,c);
    const scale=Math.min((c.width-80)/(a+2),(c.height-80)/(b+2));
    const ox=40,oy=c.height-40;
    const ax=ox+a*scale,ay=oy;
    const bx=ox,by=oy-b*scale;
    // Fill
    ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ax,ay);ctx.lineTo(bx,by);ctx.closePath();
    ctx.fillStyle='rgba(88,166,255,0.15)';ctx.fill();
    ctx.strokeStyle='#58a6ff';ctx.lineWidth=3;ctx.stroke();
    // Right angle
    ctx.strokeStyle='#ffd43b';ctx.lineWidth=2;
    ctx.strokeRect(ox,oy-15,15,-15);
    // Labels
    ctx.fillStyle='#ff6b6b';ctx.font='bold 15px monospace';ctx.textAlign='center';
    ctx.fillText('a='+a,(ox+ax)/2,oy+20);
    ctx.fillStyle='#74c0fc';ctx.fillText('b='+b,ox-22,(oy+by)/2);
    ctx.fillStyle='#ffd43b';
    const midx=(ax+bx)/2+5,midy=(ay+by)/2-5;
    ctx.fillText('c='+c2.toFixed(1),midx,midy);
    ctx.textAlign='left';
    // Formula
    ctx.fillStyle='#adb5bd';ctx.font='13px monospace';
    ctx.fillText(a+'²+'+b+'²='+c2.toFixed(1)+'²',10,22);
    ctx.fillText((a*a)+'+'+(b*b)+'='+Math.round(c2*c2),10,38);
  };
  triDraw();
}

// ============================================================
function simProbability(c,ctx,p){
  let rolls=[],coinFlips=[];
  panel(`
    <div class="btn-row">
      <button class="sim-btn btn-start" onclick="rollDice()">🎲 Dice Throw</button>
      <button class="sim-btn" style="background:#ffd43b;color:#000" onclick="flipCoin()">🪙 Coin Flip</button>
      <button class="sim-btn btn-reset" onclick="clearProb()">🔄 Clear</button>
    </div>
    <div id="prob_result" style="font-size:28px;text-align:center;padding:8px;font-family:var(--font);min-height:50px"></div>
    ${infoCards([{id:'prob_total',val:'0',label:'Total Throws'},{id:'prob_heads',val:'0%',label:'Heads %'},{id:'prob_six',val:'0%',label:'Six %'}])}
    ${theoryBox('P(event) = Favorable / Total','Theoretical probability: Coin heads = 50%, Dice six = 16.7%. Zyada throws karo — probability theoretical value ke paas aati hai!')}
  `);
  window.rollDice=()=>{
    const r=Math.floor(Math.random()*6)+1;
    rolls.push(r);
    $id('prob_result').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r-1]+' '+r;
    updateProb();drawProbChart();
  };
  window.flipCoin=()=>{
    const h=Math.random()>0.5;
    coinFlips.push(h);
    $id('prob_result').textContent=h?'🪙 Heads!':'🟫 Tails!';
    updateProb();drawProbChart();
  };
  window.clearProb=()=>{rolls=[];coinFlips=[];$id('prob_result').textContent='';updateProb();ctx.clearRect(0,0,c.width,c.height);drawGrid(ctx,c);};
  function updateProb(){
    const total=rolls.length+coinFlips.length;
    const heads=coinFlips.filter(h=>h).length;
    const sixes=rolls.filter(r=>r===6).length;
    if($id('prob_total'))$id('prob_total').textContent=total;
    if($id('prob_heads'))$id('prob_heads').textContent=coinFlips.length?Math.round(heads/coinFlips.length*100)+'%':'0%';
    if($id('prob_six'))$id('prob_six').textContent=rolls.length?Math.round(sixes/rolls.length*100)+'%':'0%';
  }
  function drawProbChart(){
    ctx.clearRect(0,0,c.width,c.height);drawGrid(ctx,c);
    if(rolls.length===0)return;
    const counts=[0,0,0,0,0,0];
    rolls.forEach(r=>counts[r-1]++);
    const max=Math.max(...counts,1);
    const bw=(c.width-60)/6,bh=c.height-70;
    ctx.fillStyle='rgba(255,255,255,0.1)';ctx.font='11px monospace';
    counts.forEach((cnt,i)=>{
      const h=(cnt/max)*bh;
      const x=30+i*bw;const y=c.height-40;
      // Bar
      ctx.fillStyle=['#ff6b6b','#ffa94d','#ffd43b','#a9e34b','#74c0fc','#cc5de8'][i];
      ctx.fillRect(x+2,y-h,bw-4,h);
      ctx.fillStyle='#fff';ctx.textAlign='center';
      ctx.fillText(i+1+'⚂',x+bw/2,y+14);
      if(cnt>0)ctx.fillText(cnt,x+bw/2,y-h-5);
    });
    // Theoretical line
    const thH=(rolls.length/6/max)*bh;
    ctx.strokeStyle='#ffd43b';ctx.setLineDash([4,4]);ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(30,c.height-40-thH);ctx.lineTo(c.width-10,c.height-40-thH);ctx.stroke();
    ctx.setLineDash([]);ctx.fillStyle='#ffd43b';ctx.textAlign='left';
    ctx.fillText('Expected',5,c.height-40-thH-5);
    ctx.textAlign='left';
  }
  drawGrid(ctx,c);
}

function simFraction(c,ctx,p){
  panel(`
    ${sliderRow('fr_num','Numerator (ऊपर)',1,11,1,'','sv("fr_num","");frDraw()')}
    ${sliderRow('fr_den','Denominator (नीचे)',2,12,4,'','sv("fr_den","");frDraw()')}
    ${infoCards([{id:'fr_val',val:'0.25',label:'Decimal Value'},{id:'fr_pct',val:'25%',label:'Percentage'},{id:'fr_simp',val:'1/4',label:'Simplified'}])}
    ${theoryBox('Fraction = Parts / Whole','Pizza ke teede sochna sabse aasaan hai! 1/4 = 4 mein se 1 hissa. 3/4 ka matlab 4 mein se 3 hisse.')}
  `);
  window.frDraw=()=>{
    let num=Math.min(gv('fr_num'),gv('fr_den'));
    const den=gv('fr_den');
    const val=(num/den).toFixed(3);
    const pct=Math.round(num/den*100)+'%';
    function gcd(a,b){return b?gcd(b,a%b):a;}
    const g=gcd(num,den);
    if($id('fr_val'))$id('fr_val').textContent=val;
    if($id('fr_pct'))$id('fr_pct').textContent=pct;
    if($id('fr_simp'))$id('fr_simp').textContent=(num/g)+'/'+(den/g);
    // Draw pizza
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cx=c.width/2,cy=c.height/2,r=Math.min(c.width,c.height)/2-20;
    const sliceAngle=2*Math.PI/den;
    for(let i=0;i<den;i++){
      const start=-Math.PI/2+i*sliceAngle;
      const end=start+sliceAngle;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();
      ctx.fillStyle=i<num?'#ff9f43':'#2d4a6a';ctx.fill();
      ctx.strokeStyle='#0d1117';ctx.lineWidth=3;ctx.stroke();
    }
    // Labels
    ctx.fillStyle='#fff';ctx.font='bold 22px monospace';ctx.textAlign='center';
    ctx.fillText(num+'/'+den,cx,cy+8);
    ctx.font='14px monospace';ctx.fillStyle='#adb5bd';
    ctx.fillText(pct+' = '+val,cx,cy+r+20);ctx.textAlign='left';
  };
  frDraw();
}

function simVectors(c,ctx,p){
  panel(`
    ${sliderRow('v1x','V1 → (X)',0,8,3,'','sv("v1x","");vecDraw()')}
    ${sliderRow('v1y','V1 ↑ (Y)',0,8,4,'','sv("v1y","");vecDraw()')}
    ${sliderRow('v2x','V2 → (X)',0,8,2,'','sv("v2x","");vecDraw()')}
    ${sliderRow('v2y','V2 ↑ (Y)',0,8,3,'','sv("v2y","");vecDraw()')}
    ${infoCards([{id:'vec_rx',val:'',label:'Resultant X'},{id:'vec_ry',val:'',label:'Resultant Y'},{id:'vec_mag',val:'',label:'Magnitude'}])}
    ${theoryBox('R = V1 + V2  |  |R| = √(Rx²+Ry²)','Vectors ke X aur Y components alag-alag add hote hain. Resultant vector ki magnitude Pythagoras theorem se nikalte hain.')}
  `);
  window.vecDraw=()=>{
    const v1x=gv('v1x'),v1y=gv('v1y'),v2x=gv('v2x'),v2y=gv('v2y');
    const rx=v1x+v2x,ry=v1y+v2y;
    const mag=Math.sqrt(rx*rx+ry*ry).toFixed(2);
    if($id('vec_rx'))$id('vec_rx').textContent=rx;
    if($id('vec_ry'))$id('vec_ry').textContent=ry;
    if($id('vec_mag'))$id('vec_mag').textContent=mag;
    ctx.clearRect(0,0,c.width,c.height);drawGrid(ctx,c);
    const ox=60,oy=c.height-60,scale=30;
    // Axes
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(ox,20);ctx.lineTo(ox,oy+20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ox-20,oy);ctx.lineTo(c.width-20,oy);ctx.stroke();
    function drawArrow(sx,sy,ex,ey,col,label){
      ctx.strokeStyle=col;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
      const ang=Math.atan2(ey-sy,ex-sx);
      ctx.fillStyle=col;ctx.beginPath();
      ctx.moveTo(ex,ey);
      ctx.lineTo(ex-12*Math.cos(ang-0.4),ey-12*Math.sin(ang-0.4));
      ctx.lineTo(ex-12*Math.cos(ang+0.4),ey-12*Math.sin(ang+0.4));
      ctx.closePath();ctx.fill();
      ctx.font='bold 12px monospace';ctx.fillText(label,(sx+ex)/2+5,(sy+ey)/2-5);
    }
    drawArrow(ox,oy,ox+v1x*scale,oy-v1y*scale,'#58a6ff','V1('+v1x+','+v1y+')');
    drawArrow(ox+v1x*scale,oy-v1y*scale,ox+v1x*scale+v2x*scale,oy-v1y*scale-v2y*scale,'#ff9f43','V2('+v2x+','+v2y+')');
    drawArrow(ox,oy,ox+rx*scale,oy-ry*scale,'#ff6b6b','R('+rx+','+ry+')='+mag);
  };
  vecDraw();
}

function simCell(c,ctx,p){
  const parts=[
    {name:'Nucleus',hindi:'केंद्रक',desc:'Cell ka control center. DNA yahan hota hai.',col:'#ff6b6b',x:0.5,y:0.45,r:0.12},
    {name:'Mitochondria',hindi:'माइटोकॉन्ड्रिया',desc:'Cell ki power house — energy banata hai (ATP).',col:'#ffd43b',x:0.3,y:0.35,r:0.07},
    {name:'Cell Membrane',hindi:'कोशिका झिल्ली',desc:'Cell ki outer boundary. Materials in/out regulate karta hai.',col:'#74c0fc',x:0.5,y:0.5,r:0.45},
    {name:'Ribosome',hindi:'राइबोसोम',desc:'Protein synthesis hoti hai yahan.',col:'#a9e34b',x:0.65,y:0.3,r:0.04},
    {name:'Endoplasmic Reticulum',hindi:'अन्तद्रव्यी जालिका',desc:'Protein aur lipid transport network.',col:'#cc5de8',x:0.5,y:0.6,r:0.08},
    {name:'Vacuole',hindi:'रिक्तिका',desc:'Storage organelle — paani, waste, nutrients.',col:'#69db7c',x:0.7,y:0.6,r:0.08},
  ];
  let sel=null;
  function drawCell(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cw=c.width,ch=c.height;
    // Cytoplasm
    ctx.beginPath();ctx.ellipse(cw/2,ch/2,cw*0.45,ch*0.45,0,0,Math.PI*2);
    ctx.fillStyle='rgba(74,192,246,0.05)';ctx.fill();
    ctx.strokeStyle='#74c0fc';ctx.lineWidth=3;ctx.stroke();
    // Parts
    parts.forEach((pt,i)=>{
      const px=pt.x*cw,py=pt.y*ch,pr=pt.r*Math.min(cw,ch);
      ctx.beginPath();
      if(i===4){ctx.ellipse(px,py,pr*2,pr*0.6,0,0,Math.PI*2);}
      else ctx.arc(px,py,pr,0,Math.PI*2);
      ctx.fillStyle=pt.col+(sel===i?'cc':'44');ctx.fill();
      ctx.strokeStyle=pt.col;ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=sel===i?'#fff':'rgba(255,255,255,0.6)';
      ctx.font=(sel===i?'bold ':'')+Math.max(8,pr*0.6)+'px monospace';
      ctx.textAlign='center';ctx.fillText(pt.name,px,py+4);
      ctx.textAlign='left';
    });
  }
  function panelHtml(){
    return `<div class="ctrl-section">
      <div class="ctrl-label">🔬 Part Chunno</div>
      <div class="btn-row" style="flex-wrap:wrap;gap:4px">
        ${parts.map((pt,i)=>`<button class="sim-btn" onclick="selCell(${i})" style="flex:0;padding:5px 10px;font-size:12px;background:${sel===i?pt.col+'33':'var(--card2)'};border:1px solid ${pt.col}44;color:${pt.col}">${pt.name}</button>`).join('')}
      </div>
    </div>
    <div id="cell_info" style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:8px">
      <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:4px">${sel!==null?parts[sel].name:'Koi part chunno...'}</div>
      <div style="font-size:12px;color:#ffd43b;margin-bottom:4px">${sel!==null?parts[sel].hindi:''}</div>
      <div style="font-size:12px;color:var(--text2);font-family:var(--font2)">${sel!==null?parts[sel].desc:'Cell ke kisi bhi hisse par click ya button se info dekho!'}</div>
    </div>`;
  }
  window.selCell=(i)=>{sel=i;panel(panelHtml());drawCell();};
  panel(panelHtml());
  drawCell();
  c.onclick=(e)=>{
    const rect=c.getBoundingClientRect();
    const mx=(e.clientX-rect.left),my=(e.clientY-rect.top);
    parts.forEach((pt,i)=>{
      const px=pt.x*c.width,py=pt.y*c.height,pr=pt.r*Math.min(c.width,c.height);
      if(Math.hypot(mx-px,my-py)<pr+10){sel=i;panel(panelHtml());drawCell();}
    });
  };
}

function simHeart(c,ctx,p){
  let bpm=72,phase=0;
  panel(`
    ${sliderRow('hrt_bpm','❤️ Heart Rate',40,180,72,' BPM','sv("hrt_bpm"," BPM");hrtUpdate()')}
    ${infoCards([{id:'hrt_type',val:'Normal',label:'Status'},{id:'hrt_period',val:'0.83',label:'Beat Interval (s)'}])}
    ${theoryBox('Normal HR: 60–100 BPM','BPM = Beats Per Minute. Normal adult: 60-100. Athletes: 40-60. Exercise par HR badhta hai. Fever mein bhi barhta hai.')}
  `);
  window.hrtUpdate=()=>{
    bpm=gv('hrt_bpm');
    const type=bpm<60?'Bradycardia (Slow)':bpm>100?'Tachycardia (Fast)':'Normal ✅';
    if($id('hrt_type'))$id('hrt_type').textContent=type;
    if($id('hrt_period'))$id('hrt_period').textContent=(60/bpm).toFixed(2);
  };
  function animHeart(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const bpm2=gv('hrt_bpm');
    phase+=bpm2/3600;
    const beat=Math.sin(phase*Math.PI*2);
    const size=1+Math.max(0,beat)*0.25;
    const cx=c.width/2,cy=c.height/2-20;
    // ECG line
    const ecgY=c.height-50;
    ctx.strokeStyle='#ff6b6b';ctx.lineWidth=2;ctx.beginPath();
    for(let x=0;x<c.width;x++){
      const t=(x/c.width+phase)*bpm2/60;
      const ecg=t%1<0.1?Math.sin((t%1/0.1)*Math.PI)*40:t%1<0.15?-10:0;
      x===0?ctx.moveTo(x,ecgY-ecg):ctx.lineTo(x,ecgY-ecg);
    }
    ctx.stroke();
    // Heart shape
    ctx.save();ctx.translate(cx,cy);ctx.scale(size,size);
    ctx.fillStyle=`rgba(255,${Math.round(50+beat*30)},${Math.round(50+beat*20)},0.9)`;
    ctx.beginPath();ctx.moveTo(0,20);
    ctx.bezierCurveTo(-5,10,-20,-5,-20,-20);ctx.bezierCurveTo(-20,-40,0,-40,0,-20);
    ctx.bezierCurveTo(0,-40,20,-40,20,-20);ctx.bezierCurveTo(20,-5,5,10,0,20);
    ctx.closePath();ctx.fill();
    if(beat>0.5){
      const g=ctx.createRadialGradient(0,0,0,0,0,50);
      g.addColorStop(0,`rgba(255,50,50,${beat*0.4})`);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,50,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle='#adb5bd';ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText(bpm2+' BPM',cx,c.height-15);ctx.textAlign='left';
    animId=requestAnimationFrame(animHeart);
  }
  hrtUpdate();
  animId=requestAnimationFrame(animHeart);
}

function simPhoto(c,ctx,p){
  let sun=7,co2=5,h2o=5,particles=[];
  panel(`
    ${sliderRow('ph_sun','☀️ Sunlight',1,10,7,'','sv("ph_sun","");photoUp()')}
    ${sliderRow('ph_co2','💨 CO₂',1,10,5,'','sv("ph_co2","");photoUp()')}
    ${sliderRow('ph_h2o','💧 Water',1,10,5,'','sv("ph_h2o","");photoUp()')}
    ${infoCards([{id:'ph_glucose',val:'',label:'Glucose'},{id:'ph_o2',val:'',label:'O₂ Released'}])}
    ${theoryBox('6CO₂ + 6H₂O + Light → C₆H₁₂O₆ + 6O₂','Harit leaves mein chlorophyll hota hai jo sunlight absorb karta hai. CO₂ + water se glucose (food) aur oxygen banta hai!')}
  `);
  window.photoUp=()=>{
    sun=gv('ph_sun');co2=gv('ph_co2');h2o=gv('ph_h2o');
    const rate=Math.round(sun*co2*h2o/15);
    if($id('ph_glucose'))$id('ph_glucose').textContent=rate+' units';
    if($id('ph_o2'))$id('ph_o2').textContent=rate+' mol';
  };
  function animPhoto(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0a1a0a';ctx.fillRect(0,0,c.width,c.height);
    const sun2=gv('ph_sun'),co22=gv('ph_co2'),h2o2=gv('ph_h2o');
    // Sun
    ctx.fillStyle=`rgba(255,220,0,${sun2/10})`;
    ctx.beginPath();ctx.arc(c.width-40,40,30,0,Math.PI*2);ctx.fill();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;ctx.strokeStyle=`rgba(255,220,0,${sun2/15})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(c.width-40+38*Math.cos(a),40+38*Math.sin(a));
      ctx.lineTo(c.width-40+55*Math.cos(a),40+55*Math.sin(a));ctx.stroke();
    }
    // Leaf
    ctx.save();ctx.translate(c.width/2,c.height/2);
    ctx.fillStyle=`rgba(${Math.round(30+sun2*5)},${Math.round(150+sun2*8)},${Math.round(30)},0.9)`;
    ctx.beginPath();ctx.ellipse(0,0,c.width*0.35,c.height*0.25,0.3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,80,0,0.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-c.width*0.3,0);ctx.lineTo(c.width*0.3,0);ctx.stroke();
    ctx.restore();
    // Particles
    if(Math.random()<sun2*co22*h2o2/300)particles.push({x:c.width/2+(Math.random()-0.5)*80,y:c.height/2+(Math.random()-0.5)*40,type:Math.random()>0.5?'o2':'glucose',life:60});
    particles=particles.filter(p=>{
      p.y-=1.5+(p.type==='o2'?1:0.5);p.life--;p.x+=(Math.random()-0.5);
      if(p.life<=0)return false;
      ctx.fillStyle=p.type==='o2'?'#74c0fc':'#ffd43b';
      ctx.font='14px monospace';ctx.textAlign='center';
      ctx.fillText(p.type==='o2'?'O₂':'🍬',p.x,p.y);
      return true;
    });
    ctx.textAlign='left';
    animId=requestAnimationFrame(animPhoto);
  }
  photoUp();
  animId=requestAnimationFrame(animPhoto);
}

function simDNA(c,ctx,p){
  let twist=0;
  const basePairs=[['A','T'],['T','A'],['G','C'],['C','G'],['A','T'],['G','C'],['T','A'],['C','G']];
  const cols={A:'#ff6b6b',T:'#74c0fc',G:'#a9e34b',C:'#ffd43b'};
  panel(`
    ${btnRow([{cls:'btn-start',fn:'dnaStart()',label:'▶ Rotate'},{cls:'btn-reset',fn:'dnaStop()',label:'⏸ Stop'}])}
    <div class="theory-box" style="margin-top:8px">
      <div class="theory-title">🧬 Base Pairs</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0">
        ${Object.entries(cols).map(([b,c])=>`<div style="background:${c}22;border:1px solid ${c};border-radius:8px;padding:4px 10px;font-family:monospace;font-weight:bold;color:${c}">${b}</div>`).join('')}
      </div>
      <div class="theory-text">A-T aur G-C hamesha pair karte hain. Double helix mein do strands spiral mein hotin hain. Har insan ka DNA unique hota hai!</div>
    </div>
  `);
  let running=false;
  window.dnaStart=()=>{running=true;animId=requestAnimationFrame(animDNA);};
  window.dnaStop=()=>{stopSim();running=false;};
  function animDNA(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const cx=c.width/2,n=10,h=c.height;
    const step=h/(n+1);
    for(let i=0;i<=n;i++){
      const y=step+i*step-step/2+20;
      const t=twist+i*0.6;
      const x1=cx+60*Math.cos(t);
      const x2=cx+60*Math.cos(t+Math.PI);
      const pair=basePairs[i%basePairs.length];
      // Left strand dot
      ctx.beginPath();ctx.arc(x1,y,8,0,Math.PI*2);ctx.fillStyle=cols[pair[0]];ctx.fill();
      ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText(pair[0],x1,y+3);
      // Right strand dot
      ctx.beginPath();ctx.arc(x2,y,8,0,Math.PI*2);ctx.fillStyle=cols[pair[1]];ctx.fill();
      ctx.fillStyle='#fff';ctx.fillText(pair[1],x2,y+3);
      // Bond
      ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(x1+8,y);ctx.lineTo(x2-8,y);ctx.stroke();ctx.setLineDash([]);
      // Connect to next
      if(i<n){
        const y2=step+(i+1)*step-step/2+20;
        const t2=twist+(i+1)*0.6;
        const nx1=cx+60*Math.cos(t2),nx2=cx+60*Math.cos(t2+Math.PI);
        ctx.strokeStyle=cols[pair[0]]+'88';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(nx1,y2);ctx.stroke();
        ctx.strokeStyle=cols[pair[1]]+'88';ctx.beginPath();ctx.moveTo(x2,y);ctx.lineTo(nx2,y2);ctx.stroke();
      }
    }
    ctx.textAlign='left';
    if(running){twist+=0.03;animId=requestAnimationFrame(animDNA);}
  }
  animDNA();
}

function simEcosystem(c,ctx,p){
  let sun=7,plants=5,herbivores=3,carnivores=2;
  panel(`
    ${sliderRow('eco_sun','☀️ Sunlight',1,10,7,'','sv("eco_sun","");ecoUpdate()')}
    ${sliderRow('eco_pl','🌿 Plants',1,10,5,'','sv("eco_pl","");ecoUpdate()')}
    ${sliderRow('eco_herb','🐇 Herbivores',1,10,3,'','sv("eco_herb","");ecoUpdate()')}
    ${sliderRow('eco_carn','🦁 Carnivores',1,10,2,'','sv("eco_carn","");ecoUpdate()')}
    ${theoryBox('Sun → Plants → Herbivores → Carnivores','Har level par energy 90% kam hoti hai. Isliye carnivores ki population sabse kam hoti hai. Balance bigaad do — sara ecosystem affect hoga!')}
  `);
  window.ecoUpdate=()=>{
    sun=gv('eco_sun');plants=gv('eco_pl');herbivores=gv('eco_herb');carnivores=gv('eco_carn');
    ecoDraw();
  };
  function ecoDraw(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const levels=[
      {emoji:'🌞',label:'Sunlight',count:sun,col:'#ffd43b',y:0.1},
      {emoji:'🌿',label:'Plants',count:plants,col:'#a9e34b',y:0.3},
      {emoji:'🐇',label:'Herbivores',count:herbivores,col:'#ff9f43',y:0.55},
      {emoji:'🦁',label:'Carnivores',count:carnivores,col:'#ff6b6b',y:0.78},
    ];
    const cw=c.width;
    // Draw pyramid
    levels.forEach((lv,i)=>{
      const y=lv.y*c.height;
      const w=cw*(0.2+(i+1)*0.15);
      const h=40;
      // Bar
      const x=(cw-w)/2;
      const ratio=lv.count/10;
      ctx.fillStyle=lv.col+'33';ctx.fillRect(x,y-h/2,w*ratio,h);
      ctx.fillStyle=lv.col+'66';ctx.fillRect(x,y-h/2,w,h);
      ctx.strokeStyle=lv.col;ctx.lineWidth=2;ctx.strokeRect(x,y-h/2,w,h);
      // Emoji+label
      ctx.font='16px monospace';ctx.textAlign='left';ctx.fillStyle='#fff';
      ctx.fillText(lv.emoji.repeat(Math.min(lv.count,8)),x+5,y+6);
      ctx.font='bold 11px monospace';ctx.fillStyle=lv.col;
      ctx.fillText(lv.label+' ('+lv.count+')',x+w+6,y+5);
      // Arrow
      if(i<levels.length-1){
        const nextY=levels[i+1].y*c.height;
        ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cw/2,y+h/2);ctx.lineTo(cw/2,nextY-h/2);ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.3)';
        const my=(y+h/2+nextY-h/2)/2;
        ctx.beginPath();ctx.moveTo(cw/2,my+8);ctx.lineTo(cw/2-6,my-4);ctx.lineTo(cw/2+6,my-4);ctx.closePath();ctx.fill();
      }
    });
    ctx.textAlign='left';
    // Balance indicator
    const balance=(plants>=herbivores*2&&herbivores>=carnivores)?'✅ Balanced':'⚠️ Imbalanced!';
    ctx.fillStyle=balance.includes('✅')?'#a9e34b':'#ff6b6b';
    ctx.font='bold 13px monospace';ctx.textAlign='center';
    ctx.fillText(balance,cw/2,c.height-10);ctx.textAlign='left';
  }
  ecoDraw();
}

// CHEMISTRY: REACTION
// ============================================================
function simReaction(c,ctx,p){
  const reactions=[
    {name:'H₂ + O₂ → H₂O',lhs:[{sym:'H',col:'#74c0fc',n:2},{sym:'O',col:'#ff6b6b',n:2}],rhs:[{sym:'H₂O',col:'#58a6ff'}],heat:true,desc:'Paani banta hai — bahut exothermic!'},
    {name:'Na + Cl → NaCl',lhs:[{sym:'Na',col:'#ffd43b',n:1},{sym:'Cl',col:'#a9e34b',n:1}],rhs:[{sym:'NaCl',col:'#fff'}],heat:true,desc:'Namak banta hai — ionic bond'},
    {name:'C + O₂ → CO₂',lhs:[{sym:'C',col:'#adb5bd',n:1},{sym:'O₂',col:'#ff6b6b',n:1}],rhs:[{sym:'CO₂',col:'#ffa94d'}],heat:true,desc:'Jaalna — carbon dioxide banta hai'},
  ];
  let selR=0,reacting=false;
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,c.width,c.height);
    const rx=reactions[selR];
    // Reactants
    rx.lhs.forEach((atom,i)=>{
      const x=50+i*80,y=c.height/2;
      ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);
      ctx.fillStyle=atom.col+'44';ctx.fill();
      ctx.strokeStyle=atom.col;ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.textAlign='center';
      ctx.fillText(atom.sym,x,y+5);
    });
    ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.textAlign='center';
    ctx.fillText(reacting?'⚡ →':'→',c.width/2,c.height/2+8);
    // Products
    rx.rhs.forEach((prod,i)=>{
      const x=c.width-80+i*60,y=c.height/2;
      ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);
      ctx.fillStyle=reacting?prod.col+'88':prod.col+'22';ctx.fill();
      if(reacting){const g=ctx.createRadialGradient(x,y,0,x,y,40);g.addColorStop(0,prod.col+'44');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,40,0,Math.PI*2);ctx.fill();}
      ctx.strokeStyle=prod.col;ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 13px monospace';ctx.fillText(prod.sym,x,y+5);
    });
    ctx.textAlign='left';
    ctx.fillStyle='#adb5bd';ctx.font='12px monospace';ctx.textAlign='center';
    ctx.fillText(rx.desc,c.width/2,30);ctx.textAlign='left';
  }
  panel(`
    <div class="ctrl-section">
      <div class="ctrl-label">⚗️ Reaction Chunno</div>
      ${reactions.map((r,i)=>`<button class="sim-btn" onclick="selReact(${i})" style="margin-bottom:6px;background:${selR===i?'var(--green2)':'var(--card2)'}">${r.name}</button>`).join('')}
    </div>
    ${btnRow([{cls:'btn-start',fn:'startReact()',label:'⚡ React!'},{cls:'btn-reset',fn:'resetReact()',label:'🔄 Reset'}])}
    ${theoryBox('Reactants → Products','Exothermic reaction mein heat release hoti hai. Endothermic mein heat absorb hoti hai. Conservation of mass: atoms ki total count same rehti hai.')}
  `);
  window.selReact=(i)=>{selR=i;reacting=false;panel(document.getElementById('controlsPanel').innerHTML.replace(/selReact\(\d\)/g,`selReact(${i})`));draw();};
  window.startReact=()=>{reacting=true;draw();setTimeout(()=>{},500);};
  window.resetReact=()=>{reacting=false;draw();};
  draw();
}
